<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小飞船搬家 · 平移与旋转</title>
<!-- 题型：图形变换 / 核心：先平移位置·再旋转朝向 / 年龄：7-10 / 场景：教室 -->
<style>
:root{
  --accent:#6366f1; --ink:#1f2a44; --muted:#667085; --line:#c7d2fe;
  --ease:cubic-bezier(0.25,1,0.5,1); --touch:52px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#eef2ff,#fdf4ff);min-height:100vh;padding:14px 12px 28px;
}
.card{
  max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);
  border-radius:20px;box-shadow:0 12px 28px rgba(99,102,241,.12);padding:18px 16px 22px;
}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{margin:0;font-size:22px;font-weight:800}
.badge{font-size:14px;font-weight:700;color:#4338ca;background:#e0e7ff;padding:5px 12px;border-radius:999px}
.story{
  background:linear-gradient(135deg,#e0e7ff,#fce7f3);border-left:5px solid var(--accent);
  border-radius:0 14px 14px 0;padding:12px;margin-bottom:12px;font-size:16px;line-height:1.7;
}
.stage{
  background:#eef2ff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;
}
.board{
  position:relative; height:220px; background:
    linear-gradient(#e2e8f0 1px, transparent 1px) 0 0 / 20px 20px,
    linear-gradient(90deg, #e2e8f0 1px, transparent 1px) 0 0 / 20px 20px,
    #f8fafc;
  border-radius:12px; border:2px solid #cbd5e1; overflow:hidden;
}
.ghost{
  position:absolute; left:40px; top:80px; width:56px; height:40px;
  border:2px dashed #94a3b8; border-radius:8px 16px 8px 8px; opacity:.7;
}
.ghost::after{
  content:''; position:absolute; right:-2px; top:12px;
  border:8px solid transparent; border-left-color:#94a3b8;
}
.path{
  position:absolute; left:68px; top:100px; height:3px; background:#fbbf24;
  border-radius:2px; width:0; transform-origin:left center;
  transition: width .5s var(--ease);
}
.ship{
  position:absolute; left:40px; top:80px; width:56px; height:40px;
  background:linear-gradient(135deg,#818cf8,#4f46e5); border-radius:8px 16px 8px 8px;
  transition: transform .55s var(--ease);
  transform-origin: center center;
  box-shadow:0 4px 12px rgba(79,70,229,.35);
  z-index:2;
}
.ship::after{
  content:''; position:absolute; right:-10px; top:12px;
  border:8px solid transparent; border-left-color:#4f46e5;
}
.ship .win{
  position:absolute; left:10px; top:10px; width:14px; height:14px;
  background:#c7d2fe; border-radius:50%;
}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:13px;color:var(--muted)}
.ctrl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.row label{font-weight:700;font-size:14px;min-width:4em}
.step button{
  min-width:var(--touch);min-height:var(--touch);border-radius:14px;border:2px solid var(--line);
  background:#fff;font-size:20px;font-weight:800;cursor:pointer;font-family:inherit;
}
.step .v{min-width:48px;text-align:center;font-size:18px;font-weight:800;color:var(--accent)}
input[type=range]{width:min(180px,40vw)}
.rots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rotbtn{
  min-height:48px;min-width:64px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);
  background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
}
.rotbtn.on{background:#e0e7ff;border-color:var(--accent);color:#4338ca}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{
  min-height:var(--touch);padding:12px 18px;border-radius:14px;border:2px solid var(--line);
  background:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
}
.btn.primary{background:linear-gradient(135deg,var(--accent),#4338ca);color:#fff;border:none}
.fb{min-height:52px;border-radius:14px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:16px;line-height:1.55;margin:10px 0}
.thinking{background:#fffbeb;border-radius:12px;padding:10px;font-size:15px;border:1px dashed #fcd34d}
.thinking .tag{font-weight:800;color:#b45309}
.say{margin-top:8px;font-size:15px;min-height:22px}
@media (prefers-reduced-motion:reduce){.ship,.path{transition:none!important}}
body.static .ship, body.static .path{transition:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <h1>小飞船搬家</h1>
    <span class="badge">7–10 岁 · 平移旋转</span>
    <label style="margin-left:auto;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="staticMode"> 静态
    </label>
  </div>
  <div class="story">
    虚线是<strong>原来的位置</strong>。先<strong>平移</strong>（整体挪地方，不转），
    再<strong>旋转</strong>（绕中心转朝向）。黄线是平移路径。
  </div>
  <div class="stage" role="img" aria-label="平移旋转图解">
    <div class="board">
      <div class="ghost" title="原位置"></div>
      <div class="path" id="path"></div>
      <div class="ship" id="ship"><span class="win"></span></div>
      <div id="coord" style="position:absolute;left:8px;bottom:6px;font-size:12px;font-weight:700;color:#64748b;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px">Δx=60 Δy=20 θ=0°</div>
    </div>
    <div class="legend">
      <span>□ 虚线=起点</span>
      <span>— 黄线=平移路径</span>
      <span>■ 实心=现在</span>
      <span id="pathLen">路径长 —</span>
    </div>
  </div>
  <div class="ctrl">
    <div class="row">
      <label>向右</label>
      <div class="step">
        <button type="button" id="xMinus">−</button>
        <span class="v" id="xVal">60</span>
        <button type="button" id="xPlus">+</button>
      </div>
      <input type="range" id="tx" min="0" max="160" value="60" step="10" aria-label="水平平移">
      <span>格</span>
    </div>
    <div class="row">
      <label>向下</label>
      <div class="step">
        <button type="button" id="yMinus">−</button>
        <span class="v" id="yVal">20</span>
        <button type="button" id="yPlus">+</button>
      </div>
      <input type="range" id="ty" min="-40" max="80" value="20" step="10" aria-label="竖直平移">
      <span>格</span>
    </div>
    <div class="rots" role="group" aria-label="旋转角度">
      <button type="button" class="rotbtn on" data-r="0">0°</button>
      <button type="button" class="rotbtn" data-r="90">90°</button>
      <button type="button" class="rotbtn" data-r="180">180°</button>
      <button type="button" class="rotbtn" data-r="270">270°</button>
    </div>
    <div class="btn-row">
      <button type="button" class="btn primary" id="btnPlay">▶ 分步演示</button>
      <button type="button" class="btn" id="btnReset">↻ 重新开始</button>
      <button type="button" class="btn" id="btnSay">🗣️ 我会说</button>
    </div>
    <p style="text-align:center;font-size:13px;color:var(--muted);margin:8px 0 0" id="phaseHint">步骤：调参数 · 或点分步演示</p>
  </div>
  <div class="fb" id="fb" aria-live="polite">调平移和旋转，或点「分步演示」：先移动，再转身。</div>
  <p class="thinking"><span class="tag">我怎么想：</span><span id="think">平移改位置；旋转改朝向。形状大小不变。</span></p>
  <div class="say" id="say"></div>
</main>
<script>
(function(){
  let tx=60, ty=20, rot=0;
  const $ = id => document.getElementById(id);
  const ship = $('ship');
  const path = $('path');

  function apply(onlyTranslate){
    const r = onlyTranslate ? 0 : rot;
    // 飞船中心：left40+28, top80+20 → 与 .path 原点对齐
    ship.style.transform = 'translate('+tx+'px,'+ty+'px) rotate('+r+'deg)';
    const len = Math.sqrt(tx*tx + ty*ty);
    path.style.width = Math.max(0, len) + 'px';
    const ang = (tx===0 && ty===0) ? 0 : Math.atan2(ty, tx) * 180 / Math.PI;
    path.style.transform = 'rotate('+ang+'deg)';
    path.setAttribute('title', '平移路径 '+Math.round(len)+'px');
    const c=$('coord'); if(c) c.textContent='Δx='+tx+' Δy='+ty+' θ='+r+'°';
    const pl=$('pathLen'); if(pl) pl.textContent='路径长 ≈ '+Math.round(len)+'px';
  }

  function sync(){
    tx=+$('tx').value; ty=+$('ty').value;
    $('xVal').textContent=tx; $('yVal').textContent=ty;
    apply(false);
    $('fb').textContent = '向右 '+tx+'、向下 '+ty+'，再转 '+rot+'°。虚线=没动前；黄线=平移轨迹。';
    $('think').textContent = '平移改位置（Δx,Δy）；旋转改朝向 θ。两步分开想。';
    $('say').textContent = '';
  }

  function bind(m,p,r,step){
    step = step || 10;
    $(m).onclick=()=>{ r.value=Math.max(+r.min,+r.value-step); sync(); };
    $(p).onclick=()=>{ r.value=Math.min(+r.max,+r.value+step); sync(); };
    r.oninput=sync;
  }
  bind('xMinus','xPlus',$('tx'));
  bind('yMinus','yPlus',$('ty'));

  document.querySelectorAll('.rotbtn').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('.rotbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      rot = +b.dataset.r;
      apply(false);
      $('fb').textContent = '旋转到 '+rot+'°。箭头朝向变了，位置由平移决定。';
    };
  });

  $('btnPlay').onclick=()=>{
    // step1: reset visual to origin
    ship.style.transition = 'none';
    path.style.transition = 'none';
    ship.style.transform = 'translate(0,0) rotate(0)';
    path.style.width = '0';
    void ship.offsetWidth;
    ship.style.transition = '';
    path.style.transition = '';
    // step2 translate
    const ph=$('phaseHint');
    if(ph) ph.textContent='① 回到起点…';
    setTimeout(()=>{
      apply(true);
      $('fb').textContent = '① 先平移：整艘船挪到新位置，还没转身。';
      $('think').textContent = '平移：每一点移动相同方向与距离。';
      if(ph) ph.textContent='① 平移中 → ② 待旋转';
    }, 50);
    setTimeout(()=>{
      apply(false);
      $('fb').textContent = '② 再旋转：绕中心转到 '+rot+'°。形状大小不变。';
      $('think').textContent = '旋转：绕飞船中心转，箭头朝向变了。';
      if(ph) ph.textContent='① 平移 ✓  ② 旋转 ✓';
    }, 700);
  };

  $('btnReset').onclick=()=>{
    $('tx').value=60; $('ty').value=20; rot=0;
    document.querySelectorAll('.rotbtn').forEach((x,i)=>x.classList.toggle('on',i===0));
    sync();
  };
  $('btnSay').onclick=()=>{
    $('say').textContent = '我会说：先向右'+tx+'向下'+ty+'平移，再旋转'+rot+'度。';
  };
  $('staticMode').onchange=e=>document.body.classList.toggle('static', e.target.checked);
  sync();
})();
</script>
</body>
</html>
