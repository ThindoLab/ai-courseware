<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v3">
<meta name="aid-version-at" content="2026-08-14T08:25:39">
<meta name="aid-version-note" content="当前稿">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>翻牌配对 · 动物与家</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Segoe UI Emoji", sans-serif;
    background: linear-gradient(180deg, #fff8e7 0%, #fce9c8 100%);
    color: #4a3b25;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100dvh; padding: 10px 8px 6px;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: min(96vw, 640px); padding: 4px 2px 8px;
  }
  .pill {
    background: #fffdf6; border: 2px solid #c98d5f; border-radius: 999px;
    padding: 7px 16px; font-size: 17px; font-weight: 700; color: #4a3b25;
    white-space: nowrap;
  }
  .icon-btn {
    width: 46px; height: 46px; min-width: 46px; border-radius: 50%;
    border: 2px solid #c98d5f; background: #fffdf6; font-size: 22px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
  }
  .icon-btn:active { transform: scale(.92); }

  /* ---------- 卡片 ---------- */
  .card-grid {
    display: grid; gap: 10px; width: min(96vw, 640px);
    margin: 2px auto 4px;
  }
  .cols-3 { grid-template-columns: repeat(3, 1fr); }
  .cols-4 { grid-template-columns: repeat(4, 1fr); }
  .cols-5 { grid-template-columns: repeat(5, 1fr); }
  .card {
    aspect-ratio: 1 / 1; min-width: 0; cursor: pointer;
    perspective: 700px; transition: opacity .4s, transform .4s;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .5s ease;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 18px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    padding: 4px; overflow: hidden;
  }
  .card-back {
    background: linear-gradient(160deg, #6fa3c4, #4f82a3);
    border: 3px solid #3f6d8c; color: #fff;
  }
  .card-back .paw { font-size: clamp(30px, 8vw, 56px); opacity: .9; }
  .card-front.animal {
    background: linear-gradient(160deg, #fff1d2, #ffe0ae);
    border: 3px solid #f0a53a;
  }
  .card-front.home {
    background: linear-gradient(160deg, #f7ead2, #ecd5ae);
    border: 3px solid #b07a43;
  }
  .face-emoji { font-size: clamp(36px, 9.5vw, 64px); line-height: 1.1; }
  .face-label { font-size: 16px; font-weight: 700; color: #4a3b25; letter-spacing: .5px; }
  .card.matched .card-inner { box-shadow: 0 0 0 4px #7cb342, 0 0 0 7px #fffdf6; border-radius: 20px; }
  .card.done { opacity: .3; transform: scale(.8); pointer-events: none; }
  .card.done .card-inner { box-shadow: none; }
  .guest {
    position: absolute; right: 4px; bottom: 4px; font-size: 20px;
    background: #fff; border-radius: 50%; padding: 2px; line-height: 1;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .card.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* ---------- 提示条 ---------- */
  .tip {
    min-height: 48px; display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 17px; font-weight: 700; color: #4a3b25;
    padding: 4px 10px; width: min(96vw, 640px);
  }
  .tip.bad { color: #c0392b; }
  .tip.good { color: #558b2f; }

  /* ---------- 飞行 emoji ---------- */
  .fly-emoji {
    position: fixed; font-size: 54px; line-height: 1; z-index: 80;
    pointer-events: none; transition: transform .65s ease-in;
  }

  /* ---------- 覆盖层 / 面板 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(255, 248, 231, .97);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .panel {
    background: #fffdf6; border: 3px solid #c98d5f; border-radius: 26px;
    max-width: 440px; width: 100%; text-align: center; padding: 26px 20px;
    box-shadow: 0 12px 30px rgba(74,59,37,.18);
  }
  .panel h1 { font-size: 30px; margin: 6px 0 4px; color: #4a3b25; }
  .panel h2 { font-size: 26px; margin: 6px 0 4px; color: #4a3b25; }
  .panel p { font-size: 18px; margin: 6px 0 10px; line-height: 1.5; }
  .panel .small { font-size: 16px; color: #7a6548; }
  .panel-emoji { font-size: 60px; line-height: 1.2; }
  .btn {
    border: none; border-radius: 999px; padding: 15px 36px; font-size: 20px; font-weight: 800;
    background: #f6a623; color: #fff; cursor: pointer;
    box-shadow: 0 5px 0 #c47f12; touch-action: manipulation;
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c47f12; }
  .btn.green { background: #7cb342; box-shadow: 0 5px 0 #558b2f; }
  .btn.green:active { box-shadow: 0 1px 0 #558b2f; }
  .skip-link {
    display: inline-block; margin-top: 14px; padding: 12px 20px;
    font-size: 16px; font-weight: 700; color: #7a6548;
    background: transparent; border: 2px solid #c98d5f; border-radius: 999px;
    cursor: pointer; touch-action: manipulation;
  }
  .skip-link:active { background: #f3e3c4; }

  /* ---------- 开场演示 ---------- */
  .demo-stage {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 18px 0 8px;
  }
  .demo-card { width: 108px; height: 108px; perspective: 600px; }
  .dc-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .5s ease;
  }
  .demo-card.flipped .dc-inner { transform: rotateY(180deg); }
  .dc-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 16px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; padding: 4px;
  }
  .dc-back { background: linear-gradient(160deg, #6fa3c4, #4f82a3); border: 3px solid #3f6d8c; color: #fff; }
  .dc-back .paw { font-size: 40px; }
  .dc-front { transform: rotateY(180deg); background: linear-gradient(160deg, #fff1d2, #ffe0ae); border: 3px solid #f0a53a; }
  .dc-front.home { background: linear-gradient(160deg, #f7ead2, #ecd5ae); border-color: #b07a43; }
  .dc-front .face-emoji { font-size: 44px; }
  .dc-front .face-label { font-size: 16px; font-weight: 700; }
  .demo-arrow { font-size: 34px; color: #c47f12; }
  .demo-ok { font-size: 46px; color: #7cb342; opacity: 0; transition: opacity .3s; }
  .demo-ok.show { opacity: 1; }
  .demo-hint { font-size: 17px; font-weight: 700; color: #4a3b25; margin: 6px 0 4px; }

  /* ---------- 想一想 ---------- */
  .think-q { font-size: 24px !important; font-weight: 800; }
  .think-opts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 12px 0 8px; }
  .opt-card {
    width: 118px; height: 128px; border-radius: 18px; cursor: pointer;
    background: #fffdf6; border: 3px solid #c98d5f;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    touch-action: manipulation;
  }
  .opt-card .oe { font-size: 50px; line-height: 1.1; }
  .opt-card .ol { font-size: 17px; font-weight: 700; }
  .opt-card:active { transform: scale(.94); }
  .opt-card.right { border-color: #7cb342; box-shadow: 0 0 0 4px #7cb342; }
  .opt-card.wrong { border-color: #c0392b; box-shadow: 0 0 0 4px #c0392b; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .card-inner, .dc-inner { transition: none; }
  }
</style>
</head>
<body>

  <!-- 主界面 -->
  <div class="topbar">
    <div class="pill" id="levelPill">第 1 关</div>
    <div class="pill" id="progPill">🏠 0/3</div>
    <button class="icon-btn" id="restartBtn" aria-label="重新开始">🔄</button>
  </div>
  <div class="card-grid cols-3" id="grid"></div>
  <div class="tip" id="tip">翻一张卡片看看</div>

  <!-- 开场演示 -->
  <div id="demoOverlay" class="overlay">
    <div class="panel">
      <h1>🐾 动物找家</h1>
      <p>翻一翻，帮小动物找到它的家</p>
      <div class="demo-stage">
        <div class="demo-card" id="demoAnimal">
          <div class="dc-inner">
            <div class="dc-face dc-back"><span class="paw">🐾</span></div>
            <div class="dc-face dc-front"><span class="face-emoji">🐦</span><span class="face-label">小鸟</span></div>
          </div>
        </div>
        <div class="demo-arrow">➜</div>
        <div class="demo-card" id="demoHome">
          <div class="dc-inner">
            <div class="dc-face dc-back"><span class="paw">🐾</span></div>
            <div class="dc-face dc-front home"><span class="face-emoji">🪺</span><span class="face-label">鸟巢</span></div>
          </div>
        </div>
        <div class="demo-ok" id="demoOk">✓</div>
      </div>
      <p class="demo-hint" id="demoHint">先翻一张，再翻一张</p>
      <button class="btn" id="demoStart">开始玩 🐾</button>
      <br>
      <button class="skip-link" id="demoSkip">跳过演示 ➜</button>
    </div>
  </div>

  <!-- 过关面板 -->
  <div id="clearPanel" class="overlay hidden">
    <div class="panel">
      <div class="panel-emoji">🎉</div>
      <h2 id="clearTitle"></h2>
      <p id="clearMsg"></p>
      <button class="btn green" id="clearNext"></button>
    </div>
  </div>

  <!-- 想一想（举一反三） -->
  <div id="thinkPanel" class="overlay hidden">
    <div class="panel">
      <h2>想一想 🤔</h2>
      <p class="think-q">🐔 小鸡的家在哪里？</p>
      <div class="think-opts" id="thinkOpts"></div>
      <p class="tip" id="thinkTip"></p>
      <button class="btn green" id="thinkNext" style="display:none">完成 🎉</button>
    </div>
  </div>

  <!-- 通关 -->
  <div id="finalPanel" class="overlay hidden">
    <div class="panel">
      <div class="panel-emoji">🏆</div>
      <h2>全部通关！</h2>
      <p>小动物们都找到自己的家啦</p>
      <p class="small">🐦鸟巢 · 🐝蜂巢 · 🐶狗窝 · 🐰兔洞 · 🐿️树洞 · 🐔鸡舍</p>
      <button class="btn" id="finalRestart">再玩一次 🔄</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var LEVELS = [
    {
      pairs: [
        { a: '🐦', an: '小鸟', h: '🪺', hn: '鸟巢' },
        { a: '🐝', an: '蜜蜂', h: '🍯', hn: '蜂巢' },
        { a: '🐶', an: '小狗', h: '🛖', hn: '狗窝' }
      ]
    },
    {
      pairs: [
        { a: '🐦', an: '小鸟', h: '🪺', hn: '鸟巢' },
        { a: '🐝', an: '蜜蜂', h: '🍯', hn: '蜂巢' },
        { a: '🐶', an: '小狗', h: '🛖', hn: '狗窝' },
        { a: '🐰', an: '兔子', h: '🕳️', hn: '兔洞' }
      ]
    },
    {
      pairs: [
        { a: '🐦', an: '小鸟', h: '🪺', hn: '鸟巢' },
        { a: '🐝', an: '蜜蜂', h: '🍯', hn: '蜂巢' },
        { a: '🐶', an: '小狗', h: '🛖', hn: '狗窝' },
        { a: '🐰', an: '兔子', h: '🕳️', hn: '兔洞' },
        { a: '🐿️', an: '松鼠', h: '🌳', hn: '树洞' }
      ]
    }
  ];

  var grid = document.getElementById('grid');
  var tipEl = document.getElementById('tip');
  var levelPill = document.getElementById('levelPill');
  var progPill = document.getElementById('progPill');

  var levelIndex = 0;
  var pairs = [];
  var cards = [];
  var open = [];
  var locked = false;
  var matchedCount = 0;

  /* ---------- 音效 ---------- */
  var actx = null;
  function playSound(kind) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      if (kind === 'ok') {
        o.type = 'sine';
        o.frequency.setValueAtTime(660, actx.currentTime);
        o.frequency.exponentialRampToValueAtTime(990, actx.currentTime + 0.18);
        g.gain.setValueAtTime(0.12, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.32);
        o.start(); o.stop(actx.currentTime + 0.34);
      } else {
        o.type = 'triangle';
        o.frequency.setValueAtTime(330, actx.currentTime);
        o.frequency.exponentialRampToValueAtTime(220, actx.currentTime + 0.22);
        g.gain.setValueAtTime(0.08, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.3);
        o.start(); o.stop(actx.currentTime + 0.32);
      }
    } catch (e) {}
  }

  /* ---------- 洗牌 ---------- */
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
  }

  /* ---------- 开局 ---------- */
  function startLevel(idx) {
    levelIndex = idx;
    pairs = LEVELS[idx].pairs;
    matchedCount = 0;
    open = [];
    locked = false;

    levelPill.textContent = '第 ' + (idx + 1) + ' 关';
    progPill.textContent = '🏠 0/' + pairs.length;
    tipEl.textContent = '翻一张卡片看看';
    tipEl.className = 'tip';

    cards = [];
    pairs.forEach(function (p, i) {
      cards.push({ pair: i, kind: 'animal', emoji: p.a, label: p.an, homeName: p.hn });
      cards.push({ pair: i, kind: 'home', emoji: p.h, label: p.hn, homeName: p.hn });
    });
    shuffle(cards);

    grid.className = 'card-grid cols-' + pairs.length;
    grid.innerHTML = '';
    cards.forEach(function (d) {
      var el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<div class="card-inner">' +
          '<div class="card-face card-back"><span class="paw">🐾</span></div>' +
          '<div class="card-face card-front ' + d.kind + '">' +
            '<span class="face-emoji">' + d.emoji + '</span>' +
            '<span class="face-label">' + d.label + '</span>' +
          '</div>' +
        '</div>';
      el.addEventListener('click', function () { onCardClick(el, d); });
      grid.appendChild(el);
    });
  }

  /* ---------- 翻牌 ---------- */
  function flip(el) { el.classList.add('flipped'); }
  function unflip(el) { el.classList.remove('flipped'); }

  function onCardClick(el, d) {
    if (locked) return;
    if (el.classList.contains('flipped') || el.classList.contains('done')) return;
    flip(el);
    playSound('flip');
    open.push({ el: el, data: d });
    if (open.length === 1) {
      tipEl.textContent = '再翻一张，找找它的家';
      tipEl.className = 'tip';
    } else if (open.length === 2) {
      locked = true;
      checkPair();
    }
  }

  function checkPair() {
    var c1 = open[0], c2 = open[1];
    var isMatch = (c1.data.pair === c2.data.pair) && (c1.data.kind !== c2.data.kind);
    if (isMatch) {
      celebrate(c1, c2);
    } else {
      failPair(c1, c2);
    }
  }

  /* ---------- 配对成功：动物飞回家 ---------- */
  function celebrate(c1, c2) {
    playSound('ok');
    var aCard = c1.data.kind === 'animal' ? c1 : c2;
    var hCard = c1.data.kind === 'home' ? c1 : c2;
    var aEl = aCard.el, hEl = hCard.el;
    var r1 = aEl.getBoundingClientRect(), r2 = hEl.getBoundingClientRect();

    var fly = document.createElement('div');
    fly.className = 'fly-emoji';
    fly.textContent = aCard.data.emoji;
    fly.style.left = (r1.left + r1.width / 2 - 27) + 'px';
    fly.style.top = (r1.top + r1.height / 2 - 27) + 'px';
    document.body.appendChild(fly);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        fly.style.transform = 'translate(' + (r2.left - r1.left) + 'px,' + (r2.top - r1.top) + 'px) scale(1.5)';
      });
    });
    setTimeout(function () { fly.remove(); }, 700);

    setTimeout(function () {
      aEl.classList.add('matched');
      hEl.classList.add('matched');
      var guest = document.createElement('span');
      guest.className = 'guest';
      guest.textContent = aCard.data.emoji;
      hEl.querySelector('.card-front').appendChild(guest);
    }, 480);

    setTimeout(function () {
      aEl.classList.add('done');
      hEl.classList.add('done');
      matchedCount++;
      progPill.textContent = '🏠 ' + matchedCount + '/' + pairs.length;
      tipEl.textContent = aCard.data.emoji + ' 回家啦！';
      tipEl.className = 'tip good';
      open = [];
      locked = false;
      if (matchedCount === pairs.length) {
        setTimeout(showClear, 750);
      }
    }, 1250);
  }

  /* ---------- 配错：概念对照 ---------- */
  function failPair(c1, c2) {
    playSound('no');
    var msg;
    if (c1.data.kind === c2.data.kind) {
      msg = c1.data.kind === 'animal'
        ? '两个都是小动物，再翻一张「家」来配对'
        : '两个都是家，再翻一张小动物';
    } else {
      var animal = c1.data.kind === 'animal' ? c1.data : c2.data;
      var home = c1.data.kind === 'home' ? c1.data : c2.data;
      msg = animal.emoji + ' ' + animal.label + '的家是' + animal.homeName + '，不是' + home.label;
    }
    tipEl.textContent = msg;
    tipEl.className = 'tip bad';
    c1.el.classList.add('shake');
    c2.el.classList.add('shake');
    setTimeout(function () {
      unflip(c1.el); unflip(c2.el);
      c1.el.classList.remove('shake');
      c2.el.classList.remove('shake');
      open = [];
      locked = false;
    }, 1150);
  }

  /* ---------- 过关 ---------- */
  function showClear() {
    var last = levelIndex === LEVELS.length - 1;
    document.getElementById('clearTitle').textContent = last ? '最后一关也通过啦！' : '第 ' + (levelIndex + 1) + ' 关完成！';
    document.getElementById('clearMsg').textContent = pairs.length + ' 个家都找到啦';
    document.getElementById('clearNext').textContent = last ? '想一想 ➜' : '下一关 ➜';
    document.getElementById('clearPanel').classList.remove('hidden');
  }
  document.getElementById('clearNext').addEventListener('click', function () {
    document.getElementById('clearPanel').classList.add('hidden');
    if (levelIndex === LEVELS.length - 1) {
      showThink();
    } else {
      startLevel(levelIndex + 1);
    }
  });

  /* ---------- 想一想（举一反三） ---------- */
  function showThink() {
    var opts = [
      { e: '🐔', l: '鸡舍', ok: true },
      { e: '🪺', l: '鸟巢', ok: false },
      { e: '🛖', l: '狗窝', ok: false }
    ];
    shuffle(opts);
    var box = document.getElementById('thinkOpts');
    box.innerHTML = '';
    var tip = document.getElementById('thinkTip');
    tip.textContent = '';
    tip.className = 'tip';
    document.getElementById('thinkNext').style.display = 'none';
    document.getElementById('thinkPanel').classList.remove('hidden');

    opts.forEach(function (o) {
      var el = document.createElement('div');
      el.className = 'opt-card';
      el.innerHTML = '<span class="oe">' + o.e + '</span><span class="ol">' + o.l + '</span>';
      el.addEventListener('click', function () {
        if (el.classList.contains('right') || el.classList.contains('wrong')) return;
        if (o.ok) {
          el.classList.add('right');
          tip.textContent = '对啦！小鸡住鸡舍，咯咯哒 🎉';
          tip.className = 'tip good';
          playSound('ok');
          document.getElementById('thinkNext').style.display = 'inline-block';
        } else {
          el.classList.add('wrong');
          tip.textContent = '🐔 小鸡住鸡舍哦，' + o.l + '不是它的家';
          tip.className = 'tip bad';
          playSound('no');
        }
      });
      box.appendChild(el);
    });
  }
  document.getElementById('thinkNext').addEventListener('click', function () {
    document.getElementById('thinkPanel').classList.add('hidden');
    document.getElementById('finalPanel').classList.remove('hidden');
  });

  /* ---------- 重玩 ---------- */
  function restartAll() {
    document.getElementById('finalPanel').classList.add('hidden');
    document.getElementById('thinkPanel').classList.add('hidden');
    document.getElementById('clearPanel').classList.add('hidden');
    startLevel(0);
  }
  document.getElementById('restartBtn').addEventListener('click', restartAll);
  document.getElementById('finalRestart').addEventListener('click', restartAll);

  /* ---------- 开场演示 ---------- */
  function beginGame() {
    document.getElementById('demoOverlay').classList.add('hidden');
    startLevel(0);
  }
  document.getElementById('demoStart').addEventListener('click', beginGame);
  document.getElementById('demoSkip').addEventListener('click', beginGame);

  function runDemo() {
    var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var a = document.getElementById('demoAnimal');
    var h = document.getElementById('demoHome');
    var ok = document.getElementById('demoOk');
    var hint = document.getElementById('demoHint');
    if (rm) {
      a.classList.add('flipped');
      h.classList.add('flipped');
      ok.classList.add('show');
      hint.textContent = '翻两张，找到一样的就配对成功';
      return;
    }
    setTimeout(function () { a.classList.add('flipped'); }, 400);
    setTimeout(function () { h.classList.add('flipped'); }, 1700);
    setTimeout(function () {
      ok.classList.add('show');
      hint.textContent = '一样的是一对！小鸟回巢啦 ✓';
      playSound('ok');
    }, 2900);
  }

  runDemo();
})();
</script>
</body>
</html>
