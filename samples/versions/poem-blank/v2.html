<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08-40-46">
<meta name="aid-version-note" content="系统重跑 2026-08-14T08-40-46">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>古诗填空 · 静夜思</title>
<style>
  :root{
    --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d;
    --card:#fff; --night:#16294a; --night2:#0e1c33; --moon:#fbbf24;
    --cw: clamp(44px, 4.2vw, 52px); --r:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100dvh;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#eef3fa; color:var(--ink);
    display:flex; flex-direction:column;
  }
  main{
    flex:1; min-height:0; width:100%; max-width:1240px; margin:0 auto;
    display:flex; flex-direction:column; padding:10px 14px 8px; gap:8px;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    min-height:46px; padding:0 4px;
  }
  header h1{font-size:clamp(20px,2.6vw,26px); font-weight:800; letter-spacing:.5px}
  header .lv{font-size:16px; color:#5b7290; font-weight:600}
  #sceneCard{
    flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,var(--night) 0%,var(--night2) 100%);
    border-radius:var(--r); position:relative; overflow:hidden;
  }
  #scene{width:100%; height:100%; max-height:340px; display:block}
  #poemCard{
    background:var(--card); border-radius:var(--r); padding:10px 12px;
    box-shadow:0 4px 14px rgba(30,58,95,.08);
  }
  .pline{display:flex; justify-content:center; gap:2px; line-height:1.25}
  .char{
    width:var(--cw); height:var(--cw); display:inline-flex; align-items:center; justify-content:center;
    font-size:calc(var(--cw)*0.66); font-weight:700; flex:none;
  }
  .punct{width:calc(var(--cw)*0.55); font-weight:700; color:var(--ink); display:inline-flex; align-items:center; justify-content:center; flex:none}
  .slot{
    width:var(--cw); height:var(--cw); border:3px dashed #9db8d8; border-radius:10px;
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    font-size:calc(var(--cw)*0.66); font-weight:800; color:var(--ink);
    background:#f2f7fd; cursor:pointer; transition:border-color .2s, background .2s;
    position:relative;
  }
  .slot .q{color:#9db8d8}
  .slot.hover{border-color:var(--accent); background:#e8f1fc}
  .slot.filled{border-style:solid; border-color:var(--ok); background:#eafaf1; animation:pop .35s cubic-bezier(.25,1,.5,1)}
  .slot.filled .q{display:none}
  @keyframes pop{0%{transform:scale(.4) translateY(10px)}60%{transform:scale(1.12) translateY(-2px)}100%{transform:scale(1) translateY(0)}}
  #tiles{
    display:flex; justify-content:center; flex-wrap:wrap; gap:10px; min-height:64px; align-items:center;
  }
  .tile{
    min-width:64px; height:60px; padding:0 14px; border:none; border-radius:14px;
    background:var(--card); color:var(--ink); font-size:30px; font-weight:800;
    box-shadow:0 3px 0 rgba(30,58,95,.18), 0 6px 14px rgba(30,58,95,.10);
    cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
    display:inline-flex; align-items:center; justify-content:center;
    transition:transform .15s, opacity .2s, box-shadow .15s;
  }
  .tile.selected{border:3px solid var(--accent); box-shadow:0 0 0 4px rgba(47,111,191,.18)}
  .tile.used{opacity:.22; transform:scale(.7); pointer-events:none; box-shadow:none}
  .tile.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-5px)}}
  .tile.dragging{position:fixed; z-index:20; margin:0; pointer-events:none; transform:scale(1.08) rotate(-2deg); box-shadow:0 10px 24px rgba(30,58,95,.25)}
  #hintBox{
    min-height:58px; border-radius:var(--r); padding:10px 14px; font-size:20px; line-height:1.4;
    background:#eef3fa; display:flex; align-items:center; text-align:left;
  }
  #hintBox.normal{color:#5b7290}
  #hintBox.error{background:#fdecec; color:#a93c3c; border:2px solid var(--bad)}
  #hintBox.good{background:#eafaf1; color:#1f7a4d; border:2px solid var(--ok)}
  footer{
    display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:52px;
  }
  footer .tip{font-size:20px; color:#5b7290}
  #nextBtn{
    display:none; min-width:132px; height:56px; border:none; border-radius:16px;
    background:var(--accent); color:#fff; font-size:22px; font-weight:800; cursor:pointer;
    box-shadow:0 4px 0 #1d4f8a; transition:transform .15s;
  }
  #nextBtn:active{transform:translateY(2px); box-shadow:0 2px 0 #1d4f8a}
  /* 开场演示 */
  #intro{
    position:fixed; inset:0; z-index:50; background:rgba(14,28,51,.78);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  #intro .box{
    width:min(560px,94vw); background:var(--card); border-radius:20px; padding:20px 22px;
    display:flex; flex-direction:column; gap:12px; align-items:center;
  }
  #intro h2{font-size:30px; font-weight:800}
  #intro p{font-size:20px; line-height:1.55; text-align:left; color:#38506e}
  #intro svg{width:100%; max-width:380px; border-radius:14px; display:block}
  #introStart{
    width:100%; height:58px; border:none; border-radius:16px; background:var(--accent); color:#fff;
    font-size:24px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #1d4f8a;
  }
  .demoMoon{animation:demoMoon 1s cubic-bezier(.25,1,.5,1) forwards}
  @keyframes demoMoon{from{opacity:.3}to{opacity:1}}
  .demoRays{animation:demoRays 1s ease .4s forwards}
  @keyframes demoRays{from{opacity:0}to{opacity:1}}
  .demoTile{animation:demoTile 1.1s cubic-bezier(.25,1,.5,1) .5s forwards}
  @keyframes demoSlice{from{opacity:.3; transform:translateY(10px)}to{opacity:1; transform:none}}
  .demoSlice{animation:demoSlice .8s ease .4s forwards}
  /* 完成屏 */
  #done{
    position:fixed; inset:0; z-index:50; background:linear-gradient(180deg,var(--night),var(--night2));
    display:none; align-items:center; justify-content:center; padding:18px;
  }
  #done.show{display:flex}
  #done .box{
    width:min(680px,96vw); background:var(--card); border-radius:20px; padding:22px 24px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  #done h2{font-size:30px; font-weight:800}
  #done .poem{
    font-size:clamp(24px,3.4vw,34px); font-weight:700; line-height:1.7; text-align:center; color:var(--ink);
  }
  #done .say{font-size:20px; color:#38506e; line-height:1.55; text-align:left}
  #done svg{width:min(320px,80%); max-height:150px; display:block}
  #replayBtn{
    width:100%; height:56px; border:none; border-radius:16px; background:var(--accent); color:#fff;
    font-size:22px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #1d4f8a;
  }
  /* 场景元素 */
  #moon{transition:opacity .6s cubic-bezier(.25,1,.5,1)}
  #moonGlow,#rays,#gaze{transition:opacity .6s cubic-bezier(.25,1,.5,1)}
  #gaze{transition:stroke-dashoffset .7s cubic-bezier(.25,1,.5,1), opacity .4s}
  #frostBand{transition:opacity .7s cubic-bezier(.25,1,.5,1)}
  #frostDots circle{transition:opacity .7s ease}
  #poetHead{transform-box:fill-box; transform-origin:center 78%; transition:transform .5s cubic-bezier(.25,1,.5,1)}
  #bubble{transform-box:fill-box; transform-origin:center bottom; transition:transform .5s cubic-bezier(.25,1,.5,1), opacity .4s}
  #bubbleWin{transition:fill .4s ease}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important}
  }
  @media (max-height:660px){
    #hintBox{min-height:46px; padding:6px 12px; font-size:19px}
    footer .tip{font-size:18px}
    #scene{max-height:210px}
  }
</style>
</head>
<body>

<!-- 开场演示 -->
<div id="intro" role="dialog" aria-label="玩法演示">
  <div class="box">
    <h2>静夜思 · 李白</h2>
    <p>夜里，小诗人看见月光，想起了远方的故乡。他写下这首诗，有几个字丢了——把字放回空位，月光就会亮起来。</p>
    <svg viewBox="0 0 380 170" aria-hidden="true">
      <rect width="380" height="170" rx="12" fill="#16294a"/>
      <circle class="demoMoon" cx="300" cy="46" r="24" fill="#fbbf24"/>
      <g class="demoRays" stroke="#fbbf24" stroke-width="2.5" opacity="0">
        <line x1="300" y1="10" x2="300" y2="20"/><line x1="334" y1="24" x2="327" y2="32"/>
        <line x1="336" y1="60" x2="326" y2="57"/><line x1="300" y1="82" x2="300" y2="72"/>
      </g>
      <rect x="0" y="142" width="380" height="28" fill="#0e1c33"/>
      <rect x="0" y="140" width="380" height="8" rx="4" fill="#cfe4ff" opacity="0" class="demoSlice"/>
      <circle cx="70" cy="112" r="17" fill="#334155"/>
      <circle cx="62" cy="96" r="13" fill="#334155"/><circle cx="58" cy="94" r="2" fill="#fff"/><circle cx="67" cy="94" r="2" fill="#fff"/>
      <line x1="62" y1="109" x2="56" y2="126" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <line x1="78" y1="109" x2="84" y2="126" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <g class="demoTile" opacity="0">
        <rect x="150" y="108" width="52" height="52" rx="12" fill="#fff"/>
        <text x="176" y="143" font-size="28" font-weight="800" fill="#1e3a5f" text-anchor="middle">月</text>
        <line x1="196" y1="118" x2="284" y2="92" stroke="#2f6fbf" stroke-width="3"/>
        <rect x="252" y="84" width="52" height="52" rx="12" fill="none" stroke="#2f6fbf" stroke-width="2.5" stroke-dasharray="6 5"/>

    <button id="introStart">开始填字</button>
  </div>
</div>

<main id="app">
  <header>
    <h1>静夜思</h1>
    <div class="lv" id="lvLabel">第一关</div>
  </header>

  <section id="sceneCard" aria-label="诗意场景">
    <svg id="scene" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="静夜思场景：夜空、月亮、诗人">
      <rect width="640" height="300" fill="url(#skyGrad)"/>
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b3154"/><stop offset="1" stop-color="#101f3a"/>
        </linearGradient>
      </defs>
      <circle cx="120" cy="50" r="2" fill="#cfe0ff" opacity=".55"/>
      <circle cx="200" cy="90" r="1.6" fill="#cfe0ff" opacity=".4"/>
      <circle cx="70" cy="110" r="1.4" fill="#cfe0ff" opacity=".35"/>
      <!-- 月亮 -->
      <circle id="moonGlow" cx="505" cy="72" r="52" fill="#fbbf24" opacity="0"/>
      <circle id="moon" cx="505" cy="72" r="30" fill="#fbbf24" opacity=".32"/>
      <g id="rays" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity="0">
        <line x1="505" y1="28" x2="505" y2="38"/><line x1="540" y1="42" x2="532" y2="50"/>
        <line x1="552" y1="72" x2="542" y2="72"/><line x1="540" y1="102" x2="532" y2="94"/>
        <line x1="505" y1="116" x2="505" y2="106"/><line x1="470" y1="102" x2="478" y2="94"/>
      </g>
      <!-- 远山与故乡小屋 -->
      <path d="M0,228 L110,186 L190,216 L300,172 L420,208 L540,180 L640,210 L640,300 L0,300 Z" fill="#0d1b30"/>
      <g id="home">
        <rect x="566" y="196" width="36" height="30" fill="#14233f"/>
        <path d="M560,198 L584,172 L608,198 Z" fill="#14233f"/>
        <rect id="homeWin" x="574" y="204" width="8" height="9" fill="#fbbf24" opacity=".8"/>
      </g>
      <!-- 地面与霜 -->
      <rect x="0" y="226" width="640" height="74" fill="#0e1c33"/>
      <rect id="frostBand" x="0" y="226" width="640" height="16" fill="#cfe4ff" opacity="0"/>
      <g id="frostDots" fill="#dbeafe">
        <circle cx="90" cy="230" r="2" opacity="0"/><circle cx="170" cy="234" r="1.6" opacity="0"/>
        <circle cx="250" cy="229" r="2.2" opacity="0"/><circle cx="360" cy="233" r="1.7" opacity="0"/>
        <circle cx="470" cy="230" r="2" opacity="0"/><circle cx="560" cy="234" r="1.8" opacity="0"/>
      </g>
      <!-- 小诗人 -->
      <g id="poet">
        <g id="poetHead">
          <circle cx="230" cy="176" r="15" fill="#334155"/>
          <circle cx="225" cy="173" r="2.2" fill="#fff"/><circle cx="235" cy="173" r="2.2" fill="#fff"/>
        </g>
        <ellipse cx="230" cy="206" rx="25" ry="19" fill="#334155"/>
        <line x1="213" y1="212" x2="202" y2="228" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
        <line x1="247" y1="212" x2="258" y2="228" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
        <line x1="211" y1="197" x2="198" y2="208" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="249" y1="197" x2="262" y2="208" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <!-- 望月的视线 -->
      <path id="gaze" d="M235,173 C300,140 380,105 470,85" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="340" stroke-dashoffset="340" opacity="0" stroke-linecap="round"/>
      <!-- 思乡泡泡 -->
      <g id="bubble" opacity="0">
        <rect x="196" y="96" width="90" height="64" rx="14" fill="#fff" opacity=".94"/>
        <circle cx="238" cy="160" r="7" fill="#fff" opacity=".9"/>
        <circle cx="232" cy="148" r="4.5" fill="#fff" opacity=".85"/>
        <path d="M204,152 L228,132 L246,146 L264,128 L282,146 L282,152 Z" fill="#0d1b30"/>
        <rect x="240" y="138" width="16" height="12" fill="#14233f"/>
        <path d="M237,140 L248,130 L259,140 Z" fill="#14233f"/>
        <rect id="bubbleWin" x="244" y="141" width="4" height="4" fill="#fbbf24"/>
      </g>
    </svg>
  </section>

  <section id="poemCard" aria-label="诗句填空"></section>

  <section id="tiles" aria-label="备选字块"></section>

  <div id="hintBox" class="normal" role="status"></div>

  <footer>
    <div class="tip" id="tip">拖字块到空位，或先点字块再点空位</div>
    <button id="nextBtn">下一关 ▶</button>
  </footer>
</main>

<!-- 完成屏 -->
<div id="done" role="dialog" aria-label="完成">
  <div class="box">
    <h2>你会背《静夜思》啦！</h2>
    <svg viewBox="0 0 320 150" aria-hidden="true">
      <rect width="320" height="150" rx="12" fill="#16294a"/>
      <circle cx="250" cy="42" r="22" fill="#fbbf24"/>
      <rect x="0" y="124" width="320" height="26" fill="#0e1c33"/>
      <rect x="0" y="122" width="320" height="8" rx="4" fill="#cfe4ff" opacity=".55"/>
      <circle cx="70" cy="96" r="15" fill="#334155"/>
      <circle cx="62" cy="82" r="12" fill="#334155"/><circle cx="58" cy="80" r="1.8" fill="#fff"/><circle cx="66" cy="80" r="1.8" fill="#fff"/>
      <line x1="62" y1="94" x2="56" y2="110" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <line x1="78" y1="94" x2="84" y2="110" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
      <path d="M66,82 C110,60 150,45 210,52" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="200" stroke-dashoffset="200"/>
    </svg>
    <div class="poem">床前明月光，疑是地上霜。<br>举头望明月，低头思故乡。</div>
    <div class="say"><b>我会说：</b>晚上看到月亮，可以把这首诗背给家人听，边背边想：诗人抬起头看月亮，低下头就想家了。</div>
    <button id="replayBtn">再玩一次</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(s){return document.querySelector(s)};
  var INTRO=$("#intro"), APP=$("#app"), DONE=$("#done");
  var poemCard=$("#poemCard"), tilesBox=$("#tiles"), hint=$("#hintBox");
  var lvLabel=$("#lvLabel"), tip=$("#tip"), nextBtn=$("#nextBtn");

  var scene={moon:$("#moon"),glow:$("#moonGlow"),rays:$("#rays"),frost:$("#frostBand"),dots:$("#frostDots"),
    head:$("#poetHead"),gaze:$("#gaze"),bubble:$("#bubble"),bubbleWin:$("#bubbleWin"),homeWin:$("#homeWin")};
  var gazeLen=scene.gaze.getTotalLength();
  scene.gaze.style.strokeDasharray=gazeLen;
  scene.gaze.style.strokeDashoffset=gazeLen;

  var POEM=[
    ["床","前","明",{a:"月"},"光"],
    ["疑","是","地","上",{a:"霜"}],
    ["举","头","望","明","月"],
    ["低","头","思","故","乡"]
  ];
  var LEVELS=[
    {
      name:"第一关 · 月光", goal:"把「月」和「霜」放回诗句",
      tiles:["月","霜","光"],
      fx:{月:"moon",霜:"frost"},
      hints:{
        "月":"「光」已经写在句尾啦。这句是「床前明月光」——发光的是月亮，空里要填「月」。",
        "霜":"「疑是地上霜」——诗人以为地上白白的一层是霜，不是光。这里要填「霜」。"
      }
    },
    {
      name:"第二关 · 望月", goal:"把动作和心情放回诗句",
      tiles:["举","望","低","乡","仰"],
      fx:{举:"up",望:"gaze",低:"down",乡:"dream"},
      hints:{
        "举":"「仰」也是抬头，可诗人写的原字是「举」。古诗的字不能换，这里要填「举」。",
        "望":"「望」是远远地、静静地看月亮。原句是「举头望明月」，这里要填「望」。",
        "低":"「低」和「抬」方向相反。这句是「低头思故乡」——诗人低下头想家，要填「低」。",
        "乡":"「乡」就是故乡、老家。诗人想的是远方的故乡，这里要填「乡」。"
      }
    },
    {
      name:"第三关 · 故乡", goal:"把整首诗补完整",
      tiles:["明","疑","上","头","思","故","白"],
      fx:{明:"moon",疑:"frost",上:"frostMore",头:"up",思:"dream",故:"home"},
      hints:{
        "明":"「明」是亮亮的。床前是明亮的月光，不是「白」光，要填「明」。",
        "疑":"「疑」是「好像、以为」的意思——诗人以为是霜，其实是月光。要填「疑」。",
        "上":"这句是「疑是地上霜」，『地上』的「上」就在这里，要填「上」。",
        "头":"「举头」就是抬起头，这里要填「头」。",
        "思":"「思」是想念。低下头想念故乡，要填「思」。",
        "故":"「故乡」就是老家，两个字在一起，这里要填「故」。"
      }
    }
  ];
  var LEVEL4={
    name:"举一反三 · 排顺序", goal:"把四句诗排回原来的顺序",
    lines:["床前明月光，","疑是地上霜，","举头望明月，","低头思故乡。"]
  };

  var cur=null, slots=[], tiles=[], selectedTile=null, filledCount=0, totalSlots=0;
  var dragging=null, dragMoved=false, dragStart={x:0,y:0};

  function shuffle(arr){
    var a=arr.slice();
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }

  function showHint(msg,cls){
    hint.textContent=msg; hint.className=cls||"normal";
  }

  function resetScene(){
    scene.moon.style.opacity=".32"; scene.glow.style.opacity="0"; scene.rays.style.opacity="0";
    scene.frost.style.opacity="0";
    var dots=scene.dots.querySelectorAll("circle");
    for(var i=0;i<dots.length;i++) dots[i].style.opacity="0";
    scene.head.style.transform="rotate(0deg)";
    scene.gaze.style.strokeDashoffset=gazeLen; scene.gaze.style.opacity="0";
    scene.bubble.style.transform="scale(0)"; scene.bubble.style.opacity="0";
    scene.bubbleWin.style.fill="#fbbf24"; scene.homeWin.style.fill="#fbbf24";
  }

  function applyFx(kind){
    switch(kind){
      case "moon":
        scene.moon.style.opacity="1"; scene.glow.style.opacity=".22"; scene.rays.style.opacity="1"; break;
      case "frost":
        scene.frost.style.opacity=".3"; scene.dots.querySelectorAll("circle")[0].style.opacity=".8";
        scene.dots.querySelectorAll("circle")[1].style.opacity=".7"; break;
      case "frostMore":
        scene.frost.style.opacity=".55";
        var ds=scene.dots.querySelectorAll("circle");
        for(var i=0;i<ds.length;i++) ds[i].style.opacity=".8"; break;
      case "up": scene.head.style.transform="rotate(-18deg)"; break;
      case "down": scene.head.style.transform="rotate(16deg)"; break;
      case "gaze": scene.gaze.style.strokeDashoffset="0"; scene.gaze.style.opacity="1"; break;
      case "dream":
        scene.bubble.style.transform="scale(1)"; scene.bubble.style.opacity="1"; break;
      case "home":
        scene.head.style.transform="rotate(16deg)";
        scene.bubble.style.transform="scale(1)"; scene.bubble.style.opacity="1";
        scene.bubbleWin.style.fill="#f59e0b"; scene.homeWin.style.fill="#f59e0b"; break;
    }
  }

  function buildPoem(lines){
    poemCard.innerHTML="";
    slots=[];
    lines.forEach(function(line){
      var row=document.createElement("div"); row.className="pline";
      line.forEach(function(item){
        if(typeof item==="string"){
          var ch=document.createElement("span");
          if(/[，。！？、]/.test(item)){ch.className="punct";}
          else{ch.className="char";}
          ch.textContent=item; row.appendChild(ch);
        }else{
          var s=document.createElement("span");
          s.className="slot"; s.dataset.ans=item.a;
          s.innerHTML='<span class="q">?</span>';
          s.addEventListener("pointerup",function(ev){
            ev.preventDefault();
            if(s.classList.contains("filled")) return;
            if(selectedTile){ tryPlace(selectedTile.dataset.char, s); deselectTile(); }
          });
          row.appendChild(s); slots.push(s);
        }
      });
      poemCard.appendChild(row);
    });
    totalSlots=slots.length; filledCount=0;
  }

  function buildTiles(chars){
    tilesBox.innerHTML="";
    tiles=[];
    shuffle(chars).forEach(function(c){
      var t=document.createElement("button");
      t.className="tile"; t.dataset.char=c; t.textContent=c; t.type="button";
      t.addEventListener("pointerdown",function(ev){
        ev.preventDefault();
        dragStart={x:ev.clientX,y:ev.clientY}; dragMoved=false;
        dragging=t; t.setPointerCapture(ev.pointerId);
      });
      t.addEventListener("pointermove",function(ev){
        if(dragging!==t) return;
        var dx=ev.clientX-dragStart.x, dy=ev.clientY-dragStart.y;
        if(Math.abs(dx)>6||Math.abs(dy)>6) dragMoved=true;
        if(dragMoved){
          t.classList.add("dragging");
          t.style.left=(ev.clientX-t.offsetWidth/2)+"px";
          t.style.top=(ev.clientY-t.offsetHeight/2)+"px";
          highlightNearSlot(ev.clientX,ev.clientY);
        }
      });
      t.addEventListener("pointerup",function(ev){
        if(dragging!==t) return;
        if(dragMoved){
          var s=findNearSlot(ev.clientX,ev.clientY);
          t.classList.remove("dragging"); t.style.left=""; t.style.top="";
          clearSlotHover();
          if(s){ if(!tryPlace(t.dataset.char,s)){ shakeTile(t);} }
          else { shakeTile(t); showHint("把字块拖到诗句的空位里，或者先点字块、再点空位。","normal"); }
        }else{
          if(t.classList.contains("used")) return;
          if(selectedTile===t){ deselectTile(); }
          else{ selectTile(t); }
        }
        dragging=null;
      });
      tilesBox.appendChild(t); tiles.push(t);
    });
  }

  function selectTile(t){
    if(selectedTile) selectedTile.classList.remove("selected");
    selectedTile=t; t.classList.add("selected");
    showHint("点一下诗句里的空位，把「"+t.dataset.char+"」放进去。","normal");
  }
  function deselectTile(){
    if(selectedTile) selectedTile.classList.remove("selected");
    selectedTile=null;
  }

  function highlightNearSlot(x,y){
    clearSlotHover();
    var s=findNearSlot(x,y);
    if(s && !s.classList.contains("filled")) s.classList.add("hover");
  }
  function clearSlotHover(){
    slots.forEach(function(s){s.classList.remove("hover")});
  }
  function findNearSlot(x,y){
    var best=null,bd=1e9;
    slots.forEach(function(s){
      if(s.classList.contains("filled")) return;
      var r=s.getBoundingClientRect();
      var cx=r.left+r.width/2, cy=r.top+r.height/2;
      var d=Math.hypot(x-cx,y-cy);
      if(d<bd && d<Math.max(r.width,r.height)*1.9){bd=d;best=s;}
    });
    return best;
  }

  function tryPlace(ch,slot){
    if(slot.dataset.ans===ch){
      slot.classList.add("filled");
      var c=document.createElement("span");
      c.textContent=ch; slot.appendChild(c);
      var used=null;
      for(var i=0;i<tiles.length;i++) if(tiles[i].dataset.char===ch && !tiles[i].classList.contains("used")){used=tiles[i];break;}
      if(used) used.classList.add("used");
      filledCount++;
      applyFx(cur.fx[ch]);
      showHint("「"+ch+"」放对啦！诗句和画面一起亮起来。","good");
      if(filledCount===totalSlots) levelDone();
      return true;
    }
    showHint(cur.hints[slot.dataset.ans]||"这句诗里要填「"+slot.dataset.ans+"」，再试试。","error");
    return false;
  }

  function shakeTile(t){
    t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake");
    setTimeout(function(){t.classList.remove("shake")},450);
  }

  function levelDone(){
    nextBtn.style.display="inline-flex";
    nextBtn.textContent = (cur===LEVEL4 || cur===LEVELS[LEVELS.length-1]) ? "看看全诗 ✦" : "下一关 ▶";
    tip.textContent="全部填对！";
  }

  function startLevel(idx){
    deselectTile(); nextBtn.style.display="none";
    resetScene(); showHint("", "normal");
    if(idx<LEVELS.length){
      cur=LEVELS[idx];
      lvLabel.textContent=(idx+1)+" / "+(LEVELS.length+1)+" 关 · "+cur.name;
      tip.textContent=cur.goal;
      buildPoem(POEM);
      buildTiles(cur.tiles);
    }else{
      cur=LEVEL4;
      lvLabel.textContent=(LEVELS.length+1)+" / "+(LEVELS.length+1)+" 关 · "+cur.name;
      tip.textContent=cur.goal;
      buildLevel4();
    }
  }

  function buildLevel4(){
    poemCard.innerHTML=""; slots=[];
    var row=document.createElement("div");
    row.className="pline"; row.style.flexWrap="wrap"; row.style.gap="6px";
    for(var i=0;i<4;i++){
      var s=document.createElement("div");
      s.className="slot"; s.style.width="auto"; s.style.padding="0 10px"; s.style.minWidth="200px"; s.style.height="54px";
      s.style.borderRadius="12px"; s.style.fontSize="24px";
      s.innerHTML='<span class="q">第 '+(i+1)+' 句</span>';
      s.addEventListener("pointerup",function(ev){
        ev.preventDefault();
        if(s.classList.contains("filled")) return;
        if(selectedTile){ tryPlace4(selectedTile.dataset.char, s); deselectTile(); }
      });
      row.appendChild(s); slots.push(s);
    }
    poemCard.appendChild(row);

    tilesBox.innerHTML=""; tiles=[];
    shuffle(LEVEL4.lines).forEach(function(line){
      var t=document.createElement("button");
      t.className="tile"; t.dataset.char=line; t.textContent=line; t.type="button";
      t.style.fontSize="24px"; t.style.minWidth="auto"; t.style.padding="0 12px";
      t.style.height="54px";
      t.addEventListener("pointerdown",function(ev){
        ev.preventDefault();
        dragStart={x:ev.clientX,y:ev.clientY}; dragMoved=false;
        dragging=t; t.setPointerCapture(ev.pointerId);
      });
      t.addEventListener("pointermove",function(ev){
        if(dragging!==t) return;
        var dx=ev.clientX-dragStart.x, dy=ev.clientY-dragStart.y;
        if(Math.abs(dx)>6||Math.abs(dy)>6) dragMoved=true;
        if(dragMoved){
          t.classList.add("dragging");
          t.style.left=(ev.clientX-t.offsetWidth/2)+"px";
          t.style.top=(ev.clientY-t.offsetHeight/2)+"px";
          highlightNearSlot(ev.clientX,ev.clientY);
        }
      });
      t.addEventListener("pointerup",function(ev){
        if(dragging!==t) return;
        if(dragMoved){
          var s=findNearSlot(ev.clientX,ev.clientY);
          t.classList.remove("dragging"); t.style.left=""; t.style.top="";
          clearSlotHover();
          if(s){ if(!tryPlace4(t.dataset.char,s)) shakeTile(t); }
          else { shakeTile(t); showHint("把句子拖到上面的空位里。","normal"); }
        }else{
          if(t.classList.contains("used")) return;
          if(selectedTile===t) deselectTile(); else selectTile(t);
        }
        dragging=null;
      });
      tilesBox.appendChild(t); tiles.push(t);
    });
  }

  var LINE_ORDER=["床前明月光，","疑是地上霜，","举头望明月，","低头思故乡。"];
  var LINE_HINT={
    "疑是地上霜，":"这一句是诗人低头看地上——床前有了月光，接着写地上白白一片像霜。它该排第 2 句。",
    "举头望明月，":"这一句是诗人抬起头看月亮——看完地上，再抬头看天上。它该排第 3 句。",
    "低头思故乡。":"这一句是诗人低下头想家，是全诗的结尾。它该排第 4 句。",
    "床前明月光，":"这一句先写床前的月光——诗是从眼前的光开始写的。它该排第 1 句。"
  };
  function tryPlace4(line,slot){
    var idx=slot.dataset.idx!==undefined? +slot.dataset.idx : slots.indexOf(slot);
    if(LINE_ORDER[idx]===line){
      slot.classList.add("filled");
      var c=document.createElement("span"); c.textContent=line.replace(/[，。]/g,"");
      slot.innerHTML=""; slot.appendChild(c);
      var used=null;
      for(var i=0;i<tiles.length;i++) if(tiles[i].dataset.char===line && !tiles[i].classList.contains("used")){used=tiles[i];break;}
      if(used) used.classList.add("used");
      filledCount++;
      if(filledCount===4){
        scene.moon.style.opacity="1"; scene.glow.style.opacity=".22"; scene.rays.style.opacity="1";
        scene.frost.style.opacity=".55";
        showHint("顺序对啦！诗就是这样一句一句读下来的。","good");
        levelDone();
      }else{
        showHint("排对一句！继续把剩下的句子排回原位。","good");
      }
      return true;
    }
    showHint(LINE_HINT[line]||"这句的位置不太对，再想想。","error");
    return false;
  }

  nextBtn.addEventListener("click",function(){
    if(cur===LEVEL4 || (cur && cur.name===LEVELS[LEVELS.length-1].name && filledCount===totalSlots)){
      showDone();
    }else{
      var idx=LEVELS.indexOf(cur);
      startLevel(idx+1);
    }
  });

  function showDone(){
    DONE.classList.add("show");
    $("#replayBtn").addEventListener("click",function(){location.reload()});
  }

  $("#introStart").addEventListener("click",function(){
    INTRO.style.display="none";
    startLevel(0);
  });
})();
</script>
