<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08-40-46">
<meta name="aid-version-note" content="系统重跑 2026-08-14T08-40-46">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反义词配对</title>
<style>
  :root{
    --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d; --card:#fff;
    --bg:#eef5fc; --line:rgba(30,58,95,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100dvh; overflow:hidden; margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:var(--bg); font-size:16px;
  }
  #app{height:100%; display:flex; flex-direction:column; max-width:min(1240px,100%); margin:0 auto;}

  /* header */
  header{display:flex; align-items:center; gap:12px; padding:10px 18px 4px;}
  .buddy{width:52px; height:52px; flex:none;}
  .buddy.big{width:84px; height:84px;}
  h1{margin:0; font-size:clamp(20px,3vw,28px); letter-spacing:.5px;}
  #progress{margin-left:auto; font-size:16px; font-weight:600; opacity:.75; white-space:nowrap;}

  /* game area */
  #game{position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; gap:5%; padding:8px 4%;}
  #links{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .linkPath{fill:none; stroke:var(--ok); stroke-width:5; stroke-linecap:round;
    transition:stroke-dashoffset .55s cubic-bezier(.25,1,.5,1);}
  .col{display:flex; flex-direction:column; gap:14px; align-items:center; flex:1; max-width:240px; min-width:0;}

  .word-card{
    position:relative; display:flex; align-items:center; justify-content:center; gap:10px;
    min-width:150px; min-height:74px; padding:10px 20px; border-radius:18px;
    background:var(--card); border:2.5px solid var(--line); color:var(--ink);
    font-size:30px; font-weight:800; line-height:1; cursor:pointer;
    touch-action:none; user-select:none;
    box-shadow:0 3px 0 rgba(30,58,95,.10);
    transition:transform .18s cubic-bezier(.25,1,.5,1), border-color .2s, background .2s, opacity .2s;
  }
  .word-card:active{transform:scale(.97);}
  .c-emoji{font-size:24px;}
  .word-card.sel{border-color:var(--accent); background:#e8f1fd; transform:scale(1.05); box-shadow:0 6px 0 rgba(47,111,191,.18);}
  .word-card.matched{border-color:var(--ok); background:#e8f9ef; cursor:default;}
  .word-card.matched::after{
    content:'✓'; position:absolute; top:-11px; right:-11px; width:30px; height:30px;
    border-radius:50%; background:var(--ok); color:#fff; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .word-card.bad{border-color:var(--bad); background:#fff0f0;}
  .word-card.shake{animation:shake .5s;}
  .word-card.origin{opacity:.35;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .dragClone{
    position:fixed; z-index:60; pointer-events:none; display:flex; align-items:center; justify-content:center; gap:10px;
    min-width:150px; min-height:74px; padding:10px 20px; border-radius:18px;
    background:var(--card); border:2.5px solid var(--accent); color:var(--ink);
    font-size:30px; font-weight:800; line-height:1;
    box-shadow:0 12px 24px rgba(30,58,95,.28); transform:scale(1.06);
  }

  /* msg */
  #msgBar{min-height:46px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:4px 18px; font-size:17px; font-weight:600; line-height:1.4;}
  #msgBar.ok{color:var(--ok);}
  #msgBar.bad{color:var(--bad);}

  /* footer */
  footer{display:flex; align-items:center; gap:12px; padding:6px 18px 14px;}
  #hint{font-size:16px; opacity:.8; line-height:1.4;}
  #restart{margin-left:auto;}
  .btn{
    min-height:48px; padding:0 24px; border:none; border-radius:14px;
    background:var(--accent); color:#fff; font-size:18px; font-weight:700; cursor:pointer;
    font-family:inherit; transition:transform .15s cubic-bezier(.25,1,.5,1);
  }
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:#fff; color:var(--accent); border:2px solid var(--accent);}

  /* win overlay */
  #win{position:absolute; inset:0; background:rgba(255,255,255,.94); z-index:30;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px;}
  #win.show{display:flex;}
  #winTitle{font-size:clamp(24px,4vw,36px); margin:0;}
  #winSub{font-size:18px; max-width:520px; line-height:1.6; margin:0;}
  #win .buddy{animation:jump .8s ease 2;}
  @keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
  .buddy.jump{animation:jump .55s ease;}
  .win-heart{font-size:44px;}

  /* demo overlay */
  #demo{position:fixed; inset:0; background:#e8f1fd; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:20px;}
  #demo.hide{display:none;}
  .demo-tip{font-size:clamp(20px,3.4vw,28px); font-weight:800; margin:0;}
  .demo-cards{position:relative; width:min(460px,86vw); height:120px;}
  .demo-card{
    position:absolute; top:8px; width:132px; height:92px; border-radius:18px;
    background:#fff; border:2.5px solid var(--ink); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:34px; font-weight:800; line-height:1;
  }
  .dc-big{left:0; animation:demoFly 4.6s cubic-bezier(.45,0,.55,1) 1 forwards;}
  .dc-small{right:0;}
  .demo-heart{position:absolute; left:50%; top:0; font-size:38px; transform:translate(-50%,0) scale(0); opacity:0; animation:heartPop 4.6s ease 1 forwards;}
  @keyframes demoFly{
    0%,28%{transform:translateX(0);}
    52%{transform:translateX(230%);}
    100%{transform:translateX(230%);}
  }
  @keyframes heartPop{
    0%,50%{opacity:0; transform:translate(-50%,0) scale(0);}
    68%{opacity:1; transform:translate(-50%,0) scale(1.15);}
    78%{opacity:1; transform:translate(-50%,0) scale(1);}
    100%{opacity:1; transform:translate(-50%,0) scale(1);}
  }
  .demo-sub{font-size:16px; opacity:.8; margin:0;}
  #demoStart{min-width:200px;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important;}
    .dc-big{transform:translateX(230%);}
    .demo-heart{opacity:1; transform:translate(-50%,0) scale(1);}
    #win .buddy{animation:none;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="buddy" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M28 74 q-12 -14 -2 -22 M92 74 q12 -14 2 -22" stroke="#1e3a5f" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M38 94 q-8 18 4 24 M82 94 q8 18 -4 24" stroke="#1e3a5f" stroke-width="7" fill="none" stroke-linecap="round"/>
      <ellipse cx="60" cy="74" rx="32" ry="38" fill="#1e3a5f"/>
      <circle cx="47" cy="66" r="5.5" fill="#fff"/>
      <circle cx="73" cy="66" r="5.5" fill="#fff"/>
      <path d="M51 84 q9 11 18 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>反义词找朋友</h1>
    <div id="progress">第 1 关</div>
  </header>

  <section id="game">
    <svg id="links" aria-hidden="true"></svg>
    <div class="col" id="leftCol"></div>
    <div class="col" id="rightCol"></div>

    <div id="win" role="dialog" aria-label="过关">
      <div class="win-heart">🎉</div>
      <svg class="buddy big" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M28 74 q-12 -14 -2 -22 M92 74 q12 -14 2 -22" stroke="#1e3a5f" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M38 94 q-8 18 4 24 M82 94 q8 18 -4 24" stroke="#1e3a5f" stroke-width="7" fill="none" stroke-linecap="round"/>
        <ellipse cx="60" cy="74" rx="32" ry="38" fill="#1e3a5f"/>
        <circle cx="47" cy="66" r="5.5" fill="#fff"/>
        <circle cx="73" cy="66" r="5.5" fill="#fff"/>
        <path d="M51 84 q9 11 18 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      </svg>
      <h2 id="winTitle">全部找到好朋友啦！</h2>
      <p id="winSub">反义词就是意思相反的词，它们是一对好朋友。</p>
      <button class="btn" id="winBtn" type="button">下一关</button>
    </div>
  </section>

  <div id="msgBar" aria-live="polite"></div>

  <footer>
    <div id="hint">大 和 小、高 和 矮、多 和 少</div>
    <button class="btn ghost" id="restart" type="button">↻ 重新开始</button>
  </footer>
</div>

<!-- 开场演示 -->
<div id="demo" role="dialog" aria-label="玩法演示">
  <svg class="buddy big" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M28 74 q-12 -14 -2 -22 M92 74 q12 -14 2 -22" stroke="#1e3a5f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M38 94 q-8 18 4 24 M82 94 q8 18 -4 24" stroke="#1e3a5f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="60" cy="74" rx="32" ry="38" fill="#1e3a5f"/>
    <circle cx="47" cy="66" r="5.5" fill="#fff"/>
    <circle cx="73" cy="66" r="5.5" fill="#fff"/>
    <path d="M51 84 q9 11 18 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </svg>
  <p class="demo-tip">意思相反的词，是好朋友！</p>
  <div class="demo-cards">
    <div class="demo-card dc-big"><span class="c-emoji">🐘</span><span>大</span></div>
    <div class="demo-card dc-small"><span class="c-emoji">🐭</span><span>小</span></div>
    <div class="demo-heart">❤️</div>
  </div>
  <p class="demo-sub">把「大」送到「小」旁边，它们就手拉手啦！</p>
  <button class="btn" id="demoStart" type="button">跳过 · 开始玩</button>
</div>

<script>
(function(){
  'use strict';
  var LEVELS = [
    {
      hint:'大 和 小、高 和 矮、多 和 少',
      pairs:[
        {a:'大', ai:'🐘', b:'小', bi:'🐭'},
        {a:'高', ai:'🦒', b:'矮', bi:'🐢'},
        {a:'多', ai:'⭐⭐⭐', b:'少', bi:'⭐'}
      ]
    },
    {
      hint:'快 和 慢、冷 和 热、黑 和 白、开 和 关',
      pairs:[
        {a:'快', ai:'🐇', b:'慢', bi:'🐌'},
        {a:'冷', ai:'🧊', b:'热', bi:'☀️'},
        {a:'黑', ai:'🌙', b:'白', bi:'❄️'},
        {a:'开', ai:'🔓', b:'关', bi:'🔒'}
      ]
    },
    {
      hint:'上 和 下、笑 和 哭、长 和 短、里 和 外',
      pairs:[
        {a:'上', ai:'⬆️', b:'下', bi:'⬇️'},
        {a:'笑', ai:'😄', b:'哭', bi:'😢'},
        {a:'长', ai:'🐍', b:'短', bi:'🐛'},
        {a:'里', ai:'🏠', b:'外', bi:'🌳'}
      ]
    }
  ];

  var app = document.getElementById('app');
  var leftCol = document.getElementById('leftCol');
  var rightCol = document.getElementById('rightCol');
  var svg = document.getElementById('links');
  var msgBar = document.getElementById('msgBar');
  var win = document.getElementById('win');
  var winBtn = document.getElementById('winBtn');

  var levelIdx = 0;
  var cards = [];
  var lines = [];
  var selected = null;
  var matchedCount = 0;
  var busy = false;
  var drag = null;

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function msg(t, cls){
    msgBar.textContent = t || '';
    msgBar.className = cls || '';
  }

  function beep(freqs, type, dur){
    try{
      var ctx = window.__audioCtx || (window.__audioCtx = new (window.AudioContext||window.webkitAudioContext)());
      var t0 = ctx.currentTime;
      freqs.forEach(function(f,i){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.type = type||'sine'; o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        var t = t0 + i*(dur||0.13);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.13));
        o.start(t); o.stop(t+(dur||0.13)+0.05);
      });
    }catch(e){}
  }

  function isPair(w1,w2){
    var lv=LEVELS[levelIdx];
    for(var i=0;i<lv.pairs.length;i++){
      var p=lv.pairs[i];
      if((p.a===w1&&p.b===w2)||(p.a===w2&&p.b===w1)) return p;
    }
    return null;
  }

  function wrongMsg(aWord,xWord){
    var lv=LEVELS[levelIdx];
    var pa=null, px=null;
    for(var i=0;i<lv.pairs.length;i++){
      var p=lv.pairs[i];
      if(p.a===aWord||p.b===aWord) pa=p;
      if(p.a===xWord||p.b===xWord) px=p;
    }
    var aOpp = pa.a===aWord?pa.b:pa.a;
    var xOpp = px.a===xWord?px.b:px.a;
    return '“'+aWord+'”的相反是“'+aOpp+'”，不是“'+xWord+'”。“'+xWord+'”的好朋友是“'+xOpp+'”。再找找看！';
  }

  function drawLine(c1,c2){
    var gr=document.getElementById('game').getBoundingClientRect();
    var ar=c1.el.getBoundingClientRect(), br=c2.el.getBoundingClientRect();
    var x1=ar.left+ar.width/2-gr.left, y1=ar.top+ar.height/2-gr.top;
    var x2=br.left+br.width/2-gr.left, y2=br.top+br.height/2-gr.top;
    var mid=(x1+x2)/2, topY=Math.min(y1,y2)-34;
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M '+x1+' '+y1+' Q '+mid+' '+topY+' '+x2+' '+y2);
    path.setAttribute('class','linkPath');
    svg.appendChild(path);
    var len=path.getTotalLength();
    path.style.strokeDasharray=len;
    path.style.strokeDashoffset=len;
    requestAnimationFrame(function(){ path.style.strokeDashoffset=0; });
    lines.push({a:c1,b:c2,path:path});
  }

  function redrawLines(){
    svg.innerHTML='';
    var old=lines;
    lines=[];
    old.forEach(function(l){ drawLine(l.a,l.b); });
  }

  function success(c1,c2,p){
    busy=true;
    c1.matched=true; c2.matched=true;
    [c1.el,c2.el].forEach(function(el){ el.classList.add('matched'); });
    drawLine(c1,c2);
    msg('“'+p.a+'”和“'+p.b+'”是好朋友！❤','ok');
    beep([523,659,784]);
    var buddy=document.querySelector('header .buddy');
    if(buddy){ buddy.classList.remove('jump'); void buddy.offsetWidth; buddy.classList.add('jump'); }
    matchedCount++;
    setTimeout(function(){
      busy=false;
      if(matchedCount===LEVELS[levelIdx].pairs.length) showWin();
    },680);
  }

  function fail(c1,c2){
    busy=true;
    msg(wrongMsg(c1.word,c2.word),'bad');
    beep([200,150],'sawtooth',0.16);
    [c1.el,c2.el].forEach(function(el){
      el.classList.add('bad','shake');
      setTimeout(function(){ el.classList.remove('bad','shake'); },700);
    });
    setTimeout(function(){ busy=false; },950);
  }

  function tryMatch(c1,c2){
    if(c1===c2||c1.matched||c2.matched||busy) return;
    var p=isPair(c1.word,c2.word);
    if(p) success(c1,c2,p);
    else fail(c1,c2);
  }

  function onCardClick(card){
    if(card.matched||busy) return;
    if(!selected){ selected=card; card.el.classList.add('sel'); return; }
    if(selected===card){ selected=null; card.el.classList.remove('sel'); return; }
    var a=selected;
    selected=null; a.el.classList.remove('sel');
    tryMatch(a,card);
  }

  function positionClone(e){
    var r=drag.card.el.getBoundingClientRect();
    drag.clone.style.left=(e.clientX-r.width/2)+'px';
    drag.clone.style.top=(e.clientY-r.height/2)+'px';
  }
  function onPM(e){
    if(!drag) return;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(!drag.clone){
      if(Math.hypot(dx,dy)<8) return;
      drag.moved=true;
      drag.clone=drag.card.el.cloneNode(true);
      drag.clone.classList.add('dragClone');
      drag.clone.removeAttribute('style');
      document.body.appendChild(drag.clone);
      drag.card.el.classList.add('origin');
      positionClone(e);
    }else{
      positionClone(e);
    }
  }
  function onPU(e){
    window.removeEventListener('pointermove',onPM);
    window.removeEventListener('pointerup',onPU);
    if(!drag) return;
    var st=drag;
    drag=null;
    if(st.clone){
      st.clone.remove();
      st.card.el.classList.remove('origin');
      if(st.moved){
        var target=document.elementFromPoint(e.clientX,e.clientY);
        if(target){
          var tc=target.closest('.word-card:not(.matched)');
          if(tc&&tc!==st.card.el){
            var card=null;
            for(var i=0;i<cards.length;i++){ if(cards[i].el===tc){card=cards[i];break;} }
            if(card) tryMatch(st.card,card);
          }
        }
      }else{
        onCardClick(st.card);
      }
    }else{
      onCardClick(st.card);
    }
  }
  function onPointerDown(e,card){
    if(card.matched||busy) return;
    e.preventDefault();
    drag={card:card, x:e.clientX, y:e.clientY, moved:false, clone:null};
    window.addEventListener('pointermove',onPM);
    window.addEventListener('pointerup',onPU);
  }

  function makeCard(w,side){
    var el=document.createElement('button');
    el.type='button';
    el.className='word-card';
    el.innerHTML='<span class="c-emoji">'+w.emoji+'</span><span class="c-word">'+w.word+'</span>';
    var card={el:el, word:w.word, pairIdx:w.pairIdx, side:side, matched:false};
    cards.push(card);
    el.addEventListener('pointerdown',function(e){ onPointerDown(e,card); });
    return el;
  }

  function renderLevel(){
    var lv=LEVELS[levelIdx];
    leftCol.innerHTML=''; rightCol.innerHTML=''; svg.innerHTML='';
    cards=[]; lines=[]; selected=null; matchedCount=0; busy=false; drag=null;
    msg('');
    document.getElementById('progress').textContent='第 '+(levelIdx+1)+' 关 · 共 '+lv.pairs.length+' 对';
    document.getElementById('hint').textContent=lv.hint;
    win.classList.remove('show');
    var leftWords=shuffle(lv.pairs.map(function(p,i){ return {word:p.a, emoji:p.ai, pairIdx:i}; }));
    var rightWords=shuffle(lv.pairs.map(function(p,i){ return {word:p.b, emoji:p.bi, pairIdx:i}; }));
    leftWords.forEach(function(w){ leftCol.appendChild(makeCard(w,'left')); });
    rightWords.forEach(function(w){ rightCol.appendChild(makeCard(w,'right')); });
  }

  function showWin(){
    var last=levelIdx===LEVELS.length-1;
    document.getElementById('winTitle').textContent=last?'你都会举一反三啦！':'全部找到好朋友啦！';
    document.getElementById('winSub').textContent=last?'想想看：新 和 旧、干 和 湿，也是一对相反的好朋友哦。':'反义词就是意思相反的词，它们是一对好朋友。';
    winBtn.textContent=last?'再玩一次':'下一关';
    win.classList.add('show');
    beep([523,659,784,1046]);
  }

  winBtn.addEventListener('click',function(){
    if(levelIdx===LEVELS.length-1) levelIdx=0; else levelIdx++;
    renderLevel();
  });
  document.getElementById('restart').addEventListener('click',renderLevel);
  window.addEventListener('resize',redrawLines);

  /* demo */
  var demo=document.getElementById('demo');
  function hideDemo(){ demo.classList.add('hide'); }
  document.getElementById('demoStart').addEventListener('click',hideDemo);
  setTimeout(hideDemo,6200);

  renderLevel();
})();
</script>
</body>
</html>
