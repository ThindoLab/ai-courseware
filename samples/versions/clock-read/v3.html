<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#F2F6FC; --card:#FFFFFF;
    --ink:#1e3a5f; --accent:#2f6fbf; --accent-soft:#E1EEFF;
    --ok:#2fbf71; --ok-soft:#DFF5E6;
    --bad:#e85d5d; --bad-soft:#FFE7E4;
    --sun:#F2A93B; --sun-soft:#FFE9C2; --bell:#FFB84D; --body:#FFD98E;
    --bean:#243B55;
    --shadow:0 8px 22px rgba(30,58,95,.12);
    --r:18px;
  }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    height:100dvh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:10px; line-height:1.5;
  }
  #app{ width:100%; max-width:min(1240px,100%); height:100%; display:flex; flex-direction:column; justify-content:center; }

  .screen{ display:none; width:100%; }
  .screen.show{ display:block; animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .card{ background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:20px 22px; }

  .btn{
    border:none; border-radius:16px; cursor:pointer;
    font-size:24px; font-weight:800; color:#fff;
    min-height:64px; padding:10px 26px; font-family:inherit;
    transition:transform .12s ease, box-shadow .12s ease, opacity .2s;
    box-shadow:0 5px 0 rgba(30,58,95,.16);
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(30,58,95,.16); }
  .btn-accent{ background:var(--accent); }
  .btn-ok{ background:var(--ok); }
  .btn-ghost{ background:transparent; color:var(--ink); box-shadow:none; font-size:20px; min-height:56px; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }

  /* ---------- 首页 ---------- */
  .home-hero{ text-align:center; }
  .home-hero h1{ font-size:min(9vw,40px); letter-spacing:2px; margin:6px 0 2px; }
  .home-hero .sub{ color:var(--ink); opacity:.75; font-size:22px; font-weight:700; margin-bottom:12px; }
  .roadmap{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:10px 0 18px; }
  .chip{ background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:8px 16px; font-size:18px; font-weight:800; }
  .hero-row{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:6px; }
  .mini-clock{ width:min(46vw,200px); display:block; }
  .mini-bean{ width:min(20vw,84px); display:block; }

  /* ---------- 演示遮罩 ---------- */
  .overlay{
    position:fixed; inset:0; z-index:60;
    background:rgba(242,246,252,.97);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  .overlay.show{ display:flex; }
  .demo-card{ text-align:center; max-width:440px; width:100%; }
  .demo-row{ display:flex; align-items:center; justify-content:center; gap:8px; }
  .demo-clock{ width:min(66vw,260px); display:block; }
  .demo-bean{ width:min(20vw,78px); display:block; }
  #demoText{ font-size:22px; font-weight:800; min-height:64px; display:flex; align-items:center; justify-content:center; margin:10px 0; }
  .demo-btns{ display:flex; justify-content:center; gap:12px; margin-top:6px; }

  /* ---------- 关卡说明 ---------- */
  .intro-card{ text-align:center; padding:26px 22px; }
  .intro-card .lvl-name{ font-size:20px; font-weight:800; color:var(--accent); }
  .intro-card h2{ font-size:min(9vw,34px); margin:4px 0 12px; }
  .intro-card .goal{
    background:var(--sun-soft); border-radius:16px; padding:14px 18px;
    font-size:21px; font-weight:800; color:#7A4B0A; margin:6px 0 24px; text-align:left;
  }

  /* ---------- 闯关舞台 ---------- */
  .quiz-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .lvl-tag{ font-size:18px; font-weight:800; color:var(--ink); opacity:.7; }
  .dots{ display:flex; gap:6px; align-items:center; }
  .dot{ width:14px; height:14px; border-radius:50%; background:#D8E2F0; }
  .dot.on{ background:var(--accent); }
  .stars{ font-size:20px; font-weight:800; color:#B7791F; }

  .stage{
    position:relative;
    display:flex; gap:16px; align-items:stretch; justify-content:center;
    flex-wrap:wrap;
  }
  .clock-wrap{
    flex:1 1 320px; min-width:250px; max-width:460px;
    background:var(--card); border-radius:var(--r); box-shadow:var(--shadow);
    padding:10px 8px 8px; text-align:center;
    display:flex; flex-direction:column; justify-content:center;
  }
  #clock{ width:min(58vw,44vh,320px); margin:0 auto; display:block; touch-action:manipulation; }
  #bubble{
    margin-top:8px; font-size:22px; font-weight:800;
    background:var(--sun-soft); color:#7A4B0A;
    border-radius:16px; padding:10px 14px; min-height:48px;
    display:flex; align-items:center; justify-content:center;
  }
  .panel{ flex:1 1 300px; min-width:250px; max-width:480px; display:flex; flex-direction:column; gap:12px; }

  .target-card{ background:var(--accent-soft); border-radius:16px; padding:12px 14px; text-align:center; }
  .target-card .t-label{ font-size:19px; font-weight:800; color:var(--accent); }
  .target-card .t-time{ font-size:min(12vw,44px); font-weight:900; color:var(--ink); letter-spacing:2px; }

  .lcd{ background:var(--ink); color:#8CD9FF; font-weight:800; border-radius:14px; padding:8px 14px; text-align:center; font-size:30px; letter-spacing:3px; font-family:"Courier New",monospace; }
  .lcd .lbl{ font-size:16px; letter-spacing:1px; color:#7FB8E8; display:block; }

  .scene-card{ background:var(--sun-soft); border-radius:16px; padding:8px; text-align:center; }
  .scene-card svg{ width:100%; max-width:300px; height:auto; display:block; margin:0 auto; }
  .scene-line{ font-size:20px; font-weight:800; color:#7A4B0A; }

  .options{ display:flex; flex-direction:column; gap:10px; }
  .opt{
    background:var(--card); border:3px solid #CBD9EC; color:var(--ink);
    border-radius:16px; font-size:26px; font-weight:800;
    min-height:66px; padding:8px 18px; cursor:pointer; font-family:inherit;
    transition:transform .1s ease, border-color .2s, background .2s, opacity .2s;
    box-shadow:0 3px 0 rgba(30,58,95,.08);
  }
  .opt:active{ transform:translateY(2px); }
  .opt:hover:not(:disabled){ border-color:var(--accent); }
  .opt.wrong-mark{ opacity:.35; border-color:#CBD9EC; background:#F0F4FA; }
  .opt.shake{ animation:shake .4s ease; }
  @keyframes shake{ 0%,100%{transform:none;} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }

  .hint-line{ font-size:20px; font-weight:800; color:var(--ink); opacity:.75; text-align:left; }

  /* 短针高亮圈 */
  .hand-hl circle{ fill:none; stroke:var(--ok); stroke-width:3; }
  .hl-ring{ animation:pulse .9s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.2;} 50%{opacity:1;} }

  /* ---------- 反馈层 ---------- */
  #feedback{
    position:absolute; inset:0; z-index:30;
    display:none; align-items:center; justify-content:center;
    background:rgba(242,246,252,.9); border-radius:var(--r); padding:14px;
  }
  #feedback.show{ display:flex; }
  .fb-card{ max-width:460px; width:100%; text-align:center; padding:18px 20px; }
  .fb-card.ok{ background:var(--ok-soft); border:3px solid var(--ok); }
  .fb-card.no{ background:var(--bad-soft); border:3px solid var(--bad); }
  .fb-title{ font-size:28px; font-weight:900; margin-bottom:8px; }
  .fb-msg{ font-size:20px; font-weight:700; margin-bottom:14px; text-align:left; }
  .fb-msg b{ color:var(--bad); }
  .fb-msg .okword{ color:var(--ok); }

  /* ---------- 通关 / 完成 ---------- */
  .done-card{ text-align:center; padding:26px 22px; }
  .done-card h2{ font-size:min(10vw,36px); margin-bottom:4px; }
  .done-sub{ font-size:22px; font-weight:800; color:var(--accent); }
  .done-stars{ font-size:42px; margin:8px 0 18px; }
  .think-card{ background:var(--sun-soft); border-radius:16px; padding:16px 18px; margin:16px 0; text-align:left; }
  .think-card .q{ font-size:22px; font-weight:800; color:#7A4B0A; }
  .think-card .a{ font-size:22px; font-weight:800; color:#7A4B0A; margin-top:10px; display:none; }
  .think-card .a.show{ display:block; animation:fadeIn .4s ease; }

  @media (max-width:620px){
    body{ padding:6px; }
    .card{ padding:14px 14px; }
    .stage{ gap:10px; }
    .panel{ gap:10px; }
    #bubble{ font-size:20px; }
    .opt{ font-size:24px; min-height:62px; }
    .home-hero .sub{ font-size:19px; }
    .roadmap{ gap:6px; }
    .chip{ font-size:15px; padding:6px 12px; }
    .fb-msg{ font-size:18px; }
    .scene-card svg{ max-width:170px; }
    .scene-card{ padding:4px; }
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ transition:none !important; animation:none !important; }
  }
</style>
</head>

  var LEVELS = [
    { tag:"第一关 · 认整点", name:"认识整点", goal:"长针指 12，短针指几就是几点", sub:"你会看整点啦" },
    { tag:"第二关 · 拨一拨", name:"拨一拨", goal:"点钟面上的数字，把短针拨到小闹钟说的时间", sub:"你会自己拨钟啦" },
    { tag:"第三关 · 小豆豆的一天", name:"小豆豆的一天", goal:"看看小豆豆在做什么，再认一认是几点", sub:"你都会看生活里的钟啦" }
  ];

  var SCENES = [
    { h:7,  line:"小豆豆起床啦！", svg:'<svg viewBox="0 0 220 120" aria-hidden="true"><rect x="16" y="66" width="150" height="40" rx="8" fill="#C9DDF3"/><rect x="22" y="60" width="52" height="16" rx="6" fill="#fff" stroke="#B9CBE0"/><circle cx="186" cy="26" r="16" fill="#F2A93B"/><path d="M186 4 V12 M186 40 V48 M162 26 H170 M202 26 H210 M170 10 L176 16 M196 36 L202 42 M202 10 L196 16 M170 42 L176 36" stroke="#F2A93B" stroke-width="4" stroke-linecap="round"/><g><path d="M78 74 L64 92 M78 74 L92 92" stroke="#243B55" stroke-width="5" stroke-linecap="round" fill="none"/><ellipse cx="78" cy="56" rx="22" ry="26" fill="#243B55"/><circle cx="70" cy="48" r="3.4" fill="#fff"/><circle cx="86" cy="48" r="3.4" fill="#fff"/><path d="M78 84 L70 102 M78 84 L86 102" stroke="#243B55" stroke-width="5" stroke-linecap="round" fill="none"/></g></svg>' },
    { h:3,  line:"小豆豆吃点心啦！", svg:'<svg viewBox="0 0 220 120" aria-hidden="true"><rect x="30" y="76" width="150" height="16" rx="6" fill="#C9A06B"/><rect x="42" y="64" width="20" height="14" rx="3" fill="#A9824F"/><path d="M100 76 L84 40 A28 28 0 0 1 116 40 Z" fill="#FFC98A" stroke="#E8A85C"/><circle cx="100" cy="44" r="4" fill="#E85D5D"/><g><path d="M150 74 L136 92 M150 74 L164 92" stroke="#243B55" stroke-width="5" stroke-linecap="round" fill="none"/><ellipse cx="150" cy="54" rx="22" ry="26" fill="#243B55"/><circle cx="142" cy="46" r="3.4" fill="#fff"/><circle cx="158" cy="46" r="3.4" fill="#fff"/><path d="M150 84 L142 102 M150 84 L158 102" stroke="#243B55" stroke-width="5" stroke-linecap="round" fill="none"/></g></svg>' },
    { h:5,  line:"小豆豆看动画啦！", svg:'<svg viewBox="0 0 220 120" aria-hidden="true"><rect x="26" y="28" width="130" height="84" rx="12" fill="#2F6FBF"/><rect x="34" y="36" width="114" height="68" rx="8" fill="#9FD0FF"/><path d="M70 40 L46 28 M120 40 L142 26" stroke="#243B55" stroke-width="5" stroke-linecap="round"/><rect x="168" y="78" width="24" height="26" rx="4" fill="#C9A06B"/><g><path d="M188 74 L172 94 M188 74 L204 94" stroke="#243B55" stroke-width="5" stroke-linecap="round" fill="none"/><ellipse cx="188" cy="54" rx="22" ry="26" fill="#243B55"/><circle cx="180" cy="46" r="3.4" fill="#fff"/><circle cx="196" cy="46" r="3.4" fill="#fff"/><path d="M188 84 L180 102 M188 84 L196 102" stroke="#243B55" stroke-width="5" stroke-linecap="round" fill="none"/></g></svg>' },
    { h:9,  line:"小豆豆睡觉啦！", svg:'<svg viewBox="0 0 220 120" aria-hidden="true"><rect x="40" y="70" width="130" height="38" rx="8" fill="#8FA8CC"/><rect x="46" y="64" width="46" height="16" rx="6" fill="#fff" stroke="#7B93B8"/><circle cx="176" cy="26" r="16" fill="#F7E08B"/><path d="M164 20 a12 12 0 1 0 24 2" fill="#F7E08B"/><g><path d="M96 78 L84 96 M96 78 L108 96" stroke="#243B55" stroke-width="5" stroke-linecap="round" fill="none"/><ellipse cx="96" cy="60" rx="22" ry="26" fill="#243B55"/><circle cx="88" cy="52" r="3.4" fill="#fff"/><circle cx="104" cy="52" r="3.4" fill="#fff"/><path d="M96 88 L88 106 M96 88 L104 106" stroke="#243B55" stroke-width="5" stroke-linecap="round" fill="none"/></g></svg>' }
  ];

  /* ---------- 声音 ---------- */
  var actx = null;
  function beep(freq,dur,delay){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = actx.currentTime + (delay||0);
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0+dur);
    }catch(e){}
  }
  function soundOk(){ beep(660,.18,0); beep(880,.28,.16); }
  function soundNo(){ beep(220,.28,0); }

  /* ---------- 页面切换 ---------- */
  var screens = ["home","intro","quiz","done","final"];
  function show(name){
    S.screen = name;
    screens.forEach(function(s){ $("screen-"+s).classList.toggle("show", s===name); });
  }

  /* ---------- 指针 ---------- */
  function degFor(h){ return (h % 12) * 30; }
  function setHands(h, minDeg, animate){
    var hd = degFor(h);
    var hEl = $("hourHand"), mEl = $("minuteHand");
    if(animate && !reduceMotion){
      var dh = shortestDelta(S.hourDeg, hd), dm = shortestDelta(S.minDeg, minDeg);
      S.hourDeg += dh; S.minDeg += dm;
      hEl.style.transform = "rotate("+S.hourDeg+"deg)";
      mEl.style.transform = "rotate("+S.minDeg+"deg)";
    } else {
      S.hourDeg = hd; S.minDeg = minDeg;
      hEl.style.transform = "rotate("+hd+"deg)";
      mEl.style.transform = "rotate("+minDeg+"deg)";
    }
  }
  function shortestDelta(from, to){
    var d = ((to - from) % 360 + 540) % 360 - 180;
    return d;
  }

  /* ---------- 演示（真动·可跳过） ---------- */
  function startDemo(){
    $("demo").classList.add("show");
    var hHand = $("demoHourHand"), mHand = $("demoMinuteHand");
    var set = function(el,deg){ el.style.transform = "rotate("+deg+"deg)"; };
    var txt = $("demoText"), next = $("demoNext");
    next.style.display = "none";
    if(reduceMotion){
      set(hHand, 210); set(mHand, 0);
      txt.textContent = "长针指 12 是整点，短针指 7 → 7 点整。";
      next.style.display = "inline-block";
      return;
    }
    var steps = [
      [300,  0, "小豆豆来学认时间！"],
      [2200, 0, "看长针（黄色细针）：它指到 12 → 这是整点。✅"],
      [4200, 210, "再看短针（蓝色粗针）：它指着 7。"],
      [6400, 210, "短针指几就是几点 → 7 点整！🎉"]
    ];
    steps.forEach(function(st){
      setTimeout(function(){
        set(hHand, st[1]); set(mHand, 0);
        txt.textContent = st[2];
        if(st[0] === 6400){ soundOk(); next.style.display = "inline-block"; }
      }, st[0]);
    });
  }
  $("demoSkip").addEventListener("click", function(){ closeDemo(); });
  $("demoNext").addEventListener("click", function(){ closeDemo(); });
  function closeDemo(){
    $("demo").classList.remove("show");
    show("intro");
    setupIntro();
  }

  /* ---------- 首页 / 关卡说明 ---------- */
  $("btnStart").addEventListener("click", function(){ startDemo(); });

  function setupIntro(){
    var L = LEVELS[S.level];
    $("introLvl").textContent = "第 " + (S.level+1) + " 关";
    $("introName").textContent = L.name;
    $("introGoal").textContent = L.goal;
  }
  $("btnGo").addEventListener("click", function(){
    S.round = 0;
    if(S.level === 1){ startSet(); } else { newQuestion(); }
    show("quiz");
    renderQuizHead();
  });

  /* ---------- 通用 ---------- */
  function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function nextH(h){ return h===12 ? 1 : h+1; }
  function prevH(h){ return h===1 ? 12 : h-1; }
  function label(h){ return h+"点"; }
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = randInt(0,i);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function hideFeedback(){ $("feedback").classList.remove("show"); }
  function showRing(show){ $("hlRing").style.display = show ? "block" : "none"; }
  function clearClockNums(){
    var gs = $("numGroup").querySelectorAll("g[data-h]");
    for(var i=0;i<gs.length;i++){ gs[i].onclick = null; }
  }

  /* ---------- 第 1 / 3 关：看钟选时间 ---------- */
  function newQuestion(){
    $("setPanel").style.display = "none";
    $("quizPanel").style.display = "block";
    clearClockNums();
    showRing(false);
    var h;
    if(S.level === 2){
      if(!S.sceneOrder){ S.sceneOrder = shuffle([0,1,2,3]); }
      h = SCENES[S.sceneOrder[S.round % SCENES.length]].h;
      S.scene = SCENES[S.sceneOrder[S.round % SCENES.length]];
    } else {
      S.scene = null;
      h = randInt(1,12);
    }
    S.q = { h:h, opts: shuffle([
      {h:h}, {h:nextH(h)}, {h:prevH(h)}
    ]), tried:[] };
    renderQuiz();
  }

  function renderQuiz(){
    setHands(S.q.h, 0, true);
    var panel = $("quizPanel");
    var sceneHtml = "";
    if(S.scene){
      sceneHtml = '<div class="scene-card">' + S.scene.svg +
        '<div class="scene-line">' + S.scene.line + '</div></div>';
    }
    $("bubble").textContent = S.scene ? "小豆豆在做的事，是几点？" : "小闹钟现在是几点？";
    var html = sceneHtml + '<div class="options">';
    S.q.opts.forEach(function(o, idx){
      var disabled = S.q.tried.indexOf(idx) > -1;
      html += '<button class="opt'+(disabled?' wrong-mark':'')+'" data-i="'+idx+'"'+(disabled?' disabled':'')+'>'+label(o.h)+'</button>';
    });
    html += '</div>';
    panel.innerHTML = html;
    var btns = panel.querySelectorAll(".opt");
    for(var k=0;k<btns.length;k++){
      btns[k].addEventListener("click", function(){ onOption(parseInt(this.getAttribute("data-i"),10), this); });
    }
    hideFeedback();
  }

  function onOption(idx, el){
    var picked = S.q.opts[idx];
    if(S.q.tried.indexOf(idx) > -1) return;
    if(picked.h === S.q.h){
      soundOk();
      S.stars++;
      showRing(true);
      showFeedback("ok", "太棒了！⭐", "长针指 12，短针指 " + S.q.h + " → <span class='okword'>" + label(S.q.h) + "</span>！", S.round >= S.quizTotal-1 ? "完成本关 ▶" : "下一题 ▶", function(){
        if(S.round >= S.quizTotal-1){ levelDone(); } else { S.round++; renderQuizHead(); newQuestion(); }
      });
    } else {
      soundNo();
      S.q.tried.push(idx);
      var btns = $("quizPanel").querySelectorAll(".opt");
      for(var i=0;i<btns.length;i++){
        if(S.q.tried.indexOf(i)>-1){ btns[i].disabled = true; btns[i].classList.add("wrong-mark"); }
      }
      if(el){ el.classList.add("shake"); }
      showRing(true);
      showFeedback("no", "再想想…", explainPick(S.q, picked), "再试一次", function(){ hideFeedback(); });
    }
  }

  function explainPick(q, picked){
    if(picked.h === nextH(q.h)){
      return "短针才指 <b>" + q.h + "</b>，还没走到 <b>" + picked.h + "</b> → 是 <span class='okword'>" + label(q.h) + "</span>，不是 " + picked.h + " 点。看粗粗的短针就知道啦。";
    }
    return "短针已经走过 <b>" + picked.h + "</b>，现在正指 <b>" + q.h + "</b> → 是 <span class='okword'>" + label(q.h) + "</span>，不是 " + picked.h + " 点。看粗粗的短针就知道啦。";
  }

  /* ---------- 第 2 关：拨一拨（点钟面数字） ---------- */
  function startSet(){
    $("quizPanel").style.display = "none";
    $("setPanel").style.display = "block";
    showRing(false);
    S.target = { h: randInt(1,12) };
    S.setH = 12;
    setHands(12, 0, false);
    renderSet();
  }

  function renderSet(){
    $("bubble").textContent = "帮我把短针拨到 " + label(S.target.h) + "！";
    $("setPanel").innerHTML =
      '<div class="target-card"><span class="t-label">小闹钟要的是</span><br><span class="t-time">' + label(S.target.h) + '</span></div>' +
      '<div class="lcd"><span class="lbl">现在</span>' + label(S.setH) + '</div>' +
      '<p class="hint-line">点钟面上的数字，把短针拨过去，再按「好了」</p>' +
      '<button class="btn btn-ok" id="btnConfirm">好了！</button>';
    bindClockNums();
    $("btnConfirm").addEventListener("click", function(){ onConfirm(); });
    hideFeedback();
  }

  function bindClockNums(){
    var gs = $("numGroup").querySelectorAll("g[data-h]");
    for(var i=0;i<gs.length;i++){
      gs[i].style.cursor = "pointer";
      gs[i].onclick = (function(hh){ return function(){ pickHour(hh); }; })(parseInt(gs[i].getAttribute("data-h"),10));
    }
    renderSetMarks();
  }
  function pickHour(h){
    S.setH = h;
    setHands(h, 0, true);
    renderSetMarks();
  }
  function renderSetMarks(){
    var gs = $("numGroup").querySelectorAll("g[data-h]");
    for(var i=0;i<gs.length;i++){
      var val = parseInt(gs[i].getAttribute("data-h"),10);
      var t = gs[i].querySelector("text");
      t.setAttribute("fill", val===S.setH ? "#2F6FBF" : "#1e3a5f");
      t.setAttribute("font-weight", val===S.setH ? "900" : "800");
    }
    var lcd = document.querySelector("#setPanel .lcd");
    if(lcd){ lcd.innerHTML = '<span class="lbl">现在</span>' + label(S.setH); }
  }
  function onConfirm(){
    if(S.setH === S.target.h){
      soundOk();
      S.stars++;
      showRing(true);
      showFeedback("ok", "拨对啦！⭐", "长针指 12，短针指 " + S.setH + " → <span class='okword'>" + label(S.setH) + "</span>！", S.round >= S.quizTotal-1 ? "完成本关 ▶" : "下一题 ▶", function(){
        if(S.round >= S.quizTotal-1){ levelDone(); } else { S.round++; renderQuizHead(); startSet(); }
      });
    } else {
      soundNo();
      showRing(true);
      showFeedback("no", "再拨一次", "短针现在指 <b>" + S.setH + "</b> → 这是 " + S.setH + " 点；小闹钟要的是 <span class='okword'>" + label(S.target.h) + "</span>。短针要指到数字 <b>" + S.target.h + "</b> 才对哦。", "好，再拨", function(){ hideFeedback(); });
    }
  }

  /* ---------- 反馈层 ---------- */
  function showFeedback(type, title, msg, btnLabel, onBtn){
    var card = $("fbCard");
    card.className = "fb-card " + type;
    $("fbTitle").textContent = title;
    $("fbMsg").innerHTML = msg;
    var b = $("fbBtn");
    b.textContent = btnLabel;
    b.onclick = function(){ hideFeedback(); onBtn(); };
    $("feedback").classList.add("show");
  }

  /* ---------- 进度 / 星星 ---------- */
  function renderQuizHead(){
    $("lvlTag").textContent = LEVELS[S.level].tag;
    $("starsLabel").textContent = "⭐ " + S.stars;
    var dots = "";
    for(var i=0;i<S.quizTotal;i++){ dots += '<span class="dot'+(i<S.round?' on':'')+'"></span>'; }
    $("dots").innerHTML = dots;
  }

  /* ---------- 通关 / 完成 ---------- */
  function levelDone(){
    var L = LEVELS[S.level];
    $("doneTitle").textContent = (S.level+1) + "/3 完成！";
    $("doneSub").textContent = L.sub;
    var st = "";
    for(var i=0;i<S.stars;i++){ st += "⭐"; }
    $("doneStars").textContent = st || "⭐";
    $("btnNext").textContent = (S.level >= 2) ? "看看总结 🎉" : "下一关 ▶";
    showRing(false);
    show("done");
  }
  $("btnNext").addEventListener("click", function(){
    if(S.level >= 2){ showFinal(); } else { S.level++; setupIntro(); show("intro"); }
  });

  function showFinal(){
    var st = "";
    for(var i=0;i<S.stars;i++){ st += "⭐"; }
    $("finalStars").textContent = st || "⭐";
    show("final");
  }
  $("btnThink").addEventListener("click", function(){
    $("thinkAnswer").classList.add("show");
    $("btnThink").style.display = "none";
    soundOk();
  });
  $("btnAgain").addEventListener("click", function(){
    S.level = 0; S.round = 0; S.stars = 0; S.sceneOrder = null;
    show("home");
  });

  /* ---------- 初始 ---------- */
  hideFeedback();
  clearClockNums();
  setHands(7, 0, false);
})();
</script>
</body>
</html>
