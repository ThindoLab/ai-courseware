<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">

<title>手掌量一量 · 用手掌当尺子</title>
<style>
:root{
  --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d; --card:#fff;
  --line:#c9d9ec; --bg:#eef4fb; --skin:#f6c9a0; --skinLine:#d99a6c;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink);
}
#app{height:100dvh;display:flex;flex-direction:column;max-width:min(1240px,100%);margin:0 auto;padding:clamp(8px,2vmin,18px);width:100%}

/* ---------- 顶部 ---------- */
.top{padding:4px 6px 8px}
.top .step{font-size:clamp(15px,2.2vmin,19px);color:var(--accent);font-weight:800;letter-spacing:.05em}
.top h1{font-size:clamp(24px,4.6vmin,38px);font-weight:900;line-height:1.25;margin-top:2px}
.top .hint{font-size:clamp(19px,2.9vmin,24px);font-weight:600;color:var(--ink);opacity:.78;margin-top:6px;line-height:1.4}

/* ---------- 主图区 ---------- */
#stage{position:relative;flex:1;min-height:0}
.obj{position:absolute;left:0;top:0}
.obj svg{width:100%;height:100%;overflow:visible}
.slot{position:absolute;width:var(--pw);height:var(--pw);display:flex;align-items:center;justify-content:center;pointer-events:none}
.slot svg{width:100%;height:100%}
.slot.hot svg{filter:drop-shadow(0 0 6px rgba(47,111,191,.45))}
.slot.filled{display:none}
.palm{
  position:absolute;width:var(--pw);height:var(--pw);display:flex;align-items:center;justify-content:center;
  background:#fff;border:3px solid var(--line);border-radius:16px;cursor:grab;touch-action:none;
  transition:left .35s cubic-bezier(.25,1,.5,1),top .35s cubic-bezier(.25,1,.5,1),transform .25s cubic-bezier(.25,1,.5,1);
  box-shadow:0 4px 10px rgba(30,58,95,.14);user-select:none;
}
.palm svg{width:78%;height:78%}
.palm.drag{transition:none;transform:scale(1.08);box-shadow:0 10px 20px rgba(30,58,95,.28);cursor:grabbing;z-index:20}
.palm.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.palm .num{
  position:absolute;top:-8px;right:-8px;min-width:30px;height:30px;border-radius:15px;background:var(--accent);color:#fff;
  font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px;
  box-shadow:0 3px 6px rgba(30,58,95,.3);transform:scale(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.palm .num.show{transform:scale(1)}
.count{
  position:absolute;right:4%;top:2%;background:#fff;border:3px solid var(--line);border-radius:18px;
  padding:8px 18px;font-size:clamp(26px,4.4vmin,40px);font-weight:900;display:flex;align-items:baseline;gap:6px;
  box-shadow:0 4px 12px rgba(30,58,95,.12);
}
.count b{color:var(--accent);display:inline-block}
.count b.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1)}}
.count span{font-size:clamp(18px,3vmin,26px);opacity:.55;font-weight:700}

/* ---------- 底部材料区 / 按钮 ---------- */
#dock{display:flex;align-items:flex-end;gap:12px;margin-top:auto;padding:10px 6px 4px;flex-wrap:wrap;justify-content:center}
.tray{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);height:var(--pw);pointer-events:none}
.tray .palm{pointer-events:auto}
#nextBtn{
  border:none;border-radius:18px;background:var(--accent);color:#fff;font-size:clamp(22px,3.4vmin,28px);font-weight:900;
  padding:16px 34px;cursor:pointer;box-shadow:0 6px 0 rgba(30,58,95,.28);transition:transform .15s,box-shadow .15s,opacity .3s;
  display:none;margin-left:auto;
}
#nextBtn:hover{transform:translateY(-2px)}
#nextBtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,58,95,.28)}
#nextBtn.ready{display:block}
#nextBtn.done{background:var(--ok)}

/* 对照关 */
.compareWrap{position:absolute;left:0;top:0;width:100%;height:100%}
.cmpSide{position:absolute;display:flex;flex-direction:column;align-items:center}
.cmpSide .sideTitle{font-size:clamp(19px,3vmin,25px);font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.cmpSide .sideTitle .tag{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:900}
.cmpSide .cmpCount{font-size:clamp(24px,3.8vmin,34px);font-weight:900;color:var(--accent);margin-top:8px}
.cmpSide .cmpCount b{display:inline-block}
.cmpSide .cmpCount b.pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.ruler{position:absolute;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;flex-direction:column}
.ruler.show{display:flex}
.ruler .rulerLabel{font-size:clamp(18px,2.8vmin,23px);font-weight:800;color:var(--ok);background:#fff;border:3px solid var(--ok);border-radius:14px;padding:6px 14px}
.ruler svg{width:clamp(240px,46vmin,420px);height:auto}

/* 结论条 */
.verdict{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%) translateY(120%);width:min(560px,92%);
  background:var(--card);border:4px solid var(--ok);border-radius:20px;padding:14px 20px;
  font-size:clamp(21px,3.2vmin,27px);font-weight:900;text-align:center;line-height:1.45;
  box-shadow:0 8px 22px rgba(30,58,95,.2);transition:transform .45s cubic-bezier(.25,1,.5,1);z-index:8;
}
.verdict.show{transform:translateX(-50%) translateY(0)}
.verdict .big{color:var(--accent);font-size:1.15em}

/* 对照结论 */
.cmpVerdict{
  position:absolute;left:50%;transform:translateX(-50%) translateY(140%);width:min(680px,94%);
  background:var(--card);border:4px solid var(--ok);border-radius:20px;padding:14px 20px;
  font-size:clamp(20px,3vmin,25px);font-weight:800;text-align:left;line-height:1.55;
  box-shadow:0 8px 22px rgba(30,58,95,.2);transition:transform .5s cubic-bezier(.25,1,.5,1);z-index:8;
}
.cmpVerdict.show{transform:translateX(-50%) translateY(0)}
.cmpVerdict .hl{color:var(--bad);font-weight:900}

/* 对照关按钮 */
.palmBtn{
  border:none;border-radius:18px;background:#fff;border:4px solid var(--accent);color:var(--ink);
  font-size:clamp(19px,2.9vmin,24px);font-weight:900;padding:12px 20px;cursor:pointer;box-shadow:0 5px 0 rgba(30,58,95,.18);
  display:flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .15s,opacity .3s;
}
.palmBtn svg{width:42px;height:42px;flex:none}
.palmBtn:hover{transform:translateY(-2px)}
.palmBtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(30,58,95,.18)}
.palmBtn.used{background:var(--ok);border-color:var(--ok);color:#fff;opacity:.92}
.palmBtn.used svg{opacity:.4}
.palmBtn.used::after{content:"✓";font-size:24px;font-weight:900;margin-left:4px}

/* ---------- Overlay ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(30,58,95,.8);display:flex;align-items:center;justify-content:center;
  z-index:60;flex-direction:column;gap:8px;padding:16px;
}
.overlay.hide{display:none}
.ovCard{
  background:var(--card);border-radius:28px;padding:clamp(16px,3vmin,30px);max-width:min(720px,94%);
  text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative;
}
.ovCard h2{font-size:clamp(26px,5vmin,40px);font-weight:900;margin-bottom:8px}
.ovCard p{font-size:clamp(20px,3.2vmin,27px);font-weight:700;line-height:1.5;margin:10px 0}
.ovDemo{width:min(560px,86vw);margin:8px auto 2px}
.ovDemo svg{width:100%;height:auto;display:block}
.skipBtn{
  position:absolute;top:14px;right:14px;border:none;background:rgba(255,255,255,.2);color:#fff;
  border-radius:999px;padding:10px 20px;font-size:clamp(17px,2.6vmin,22px);font-weight:800;cursor:pointer;
}
.startBtn{
  border:none;border-radius:18px;background:var(--accent);color:#fff;font-size:clamp(21px,3.4vmin,28px);font-weight:900;
  padding:16px 42px;cursor:pointer;box-shadow:0 6px 0 rgba(30,58,95,.3);margin-top:8px;
}
.startBtn:hover{transform:translateY(-2px)}
.startBtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,58,95,.3)}
.doneCard .startBtn{background:var(--ok);box-shadow:0 6px 0 rgba(22,101,52,.3)}
.doneTxt{font-size:clamp(21px,3.4vmin,28px);font-weight:900;color:var(--ink);line-height:1.55;margin-top:6px}
.doneTxt .small{font-size:.78em;color:var(--accent);font-weight:800}

/* 演示动画 */
.demo-palm{opacity:0}
.demo-palm.in{animation:slideIn .5s cubic-bezier(.25,1,.5,1) forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:translateX(0)}}
.demo-num{opacity:0}
.demo-num.in{animation:popIn .35s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popIn{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.demo-wobble{transform-origin:center}
.demo-wobble.in{animation:wobble 1.1s ease .2s}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}45%{transform:rotate(6deg)}70%{transform:rotate(-4deg)}90%{transform:rotate(2deg)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .demo-palm,.demo-num{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="step" id="stepTag">第 1 关</div>
    <h1 id="title">量一量小铅笔</h1>
    <p class="hint" id="hint">把手掌印一个挨一个，排到小铅笔下面</p>
  </header>
  <main id="stage"></main>
  <footer id="dock">
    <button id="nextBtn">下一关 →</button>

</div>

<!-- 开场演示 -->
<div class="overlay" id="demoOv">

</div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const stage=$("#stage"), dock=$("#dock"), nextBtn=$("#nextBtn");
const title=$("#title"), hint=$("#hint"), stepTag=$("#stepTag");

/* ---------- 图形工厂 ---------- */
function palmSVG(dashed){
  const stroke = dashed ? "var(--line)" : "var(--skinLine)";
  const fill = dashed ? "none" : "var(--skin)";
  return `<svg viewBox="0 0 80 80" aria-hidden="true">
    <g fill="${fill}" stroke="${stroke}" stroke-width="2.6" stroke-linecap="round">
      <rect x="19" y="30" width="42" height="40" rx="12"/>
      <rect x="14" y="7"  width="12" height="28" rx="6"/>
      <rect x="28" y="3"  width="12" height="32" rx="6"/>
      <rect x="42" y="3"  width="12" height="32" rx="6"/>
      <rect x="56" y="12" width="12" height="24" rx="6"/>
    </g>
  </svg>`;
}
const OBJ_SVG={
  pencil:`<svg viewBox="0 0 300 96" aria-hidden="true">
    <polygon points="14,48 46,26 46,70" fill="#eab308" stroke="#1e3a5f" stroke-width="3" stroke-linejoin="round"/>
    <rect x="46" y="26" width="210" height="44" rx="6" fill="#fcd34d" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="244" y="26" width="10" height="44" fill="#cbd5e1" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="254" y="26" width="34" height="44" rx="6" fill="#fda4af" stroke="#1e3a5f" stroke-width="3"/>
    <path d="M8 74 H292" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 10" opacity=".35"/>
  </svg>`,
  bed:`<svg viewBox="0 0 300 110" aria-hidden="true">
    <rect x="8" y="34" width="284" height="50" rx="10" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="18" y="20" width="64" height="28" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="88" y="26" width="196" height="40" rx="12" fill="#fdba74" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="20" y="84" width="16" height="20" rx="5" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="264" y="84" width="16" height="20" rx="5" fill="#93c5fd" stroke="#1e3a5f" stroke-width="3"/>
    <path d="M8 106 H292" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 10" opacity=".35"/>
  </svg>`,
  table:`<svg viewBox="0 0 320 92" aria-hidden="true">
    <rect x="8" y="14" width="304" height="22" rx="7" fill="#fcd34d" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="20" y="36" width="16" height="50" rx="5" fill="#d9a441" stroke="#1e3a5f" stroke-width="3"/>
    <rect x="284" y="36" width="16" height="50" rx="5" fill="#d9a441" stroke="#1e3a5f" stroke-width="3"/>
  </svg>`,
  scooter:`<svg viewBox="0 0 300 84" aria-hidden="true">
    <rect x="8" y="22" width="284" height="24" rx="12" fill="#7dd3fc" stroke="#1e3a5f" stroke-width="3"/>
    <circle cx="44" cy="60" r="16" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
    <circle cx="256" cy="60" r="16" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
    <circle cx="44" cy="60" r="6" fill="#2f6fbf"/>
    <circle cx="256" cy="60" r="6" fill="#2f6fbf"/>
    <path d="M8 78 H292" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 10" opacity=".35"/>
  </svg>`
};
function fishSVG(){
  return `<svg viewBox="0 0 300 120" aria-hidden="true">
    <polygon points="232,60 290,28 290,92" fill="#60a5fa" stroke="#1e3a5f" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="120" cy="60" rx="104" ry="40" fill="#7dd3fc" stroke="#1e3a5f" stroke-width="3"/>
    <circle cx="74" cy="50" r="9" fill="#fff" stroke="#1e3a5f" stroke-width="2.5"/>
    <circle cx="71" cy="48" r="4" fill="#1e3a5f"/>
    <path d="M120 20 Q134 34 120 48" stroke="#1e3a5f" stroke-width="2.5" fill="none" opacity=".5"/>
  </svg>`;
}
function beanSVG(raiseHand){
  return `<svg viewBox="0 0 150 170" aria-hidden="true">
    <circle cx="75" cy="40" r="27" fill="#2f3b52"/>
    <circle cx="66" cy="34" r="5.5" fill="#fff"/>
    <circle cx="86" cy="34" r="5.5" fill="#fff"/>
    <rect x="43" y="66" width="64" height="68" rx="28" fill="#2f3b52"/>
    ${raiseHand
      ? `<path d="M96 82 L118 58" stroke="#2f3b52" stroke-width="9" stroke-linecap="round"/>
         <path d="M107 60 L44 92" stroke="#2f3b52" stroke-width="9" stroke-linecap="round"/>`
      : `<path d="M52 86 L32 104 M98 86 L118 104" stroke="#2f3b52" stroke-width="9" stroke-linecap="round"/>`}
    <path d="M66 134 L56 156 M84 134 L94 156" stroke="#2f3b52" stroke-width="9" stroke-linecap="round"/>
  </svg>`;
}
function rulerSVG(){
  return `<svg viewBox="0 0 420 64" aria-hidden="true">
    <rect x="4" y="6" width="412" height="52" rx="8" fill="#fff" stroke="#1e3a5f" stroke-width="3"/>
    <g stroke="#1e3a5f" stroke-width="2.5">
      <line x1="40" y1="14" x2="40" y2="46"/>
      <line x1="80" y1="22" x2="80" y2="46"/>
      <line x1="120" y1="14" x2="120" y2="46"/>
      <line x1="160" y1="22" x2="160" y2="46"/>
      <line x1="200" y1="14" x2="200" y2="46"/>
      <line x1="240" y1="22" x2="240" y2="46"/>
      <line x1="280" y1="14" x2="280" y2="46"/>
      <line x1="320" y1="22" x2="320" y2="46"/>
      <line x1="360" y1="14" x2="360" y2="46"/>
    </g>
    <g fill="#1e3a5f" font-size="16" font-weight="800" text-anchor="middle">
      <text x="40" y="62">0</text><text x="120" y="62">1</text><text x="200" y="62">2</text>
      <text x="280" y="62">3</text><text x="360" y="62">4</text>
    </g>
  </svg>`;
}

/* ---------- 关卡定义 ---------- */
const LEVELS=[
  {kind:"measure", obj:"pencil", count:3,
   step:"第 1 关", title:"量一量小铅笔", hint:"把手掌印一个挨一个，排到小铅笔下面",
   verdict:"小铅笔有 <span class='big'>3</span> 个手掌长，就是 3 拃！"},
  {kind:"measure", obj:"bed", count:5,
   step:"第 2 关", title:"量一量小床", hint:"小床更长了！还是从左边开始，一个挨一个排",
   verdict:"小床有 <span class='big'>5</span> 个手掌长，就是 5 拃！"},
  {kind:"compare",
   step:"第 3 关", title:"大手小手比一比", hint:"点一点：妈妈的大手和宝宝的小手，量同一张桌子"},
  {kind:"measure", obj:"scooter", count:4,
   step:"第 4 关", title:"量一量小滑板车", hint:"你也来量！手掌印一个挨一个排过去",
   verdict:"小滑板车有 <span class='big'>4</span> 个手掌长！"}
];

let level=0;
let palms=[], slots=[], placed=0, trayRects=[];

/* ---------- 普通测量关 ---------- */
function shuffleArr(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function layoutMeasure(){
  const L=LEVELS[level];
  const st=stage.getBoundingClientRect();
  const pw=Math.max(64,Math.min(84,st.width/(L.count+1.4),st.height*0.16));
  stage.style.setProperty("--pw",pw+"px");
  const totalW=pw*L.count;
  const objW=totalW, objH=Math.max(70,Math.min(150,pw*0.72));
  const objX=(st.width-objW)/2, objY=st.height*0.06;
  const obj=stage.querySelector(".obj");
  obj.style.left=objX+"px"; obj.style.top=objY+"px"; obj.style.width=objW+"px"; obj.style.height=objH+"px";
  const slotY=objY+objH+6;
  // 槽位
  slots.forEach((s,i)=>{s.style.left=(objX+i*pw)+"px";s.style.top=slotY+"px";});
  // 材料区位置（乱序）
  const order=shuffleArr([...Array(L.count).keys()]);
  const trayGap=8, trayW=L.count*pw+(L.count-1)*trayGap;
  const trayX=(st.width-trayW)/2, trayY=st.height-pw-8;
  palms.forEach((p,idx)=>{
    const slotIdx=order[idx];
    p.dataset.slot=slotIdx;
    p.style.left=(trayX+idx*(pw+trayGap))+"px";
    p.style.top=trayY+"px";
  });
}

function buildMeasure(){
  const L=LEVELS[level];
  stage.innerHTML="";
  const obj=document.createElement("div");obj.className="obj";
  obj.innerHTML=OBJ_SVG[L.obj];stage.appendChild(obj);
  // 计数
  const cnt=document.createElement("div");cnt.className="count";
  cnt.innerHTML=`<b id="cntNum">0</b><span>/ ${L.count}</span>`;
  stage.appendChild(cnt);
  // 槽位（虚线手掌）
  slots=[];palms=[];
  for(let i=0;i<L.count;i++){
    const s=document.createElement("div");s.className="slot"+(i===0?" hot":"");
    s.innerHTML=palmSVG(true);s.style.setProperty("--pw","var(--pw)");
    stage.appendChild(s);slots.push(s);
  }
  // 材料手掌印（打乱）
  const order=shuffleArr([...Array(L.count).keys()]);
  order.forEach(slotIdx=>{
    const p=document.createElement("div");p.className="palm";
    p.innerHTML=palmSVG(false)+`<span class="num"></span>`;
    p.dataset.slot=slotIdx;stage.appendChild(p);palms.push(p);
    bindPalm(p);
  });
  // 结论条
  const v=document.createElement("div");v.className="verdict";v.innerHTML=L.verdict;
  stage.appendChild(v);
  placed=0;
  layoutMeasure();
  nextBtn.classList.remove("ready","done");
}

function nextEmptySlot(){
  for(let i=0;i<slots.length;i++){if(!slots[i].classList.contains("filled"))return i;}
  return -1;
}
function placePalm(p,slotIdx){
  const s=slots[slotIdx];
  p.style.left=s.style.left;p.style.top=s.style.top;
  s.classList.add("filled");
  const num=p.querySelector(".num");num.textContent=slotIdx+1;num.classList.add("show");
  placed++;
  const cn=$("#cntNum");cn.textContent=placed;cn.classList.remove("pop");void cn.offsetWidth;cn.classList.add("pop");
  if(placed===LEVELS[level].count){
    const v=stage.querySelector(".verdict");v.classList.add("show");
    nextBtn.classList.add("ready");
    if(level===LEVELS.length-1){nextBtn.textContent="完成 🎉";nextBtn.classList.add("done");}
  }
}
function returnPalm(p){
  const orig=p._home;
  p.classList.remove("drag");
  p.style.left=orig.left+"px";p.style.top=orig.top+"px";
  p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");
}
function bindPalm(p){
  let dragging=false,moved=false,sx=0,sy=0,ox=0,oy=0;
  p.addEventListener("pointerdown",e=>{
    dragging=true;moved=false;
    const r=p.getBoundingClientRect(),st=stage.getBoundingClientRect();
    sx=e.clientX;sy=e.clientY;ox=r.left-st.left;oy=r.top-st.top;
    p._home={left:parseFloat(p.style.left),top:parseFloat(p.style.top)};
    p.classList.add("drag");
    p.setPointerCapture(e.pointerId);
  });
  p.addEventListener("pointermove",e=>{
    if(!dragging)return;
    const st=stage.getBoundingClientRect();
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>8)moved=true;
    p.style.left=(ox+dx)+"px";p.style.top=(oy+dy)+"px";
  });
  p.addEventListener("pointerup",e=>{
    if(!dragging)return;dragging=false;
    p.classList.remove("drag");
    if(!moved){ // 点选入位
      const idx=nextEmptySlot();
      if(idx>=0)placePalm(p,idx);
      else returnPalm(p);
      return;
    }
    // 拖拽：找最近空槽
    const pr=p.getBoundingClientRect();
    let best=-1,bestD=1e9;
    for(let i=0;i<slots.length;i++){
      if(slots[i].classList.contains("filled"))continue;
      const sr=slots[i].getBoundingClientRect();
      const cx=(pr.left+pr.width/2)-(sr.left+sr.width/2);
      const cy=(pr.top+pr.height/2)-(sr.top+sr.height/2);
      const d=Math.hypot(cx,cy);
      if(d<bestD){bestD=d;best=i;}
    }
    const thr=Math.min(70,slots[0].getBoundingClientRect().width*0.85);
    if(best>=0&&bestD<thr)placePalm(p,best);
    else returnPalm(p);
  });
  p.addEventListener("pointercancel",()=>{if(dragging){dragging=false;p.classList.remove("drag");returnPalm(p);}});
}

/* ---------- 对照关 ---------- */
let cmpDone={big:false,small:false};
function layoutCompare(){
  const st=stage.getBoundingClientRect();
  const vertical=st.width<760;
  const pwS=Math.max(56,Math.min(72,st.width/9));
  const pwB=pwS*1.55;
  const tableW=Math.min(340,st.width*0.82);
  const sides=stage.querySelectorAll(".cmpSide");
  const sideH=vertical?st.height*0.44:st.height;
  if(vertical){
    sides[0].style.left="0";sides[0].style.top="0";sides[0].style.width="100%";sides[0].style.height=sideH+"px";
    sides[1].style.left="0";sides[1].style.top=(st.height-sideH)+"px";sides[1].style.width="100%";sides[1].style.height=sideH+"px";
  }else{
    sides[0].style.left="2%";sides[0].style.top="0";sides[0].style.width="48%";sides[0].style.height="100%";
    sides[1].style.right="2%";sides[1].style.left="auto";sides[1].style.top="0";sides[1].style.width="48%";sides[1].style.height="100%";
  }
  stage.style.setProperty("--pwS",pwS+"px");
  stage.style.setProperty("--pwB",pwB+"px");
  // 每个 side 内部：标题 + 桌 + 槽
  const tableEls=stage.querySelectorAll(".cmpTable");
  const slotRows=stage.querySelectorAll(".cmpSlots");
  const counts=stage.querySelectorAll(".cmpCount");
  tableEls.forEach((t,i)=>{
    t.style.width=tableW+"px";
    t.style.height=Math.max(56,Math.min(120,tableW*0.3))+"px";
  });
  // 槽位 y 在桌下
  slotRows.forEach((row,i)=>{
    const side=sides[i],t=tableEls[i];
    const isBig=i===0;
    const pw=isBig?pwB:pwS;
    const n=isBig?3:5;
    row.style.top=(t.offsetTop+t.offsetHeight+4)+"px";
    row.style.height=pw+"px";
    const rowW=n*pw;
    row.style.left=((side.offsetWidth-rowW)/2)+"px";
    const slotsIn=row.querySelectorAll(".cmpSlot");
    slotsIn.forEach((s,j)=>{s.style.width=pw+"px";s.style.height=pw+"px";s.style.left=(j*pw)+"px";});
  });
}
function buildCompare(){
  const st=stage.getBoundingClientRect();
  stage.innerHTML="";
  cmpDone={big:false,small:false};
  const wrap=document.createElement("div");wrap.className="compareWrap";stage.appendChild(wrap);
  const mkSide=(id,label,tagClr,big)=>{
    const side=document.createElement("div");side.className="cmpSide";side.id=id;
    const pwCss=big?"var(--pwB)":"var(--pwS)";
    side.innerHTML=`
      <div class="sideTitle"><span class="tag" style="background:${tagClr}">${big?"👩":"👶"}</span>${label}</div>
      <div class="cmpTable" style="position:relative">${OBJ_SVG.table}</div>
      <div class="cmpSlots" style="position:absolute"></div>
      <div class="cmpCount">0<b> 个</b></div>`;
    wrap.appendChild(side);
    const row=side.querySelector(".cmpSlots");
    const n=big?3:5;
    for(let i=0;i<n;i++){
      const s=document.createElement("div");s.className="cmpSlot";
      s.style.position="absolute";s.style.display="flex";s.style.alignItems="center";s.style.justifyContent="center";
      s.innerHTML=palmSVG(true);row.appendChild(s);
    }
    return side;
  };
  mkSide("bigSide","妈妈的大手","#e85d5d",true);
  mkSide("smallSide","宝宝的小手","#2f6fbf",false);
  // 尺子（对照结论用）
  const ruler=document.createElement("div");ruler.className="ruler";
  ruler.innerHTML=rulerSVG()+`<div class="rulerLabel">用尺子量，大家都一样啦！</div>`;
  stage.appendChild(ruler);
  // 对照结论
  const v=document.createElement("div");v.className="cmpVerdict";
  v.innerHTML=`桌子一样长，数却不一样——<span class="hl">因为妈妈的手大、宝宝的手小！</span><br>想让大家都量得一样，就用尺子！`;
  stage.appendChild(v);
  layoutCompare();
  bindCompareButtons();
  nextBtn.classList.remove("ready","done");
  nextBtn.textContent="下一关 →";
}
function bindCompareButtons(){
  const bigBtn=document.createElement("button");bigBtn.className="palmBtn big";
  bigBtn.innerHTML=palmSVG(false)+`妈妈的大手`;
  const smallBtn=document.createElement("button");smallBtn.className="palmBtn small";
  smallBtn.innerHTML=palmSVG(false)+`宝宝的小手`;
  dock.insertBefore(smallBtn,nextBtn);dock.insertBefore(bigBtn,nextBtn);
  bigBtn.addEventListener("click",()=>animateCompare("big",bigBtn));
  smallBtn.addEventListener("click",()=>animateCompare("small",smallBtn));
}
function animateCompare(kind,btn){
  if(cmpDone[kind])return;
  const isBig=kind==="big";
  const side=stage.querySelector(isBig?"#bigSide":"#smallSide");
  const row=side.querySelector(".cmpSlots");
  const slotsIn=row.querySelectorAll(".cmpSlot");
  const n=isBig?3:5;
  const pw=isBig?parseFloat(getComputedStyle(stage).getPropertyValue("--pwB")):parseFloat(getComputedStyle(stage).getPropertyValue("--pwS"));
  const countEl=side.querySelector(".cmpCount");
  btn.disabled=true;btn.classList.add("used");
  let done=0;
  slotsIn.forEach((slot,i)=>{
    const p=document.createElement("div");p.className="palm";
    p.style.setProperty("--pw",pw+"px");
    p.style.width=pw+"px";p.style.height=pw+"px";
    p.style.left="-120px";p.style.top=(row.offsetTop+row.offsetHeight/2-pw/2)+"px";
    p.style.opacity="0";p.style.pointerEvents="none";
    p.innerHTML=palmSVG(false)+`<span class="num">${i+1}</span>`;
    side.appendChild(p);
    setTimeout(()=>{
      p.style.opacity="1";
      p.style.left=(parseFloat(slot.style.left)+pw/2)+"px";
      p.style.top=(row.offsetTop+row.offsetHeight/2-pw/2)+"px";
      p.querySelector(".num").classList.add("show");
      done++;
      countEl.querySelector("b").textContent=i+1+" 个";
      const b=countEl.querySelector("b");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
      if(done===n){cmpDone[kind]=true;checkCompare();}
    },260*i+80);
  });
}
function checkCompare(){
  if(cmpDone.big&&cmpDone.small){
    const v=stage.querySelector(".cmpVerdict");v.classList.add("show");
    const ruler=stage.querySelector(".ruler");ruler.classList.add("show");
    nextBtn.classList.add("ready");
  }
}

/* ---------- 页面切换 ---------- */
function render(){
  const L=LEVELS[level];
  stepTag.textContent=L.step;title.textContent=L.title;hint.textContent=L.hint;
  dock.querySelectorAll(".palmBtn").forEach(b=>b.remove());
  if(L.kind==="measure")buildMeasure();else buildCompare();
  nextBtn.textContent="下一关 →";
}
nextBtn.addEventListener("click",()=>{
  if(!nextBtn.classList.contains("ready"))return;
  if(level<LEVELS.length-1){level++;render();}
  else{level=LEVELS.length-1;document.getElementById("doneOv").classList.remove("hide");}
});
document.getElementById("doneReplay").addEventListener("click",()=>{
  document.getElementById("doneOv").classList.add("hide");
  level=0;render();
});
window.addEventListener("resize",()=>{
  const L=LEVELS[level];
  if(L.kind==="measure")layoutMeasure();else layoutCompare();
});
