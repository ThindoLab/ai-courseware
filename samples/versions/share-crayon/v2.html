<style>
:root{
  --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d;
  --card:#fff; --bg:#eef4fb; --line:#c9dcf2;
  --ease:cubic-bezier(.25,1,.5,1);
}
*{box-sizing:border-box}
html,body{height:100dvh;margin:0;overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;
  padding:clamp(6px,1.2vh,14px) clamp(10px,1.6vw,22px);
}
.card{
  flex:1 1 auto;min-height:0;width:100%;max-width:min(1240px,100%);margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 12px 30px rgba(30,58,95,.10);
  display:flex;flex-direction:column;overflow:hidden;
  padding:clamp(10px,1.6vh,20px) clamp(14px,2vw,28px) clamp(10px,1.4vh,18px);
  gap:clamp(6px,1vh,12px);
}
.top{flex:none;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:.5px}
.badge{flex:none;font-size:clamp(15px,1.6vw,18px);font-weight:700;color:var(--accent);
  background:#e3eefc;padding:6px 14px;border-radius:999px}
.spacer{flex:1}
.mini{flex:none;min-height:48px;padding:6px 16px;border-radius:14px;border:2px solid var(--line);
  background:#fff;font-size:clamp(16px,1.8vw,20px);font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
.prompt{flex:none;margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:700;line-height:1.35}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#f6fafd,#eef6f2);border:2px solid #dbe9f7;border-radius:16px;overflow:hidden}
.stage svg{width:100%;height:100%;max-height:100%}
.choices{flex:none;display:flex;flex-direction:column;gap:10px}
.btn{flex:none;min-height:64px;padding:12px 18px;border-radius:16px;border:2px solid var(--line);
  background:#fff;font-size:clamp(18px,2.2vw,24px);font-weight:700;color:var(--ink);
  cursor:pointer;font-family:inherit;text-align:left;line-height:1.3;transition:transform .15s var(--ease),border-color .2s}
.btn:active{transform:translateY(1px)}
.btn.ok{border-color:var(--ok);background:#e9f9f0;color:#1c7a4c}
.btn.bad{border-color:var(--bad);background:#fdeeee;color:#b23c3c}
.btn:disabled{opacity:.5;cursor:not-allowed}
.steps{flex:none;display:flex;gap:10px}
.step{flex:1;min-height:64px;padding:8px 10px;border-radius:16px;border:2px solid var(--line);
  background:#fff;font-size:clamp(16px,1.9vw,22px);font-weight:700;color:var(--ink);
  cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .25s,color .25s,border-color .25s}
.step b{font-size:clamp(14px,1.6vw,18px);opacity:.75}
.step.done{border-color:var(--ok);background:#e9f9f0;color:#1c7a4c}
.step.ready{border-color:var(--accent);color:var(--accent);background:#e3eefc;animation:pulse 1.4s ease infinite}
.step.off{opacity:.45}
.fb{flex:none;min-height:clamp(52px,7vh,84px);border-radius:16px;padding:10px 16px;
  font-size:clamp(17px,2vw,23px);font-weight:600;line-height:1.45;display:flex;align-items:center;gap:12px}
.fb .ico{flex:none;font-size:clamp(22px,2.6vw,30px)}
.fb.hide{visibility:hidden}
.fb.good{background:#e9f9f0;border:2px solid #a9e6c5}
.fb.bad{background:#fdeeee;border:2px solid #f2b8b8}
.fb.fin{background:#fff7e6;border:2px solid #f5d797}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s var(--ease)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,111,191,.25)}50%{box-shadow:0 0 0 6px rgba(47,111,191,.12)}}
/* 演示 overlay */
.demo{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#eef4fb,#e6f2ec);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:18px;transition:opacity .3s var(--ease)}
.demo.hide{opacity:0;pointer-events:none}
.demo .box{flex:1 1 auto;min-height:0;width:100%;max-width:820px;display:flex;align-items:center;justify-content:center}
.demo .box svg{width:100%;height:100%;max-height:56vh}
.demo .caption{font-size:clamp(20px,2.6vw,28px);font-weight:800;color:var(--accent)}
.demo .demoGo{flex:none;min-height:64px;padding:14px 28px;border-radius:16px;border:none;
  background:var(--accent);color:#fff;font-size:clamp(20px,2.4vw,26px);font-weight:800;cursor:pointer;font-family:inherit}
.demo .skip{position:absolute;top:16px;right:16px;min-height:48px;padding:8px 18px;border-radius:14px;
  border:2px solid var(--line);background:#fff;font-size:clamp(16px,1.8vw,20px);font-weight:700;cursor:pointer;font-family:inherit}
#demoStatic{display:none}
/* 演示动画：只播一次，不循环 */
@keyframes dBluBubble{0%,8%{opacity:0}14%,52%{opacity:1}60%,100%{opacity:0}}
@keyframes dOrangeBubble{0%,20%{opacity:0}26%,60%{opacity:1}66%,100%{opacity:0}}

@keyframes dCrayonToBlu{0%,34%{transform:translate(600px,262px)}42%,100%{transform:translate(210px,262px)}}
@keyframes dCrayonBack{0%,66%{transform:translate(210px,262px)}74%,100%{transform:translate(600px,262px)}}
@keyframes dSun{0%,48%{opacity:0}56%,100%{opacity:1}}
@keyframes dFadeIn{from{opacity:0}to{opacity:1}}
.demo .a1{animation:dBluBubble 9s var(--ease) both}
.demo .a2{animation:dOrangeBubble 9s var(--ease) both}
.demo .a3{animation:dNod 9s var(--ease) both;transform-origin:560px 232px}

.demo .a6{animation:dSun 9s var(--ease) both}
.demo .a7{animation:dFadeIn .5s 7.6s both}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  #demoAnimated{display:none}
  #demoStatic{display:block}
}
html.aid-compact .badge,html.aid-compact .demo .box{display:none}
html.aid-compact .prompt{font-size:17px}
html.aid-compact .fb{min-height:44px;padding:6px 12px;font-size:15px}
html.aid-compact .btn,html.aid-compact .step{min-height:52px;font-size:16px;padding:8px 12px}
html.aid-compact .stage{border-radius:12px}

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var crayon=$('crayon'), car=$('car');
  var CRAYON_AT_BLU='translate(210px,262px)', CRAYON_AT_ORANGE='translate(600px,262px)';
  var CAR_AT_BLU='translate(205px,304px)', CAR_AT_ORANGE='translate(620px,304px)';
  crayon.style.transition='transform .65s cubic-bezier(.25,1,.5,1)';
  car.style.transition='transform .65s cubic-bezier(.25,1,.5,1)';

  var state={phase:'choose', step:0, extStep:0, wrongDone:false};

  function setExpr(who,expr){
    ['smile','angry','shock'].forEach(function(e){
      var el=$(who+'-'+e); if(el) el.style.display=(e===expr)?'':'none';
    });
  }
  function bubble(who,text){
    var b=$(who+'-bubble');
    $(who+'-bubble-text').textContent=text;
    b.style.opacity=1;
  }
  function hideBubbles(){
    $('blu-bubble').style.opacity=0;
    $('or-bubble').style.opacity=0;
  }
  function nod(){
    var h=$('orHead');
    h.style.transition='none';
    h.style.transform='rotate(0deg)';
    void h.getBoundingClientRect();
    h.style.transition='transform .18s cubic-bezier(.25,1,.5,1)';
    h.style.transform='rotate(-11deg)';
    setTimeout(function(){h.style.transform='rotate(0deg)';},260);
  }
  function drawSun(){
    var d=$('sunDoodle');
    d.style.opacity=1;
    d.style.transition='opacity .45s var(--ease)';
    $('sunCore').style.transition='opacity .45s var(--ease)';
    var rays=document.querySelectorAll('#sunRays line');
    rays.forEach(function(l){l.style.transition='stroke-dashoffset .5s .15s var(--ease)';l.style.strokeDasharray='14';l.style.strokeDashoffset='0';});
  }
  function resetScene(){
    setExpr('blu','smile'); setExpr('or','smile');
    hideBubbles();
    crayon.style.transition='none'; crayon.style.transform=CRAYON_AT_ORANGE; void crayon.getBoundingClientRect();
    car.style.transition='none'; car.style.transform=CAR_AT_ORANGE; void car.getBoundingClientRect();
    crayon.style.transition='transform .65s cubic-bezier(.25,1,.5,1)';
    car.style.transition='transform .65s cubic-bezier(.25,1,.5,1)';
    crayon.style.display=''; car.style.display='none';
    var d=$('sunDoodle'); d.style.opacity=0;
    document.querySelectorAll('#sunRays line').forEach(function(l){l.style.strokeDashoffset='14';l.style.transition='none';});
  }

  function showFb(kind,ico,txt){
    var fb=$('fb'); fb.className='fb '+kind;
    $('fbIco').textContent=ico; $('fbText').textContent=txt;
  }
  function hideFb(){$('fb').className='fb hide';}

  /* ---------- 第 1 关：怎么开口 ---------- */
  var CHOICES=[
    {text:'小蓝直接伸手去拿小橙的蜡笔', good:false,
      effect:function(){ setExpr('or','angry'); bubble('or','那是我的！'); },
      fb:'没问就拿，小橙皱起眉头，把蜡笔收走了。要先开口问：「可以吗？」对方点头，才能伸手拿。'},
    {text:'小蓝大声喊：「快把蜡笔给我！」', good:false,
      effect:function(){ setExpr('or','shock'); bubble('or','好吵呀！'); },
      fb:'大声命令会吓到别人，小橙捂住耳朵，不愿意借。要轻轻说：「请问，可以借我一下吗？」'},
    {text:'小蓝轻轻说：「请问，可以借我黄色蜡笔吗？」', good:true,
      effect:function(){ bubble('blu','请问，可以借我蜡笔吗？'); },
      fb:'对啦！先问「可以吗」，再等对方点头——这就是礼貌。'}
  ];
  function renderChoices(){
    state.phase='choose';
    $('choices').style.display=''; $('steps').style.display='none';
    $('prompt').textContent='小蓝想画一个太阳，可是没有黄色蜡笔。小橙有黄色蜡笔。小蓝该怎么办？';
    var box=$('choices'); box.innerHTML='';
    CHOICES.forEach(function(c,i){
      var b=document.createElement('button');
      b.type='button'; b.className='btn'; b.textContent=c.text;
      b.onclick=function(){choose(i,b);};
      box.appendChild(b);
    });
    hideFb();
  }
  function choose(i,btn){
    var c=CHOICES[i];
    if(c.good){
      Array.prototype.forEach.call($('choices').children,function(el){el.disabled=true;});
      c.effect();
      showFb('good','👍',c.fb);
      state.step=1;
      setTimeout(beginSteps,600);
    }else{
      c.effect();
      btn.classList.add('bad','shake');
      showFb('bad','💡',c.fb);
      btn.disabled=true;
      setTimeout(function(){
        btn.classList.remove('bad','shake');
        if($('choices').querySelectorAll('button:not([disabled])').length>0){
          hideFb();
        }
      },1400);
    }
  }

  /* ---------- 四步链 ---------- */
  var ACTIONS=[
    { // 01 请问（选对时已点亮）
      step:function(){ bubble('blu','请问，可以借我蜡笔吗？'); },
      tip:'小蓝轻轻问：可以吗？'
    },
    { // 02 点头
      step:function(){ nod(); bubble('or','可以呀！'); },
      tip:'小橙点头同意，小蓝才伸手拿。'
    },
    { // 03 谢谢
      step:function(){ crayon.style.transform=CRAYON_AT_BLU; setTimeout(function(){bubble('blu','谢谢你！');drawSun();},620); },
      tip:'蜡笔飞到小蓝手里，小蓝说谢谢，画了一个太阳。'
    },
    { // 04 归还
      step:function(){ crayon.style.transform=CRAYON_AT_ORANGE; setTimeout(function(){bubble('or','谢谢你借给我！');setExpr('or','smile');},620); },
      tip:'画完了，小蓝把蜡笔还回去，小橙笑了。'
    }
  ];
  function setStep(i,cls){
    var el=$('st'+i);
    el.className='step '+(cls||'');
  }
  function beginSteps(){
    state.phase='steps';
    $('choices').style.display='none'; $('steps').style.display='';
    hideBubbles(); hideFb();
    for(var i=0;i<4;i++) setStep(i,'off');
    setStep(0,'done');      // 01 已问
    setStep(1,'ready');
    $('prompt').textContent=ACTIONS[0].tip+' 点下一步';
    showFb('good','🗣️','第一步已经做好啦：小蓝问「可以吗」。');
  }
  function doStep(i){
    if(i!==state.step) return;
    ACTIONS[i].step();
    setStep(i,'done');
    showFb('good', i===3?'🎉':'✅', ACTIONS[i].tip);
    if(i===3){
      state.phase='fin';
      $('prompt').textContent='先问、点头、谢谢、归还——借东西有礼貌，别人更愿意借给你！';
      setStep(0,'done');setStep(1,'done');setStep(2,'done');setStep(3,'done');
      showFb('fin','🌟','太棒了！你学会了礼貌借东西。');
      $('btnReset').textContent='再玩一次 ↻';
      return;
    }
    state.step=i+1;
    setStep(i+1,'ready');
  }

  /* ---------- 举一反三：借玩具小车 ---------- */
  var CAR_ACTIONS=[
    {step:function(){ bubble('blu','请问，可以借小车吗？'); }, tip:'先问：「可以吗？」'},
    {step:function(){ nod(); bubble('or','可以呀！'); }, tip:'点头同意，再拿。'},
    {step:function(){ car.style.transform=CAR_AT_BLU; setTimeout(function(){bubble('blu','谢谢你！');},620); }, tip:'借到小车，说谢谢。'},
    {step:function(){ car.style.transform=CAR_AT_ORANGE; setTimeout(function(){bubble('or','谢谢你借给我！');},620); }, tip:'玩完了，还回去。'}
  ];
  function beginExt(){
    state.phase='ext'; state.extStep=0;
    crayon.style.display='none'; car.style.display='';
    car.style.transform=CAR_AT_ORANGE;
    hideBubbles(); hideFb();
    for(var i=0;i<4;i++) setStep(i,'off');
    setStep(0,'ready');
    $('prompt').textContent='小蓝又想玩小橙的玩具小车。你来帮小蓝，按顺序点四步吧！';
    showFb('good','🚗','换一个东西试试：借小车，也要先问、点头、谢谢、归还。');
    $('btnReset').textContent='↻ 重新来';
  }
  function doExt(i){
    if(i!==state.extStep) return;
    CAR_ACTIONS[i].step();
    setStep(i,'done');
    showFb('good', i===3?'🎉':'✅', CAR_ACTIONS[i].tip);
    if(i===3){
      state.phase='extfin';
      $('prompt').textContent='你会说礼貌的话，真棒！别人都愿意把东西借给你！';
      showFb('fin','🌟','换一个东西，你也会礼貌地借。真棒！');
    }else{
      state.extStep=i+1;
      setStep(i+1,'ready');
    }
  }

  /* ---------- 演示 overlay ---------- */
  function closeDemo(){
    var d=$('demo'); d.classList.add('hide');
    setTimeout(function(){d.style.display='none';},320);
  }
  $('btnSkipDemo').onclick=closeDemo;
  $('btnStart').onclick=closeDemo;
  $('btnReset').onclick=function(){
    resetScene();
    if(state.phase==='ext'||state.phase==='extfin'){
      beginExt();
    }else{
      renderChoices();
    }
  };
  // 步骤按钮点击
  $('st0').onclick=function(){ if(state.phase==='steps') doStep(0); else if(state.phase==='ext') doExt(0); };
  $('st1').onclick=function(){ if(state.phase==='steps') doStep(1); else if(state.phase==='ext') doExt(1); };
  $('st2').onclick=function(){ if(state.phase==='steps') doStep(2); else if(state.phase==='ext') doExt(2); };
  $('st3').onclick=function(){ if(state.phase==='steps') doStep(3); else if(state.phase==='ext') doExt(3); };

  /* ---------- 一屏适配 ---------- */
  (function fit(){
    var html=document.documentElement;
    function measure(){
      html.classList.remove('aid-compact');
      if(innerHeight<760 || document.querySelector('.card').scrollHeight>document.querySelector('.card').clientHeight+6){
        html.classList.add('aid-compact');
      }
    }
    addEventListener('resize',measure);
    addEventListener('load',measure);
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',measure);
    else requestAnimationFrame(measure);
    setTimeout(measure,80); setTimeout(measure,400);
  })();

  resetScene();
  renderChoices();
})();
</script>
</body>
</html>
