<style>
:root{--ink:#1f2a44;--accent:#f97316;--ok:#10b981;--bad:#ef4444;--muted:#667085;--line:#fed7aa;--cream:#fff7ed;--ease:cubic-bezier(0.25,1,0.5,1);--touch:64px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff7ed,#fce7f3);height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:clamp(6px,1.2vh,14px) clamp(8px,1.5vw,18px)}
.card{flex:1 1 auto;min-height:0;width:100%;max-width:min(1240px,100%);margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 28px rgba(249,115,22,.12);padding:clamp(10px,1.5vh,20px) clamp(12px,1.8vw,24px);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;flex:none}
.top h1{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:800}
.badge{font-size:15px;font-weight:700;color:#c2410c;background:#ffedd5;padding:5px 12px;border-radius:999px}
.progress{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:6px;flex:none}
.scene{flex:1 1 40%;min-height:min(260px,36vh);overflow:hidden;display:flex;flex-direction:column;justify-content:center;background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:8px 10px 6px;margin-bottom:8px}
.scene svg{flex:1 1 auto;width:100%;height:100%;max-height:100%;min-height:0}
.scene p{font-size:clamp(21px,2.3vw,27px);line-height:1.5;margin:8px 0 0;text-align:left;flex:none}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;flex:none}
.btn{min-height:var(--touch);padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:clamp(21px,2.1vw,25px);font-weight:700;cursor:pointer;font-family:inherit;text-align:left;line-height:1.35}
.btn:disabled{opacity:.75;cursor:not-allowed}
.btn.ok{border-color:var(--ok);background:#ecfdf5}
.btn.bad{border-color:var(--bad);background:#fef2f2}
.consequence{display:none;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid var(--line);background:#f8fafc;flex:none;max-height:36%;overflow:auto}
.consequence.show{display:block}
.consequence.ok{background:#ecfdf5;border-color:#6ee7b7}
.consequence.bad{background:#fff7ed;border-color:#fcd34d}
.consequence svg{width:100%;max-width:300px;height:auto;margin:0 auto;display:block}
.consequence .txt{font-size:clamp(20px,2.1vw,24px);line-height:1.6;margin-top:8px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;flex:none}
.btn.small{min-height:54px;font-size:19px;text-align:center;padding:10px 16px}
.btn.primary{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;border:none;text-align:center}
.thinking{background:#fffbeb;border-radius:12px;padding:10px;font-size:clamp(17px,1.8vw,20px);border:1px dashed #fcd34d;margin-top:6px;flex:none}
.thinking .tag{font-weight:800;color:#b45309}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:wobble .4s ease}
@keyframes knockIn{0%,100%{transform:translateX(0)}30%{transform:translateX(-9px)}60%{transform:translateX(5px)}}
.knock-anim{animation:knockIn .5s ease infinite}
@keyframes handIn{0%{transform:translateX(-26px);opacity:0}100%{transform:translateX(0);opacity:1}}
.hand-anim{animation:handIn .55s var(--ease) forwards}
@keyframes ringWave{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2);opacity:0}}
.ring{transform-origin:center;transform-box:fill-box;animation:ringWave 1.3s ease-out infinite}
@keyframes stepPop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.step-pop{animation:stepPop .35s var(--ease) forwards}
/* 开场演示 */
#intro{position:fixed;inset:0;z-index:50;background:rgba(31,42,68,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#intro.hidden{display:none}
#intro .demo-title{color:#fff;font-size:clamp(26px,3.2vw,36px);font-weight:800}
#intro svg{width:min(400px,90vw);height:auto}
#intro .demo-line{color:#ffedd5;font-size:clamp(18px,2vw,24px);max-width:560px;min-height:2.4em}
#intro .skip{min-height:64px;padding:14px 34px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-size:clamp(21px,2.3vw,27px);font-weight:800;cursor:pointer;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:960px) and (min-height:780px){
  body{font-size:18px}
  .top h1{font-size:clamp(26px,2.2vw,32px)}
}
</style>

<body>
<main class="card">
  <div class="top"><h1>有人敲门</h1><span class="badge">3–6 岁 · 家庭安全</span></div>
  <div class="progress" id="progress">情境 1</div>
  <div class="scene">
    <svg id="mainSvg" viewBox="0 0 360 170" role="img" aria-label="家里门口，小豆人豆豆">
      <!-- 墙 -->
      <rect x="0" y="0" width="360" height="170" fill="#fdf6ec"/>

      <rect id="gap" x="330" y="36" width="14" height="108" fill="#5b3a1e" opacity="0"/>

        <circle cx="-6" cy="-11" r="3.4" fill="#fff"/>
        <circle cx="6" cy="-11" r="3.4" fill="#fff"/>
        <path d="M0 -18 Q0 -24 0 -24" stroke="#94a3b8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 豆豆手（常驻，打电话时举起） -->
      <g id="armCall" opacity="0">
        <path d="M16 6 Q34 0 38 8" stroke="#334155" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M38 2 L50 -6" stroke="#334155" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="50" cy="-6" r="4" fill="#334155"/>
      </g>
      <!-- 敲门拳头 -->
      <g id="knock" opacity="0">
        <circle cx="216" cy="96" r="12" fill="#b45309"/>
        <path d="M208 90 L212 96 M224 90 L220 96 M216 84 L216 92" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
        <text x="216" y="70" text-anchor="middle" font-size="15" fill="#c2410c" font-weight="800">咚咚咚</text>
      </g>
      <!-- 陌生人的手（危险后果） -->
      <g id="hand" opacity="0">
        <path d="M336 74 L312 74 L308 62 L304 74 L300 72" stroke="#7c3aed" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="300" y="70" width="40" height="12" rx="6" fill="#7c3aed" opacity=".85"/>
      </g>
      <!-- 电话（豆豆听筒） -->
      <g id="phone" opacity="0">
        <path d="M52 2 Q56 -14 46 -22 M52 2 Q68 6 74 -2" stroke="#0f766e" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="46" cy="-22" r="3.4" fill="#0f766e"/>
        <circle cx="74" cy="-2" r="3.4" fill="#0f766e"/>
        <circle class="ring" cx="88" cy="-8" r="10" fill="none" stroke="#0f766e" stroke-width="2.6" opacity="0"/>
      </g>
      <!-- 对话泡（危险：说出家里没人） -->
      <g id="bubble" opacity="0">
        <rect x="104" y="8" width="120" height="42" rx="14" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
        <path d="M136 50 L128 64 L148 50 Z" fill="#fff" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="164" y="34" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="800">家里只有我一个人</text>
      </g>
      <!-- 安全行动链徽章 -->
      <g id="steps" opacity="0">
        <g transform="translate(40,128)"><circle class="step" r="13" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/><text text-anchor="middle" y="5" font-size="15" font-weight="800" fill="#c2410c">1</text></g>
        <g transform="translate(92,128)"><circle class="step" r="13" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/><text text-anchor="middle" y="5" font-size="15" font-weight="800" fill="#c2410c">2</text></g>
        <g transform="translate(144,128)"><circle class="step" r="13" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5"/><text text-anchor="middle" y="5" font-size="15" font-weight="800" fill="#c2410c">3</text></g>
        <text x="24" y="112" font-size="13" fill="#9a3412" font-weight="700">不开门 · 问爸妈 · 听安排</text>
      </g>
    </svg>
    <p id="nodeText">咚咚咚！门外有人敲门，说：「我是送快递的」。你会怎么做？</p>
  </div>
  <div class="choices" id="choices"></div>
  <div class="consequence" id="consequence">
    <div id="consSvg"></div>
    <div class="txt" id="consTxt" aria-live="polite"></div>
  </div>
  <div class="btn-row">
    <button type="button" class="btn small primary" id="btnNext" hidden>下一步 →</button>
    <button type="button" class="btn small" id="btnReset">↻ 重新开始</button>
    <button type="button" class="btn small" id="btnSay">🗣️ 我会说</button>
  </div>
  <p class="thinking"><span class="tag">我怎么想：</span><span id="thinkText">大人不在，不要给陌生人开门。先打电话问爸爸妈妈。</span></p>
</main>

<!-- 开场演示：可跳过 -->
<div id="intro">
  <div class="demo-title">咚咚咚，有人敲门</div>
  <svg id="demoSvg" viewBox="0 0 400 200" role="img" aria-label="演示">
    <rect x="0" y="0" width="400" height="200" fill="#2b3a55"/>
    <rect x="248" y="30" width="120" height="140" rx="6" fill="#fdba74" stroke="#9a6b3f" stroke-width="3"/>
    <circle cx="280" cy="56" r="5" fill="#1f2a44"/>
    <circle cx="332" cy="104" r="7" fill="#d9a05b" stroke="#9a6b3f" stroke-width="2"/>
    <g id="demoKid" transform="translate(80,108)">
      <ellipse cx="0" cy="26" rx="24" ry="28" fill="#334155"/>
      <circle cx="0" cy="-8" r="17" fill="#475569"/>
      <circle cx="-7" cy="-12" r="3.6" fill="#fff"/>

      <path d="M84 8 Q90 -10 78 -20" stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="78" cy="-20" r="3.6" fill="#34d399"/>
      <circle class="ring" cx="104" cy="-12" r="10" fill="none" stroke="#34d399" stroke-width="2.6" opacity="0"/>
    </g>
    <text id="demoCap" x="200" y="185" text-anchor="middle" font-size="19" fill="#ffedd5" font-weight="800">先不开门 · 打电话问爸妈</text>

<script>
(function(){
  var NODES = {
    start:{
      progress:'情境 1 · 敲门',
      text:'咚咚咚！门外有人敲门，说：「我是送快递的」。你会怎么做？',
      scene:'knock',
      choices:[
        {text:'📞 先打电话问爸爸妈妈', next:'call', correct:true,
          fb:'对！大人不在时，先问信任的大人，不要自己开门。',
          svg:svgOk('先问爸妈')},
        {text:'🚪 有人会直接开门看看，会怎样？', next:'openDanger', correct:false,
          fb:'危险！门外可能是坏人。门一开，坏人就能进来，宝宝会害怕，还可能受伤。马上关好门、锁起来，打电话给爸爸妈妈。',
          svg:svgHand()},
        {text:'🗣️ 有人会大声说「家里只有我一个人」，行吗？', next:'tellDanger', correct:false,
          fb:'危险！告诉陌生人「家里没有大人」，坏人就知道只有宝宝一个人，更想进来了。马上不说话，打电话给爸爸妈妈。',
          svg:svgBubble()}
      ]
    },
    call:{
      progress:'情境 2 · 问爸妈',
      text:'爸爸妈妈说：「别开门，我们马上回来，快递放门外。」豆豆怎么做？',
      scene:'phone',
      choices:[
        {text:'✅ 听爸妈的，不开门，在家里等', next:'success', correct:true,
          fb:'对！不开门 → 问大人 → 听安排，这样做最安全。',
          svg:svgOk('听大人的话')},
        {text:'🚪 有人觉得「反正快回来了」，开一点门看看，会怎样？', next:'fail', correct:false,
          fb:'爸妈说了不开，就不要开。门一开，坏人就能进来，很危险。马上关好门，等爸爸妈妈回来。',
          svg:svgHand()}
      ]
    },
    openDanger:{
      progress:'危险 · 门开了缝',
      text:'门开了一条缝，外面伸进来一只陌生人的手！现在怎么办？',
      scene:'hand',
      choices:[
        {text:'🔒 用力关上门、锁好，打电话给爸妈', next:'success', correct:true,
          fb:'对！赶快回到安全状态：关门、锁好、联系大人。',
          svg:svgOk('关门 · 锁好 · 找爸妈')},
        {text:'🏃 有人会跟陌生人下楼拿快递，会怎样？', next:'fail', correct:false,
          fb:'不能跟陌生人离开家！跟着走就离开了安全的地方，可能会被带走，再也见不到爸爸妈妈。马上关好门，打电话给爸妈。',
          svg:svgLeave()}
      ]
    },
    tellDanger:{
      progress:'危险 · 说出了秘密',
      text:'陌生人知道家里没人，敲门敲得更凶了！豆豆现在怎么办？',
      scene:'bubble',
      choices:[
        {text:'🤫 不再说话，打电话给爸爸妈妈', next:'success', correct:true,
          fb:'对！停止说话，不透露任何信息，马上联系信任的大人。',
          svg:svgOk('不说话 · 打电话')},
        {text:'📢 有人会把姓名、幼儿园都告诉门外的人，行吗？', next:'fail', correct:false,
          fb:'自己的名字、幼儿园不能告诉陌生人！知道得越多，坏人越容易骗到宝宝。马上闭嘴，打电话给爸妈。',
          svg:svgBubble()}
      ]
    },
    success:{progress:'✓ 安全', ending:true, success:true,
      text:'记住安全三步：① 不开门 ② 问爸妈 ③ 听安排。',
      scene:'steps', choices:[], next2:'more'},
    fail:{progress:'⚠ 危险', ending:true, success:false,
      text:'这样做太危险了！陌生人可能进屋，或把宝宝带走。点「重新开始」，从「先问爸妈」开始。',
      scene:'none', choices:[], next2:'start'},
    more:{
      progress:'再想一想 · 门铃响了',
      text:'在楼下单元门口，有人按门铃说：「我是修水管的，快开门。」豆豆怎么做？',
      scene:'bell',
      choices:[
        {text:'✅ 还是先打电话问爸爸妈妈', next:'allGood', correct:true,
          fb:'对！不管是谁，大人不在就不开门，先问爸爸妈妈。',
          svg:svgOk('先问爸妈')},
        {text:'🚪 有人会开门让叔叔进来，会怎样？', next:'fail', correct:false,
          fb:'他说自己是修水管的，也可能是坏人装的。门一开，坏人就能进来。不管是谁，先问爸妈再说。',
          svg:svgHand()}
      ]
    },
    allGood:{progress:'🎉 你真棒', ending:true, success:true,
      text:'记住啦：大人不在家，谁敲门都不开，先打电话问爸爸妈妈！', scene:'none', choices:[], next2:'start'}
  };
  var nodeId='start', answered=false, introDone=false;
  function $(id){return document.getElementById(id);}
  function svgOk(label){
    return '<svg viewBox="0 0 220 100"><rect width="220" height="100" rx="10" fill="#ecfdf5"/><circle cx="64" cy="50" r="22" fill="#10b981"/><path d="M52 50 L61 59 L77 41" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="58" font-size="19" font-weight="800" fill="#065f46">'+label+'</text></svg>';
  }
  function svgHand(){
    return '<svg viewBox="0 0 220 100"><rect width="220" height="100" rx="10" fill="#fff7ed"/><rect x="150" y="14" width="52" height="66" rx="4" fill="#fdba74" stroke="#9a6b3f" stroke-width="2.5"/><rect x="182" y="18" width="8" height="58" fill="#5b3a1e"/><path d="M196 46 L168 46 L164 36 L160 46 L156 44" stroke="#7c3aed" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="34" y="62" font-size="40">😨</text><text x="104" y="92" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="800">陌生人进屋，很危险！</text></svg>';
  }
  function svgBubble(){
    return '<svg viewBox="0 0 220 100"><rect width="220" height="100" rx="10" fill="#fef2f2"/><rect x="70" y="12" width="120" height="38" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="130" y="36" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="800">家里只有我一个人</text><ellipse cx="42" cy="78" rx="30" ry="16" fill="#1f2a44" opacity=".9"/><circle cx="30" cy="74" r="3" fill="#fff"/><circle cx="52" cy="74" r="3" fill="#fff"/><text x="130" y="92" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="800">坏人知道没人，更想进来！</text></svg>';
  }
  function svgLeave(){
    return '<svg viewBox="0 0 220 100"><rect width="220" height="100" rx="10" fill="#fff7ed"/><ellipse cx="52" cy="72" rx="22" ry="16" fill="#334155"/><circle cx="52" cy="58" r="12" fill="#475569"/><path d="M150 70 L186 52 M150 70 L186 70" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/><text x="110" y="96" text-anchor="middle" font-size="15" fill="#991b1b" font-weight="800">跟陌生人走，会离开家！</text><text x="52" y="32" text-anchor="middle" font-size="26">🏠</text></svg>';
  }
  // ---- 主图状态机：每次切幕设置可见元素与动效 ----
  function setScene(kind){
    ['knock','hand','phone','bubble','steps','bell'].forEach(function(k){
      var g=document.getElementById(k); if(g) g.setAttribute('opacity',0);
    });
    var base={knock:'knock',hand:'hand',phone:'phone',bubble:'bubble',steps:'steps',bell:'knock'};
    var key=base[kind]||'none';
    if(key!=='none'){
      var g=document.getElementById(key);
      g.setAttribute('opacity',1);
      if(key==='knock' && !$('knock').classList.contains('knock-anim')) $('knock').classList.add('knock-anim');
      if(key==='hand'){
        $('gap').setAttribute('opacity',1);
        var h=$('hand'); h.classList.remove('hand-anim'); void h.getBoundingClientRect(); h.classList.add('hand-anim');
      }
      if(key==='steps'){ startSteps(); }
    } else {
      $('gap').setAttribute('opacity',0);
    }
  }
  function startSteps(){
    var cs=document.querySelectorAll('#steps .step');
    cs.forEach(function(c,i){
      setTimeout(function(){ c.setAttribute('fill','#c2410c'); c.classList.add('step-pop'); }, 350*i+150);
    });
  }
  // ---- 剧情渲染 ----
  function render(){
    var n=NODES[nodeId]; answered=false;
    $('progress').textContent=n.progress;
    $('nodeText').textContent=n.text;
    $('consequence').className='consequence';
    $('btnNext').hidden=true;
    setScene(n.scene||'none');
    var box=$('choices'); box.innerHTML='';
    if(n.ending){
      $('thinkText').textContent=n.success?'不开门、问爸妈、听安排，最安全。':'下次先打电话给爸妈，不要自己开门。';
      if(n.next2){
        $('btnNext').textContent=(nodeId==='success')?'再玩一关 →':'↻ 再试一次';
        $('btnNext').hidden=false;
        $('btnNext').onclick=function(){ nodeId=n.next2; render(); };
      }
      return;
    }
    n.choices.forEach(function(c){
      var b=document.createElement('button');
      b.type='button'; b.className='btn'; b.textContent=c.text;
      b.onclick=function(){ choose(c,b); };
      box.appendChild(b);
    });
    $('thinkText').textContent='大人不在，不要给陌生人开门。';
  }
  function choose(c,btn){
    if(answered) return; answered=true;
    Array.prototype.forEach.call($('choices').children,function(el){ el.disabled=true; });
    btn.classList.add(c.correct?'ok':'bad');
    if(!c.correct) btn.classList.add('shake');
    var cons=$('consequence');
    cons.className='consequence show '+(c.correct?'ok':'bad');
    $('consSvg').innerHTML=c.svg;
    $('consTxt').textContent=c.fb;
    nodeId=c.next;
    $('btnNext').hidden=false;
    $('btnNext').textContent='下一步 →';
    $('btnNext').onclick=render;
    if(!c.correct){
      setTimeout(function(){
        Array.prototype.forEach.call($('choices').children,function(el){
          if(!el.classList.contains('bad')) el.disabled=false;
        });
        answered=false;
      }, 900);
    }
  }
  $('btnReset').onclick=function(){ nodeId='start'; render(); };
  $('btnSay').onclick=function(){
    $('consequence').className='consequence show ok';
    $('consSvg').innerHTML='';
    $('consTxt').textContent='我会说：爸妈不在，我不给陌生人开门，先打电话问爸爸妈妈。';
  };
  $('btnStart').onclick=function(){ $('intro').classList.add('hidden'); introDone=true; };
  // ---- 开场演示（可跳过；reduced-motion 出静帧） ----
  (function intro(){
    var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    var line=$('demoLine'), cap=$('demoCap');
    if(reduce){
      line.textContent='有人敲门，先不开门，打电话问爸爸妈妈。';
      $('demoHand').setAttribute('opacity',1);
      $('demoPhone').setAttribute('opacity',1);
      return;
    }
    var seq=[
      {t:0,  fn:function(){ line.textContent='听到敲门，先不要开门。'; $('demoHand').setAttribute('opacity',1); }},
      {t:2600,fn:function(){ line.textContent='不认识的叔叔阿姨，不能开门。'; cap.textContent='不认识的人 · 不开门'; }},
      {t:5200,fn:function(){ line.textContent='拿起电话，问爸爸妈妈怎么做。'; $('demoHand').setAttribute('opacity',0); $('demoPhone').setAttribute('opacity',1); cap.textContent='先不开门 · 打电话问爸妈'; }},
      {t:8200,fn:function(){ line.textContent='爸爸妈妈说：别开门，等我们回来。'; }},
      {t:10500,fn:function(){ line.textContent='准备好了吗？开始玩吧！'; }},
    ];
    seq.forEach(function(s){ setTimeout(s.fn, s.t); });
  })();
  render();
})();
</script>
