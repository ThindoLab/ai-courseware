<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v3">
<meta name="aid-version-at" content="2026-08-17T06-33-24">

<title>分披萨 · 分数</title>
<!-- aid-contract {"levels":[
 {"answers":["1/4"],"tiles":["1/4","1/3","1/2"]},
 {"answers":["2/4"],"tiles":["2/4","2/3","1/4"]},
 {"answers":["3/4"],"tiles":["3/4","3/3","1/4"]},
 {"answers":["1/2 更大"],"tiles":["1/2 更大","1/4 更大","一样大"]},
 {"answers":["2/6"],"tiles":["2/6","2/4","1/2"]}
]} -->
<style>
:root{
  --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d; --card:#fff;
  --cheese:#f7a83c; --crust:#c97b2d; --melon:#4cae6a; --melonD:#2e7d4f;
  --bg:#eef4fb; --line:#d7e3f2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;overflow:hidden;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column;
}
#app{display:flex;flex-direction:column;height:100%;max-width:min(1240px,100%);margin:0 auto;width:100%}
header{
  flex:none; display:flex; align-items:center; gap:12px;
  padding:10px 16px 6px;
}
.title{font-size:26px;font-weight:900;letter-spacing:.5px;line-height:1.1}
.lvl{margin-left:auto;font-size:20px;font-weight:800;color:var(--accent);background:#e2ecfb;padding:6px 14px;border-radius:999px;white-space:nowrap}
.reset{flex:none;width:52px;height:52px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform .15s}
.reset:active{transform:scale(.94)}
#dots{flex:none;display:flex;gap:8px;padding:4px 16px 0}
.dot{width:12px;height:12px;border-radius:50%;background:#c7d8ee}
.dot.on{background:var(--accent)}
#stage{
  flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
  padding:2px 12px; position:relative;
}
#stage svg{width:100%;height:100%;max-width:100%;max-height:100%}
.buddyRow{flex:none;display:flex;align-items:center;gap:10px;padding:2px 16px 0}
.buddy{width:46px;height:66px;flex:none}
.buddyTxt{font-size:20px;font-weight:600;line-height:1.3}
footer{
  flex:none; width:100%; max-width:880px; margin:0 auto;
  padding:6px 16px 14px; display:flex; flex-direction:column; gap:8px;
}
#prompt{
  display:flex; align-items:center; gap:12px; min-height:44px;
  font-size:22px; font-weight:800;
}
#fracUI{font-size:40px;color:var(--accent)}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle}
.frac .num{font-size:.85em;font-weight:900}
.frac .line{width:1.05em;height:.09em;background:currentColor;border-radius:2px;margin:.04em 0}
.frac .den{font-size:.85em;font-weight:900}
#opts{display:flex;gap:12px;flex-wrap:wrap}
.btn{
  min-height:56px;padding:8px 22px;font-size:21px;font-weight:800;
  border-radius:18px;border:2.5px solid var(--ink);background:var(--card);color:var(--ink);
  cursor:pointer;transition:transform .12s ease, background .18s ease, color .18s ease;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:1;min-width:150px;
  touch-action:manipulation;
}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{flex:none;min-width:0;min-height:52px;font-size:20px;padding:6px 14px}
.btn .frac{font-size:24px}
#feedback{min-height:52px;font-size:20px;font-weight:700;line-height:1.35;padding:4px 2px}
#feedback.ok{color:var(--ok)}
#feedback.bad{color:var(--bad)}
#feedback.hint{color:var(--accent)}
.shake{animation:shake .38s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.blk{cursor:pointer;transition:fill .2s ease, transform .3s cubic-bezier(.25,1,.5,1), stroke .2s}
.cut{transition:stroke-dashoffset .34s cubic-bezier(.25,1,.5,1)}
.slideIn{animation:slideIn .5s cubic-bezier(.25,1,.5,1) both}
@keyframes slideIn{from{transform:translateX(var(--sx,0))}to{transform:translateX(0)}}
/* 开场演示 overlay */
.overlay{position:fixed;inset:0;background:rgba(238,244,251,.97);z-index:20;display:flex;align-items:center;justify-content:center}
.ov-card{background:var(--card);border:3px solid var(--accent);border-radius:22px;padding:22px 30px;max-width:min(680px,92vw);text-align:center;box-shadow:0 18px 50px rgba(30,58,95,.18)}
.ov-card h2{font-size:clamp(28px,4.5vw,44px);margin:0 0 10px}
.ov-card .line{font-size:clamp(20px,3vw,28px);margin:8px 0;font-weight:700}
.ov-card .sub{font-size:clamp(17px,2.2vw,21px);color:#5a7596;margin:6px 0 12px}
.ov-frame{display:none}
.ov-frame.show{display:block}
.ov-frame svg{max-width:240px;max-height:190px;margin:0 auto;display:block}
.ov-card .skip{min-height:56px;padding:10px 26px;border-radius:16px;border:0;background:var(--accent);color:#fff;font-size:clamp(19px,2.6vw,24px);font-weight:800;cursor:pointer;touch-action:manipulation;margin-top:14px}
.ov-card .skip.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);margin-right:10px}
/* 完成页 overlay */
.finish{position:fixed;inset:0;background:rgba(238,244,251,.97);z-index:20;display:none;align-items:center;justify-content:center}
.finish.show{display:flex}
.fin-card{background:var(--card);border:3px solid var(--ok);border-radius:22px;padding:30px 36px;max-width:min(600px,92vw);text-align:center}
.big-ok{width:88px;height:88px;border-radius:50%;background:var(--ok);color:#fff;font-size:50px;line-height:88px;margin:0 auto 14px}
.fin-card h2{font-size:clamp(26px,4vw,38px);margin:0 0 10px}
.fin-card p{font-size:clamp(19px,2.5vw,24px);color:#5a7596;margin:0 0 8px;line-height:1.5}
.fin-card .extra{margin:12px auto 18px;font-size:clamp(17px,2.2vw,21px);font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;max-width:460px}
.fin-card .skip{min-height:56px;padding:10px 30px;border-radius:16px;border:0;background:var(--accent);color:#fff;font-size:22px;font-weight:800;cursor:pointer;touch-action:manipulation}
@media (max-width:560px){
  .title{font-size:21px}
  .lvl{font-size:16px}
  .buddyTxt{font-size:17px}
  #prompt{font-size:19px}
  #fracUI{font-size:34px}
  .btn{font-size:18px;min-width:0}
  #feedback{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">🍕 分披萨 · 分数</div>
    <div class="lvl" id="lvlName">第 1 关 · 切披萨</div>
    <button class="reset" id="resetBtn" aria-label="重新开始">↻</button>
  </header>
  <div id="dots"></div>
  <main id="stage"></main>
  <div class="buddyRow">
    <svg class="buddy" viewBox="0 0 60 90" aria-hidden="true">
      <ellipse cx="30" cy="54" rx="19" ry="25" fill="#1e3a5f"/>
      <circle cx="24" cy="47" r="2.8" fill="#fff"/>
      <circle cx="36" cy="47" r="2.8" fill="#fff"/>
      <path d="M27 66 Q30 71 33 66" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M11 52 Q3 64 5 74" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M49 52 Q57 64 55 74" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M18 86 Q30 92 42 86" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="buddyTxt" id="buddyTxt">我是小厨。把披萨切成一样大的块，数一数有几份！</div>
  </div>
  <footer>
    <div id="prompt"><span class="frac" id="fracUI" style="opacity:.35"><span class="num">1</span><span class="line"></span><span class="den">?</span></span><span id="promptTxt">先把披萨切成一样大的块</span></div>
    <div id="opts"></div>
    <div id="feedback"></div>
  </footer>
</div>

<!-- 开场演示（可跳过、真动；演示主图 = 正式玩同一套披萨） -->
<div class="overlay" id="demo">
  <div class="ov-card">
    <div class="ov-frame show" id="f1">
      <h2>先切披萨</h2>
      <div id="demoPizza1"></div>
      <p class="line">切成一模一样大的块<br>这叫<b style="color:var(--accent)">平均分</b></p>
    </div>
    <div class="ov-frame" id="f2">
      <h2>切成 2 份</h2>
      <div id="demoPizza2"></div>
      <p class="line">数一数：切成了 <b style="color:var(--accent)">2</b> 份</p>
    </div>
    <div class="ov-frame" id="f3">
      <h2>1 份写作 1/2</h2>
      <div id="demoPizza3"></div>
      <p class="sub">分母 2 = 总份数，分子 1 = 取的 1 份<br>现在你来试试！</p>
    </div>
    <div style="margin-top:6px">
      <button class="skip ghost" id="skipDemo">跳过</button>
      <button class="skip" id="startDemo">开始玩 ▶</button>
    </div>
  </div>
</div>

<!-- 完成页 -->
<div class="finish" id="finish">
  <div class="fin-card">
    <div class="big-ok">✓</div>
    <h2>你会分披萨啦！</h2>
    <p>1/4、2/4、3/4 都难不倒你！<br>秘诀：分母是总份数，分子是取的份数。</p>
    <div class="extra">🏠 举一反三：回家考考爸妈——一块巧克力切成 3 份，取 1 份，是几分之几？（答案：1/3）</div>
    <button class="skip" id="again">再玩一次</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const CX=150,CY=138,R=88;
let level=1;
let cur={parts:2,taken:[],target:1,step:0};
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- SVG helpers ---------- */
function sectorPath(cx,cy,r,a0,a1){
  const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
  const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
  const large=(a1-a0)>Math.PI?1:0;
  return `M${cx} ${cy} L${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`;
}
function fracHTML(n,d,cls){
  return `<span class="frac${cls?' '+cls:''}"><span class="num">${n}</span><span class="line"></span><span class="den">${d}</span></span>`;
}
function setFrac(n,d){
  $('fracUI').innerHTML=`<span class="num">${n}</span><span class="line"></span><span class="den">${d}</span>`;
  $('fracUI').style.opacity='1';
}
function setPrompt(txt, frac){ $('promptTxt').textContent=txt; if(!frac){$('fracUI').style.opacity='.35';} }
function setFB(html,cls){ $('feedback').innerHTML=html; $('feedback').className=cls||''; }
function drawDots(){
  const html=[]; for(let i=1;i<=5;i++) html.push(`<span class="dot${i<=level?' on':''}"></span>`);
  $('dots').innerHTML=html.join('');
}

/* ---------- Pizza builder（演示与正式玩共用同一套） ---------- */
function buildPizza(opts){
  const {parts=2, highlight=[], clickable=true, cx=CX, cy=CY, r=R, fill='var(--cheese)', crust='var(--crust)', animate=!reduceMotion, viewBox='0 0 300 260'} = opts;
  let svg=`<svg viewBox="${viewBox}" role="img" aria-label="披萨图" preserveAspectRatio="xMidYMid meet">`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${crust}" stroke-width="4"/>`;
  for(let i=0;i<parts;i++){
    const a0=-Math.PI/2 + i*2*Math.PI/parts;
    const a1=-Math.PI/2 + (i+1)*2*Math.PI/parts;
    const isH=highlight.includes(i);
    const d=sectorPath(cx,cy,r-2,a0+0.04,a1-0.04);
    const tx=isH?7*Math.cos((a0+a1)/2):0, ty=isH?7*Math.sin((a0+a1)/2):0;
    svg+=`<path class="blk" data-i="${i}" d="${d}" fill="${isH?'rgba(47,111,191,.42)':'transparent'}" stroke="${isH?'var(--accent)':'none'}" stroke-width="3" transform="translate(${tx} ${ty})" ${clickable?'':'style="pointer-events:none"'}></path>`;
  }
  for(let i=0;i<parts;i++){
    const a=-Math.PI/2 + i*2*Math.PI/parts;
    const x2=cx+r*Math.cos(a), y2=cy+r*Math.sin(a);
    svg+=`<line class="cut" x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="2.5" opacity=".72" stroke-linecap="round" style="stroke-dasharray:${r};stroke-dashoffset:${animate?r:0};transition:stroke-dashoffset .32s cubic-bezier(.25,1,.5,1) ${animate?(i*0.11)+'s':0}"></line>`;
  }
  svg+=`</svg>`;
  return svg;
}
function attachBlocks(handler){
  document.querySelectorAll('#stage .blk').forEach(el=>{
    el.addEventListener('click',()=>{ const i=+el.dataset.i; handler(i, el); });
  });
}
function redraw(parts, highlight, extra){
  $('stage').innerHTML=buildPizza(Object.assign({parts,highlight},extra||{}));
  requestAnimationFrame(()=>{ document.querySelectorAll('#stage .cut').forEach((l,j)=>{ l.style.strokeDashoffset='0'; }); });
}

/* ---------- Options / feedback ---------- */
function showOptions(list, correctIdx, onPick){
  $('opts').innerHTML=list.map((o,i)=>`<button class="btn opt" data-i="${i}">${o}</button>`).join('');
  document.querySelectorAll('#opts .opt').forEach(b=>{
    b.addEventListener('click',()=>{
      const i=+b.dataset.i;
      if(i===correctIdx){ onPick(true,i); }
      else{ onPick(false,i); }
    });
  });
}
function clearOpts(){ $('opts').innerHTML=''; }
function showNext(label){
  clearOpts();
  $('opts').innerHTML=`<button class="btn primary" id="nextBtn">${label||'下一关 →'}</button>`;
  $('nextBtn').addEventListener('click',()=>{ goNext(); });
}
function shakeBlock(i){
  const el=document.querySelector(`#stage .blk[data-i="${i}"]`);
  if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
}

/* ---------- Level 1: 切披萨（第一关讲清后必须出「下一关」） ---------- */
function initL1(){
  $('lvlName').textContent='第 1 关 · 切披萨';
  $('buddyTxt').textContent='把披萨切成一样大的块，这叫平均分。数一数切成了几份！';
  cur={parts:2,taken:[],target:1,step:0};
  setPrompt('点按钮切披萨，再点一块看看', false);
  setFB('', '');
  redraw(2, []);
  const cutBtns=['2','4','8'].map(p=>`<button class="btn small" data-p="${p}">切成 ${p} 份</button>`).join('');
  $('opts').innerHTML=cutBtns;
  document.querySelectorAll('#opts .btn[data-p]').forEach(b=>{
    b.addEventListener('click',()=>{
      const p=+b.dataset.p; cur.parts=p; cur.taken=[];
      document.querySelectorAll('#opts .btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      setFrac(1,p); setPrompt(`切成 ${p} 份。点一块，看看它占整个披萨的多少`, true);
      setFB('', '');
      redraw(p, []);
      attachBlocks((i)=>{
        cur.taken=[i];
        redraw(p,[i]);
        attachBlocksL1();
        setFrac(1,p);
        setPrompt(`${p} 份里的 1 份，写作`, true);
        setFB(`<b>1/${p}</b>：分母 ${p} 是总份数，分子 1 是取了的 1 份。每一块都一样大，才是平均分。`,'ok');
        showNext('下一关 →');
      });
    });
  });
  function attachBlocksL1(){
    attachBlocks((i)=>{
      cur.taken=[i];
      redraw(cur.parts,[i]);
      attachBlocksL1();
      setFrac(1,cur.parts);
      setPrompt(`${cur.parts} 份里的 1 份，写作`, true);
      setFB(`<b>1/${cur.parts}</b>：分母 ${cur.parts} 是总份数，分子 1 是取了的 1 份。每一块都一样大，才是平均分。`,'ok');
      showNext('下一关 →');
    });
  }
  // 默认先切成 2 份并高亮演示
  setTimeout(()=>{ document.querySelectorAll('#opts .btn[data-p]')[0].click(); }, 420);
}

/* ---------- Level 2: 几分之一 ---------- */
function initL2(){
  $('lvlName').textContent='第 2 关 · 一块是多少';
  $('buddyTxt').textContent='披萨切成了 4 份。点 1 块，看看它是几分之一。';
  cur={parts:4,taken:[],target:1,step:0};
  setPrompt('点 1 块披萨', false);
  setFB('', '');
  redraw(4,[]);
  attachBlocks((i)=>{
    cur.taken=[i];
    redraw(4,[i]);
    attachBlocksL2();
    setFrac(1,4);
    setPrompt('这一块是？', true);
    showOptions([fracHTML(1,4),fracHTML(1,3),fracHTML(1,2)],0,(ok,idx)=>{
      if(ok){
        setFB('对！4 份里的 1 份写作 <b>1/4</b>。分母 4 = 总份数，分子 1 = 取的份数。','ok');
        showNext();
      }else{
        shakeBlock(i);
        const txt = idx===1
          ? '数一数：这个披萨被切成了 <b>4</b> 份，不是 3 份。1 份就是 4 份里的 1 份，写作 <b>1/4</b>。'
          : '把整个披萨切成 2 份时，1 份才是 1/2。现在切成的是 4 份，1 份是 <b>1/4</b>。';
        setFB(txt,'bad');
      }
    });
  });
  function attachBlocksL2(){
    attachBlocks((i)=>{
      cur.taken=[i]; redraw(4,[i]); attachBlocksL2();
      setFrac(1,4); setPrompt('这一块是？', true);
    });
  }
}

/* ---------- Level 3: 几分之几 ---------- */
function initL3(){
  $('lvlName').textContent='第 3 关 · 取几块';
  $('buddyTxt').textContent='这次取好几块。先点 2 块，再点 3 块。';
  cur={parts:4,taken:[],target:2,step:0};
  setPrompt('点 2 块披萨', false);
  setFB('', '');
  redraw(4,[]);
  wireL3();
  function wireL3(){
    attachBlocks((i)=>{
      if(cur.taken.includes(i)){
        cur.taken=cur.taken.filter(x=>x!==i);
        redraw(4,cur.taken); wireL3();
        setFB('','');
        return;
      }
      if(cur.taken.length>=cur.target){
        setFB(`已经取 ${cur.target} 块啦。点亮的块再点一下，可以取消。`,'hint');
        return;
      }
      cur.taken.push(i);
      redraw(4,cur.taken); wireL3();
      if(cur.taken.length===cur.target){
        const n=cur.target;
        setFrac(n,4);
        setPrompt(`${n} 块，是 4 份里的几份？`, true);
        const opts = n===2 ? [fracHTML(2,4),fracHTML(2,3),fracHTML(1,4)] : [fracHTML(3,4),fracHTML(3,3),fracHTML(1,4)];
        showOptions(opts,0,(ok,idx)=>{
          if(ok){
            if(n===2){
              setFB('对！4 份里的 2 份写作 <b>2/4</b>。真棒，再取 3 块试试。','ok');
              cur.taken=[]; cur.target=3; cur.step=1;
              setTimeout(()=>{
                redraw(4,[]); wireL3();
                setPrompt('再点 3 块披萨', false);
                setFB('','');
              },900);
            }else{
              setFB('对！4 份里的 3 份写作 <b>3/4</b>。分子 3 = 取的份数，分母 4 = 总份数。','ok');
              showNext();
            }
          }else{
            const txt = n===2
              ? (idx===1 ? '一共切了 4 份，分母写总份数 4；你点亮了 2 块，分子写 2。所以是 <b>2/4</b>。' : '<b>1/4</b> 只表示取了 1 块。你点亮了 2 块，是 <b>2/4</b>。')
              : (idx===1 ? '一共切了 4 份，不是 3 份。取了 3 块，写作 <b>3/4</b>。' : '<b>1/4</b> 只表示取了 1 块。你点亮了 3 块，是 <b>3/4</b>。');
            setFB(txt,'bad');
          }
        });
      }
    });
  }
}

/* ---------- Level 4: 比大小 ---------- */
function initL4(){
  $('lvlName').textContent='第 4 关 · 谁更大';
  $('buddyTxt').textContent='两个披萨一样大。一块切 2 份，一块切 4 份。猜猜哪块更大？';
  cur={parts:4,taken:[],target:1,step:0};
  setFrac(1,2); setPrompt('比一比：1/2 和 1/4，谁更大？', true);
  setFB('','');
  let svg='<svg viewBox="0 0 520 260" role="img" aria-label="两个披萨比大小" preserveAspectRatio="xMidYMid meet">';
  const left=(cx,cy,r,parts,hl,label)=>{ let s=`<g class="slideIn" style="--sx:-26px">`; s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--cheese)" stroke="var(--crust)" stroke-width="4"/>`;
    for(let i=0;i<parts;i++){ const a0=-Math.PI/2+i*2*Math.PI/parts, a1=-Math.PI/2+(i+1)*2*Math.PI/parts; const isH=hl.includes(i); const d=sectorPath(cx,cy,r-2,a0+0.05,a1-0.05); const tx=isH?8*Math.cos((a0+a1)/2):0, ty=isH?8*Math.sin((a0+a1)/2):0; s+=`<path d="${d}" fill="${isH?'rgba(47,111,191,.42)':'transparent'}" stroke="${isH?'var(--accent)':'none'}" stroke-width="3" transform="translate(${tx} ${ty})"></path>`; }
    for(let i=0;i<parts;i++){ const a=-Math.PI/2+i*2*Math.PI/parts; s+=`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="var(--ink)" stroke-width="2.5" opacity=".72" stroke-linecap="round"></line>`; }
    s+=`<text x="${cx}" y="${cy+r+30}" text-anchor="middle" font-size="30" font-weight="900" fill="var(--ink)">${label}</text></g>`;
    return s;
  };
  svg+=left(140,118,78,2,[0],'1/2');
  svg+=left(380,118,78,4,[0],'1/4');
  svg+='</svg>';
  $('stage').innerHTML=svg;
  showOptions(['1/2 更大','1/4 更大','一样大'],0,(ok,idx)=>{
    if(ok){
      setFB('对！<b>1/2 比 1/4 大</b>。同样大的披萨，切得份数越多，每份越小。','ok');
      showNext();
    }else{
      const txt = idx===1
        ? '两块披萨一样大。左边切成 2 份，右边切成 4 份——分得份数越多，每份越小。所以 <b>1/2 更大</b>。'
        : '<b>1/2</b> 是半块，<b>1/4</b> 是四分之一块。半块明显比四分之一块大。';
      setFB(txt,'bad');
    }
  });
}

/* ---------- Level 5: 举一反三 换西瓜 ---------- */
function initL5(){
  $('lvlName').textContent='第 5 关 · 换个西瓜';
  $('buddyTxt').textContent='换个大西瓜！切成 6 份，取 2 块，是几分之几？';
  cur={parts:6,taken:[],target:2,step:0};
  setPrompt('点 2 块西瓜', false);
  setFB('','');
  redraw(6,[],{fill:'var(--melon)',crust:'var(--melonD)',viewBox:'0 0 300 260'});
  wireL5();
  function wireL5(){
    attachBlocks((i)=>{
      if(cur.taken.includes(i)){
        cur.taken=cur.taken.filter(x=>x!==i);
        redraw(6,cur.taken,{fill:'var(--melon)',crust:'var(--melonD)'}); wireL5(); setFB('',''); return;
      }
      if(cur.taken.length>=2){ setFB('已经取 2 块啦。点亮的块再点一下，可以取消。','hint'); return; }
      cur.taken.push(i);
      redraw(6,cur.taken,{fill:'var(--melon)',crust:'var(--melonD)'}); wireL5();
      if(cur.taken.length===2){
        setFrac(2,6); setPrompt('2 块，是 6 份里的几份？', true);
        showOptions([fracHTML(2,6),fracHTML(2,4),fracHTML(1,2)],0,(ok,idx)=>{
          if(ok){
            setFB('对！6 份里的 2 份写作 <b>2/6</b>。换了个西瓜，道理一样：分母是总份数，分子是取的份数。','ok');
            showNext('完成 🎉');
          }else{
            const txt = idx===1
              ? '数一数切痕：西瓜被切成了 <b>6</b> 份，不是 4 份。2 块是 6 份里的 2 份，写作 <b>2/6</b>。'
              : '你点亮了 2 块，但它不是“2 份里的 2 块”——一共切了 <b>6</b> 份。分母写总份数 6，分子写取的 2，是 <b>2/6</b>。';
            setFB(txt,'bad');
          }
        });
      }
    });
  }
}

/* ---------- Finish（静态完成页 overlay） ---------- */
function showFinish(){
  $('finish').classList.add('show');
}

/* ---------- Router ---------- */
function initLevel(n){
  level=n; drawDots();
  $('stage').innerHTML='';
  clearOpts();
  if(n===1) initL1();
  else if(n===2) initL2();
  else if(n===3) initL3();
  else if(n===4) initL4();
  else if(n===5) initL5();
}
function goNext(){
  if(level<5) initLevel(level+1);
  else showFinish();
}

/* ---------- 开场演示（可跳过、真动；演示答案按规律能做对） ---------- */
function showDemo(){
  const demo=$('demo');
  demo.style.display='flex';
  const frames=[$('f1'),$('f2'),$('f3')];
  const demoOpts={parts:2,highlight:[0],clickable:false,cx:130,cy:110,r:80,viewBox:'0 0 260 220'};
  let fi=0;
  if(reduceMotion){
    frames[0].classList.remove('show');
    frames[1].classList.remove('show');
    frames[2].classList.add('show');
    $('demoPizza3').innerHTML=buildPizza(Object.assign({},demoOpts,{animate:false}));
    return;
  }
  $('demoPizza1').innerHTML='<svg viewBox="0 0 260 220" role="img" aria-label="整块披萨" preserveAspectRatio="xMidYMid meet"><circle cx="130" cy="110" r="80" fill="var(--cheese)" stroke="var(--crust)" stroke-width="4"/></svg>';
  frames[0].classList.add('show');
  const timer=setInterval(()=>{
    frames[fi].classList.remove('show');
    fi++;
    if(fi>=3){ clearInterval(timer); return; }
    frames[fi].classList.add('show');
    if(fi===1) $('demoPizza2').innerHTML=buildPizza(Object.assign({},demoOpts,{highlight:[],animate:true}));
    if(fi===2) $('demoPizza3').innerHTML=buildPizza(Object.assign({},demoOpts,{animate:false}));
  },2600);
  const close=()=>{ clearInterval(timer); demo.style.display='none'; initLevel(1); };
  $('startDemo').addEventListener('click',close,{once:true});
  $('skipDemo').addEventListener('click',close,{once:true});
}

/* ---------- 收尾绑定 ---------- */
$('resetBtn').addEventListener('click',()=>{ level=1; initLevel(1); });
$('again').addEventListener('click',()=>{ $('finish').classList.remove('show'); level=1; initLevel(1); });
initLevel(1);
showDemo();
</script>
