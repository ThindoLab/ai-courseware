<!doctype html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08-40-46">
<meta name="aid-version-note" content="系统重跑 2026-08-14T08-40-46">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>罗罗的运动乐园 · 平移与旋转</title>
<!-- 题型：param-visual / 核心：先分清明·旋转再判断 / 年龄：7-9 / 场景：家庭+教室 -->
<style>
:root{
  --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d;
  --card:#fff; --bg:#eef4fb; --line:#c9d8ea; --muted:#5b6b82;
  --ease:cubic-bezier(.25,1,.5,1); --r:16px;
}
*{box-sizing:border-box}
html,body{height:100dvh;overflow:hidden;margin:0}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); background:var(--bg);
  display:flex; padding:10px;
}
.card{
  flex:1; display:flex; flex-direction:column; gap:10px;
  max-width:min(1080px,100%); margin:0 auto;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:14px 16px 12px; box-shadow:0 10px 30px rgba(30,58,95,.12);
  min-height:0;
}
.top{display:flex;align-items:center;gap:10px;flex:none}
.top h1{margin:0;font-size:clamp(20px,3vw,28px);font-weight:800}
.badge{font-size:16px;font-weight:700;color:var(--accent);background:#dcebfb;padding:5px 12px;border-radius:999px}
.prog{margin-left:auto;font-weight:800;color:var(--accent);font-size:20px}
.scene{
  flex:1 1 auto; min-height:0; border:2px solid var(--line); border-radius:var(--r);
  background:#f8fbff; display:flex; align-items:center; justify-content:center;
  overflow:hidden; position:relative;
}
.scene svg{width:100%;height:100%;max-height:100%;flex:1 1 auto}
.scene .cap{
  position:absolute; left:10px; top:8px; font-size:16px; font-weight:700;
  color:var(--muted); background:rgba(255,255,255,.85); padding:3px 10px; border-radius:8px;
}
.fb{
  flex:none; min-height:60px; border-radius:var(--r); padding:9px 14px;
  background:#eef4fb; font-size:20px; line-height:1.45; font-weight:600;
  display:flex; align-items:center; gap:10px;
}
.fb .tag{flex:none; font-weight:800; color:var(--accent)}
.ctrl{flex:none; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center}
button{
  font-family:inherit; cursor:pointer; border-radius:14px; border:2px solid var(--line);
  background:#fff; color:var(--ink); font-size:20px; font-weight:700;
  min-height:52px; min-width:52px; padding:8px 18px; touch-action:manipulation;
}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.ok{background:var(--ok); border-color:var(--ok); color:#fff}
button.warn{background:var(--bad); border-color:var(--bad); color:#fff}
.dirrow{display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap}
.dirbtn{min-width:64px; min-height:64px; font-size:26px; border-radius:16px}
.foot{flex:none; display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:auto}
.foot .spacer{flex:1}
.mode{display:flex; align-items:center; gap:6px; font-size:16px; color:var(--muted)}
.act,.act-ctrl{display:none}
.act.show,.act-ctrl.show{display:block}
#ctrlA.show,#ctrlB.show{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center}
.hidden{display:none!important}
@media (max-height:660px){
  body{padding:6px}
  .card{gap:6px; padding:10px 12px 8px}
  .fb{min-height:48px; padding:6px 12px; font-size:18px}
  .scene{border-radius:12px}
  button{min-height:48px; font-size:18px; padding:6px 14px}
  .top h1{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  .act *{transition:none!important; animation:none!important}
}
body.static .act *{transition:none!important; animation:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <h1>罗罗的运动乐园</h1>
    <span class="badge">平移 · 旋转</span>
    <label class="mode" style="margin-left:auto"><input type="checkbox" id="staticMode"> 静态</label>
    <span class="prog" id="prog">1 / 4</span>
  </div>

  <div class="scene" role="img" aria-label="主图区">
    <span class="cap" id="cap">平移：挪地方，不转身</span>
    <!-- 幕1 平移 -->
    <svg id="svgA" class="act show" viewBox="0 0 360 260" preserveAspectRatio="xMidYMid meet" aria-label="罗罗在格子里平移">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0 H0 V40" fill="none" stroke="#dbe6f2" stroke-width="1"/>
        </pattern>
      </defs>
      <rect x="0" y="0" width="360" height="260" fill="url(#grid)"/>
      <rect id="startBox" x="0" y="160" width="40" height="40" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
      <polyline id="pathA" points="" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g id="roarA">
        <ellipse cx="0" cy="6" rx="13" ry="11" fill="#1e3a5f"/>
        <path d="M-7 -12 L12 -4 L-7 4 Z" fill="#e85d5d"/>
        <circle cx="-4" cy="5" r="2.4" fill="#fff"/>
        <circle cx="5" cy="5" r="2.4" fill="#fff"/>
        <path d="M-3 15 L-3 22 M4 15 L4 22" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
    <!-- 幕2 旋转 -->
    <svg id="svgB" class="act" viewBox="0 0 360 260" preserveAspectRatio="xMidYMid meet" aria-label="罗罗坐在转盘上旋转">
      <circle cx="180" cy="130" r="96" fill="#eef4fb" stroke="#c9d8ea" stroke-width="2"/>
      <circle cx="180" cy="130" r="88" fill="#dcebfb" stroke="#1e3a5f" stroke-width="3"/>
      <g id="turntable">
        <line x1="180" y1="42" x2="180" y2="218" stroke="#7da7d6" stroke-width="3"/>
        <line x1="92" y1="130" x2="268" y2="130" stroke="#7da7d6" stroke-width="3"/>
        <circle cx="180" cy="130" r="12" fill="#1e3a5f"/>
        <g id="roarB">
          <ellipse cx="268" cy="130" rx="13" ry="11" fill="#1e3a5f"/>
          <path d="M259 117 L283 130 L259 143 Z" fill="#e85d5d"/>
          <circle cx="262" cy="129" r="2.4" fill="#fff"/>
          <circle cx="271" cy="129" r="2.4" fill="#fff"/>
          <path d="M266 139 L266 146 M272 139 L272 146" stroke="#1e3a5f" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
    <!-- 幕3 判断 -->
    <svg id="svgC" class="act" viewBox="0 0 360 240" preserveAspectRatio="xMidYMid meet" aria-label="猜一猜它是什么运动">
      <g id="q-door" class="q">
        <rect x="60" y="36" width="150" height="164" fill="none" stroke="#1e3a5f" stroke-width="4"/>
        <g id="doorPanel" style="transform-origin:60px 200px">
          <rect x="60" y="36" width="150" height="164" fill="#bfdbfe" stroke="#1e3a5f" stroke-width="4"/>
          <circle cx="192" cy="116" r="5" fill="#1e3a5f"/>
        </g>
      </g>
      <g id="q-drawer" class="q hidden">
        <rect x="100" y="52" width="152" height="136" fill="#fff" stroke="#1e3a5f" stroke-width="4"/>
        <g id="drawerPanel">
          <rect x="100" y="62" width="132" height="52" fill="#fde68a" stroke="#1e3a5f" stroke-width="4"/>
          <circle cx="212" cy="88" r="5" fill="#1e3a5f"/>
        </g>
      </g>
      <g id="q-ferris" class="q hidden">
        <line x1="180" y1="232" x2="180" y2="118" stroke="#1e3a5f" stroke-width="6"/>
        <g id="ferrisWheel" style="transform-origin:180px 118px">
          <circle cx="180" cy="118" r="80" fill="none" stroke="#2f6fbf" stroke-width="5"/>
          <line x1="180" y1="38" x2="180" y2="198" stroke="#2f6fbf" stroke-width="3"/>
          <line x1="100" y1="118" x2="260" y2="118" stroke="#2f6fbf" stroke-width="3"/>
          <circle cx="180" cy="38" r="11" fill="#e85d5d"/>
          <circle cx="260" cy="118" r="11" fill="#e85d5d"/>
          <circle cx="180" cy="198" r="11" fill="#e85d5d"/>
          <circle cx="100" cy="118" r="11" fill="#e85d5d"/>
        </g>
      </g>
      <g id="q-elevator" class="q hidden">
        <rect x="122" y="26" width="92" height="184" fill="none" stroke="#1e3a5f" stroke-width="4"/>
        <g id="elevCab">
          <rect x="134" y="104" width="68" height="66" fill="#bfdbfe" stroke="#1e3a5f" stroke-width="4"/>
          <rect x="144" y="116" width="20" height="20" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
        </g>
      </g>
      <!-- 幕4 风车 -->
      <g id="q-windmill" class="q hidden">
        <line x1="180" y1="232" x2="180" y2="118" stroke="#1e3a5f" stroke-width="6"/>
        <g id="millBlades" style="transform-origin:180px 118px">
          <rect x="171" y="26" width="18" height="92" rx="9" fill="#fde68a" stroke="#1e3a5f" stroke-width="3"/>
          <rect x="171" y="118" width="18" height="92" rx="9" fill="#fde68a" stroke="#1e3a5f" stroke-width="3"/>
          <rect x="88" y="109" width="92" height="18" rx="9" fill="#bfdbfe" stroke="#1e3a5f" stroke-width="3"/>
          <rect x="180" y="109" width="92" height="18" rx="9" fill="#bfdbfe" stroke="#1e3a5f" stroke-width="3"/>
          <circle cx="180" cy="118" r="14" fill="#1e3a5f"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="fb" id="fb" aria-live="polite"><span class="tag">罗罗说：</span><span id="fbTxt">先看第一关：点方向键，帮罗罗搬家。</span></div>

  <div class="ctrl">
    <!-- 幕1 控件 -->
    <div id="ctrlA" class="act-ctrl show">
      <button class="dirbtn" id="up" aria-label="向上">↑</button>
      <div class="dirrow">
        <button class="dirbtn" id="left" aria-label="向左">←</button>
        <button class="dirbtn primary" id="down" aria-label="向下">↓</button>
        <button class="dirbtn" id="right" aria-label="向右">→</button>
      </div>
      <button id="btnSayA">🗣️ 我会说</button>
    </div>
    <!-- 幕2 控件 -->
    <div id="ctrlB" class="act-ctrl">
      <button id="r90">右转 90°</button>
      <button id="l90">左转 90°</button>
      <button id="r180">转半圈</button>
      <button id="r0">回到 0°</button>
      <button id="btnSayB">🗣️ 我会说</button>
    </div>
    <!-- 幕3 控件 -->
    <div id="ctrlC" class="act-ctrl">
      <span class="prog" id="qProg" style="font-weight:800;color:var(--accent);font-size:20px">第 1 / 4 题</span>
      <button id="replayC">▶ 再看一遍</button>
      <button class="ok" id="pickT">平移</button>
      <button class="warn" id="pickR">旋转</button>
      <button id="btnSayC">🗣️ 我会说</button>
    </div>
    <!-- 幕4 控件 -->
    <div id="ctrlD" class="act-ctrl">
      <button id="replayD">▶ 再看一遍</button>
      <button class="ok" id="pickT2">平移</button>
      <button class="warn" id="pickR2">旋转</button>
      <button id="btnSayD">🗣️ 我会说</button>
    </div>
  </div>

  <div class="foot">
    <button id="btnReset">↻ 重来</button>
    <span class="spacer"></span>
    <button class="primary" id="btnNext">下一关 ➜</button>
  </div>
</main>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ACT=1, TOT=4;
  var caps={1:'平移：挪地方，不转身',2:'旋转：绕中心转，朝向变',3:'猜一猜：它是什么运动？',4:'举一反三：它是什么运动？'};

  /* ---------- 幕1 平移 ---------- */
  var GRID=40, SX=20, SY=180, MX=8, MY=6;
  var cur={x:0,y:4};
  var pathPts=[{x:0,y:4}];
  var roarA=$('roarA'), pathA=$('pathA'), startBox=$('startBox');

  function pos(g){return {x:SX+g.x*GRID, y:SY+g.y*GRID}}
  function drawPath(){
    pathA.setAttribute('points', pathPts.map(function(p){return pos(p).x+','+pos(p).y}).join(' '));
  }
  function move(dx,dy){
    var nx=cur.x+dx, ny=cur.y+dy;
    if(nx<0||nx>MX||ny<0||ny>MY){
      flash('不能再走啦，格子到头咯。');
      return;
    }
    cur={x:nx,y:ny};
    pathPts.push(cur);
    var p=pos(cur);
    roarA.style.transition='transform .45s '+getComputedStyle(document.documentElement).getPropertyValue('--ease')||'cubic-bezier(.25,1,.5,1)';
    roarA.style.transform='translate('+p.x+'px,'+p.y+'px)';
    drawPath();
    var s='向右 '+cur.x+' 格'+(cur.y>4?('、向下 '+(cur.y-4)+' 格'):(cur.y<4?('、向上 '+(4-cur.y)+' 格'):''));
    setFb('罗罗挪到了新地方：'+s+'。帽子一直朝右，没转身 → 这叫平移。');
  }
  $('up').onclick=function(){move(0,-1)};
  $('down').onclick=function(){move(0,1)};
  $('left').onclick=function(){move(-1,0)};
  $('right').onclick=function(){move(1,0)};
  $('btnSayA').onclick=function(){say('平移是挪地方，不转身。')};

  /* ---------- 幕2 旋转 ---------- */
  var tt=$('turntable'), deg=0;
  function rotateTo(d){
    deg=d;
    tt.style.transition='transform .6s cubic-bezier(.25,1,.5,1)';
    tt.style.transform='rotate('+deg+'deg)';
    setFb('罗罗绕中心转了 '+Math.abs(deg)+'°，还在盘边没挪窝。帽子朝向变了 → 这叫旋转。');
  }
  $('r90').onclick=function(){rotateTo(deg+90)};
  $('l90').onclick=function(){rotateTo(deg-90)};
  $('r180').onclick=function(){rotateTo(deg+180)};
  $('r0').onclick=function(){rotateTo(0)};
  $('btnSayB').onclick=function(){say('旋转是绕中心转，朝向变。')};

  /* ---------- 幕3/4 判断 ---------- */
  var QUIZ=[
    {id:'door', name:'开门', type:'rotate'},
    {id:'drawer', name:'拉抽屉', type:'translate'},
    {id:'ferris', name:'摩天轮', type:'rotate'},
    {id:'elevator', name:'电梯', type:'translate'}
  ];
  var ANIM={
    door:{el:'doorPanel', from:'rotate(0deg)', to:'rotate(-95deg)'},
    drawer:{el:'drawerPanel', from:'translateX(0px)', to:'translateX(115px)'},
    ferris:{el:'ferrisWheel', from:'rotate(0deg)', to:'rotate(180deg)'},
    elevator:{el:'elevCab', from:'translateY(0px)', to:'translateY(-72px)'},
    windmill:{el:'millBlades', from:'rotate(0deg)', to:'rotate(270deg)'}
  };
  var qi=0, isWind=false;

  function playAnim(id){
    var a=ANIM[id], el=$(a.el);
    if(!el) return;
    el.style.transition='none';
    el.style.transform=a.from;
    void el.offsetWidth;
    if(reduced||document.body.classList.contains('static')){
      el.style.transform=a.to;
      return;
    }
    el.style.transition='transform 1.1s cubic-bezier(.25,1,.5,1)';
    el.style.transform=a.to;
  }
  function showQ(gid){
    document.querySelectorAll('.q').forEach(function(g){g.classList.add('hidden')});
    $(gid).classList.remove('hidden');
    playAnim(gid.replace('q-',''));
  }
  function loadQuiz(){
    var q=QUIZ[qi];
    showQ('q-'+q.id);
    $('qProg').textContent='第 '+(qi+1)+' / 4 题';
    setFb(q.name+'：先看它怎么动，再选「平移」还是「旋转」。');
  }
  function judge(type, pick){
    var q=isWind?{name:'风车',type:'rotate'}:QUIZ[qi];
    if(type===q.type){
      setFb('对！'+q.name+(q.type==='rotate'?'绕中心转，朝向一直在变 → 旋转。':'整体挪动、方向不变 → 平移。'), true);
      setTimeout(function(){
        if(isWind){ finish(); }
        else { qi++; if(qi<QUIZ.length){loadQuiz();} else {startWind();} }
      }, 1100);
    }else{
      setFb('再看：'+q.name+(q.type==='rotate'
        ?'是绕着中心转，每个点都在画圈，方向一直变 → 绕中心转=旋转。点「再看一遍」重播吧。'
        :'是整体挪动，没有绕任何点转，方向一直没变 → 换位置不转身=平移。点「再看一遍」重播吧。'));
    }
  }
  $('pickT').onclick=function(){judge('translate','T')};
  $('pickR').onclick=function(){judge('rotate','R')};
  $('replayC').onclick=function(){var q=QUIZ[qi]; playAnim(q.id)};
  $('btnSayC').onclick=function(){say('绕中心转是旋转，整体挪是平移。')};

  /* 幕4 举一反三：风车（旋转变式） */
  function startWind(){
    ACT=4; paint();
    isWind=true;
    $('ctrlC').classList.remove('show');
    $('ctrlD').classList.add('show');
    showQ('q-windmill');
    setFb('变一变：这回是风车。看它怎么动，再选。');
  }
  $('pickT2').onclick=function(){judge('translate','T')};
  $('pickR2').onclick=function(){judge('rotate','R')};
  $('replayD').onclick=function(){playAnim('windmill')};
  $('btnSayD').onclick=function(){say('绕中心转是旋转，整体挪是平移。')};

  function finish(){
    ACT=4; paint();
    setFb('你都会啦！平移=挪地方不转身，旋转=绕中心转圈圈。', true);
    $('cap').textContent='通关啦！';
    $('prog').textContent='4 / 4 ✓';
    $('btnNext').textContent='再来一次 ➜';
    $('btnNext').onclick=function(){location.reload()};
  }

  /* ---------- 通用 ---------- */
  var fbTxt=$('fbTxt');
  function setFb(t, good){
    fbTxt.textContent=t;
    var fb=$('fb');
    fb.style.borderLeft='5px solid '+(good?'var(--ok)':'var(--accent)');
  }
  function say(t){
    var old=fbTxt.textContent;
    setFb(t);
    setTimeout(function(){fbTxt.textContent=old}, 2600);
  }
  function flash(t){setFb(t)}
  function paint(){
    $('prog').textContent=ACT+' / '+TOT;
    $('cap').textContent=caps[ACT]||'';
    $('svgA').classList.toggle('show', ACT===1);
    $('svgB').classList.toggle('show', ACT===2);
    $('svgC').classList.toggle('show', ACT>=3);
    $('ctrlA').classList.toggle('show', ACT===1);
    $('ctrlB').classList.toggle('show', ACT===2);
    $('ctrlC').classList.toggle('show', ACT===3);
    $('ctrlD').classList.toggle('show', ACT===4 && !isWind);
    $('btnNext').style.display=(ACT>=3)?'none':'';
  }
  $('btnNext').onclick=function(){
    if(ACT===1){ACT=2;paint();setFb('第二关：点按钮让转盘转起来，看罗罗的帽子。');}
    else if(ACT===2){ACT=3;paint();loadQuiz();}
  };
  $('btnReset').onclick=function(){location.reload()};
  $('staticMode').onchange=function(e){document.body.classList.toggle('static', e.target.checked)};

  /* 初始 */
  var p0=pos(cur);
  roarA.style.transform='translate('+p0.x+'px,'+p0.y+'px)';
  drawPath();
  paint();
})();
</script>
</body>
</html>
