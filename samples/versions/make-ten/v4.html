<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v4">
<meta name="aid-version-at" content="2026-08-14T10-09-13">
<meta name="aid-version-note" content="系统重跑 2026-08-14T10-09-13">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小熊凑十</title>
<style>
  :root{
    --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d; --card:#fff;
    --amber:#f5a623;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100dvh;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#fdf6ec;color:var(--ink)}
  .stage{height:100dvh;display:flex;flex-direction:column;max-width:min(1240px,100%);margin:0 auto;padding:14px 14px 10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 6px 8px}
  .title{font-size:clamp(22px,4.2vw,34px);font-weight:800;letter-spacing:1px}
  .progress{font-size:clamp(17px,2.6vw,22px);font-weight:700;color:var(--accent);background:#e8f1fb;border-radius:16px;padding:6px 14px}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
  .qline{font-size:clamp(20px,3.4vw,28px);font-weight:700;margin-bottom:6px;text-align:center}
  .hint{font-size:clamp(18px,2.8vw,23px);color:#5a7394;margin-bottom:8px;min-height:1.2em}
  .tenframe{background:var(--card);border:3px solid var(--accent);border-radius:20px;padding:clamp(8px,1.6vw,16px);display:flex;gap:clamp(5px,1vw,10px);flex-wrap:nowrap;justify-content:center}
  .slot{width:clamp(44px,9vw,82px);height:clamp(44px,9vw,82px);border:3px dashed #b8cfe8;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#f4f9ff}
  .slot.filled{border-style:solid;border-color:var(--amber);background:#fff7e6;animation:pop .3s cubic-bezier(.25,1,.5,1)}
  @keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  .slot .jar{width:78%;height:78%}
  .shelf{display:flex;gap:clamp(8px,1.6vw,16px);margin-top:14px;min-height:96px;flex-wrap:wrap;justify-content:center}
  .jar-btn{width:clamp(70px,12vw,104px);height:clamp(70px,12vw,104px);border:none;background:var(--card);border-radius:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 0 #d9c9a8;touch-action:none;transition:transform .15s}
  .jar-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d9c9a8}
  .jar-btn.used{opacity:.25;pointer-events:none}
  .jar-btn .jar{width:72%;height:72%}
  .actions{display:flex;gap:14px;margin-top:14px;min-height:64px;align-items:center;justify-content:center;flex-wrap:wrap}
  .btn{font-size:clamp(20px,3vw,26px);font-weight:800;border:none;border-radius:18px;padding:14px 30px;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .btn.next{background:var(--accent)}
  .btn.replay{background:var(--ok)}
  .feedback{font-size:clamp(19px,3vw,25px);font-weight:700;text-align:center;min-height:1.3em;margin-top:8px}
  .feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
  .bear{width:clamp(88px,15vw,150px)}
  .overlay{position:fixed;inset:0;background:rgba(253,246,236,.96);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
  .overlay .demo-title{font-size:clamp(24px,4.6vw,38px);font-weight:800}
  .overlay .demo{display:flex;gap:10px;align-items:center}
  .overlay .d-slot{width:clamp(34px,6vw,56px);height:clamp(34px,6vw,56px);border:2px dashed #b8cfe8;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#fff}
  .overlay .d-slot.filled{border-style:solid;border-color:var(--amber);background:#fff7e6}
  .overlay .d-slot .jar{width:74%;height:74%}
  .overlay .skip{position:absolute;top:20px;right:20px;background:#e8f1fb;border:none;border-radius:16px;font-size:18px;font-weight:700;color:var(--ink);padding:10px 18px;cursor:pointer}
  .overlay .d-hint{font-size:clamp(17px,2.8vw,23px);color:#5a7394;min-height:1.2em;text-align:center}
  .congrats{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px}
  .congrats .big{font-size:clamp(40px,8vw,66px);font-weight:900;color:var(--amber);animation:bounce 1s ease}
  @keyframes bounce{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .congrats .sub{font-size:clamp(21px,3.4vw,28px);font-weight:700}
  .congrats .card{background:var(--card);border-radius:20px;padding:18px 26px;font-size:clamp(19px,3vw,25px);line-height:1.6;box-shadow:0 4px 0 #d9c9a8;max-width:min(560px,92vw)}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media (max-height:560px){
    .hint{display:none}
    .shelf{margin-top:6px;min-height:72px}
    .jar-btn{width:64px;height:64px}
    .actions{margin-top:6px;min-height:52px}
    .qline{font-size:18px;margin-bottom:2px}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header>
    <div class="title">🐻 小熊凑十</div>
    <div class="progress" id="progress">第 1 关</div>
  </header>
  <div class="main" id="main"></div>
</div>

<!-- 开场演示 overlay -->
<div class="overlay" id="overlay">
  <button class="skip" id="skipBtn">跳过 ▶</button>
  <div class="demo-title">🐻 帮小熊装满 10 罐蜂蜜！</div>
  <div class="demo" id="demoRow">
    <div class="d-slot filled" id="d0"><svg class="jar" viewBox="0 0 64 64"><path d="M18 26 h28 v6 h-28z" fill="#f5a623"/><rect x="14" y="32" width="36" height="22" rx="7" fill="#fbbf24"/><rect x="22" y="24" width="20" height="6" rx="3" fill="#e58a12"/><text x="32" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c4a03">蜜</text></svg></div>
    <div class="d-slot filled" id="d1"><svg class="jar" viewBox="0 0 64 64"><path d="M18 26 h28 v6 h-28z" fill="#f5a623"/><rect x="14" y="32" width="36" height="22" rx="7" fill="#fbbf24"/><rect x="22" y="24" width="20" height="6" rx="3" fill="#e58a12"/><text x="32" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c4a03">蜜</text></svg></div>
    <div class="d-slot filled" id="d2"><svg class="jar" viewBox="0 0 64 64"><path d="M18 26 h28 v6 h-28z" fill="#f5a623"/><rect x="14" y="32" width="36" height="22" rx="7" fill="#fbbf24"/><rect x="22" y="24" width="20" height="6" rx="3" fill="#e58a12"/><text x="32" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c4a03">蜜</text></svg></div>
    <div class="d-slot filled" id="d3"><svg class="jar" viewBox="0 0 64 64"><path d="M18 26 h28 v6 h-28z" fill="#f5a623"/><rect x="14" y="32" width="36" height="22" rx="7" fill="#fbbf24"/><rect x="22" y="24" width="20" height="6" rx="3" fill="#e58a12"/><text x="32" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c4a03">蜜</text></svg></div>
    <div class="d-slot filled" id="d4"><svg class="jar" viewBox="0 0 64 64"><path d="M18 26 h28 v6 h-28z" fill="#f5a623"/><rect x="14" y="32" width="36" height="22" rx="7" fill="#fbbf24"/><rect x="22" y="24" width="20" height="6" rx="3" fill="#e58a12"/><text x="32" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c4a03">蜜</text></svg></div>
    <div class="d-slot filled" id="d5"><svg class="jar" viewBox="0 0 64 64"><path d="M18 26 h28 v6 h-28z" fill="#f5a623"/><rect x="14" y="32" width="36" height="22" rx="7" fill="#fbbf24"/><rect x="22" y="24" width="20" height="6" rx="3" fill="#e58a12"/><text x="32" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c4a03">蜜</text></svg></div>
    <div class="d-slot filled" id="d6"><svg class="jar" viewBox="0 0 64 64"><path d="M18 26 h28 v6 h-28z" fill="#f5a623"/><rect x="14" y="32" width="36" height="22" rx="7" fill="#fbbf24"/><rect x="22" y="24" width="20" height="6" rx="3" fill="#e58a12"/><text x="32" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c4a03">蜜</text></svg></div>
    <div class="d-slot" id="d7"></div>
    <div class="d-slot" id="d8"></div>
    <div class="d-slot" id="d9"></div>
  </div>
  <div class="d-hint" id="demoHint">现在有 7 罐，还差 3 罐就满 10 啦</div>
  <div class="actions"><button class="btn next" id="watchBtn">▶ 看一遍</button></div>
</div>

<script>
(function(){
  const $ = s=>document.querySelector(s);
  const main = $('#main');
  const progress = $('#progress');

  const JAR = '<svg class="jar" viewBox="0 0 64 64"><path d="M18 26 h28 v6 h-28z" fill="#f5a623"/><rect x="14" y="32" width="36" height="22" rx="7" fill="#fbbf24"/><rect x="22" y="24" width="20" height="6" rx="3" fill="#e58a12"/><text x="32" y="47" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c4a03">蜜</text></svg>';
  const NUT = '<svg class="jar" viewBox="0 0 64 64"><path d="M20 34 q12 -14 24 0 q-12 20 -24 0z" fill="#a05a2c"/><rect x="29" y="16" width="6" height="10" rx="3" fill="#7a4220"/><text x="32" y="40" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b2d12">栗</text></svg>';

  const BEAR = '<svg class="bear" viewBox="0 0 160 130" aria-label="小熊"><ellipse cx="80" cy="118" rx="34" ry="9" fill="#f0d9b0" opacity=".8"/><circle cx="80" cy="78" r="34" fill="#c98a4b"/><circle cx="80" cy="78" r="22" fill="#e0a866"/><circle cx="60" cy="60" r="13" fill="#c98a4b"/><circle cx="100" cy="60" r="13" fill="#c98a4b"/><circle cx="56" cy="56" r="4" fill="#3d2b1f"/><circle cx="104" cy="56" r="4" fill="#3d2b1f"/><circle cx="80" cy="66" r="7" fill="#3d2b1f"/><ellipse cx="80" cy="72" rx="6" ry="4" fill="#e0a866"/><path d="M74 84 q6 7 12 0" stroke="#3d2b1f" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>';

  // 前 5 关蜂蜜罐，第 6 关举一反三：换物（栗子）不换骨架，仍凑 10
  const LEVELS = [
    {a:5, b:5, item:JAR, itemName:'蜂蜜罐', q:'5 + ? = 10', hint:'先点 5 罐，再点 5 罐，装满 10！'},
    {a:7, b:3, item:JAR, itemName:'蜂蜜罐', q:'7 + ? = 10', hint:'已经有 7 罐，再点几罐装满 10？'},
    {a:8, b:2, item:JAR, itemName:'蜂蜜罐', q:'8 + ? = 10', hint:'已经有 8 罐，还差几罐？'},
    {a:9, b:1, item:JAR, itemName:'蜂蜜罐', q:'9 + ? = 10', hint:'只差 1 罐就满 10 啦！'},
    {a:6, b:4, item:JAR, itemName:'蜂蜜罐', q:'6 + ? = 10', hint:'已经有 6 罐，再点 4 罐装满 10！'},
    {a:4, b:6, item:NUT, itemName:'栗子', q:'4 + ? = 10', hint:'举一反三：小熊改收栗子啦！已有 4 颗，再点几颗装满 10？'}
  ];

  let level = 0;
  let filled = 0;
  let solved = false;

  function bearBlock(){
    const d = document.createElement('div');
    d.style.cssText = 'display:flex;justify-content:center;margin-bottom:4px';
    d.innerHTML = BEAR;
    return d;
  }

  function renderLevel(){
    const L = LEVELS[level];
    filled = L.a; solved = false;
    progress.textContent = (level === LEVELS.length-1) ? '举一反三' : '第 ' + (level+1) + ' 关';
    let h = '';
    h += '<div class="qline">🐻 ' + L.q + '</div>';
    h += '<div class="hint" id="hint">' + L.hint + '</div>';
    h += '<div class="tenframe" id="frame"></div>';
    h += '<div class="shelf" id="shelf"></div>';
    h += '<div class="actions"><button class="btn next" id="goBtn" style="display:none">下一关 ➜</button></div>';
    h += '<div class="feedback" id="fb"></div>';
    main.innerHTML = h;
    main.insertBefore(bearBlock(), main.firstChild);
    const frame = $('#frame');
    for(let i=0;i<10;i++){
      const s = document.createElement('div');
      s.className = 'slot' + (i < L.a ? ' filled' : '');
      if(i < L.a) s.innerHTML = L.item;
      frame.appendChild(s);
    }
    const shelf = $('#shelf');
    for(let i=0;i<L.b;i++){
      const b = document.createElement('button');
      b.className = 'jar-btn';
      b.setAttribute('aria-label','一个' + L.itemName);
      b.innerHTML = L.item;
      b.addEventListener('pointerdown', e=>{ e.preventDefault(); startDrag(b, e); });
      b.addEventListener('click', ()=>{ if(!b.classList.contains('used')) placeJar(b); });
      shelf.appendChild(b);
    }
  }

  // —— 点选入位 ——
  function placeJar(btn){
    if(solved) return;
    const frame = $('#frame');
    const slots = frame.querySelectorAll('.slot');
    const empty = [...slots].find(s=>!s.classList.contains('filled'));
    if(!empty) return;
    btn.classList.add('used');
    empty.classList.add('filled');
    empty.innerHTML = LEVELS[level].item;
    filled++;
    updateFb();
    if(filled === 10){
      solved = true;
      setTimeout(()=>{
        $('#fb').className = 'feedback ok';
        $('#fb').textContent = '🎉 装满 10 个啦！';
        const go = $('#goBtn');
        go.style.display = 'inline-block';
        go.textContent = (level === LEVELS.length-1) ? '收下礼物 🎁' : '下一关 ➜';
        go.addEventListener('click', ()=>{
          if(level < LEVELS.length-1){ level++; renderLevel(); }
          else showCongrats();
        });
      }, 320);
    }
  }

  function updateFb(){
    const fb = $('#fb');
    if(filled > 10){
      fb.className = 'feedback bad';
      fb.textContent = '多啦！现在 ' + filled + ' 个，10 个格子装不下…';
      setTimeout(()=>{ if(filled>10){ filled = LEVELS[level].a; refreshFrame(); fb.textContent=''; } }, 600);
    } else if(filled < 10){
      fb.className = '';
      fb.textContent = '现在 ' + filled + ' 个，还差 ' + (10-filled) + ' 个';
    }
  }
  function refreshFrame(){
    const L = LEVELS[level];
    const frame = $('#frame');
    const slots = frame.querySelectorAll('.slot');
    slots.forEach((s,i)=>{
      s.classList.toggle('filled', i < filled);
      s.innerHTML = (i < filled) ? L.item : '';
    });
    $('#shelf').querySelectorAll('.jar-btn').forEach(b=>b.classList.remove('used'));
    const usedCount = filled - L.a;
    const btns = $('#shelf').querySelectorAll('.jar-btn');
    for(let i=0;i<usedCount;i++){ if(btns[i]) btns[i].classList.add('used'); }
    updateFb();
  }

  // —— 拖拽跟手（保留点选兜底）——
  let dragEl=null, dragGhost=null, offX=0, offY=0;
  function startDrag(btn, e){
    if(solved || btn.classList.contains('used')) return;
    dragEl = btn;
    const r = btn.getBoundingClientRect();
    dragGhost = btn.cloneNode(true);
    dragGhost.style.cssText = 'position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;pointer-events:none;z-index:40;box-shadow:0 8px 16px rgba(0,0,0,.25)';
    document.body.appendChild(dragGhost);
    btn.style.opacity = '0';
    offX = e.clientX - r.left;
    offY = e.clientY - r.top;
    try{ btn.setPointerCapture && btn.setPointerCapture(e.pointerId); }catch(err){}
  }
  document.addEventListener('pointermove', e=>{
    if(!dragGhost) return;
    dragGhost.style.left = (e.clientX - offX) + 'px';
    dragGhost.style.top = (e.clientY - offY) + 'px';
  });
  document.addEventListener('pointerup', e=>{
    if(!dragGhost) return;
    const frame = $('#frame');
    if(frame){
      const fr = frame.getBoundingClientRect();
      const x = e.clientX, y = e.clientY;
      if(x >= fr.left-10 && x <= fr.right+10 && y >= fr.top-10 && y <= fr.bottom+10){
        if(dragEl && !dragEl.classList.contains('used')){
          dragEl.style.opacity = '';
          placeJar(dragEl);
        }
      } else {
        dragEl.style.opacity = '';
      }
    } else {
      dragEl.style.opacity = '';
    }
    if(dragGhost){ dragGhost.remove(); dragGhost=null; }
    dragEl = null;
  });

  // —— 开场演示：真动（7 → 3 罐飞入）——
  const overlay = $('#overlay');
  const demoHint = $('#demoHint');
  let demoRunning = false;
  function demoReset(){
    ['d7','d8','d9'].forEach(id=>{ $('#'+id).classList.remove('filled'); $('#'+id).innerHTML=''; });
    demoHint.textContent = '现在有 7 罐，还差 3 罐就满 10 啦';
  }
  function playDemo(){
    if(demoRunning) return;
    demoRunning = true;
    demoReset();
    const ids = ['d7','d8','d9'];
    function one(i){
      if(i >= ids.length){
        demoHint.textContent = '看！3 罐飞进去，7 + 3 = 10 🎉';
        demoRunning = false;
        setTimeout(()=>{ demoReset(); }, 1600);
        return;
      }
      const slot = $('#'+ids[i]);
      const sr = slot.getBoundingClientRect();
      const fly = document.createElement('div');
      fly.innerHTML = JAR;
      fly.style.cssText = 'position:fixed;width:'+sr.width+'px;height:'+sr.height+'px;left:16vw;top:34vh;z-index:60;transition:left .6s cubic-bezier(.25,1,.5,1),top .6s cubic-bezier(.25,1,.5,1)';
      document.body.appendChild(fly);
      requestAnimationFrame(()=>{
        fly.style.left = (sr.left + window.scrollX)+'px';
        fly.style.top = (sr.top + window.scrollY)+'px';
      });
      demoHint.textContent = '飞！' + (i+1) + ' / 3';
      setTimeout(()=>{
        fly.remove();
        slot.classList.add('filled');
        slot.innerHTML = JAR;
        one(i+1);
      }, 620);
    }
    setTimeout(()=>one(0), 400);
  }
  $('#watchBtn').addEventListener('click', playDemo);
  $('#skipBtn').addEventListener('click', ()=>{
    overlay.style.display = 'none';
    renderLevel();
  });
  setTimeout(()=>{ if(overlay.style.display !== 'none'){ overlay.style.display='none'; renderLevel(); } }, 13000);

  // —— 通关祝贺页 ——
  function showCongrats(){
    progress.textContent = '完成 🎉';
    main.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'congrats';
    box.innerHTML =
      '<div class="big">🎉</div>' +
      '<div class="sub">小熊谢谢你，10 个全装满啦！</div>' +
      '<div class="card">10 可以分成：<br>1 和 9、2 和 8、3 和 7、4 和 6、5 和 5<br>小熊说：你已经是凑十小高手！</div>' +
      '<div class="actions">' +
        '<button class="btn next" id="againBtn">🔁 再玩一次</button>' +
      '</div>';
    main.appendChild(box);
    $('#againBtn').addEventListener('click', ()=>{ level = 0; renderLevel(); });
  }

  renderLevel();
})();
</script>
</body>
</html>
