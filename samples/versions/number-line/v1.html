<title>小青蛙跳数轴 · 加减</title>
<!-- 风格：数轴动画 / 场景：家庭+教室 / 核心：加减即方向与格数 -->
<style>
:root{--accent:#16a34a;--ink:#1f2a44;--muted:#667085;--line:#bbf7d0;--ease:cubic-bezier(0.25,1,0.5,1);--touch:52px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#f0fdf4,#ecfeff);min-height:100vh;padding:14px 12px 28px}
.card{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 28px rgba(22,163,74,.12);padding:18px 16px 22px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{margin:0;font-size:20px;font-weight:800}
.badge{font-size:14px;font-weight:700;color:#15803d;background:#dcfce7;padding:5px 12px;border-radius:999px}
.story{background:linear-gradient(135deg,#dcfce7,#e0f2fe);border-left:5px solid var(--accent);border-radius:0 14px 14px 0;padding:12px;margin-bottom:12px;font-size:16px;line-height:1.7}
.stage{background:#f0fdf4;border:1px solid var(--line);border-radius:16px;padding:20px 12px 28px;margin-bottom:12px;position:relative;overflow:hidden}
.line{position:relative;height:8px;background:#86efac;border-radius:4px;margin:40px 8% 0}
.tick{position:absolute;top:-8px;width:2px;height:24px;background:#166534;transform:translateX(-50%)}
.tick label{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--muted)}
.frog{position:absolute;top:-36px;font-size:32px;transform:translateX(-50%);transition:left .5s var(--ease);z-index:2}
.hop{position:absolute;top:-8px;height:4px;background:#fbbf24;border-radius:2px;transform-origin:left center;opacity:.85;z-index:1;transition:width .5s var(--ease),left .5s var(--ease)}
.eq{text-align:center;font-size:28px;font-weight:800;color:#15803d;margin:8px 0}
.ctrl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.row label{font-weight:700;font-size:14px}
.step button{min-width:var(--touch);min-height:var(--touch);border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer;font-family:inherit}
.step .v{min-width:40px;text-align:center;font-size:22px;font-weight:800;color:var(--accent)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{min-height:var(--touch);padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,var(--accent),#15803d);color:#fff;border:none}
.btn.add{border-color:#86efac}
.btn.sub{border-color:#fda4af}
.fb{min-height:52px;border-radius:14px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:16px;line-height:1.55;margin:10px 0}
.thinking{background:#fffbeb;border-radius:12px;padding:10px;font-size:15px;border:1px dashed #fcd34d}
.thinking .tag{font-weight:800;color:#b45309}
.say{margin-top:8px;font-size:15px;min-height:22px}
@media (prefers-reduced-motion:reduce){.frog{transition:none!important}}
</style><style id="aid-fit">/* AID_FIT_V1 */

body{
  min-height:100dvh!important;height:100dvh!important;

  overflow:hidden!important;
  padding:clamp(10px,1.5vh,20px) clamp(12px,1.8vw,24px) clamp(10px,1.3vh,16px)!important;

@media (min-width:960px) and (min-height:780px){
  body{font-size:17px}
  .top h1,.topbar h1{font-size:clamp(24px,2.1vw,30px)}
}

<body>
<main class="card">
  <div class="top"><h1>小青蛙跳数轴</h1><span class="badge">6–9 岁 · 加减</span></div>
  <div class="story"><strong>向右跳</strong>是加，<strong>向左跳</strong>是减。每格 1。看青蛙落在哪一格。</div>
  <div class="stage" role="img" aria-label="数轴">
    <div class="line" id="line">
      <div class="hop" id="hop" hidden></div>
      <div class="frog" id="frog">🐸</div>
    </div>
    <div class="eq" id="eq">3 + 2 = 5</div>
  </div>
  <div class="ctrl">
    <div class="row">
      <label>起点</label>
      <div class="step"><button type="button" id="sM">−</button><span class="v" id="sV">3</span><button type="button" id="sP">+</button></div>
      <input type="range" id="start" min="0" max="10" value="3" aria-label="起点">
    </div>
    <div class="row">
      <label>跳几格</label>
      <div class="step"><button type="button" id="jM">−</button><span class="v" id="jV">2</span><button type="button" id="jP">+</button></div>
      <input type="range" id="jump" min="0" max="8" value="2" aria-label="跳的格数">
    </div>
    <div class="btn-row">
      <button type="button" class="btn primary add" id="btnAdd">+ 向右跳（加）</button>
      <button type="button" class="btn primary sub" id="btnSub">− 向左跳（减）</button>
      <button type="button" class="btn" id="btnReset">↻ 重新开始</button>
      <button type="button" class="btn" id="btnSay">🗣️ 我会说</button>
    </div>
  </div>
  <div class="fb" id="fb" aria-live="polite">设好起点和格数，点向右或向左看青蛙跳。</div>
  <p class="thinking"><span class="tag">我怎么想：</span><span id="think">加法往大的方向走，减法往小的方向走。</span></p>
  <div class="say" id="say"></div>
</main>
<script>
(function(){
  const MAX=12;
  let start=3, jump=2, pos=3, lastOp='+';
  const $=id=>document.getElementById(id);

  function buildLine(){
    const line=$('line');
    // clear ticks keep frog
    [...line.querySelectorAll('.tick')].forEach(t=>t.remove());
    for(let i=0;i<=MAX;i++){
      const t=document.createElement('div');
      t.className='tick';
      t.style.left=(i/MAX*100)+'%';
      t.innerHTML='<label>'+i+'</label>';
      line.appendChild(t);
    }
  }
  function place(p, animate){
    pos=Math.max(0, Math.min(MAX, p));
    const frog=$('frog');
    if(!animate) frog.style.transition='none';
    frog.style.left=(pos/MAX*100)+'%';
    if(!animate){ void frog.offsetWidth; frog.style.transition=''; }
  }
  function syncLabels(){
    start=+$('start').value; jump=+$('jump').value;
    $('sV').textContent=start; $('jV').textContent=jump;
  }
  function updateEq(){
    if(lastOp==='+') $('eq').textContent=start+' + '+jump+' = '+(start+jump);
    else $('eq').textContent=start+' − '+jump+' = '+(start-jump);
  }
  function go(op){
    syncLabels();
    lastOp=op;
    place(start, false);
    const target = op==='+' ? start+jump : start-jump;
    if(target<0 || target>MAX){
      $('fb').textContent='会跳出 0～'+MAX+' 的数轴，换小一点的格数。';
      updateEq();
      return;
    }
    $('fb').textContent=(op==='+'?'向右':'向左')+'跳 '+jump+' 格…';
    $('think').textContent=op==='+'?'加法：从起点往更大的数跳。':'减法：从起点往更小的数跳。';
    const hop=$('hop');
    if(hop){
      hop.hidden=false;
      const a=Math.min(start,target), b=Math.max(start,target);
      hop.style.left=(a/MAX*100)+'%';
      hop.style.width=((b-a)/MAX*100)+'%';
      hop.style.background = op==='+' ? '#86efac' : '#fda4af';
    }
    setTimeout(()=>{
      place(target, true);
      updateEq();
      $('fb').textContent='落在 '+target+'。'+(op==='+'?start+'+'+jump+'='+target:start+'−'+jump+'='+target)+'。黄/彩条是跳过的格子。';
    }, 80);
  }
  function bind(m,p,r){
    $(m).onclick=()=>{ r.value=Math.max(+r.min,+r.value-1); syncLabels(); place(start,false); updateEq(); };
    $(p).onclick=()=>{ r.value=Math.min(+r.max,+r.value+1); syncLabels(); place(start,false); updateEq(); };
    r.oninput=()=>{ syncLabels(); place(start,false); updateEq(); };
  }
  bind('sM','sP',$('start'));
  bind('jM','jP',$('jump'));
  $('btnAdd').onclick=()=>go('+');
  $('btnSub').onclick=()=>go('-');
  $('btnReset').onclick=()=>{
    $('start').value=3; $('jump').value=2; lastOp='+';
    syncLabels(); place(start,false); updateEq();
    $('fb').textContent='设好起点和格数，点向右或向左看青蛙跳。';
    $('say').textContent='';
  };
  $('btnSay').onclick=()=>{
    $('say').textContent=lastOp==='+'
      ? '我会说：从 '+start+' 向右跳 '+jump+' 格，到 '+(start+jump)+'。'
      : '我会说：从 '+start+' 向左跳 '+jump+' 格，到 '+(start-jump)+'。';
  };
  buildLine();
  syncLabels();
  place(start,false);
  updateEq();
})();
</script><script id="aid-fit-js">/* AID_FIT_V1 */
(function(){
  var html=document.documentElement;
  function measure(){
    var card=document.querySelector("main.card, body>.card");
    if(!card) return;
    html.classList.remove("aid-compact","aid-tight");
    card.style.overflowY="hidden";
    void card.offsetHeight;
    var stage=card.querySelector(".stage,.scene,.stage-wrap,.viz");
    var stageH=stage?stage.clientHeight:999;
    if(card.scrollHeight>card.clientHeight+8 || stageH<240 || innerHeight<820) html.classList.add("aid-compact");
    void card.offsetHeight;
    stageH=stage?stage.clientHeight:999;
    if(card.scrollHeight>card.clientHeight+8 || stageH<200) html.classList.add("aid-tight");
    void card.offsetHeight;
    if(card.scrollHeight>card.clientHeight+8) card.style.overflowY="auto";
  }
  addEventListener("resize",measure);
  addEventListener("load",measure);
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",measure);
  else requestAnimationFrame(measure);
  setTimeout(measure,80);
  setTimeout(measure,400);
  var card=document.querySelector("main.card, body>.card");
  if(card && typeof MutationObserver==="function"){
    var t;
    new MutationObserver(function(){
      clearTimeout(t); t=setTimeout(measure,40);
    }).observe(card,{childList:true,subtree:true,characterData:true});
  }
})();
</script>
</body>
