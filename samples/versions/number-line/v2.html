<!doctype html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08-40-46">
<meta name="aid-version-note" content="系统重跑 2026-08-14T08-40-46">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小青蛙跳数轴 · 加减</title>
<style>
:root{
  --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --ok-deep:#15803d;
  --bad:#e85d5d; --card:#fff; --muted:#64748b; --line:#d7e6f5;
  --ease:cubic-bezier(.25,1,.5,1); --touch:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
html{height:100dvh}
body{
  font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  color:var(--ink); background:linear-gradient(160deg,#f0fdf4,#eaf4ff);
  height:100dvh; overflow:hidden;
  display:flex; padding:clamp(6px,1.4vh,16px) clamp(8px,1.6vw,20px);
}
.card{
  flex:1 1 auto; min-height:0; width:100%; max-width:min(1240px,100%); margin:0 auto;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  box-shadow:0 12px 28px rgba(31,58,95,.10);
  display:flex; flex-direction:column; overflow:hidden;
  padding:clamp(10px,1.6vh,20px) clamp(12px,2vw,26px) clamp(10px,1.4vh,16px);
}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none;margin-bottom:8px}
.top h1{margin:0;font-size:clamp(20px,2.4vw,26px);font-weight:800}
.badge{font-size:15px;font-weight:700;color:var(--ok-deep);background:#dcfce7;padding:5px 12px;border-radius:999px;white-space:nowrap}
.tabs{margin-left:auto;display:flex;gap:6px}
.tab{min-height:var(--touch);padding:0 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit}
.tab.on{background:var(--ok);border-color:var(--ok);color:#fff}
.stage{
  flex:1 1 auto; min-height:min(220px,30vh); position:relative; overflow:hidden;
  background:#f7fdf9; border:1px solid #d7f0e2; border-radius:16px;
  display:flex; flex-direction:column; justify-content:center; padding:34px 18px 18px;
}
.line{position:relative;height:8px;background:#bfe8d0;border-radius:4px;margin:0 6px}
.tick{position:absolute;top:-10px;width:3px;height:26px;background:var(--ok-deep);transform:translateX(-50%);border-radius:2px}
.tick label{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:20px;font-weight:800;color:var(--ink)}
.hop-layer{position:absolute;left:6px;right:6px;top:-16px;height:12px;pointer-events:none}
.hop-cell{position:absolute;top:0;height:100%;border-radius:6px;opacity:0;transition:opacity .18s var(--ease)}
.hop-cell.lit{opacity:1}
.frog{
  position:absolute; top:6px; width:54px; height:46px; z-index:3;
  transform:translateX(-50%); left:0; transition:left .55s var(--ease);
  filter:drop-shadow(0 4px 3px rgba(21,128,61,.25));
}
.frog svg{width:100%;height:100%;display:block}
.frog .hop-up{animation:hopUp .55s var(--ease)}
.frog.land .hop-up{animation:land .34s var(--ease)}
@keyframes hopUp{
  0%{transform:translateY(0) scale(1,1)}
  30%{transform:translateY(-54px) scale(1.02,.94)}
  55%{transform:translateY(-58px) scale(1.04,.9)}
  78%{transform:translateY(-18px) scale(.96,1.06)}
  100%{transform:translateY(0) scale(1,1)}
}
@keyframes land{
  0%{transform:translateY(0) scale(1.28,.66)}
  35%{transform:translateY(-10px) scale(.94,1.12)}
  100%{transform:translateY(0) scale(1,1)}
}
.mark{position:absolute;top:-4px;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none}
.mark.good{background:rgba(47,191,113,.28);border:3px solid var(--ok)}
.mark.wrong{background:rgba(232,93,93,.22);border:3px solid var(--bad);animation:shake .3s var(--ease)}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 7px),-50%)}75%{transform:translate(calc(-50% + 7px),-50%)}}
.ring{position:absolute;width:40px;height:40px;border:3px solid #fbbf24;border-radius:50%;transform:translate(-50%,-50%);animation:ringOut .7s var(--ease) forwards;pointer-events:none;z-index:2}
@keyframes ringOut{0%{width:26px;height:26px;opacity:.95}100%{width:64px;height:64px;opacity:0}}
.star{position:absolute;font-size:24px;transform:translate(-50%,-50%);animation:starPop .8s var(--ease) forwards;pointer-events:none;z-index:2}
@keyframes starPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-20deg)}60%{opacity:1;transform:translate(-50%,-120%) scale(1.25) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-190%) scale(.9) rotate(0)}}
.task{flex:none;margin:10px 0 8px;font-size:clamp(18px,2.2vw,22px);font-weight:800;text-align:left;line-height:1.5}
.task .dir-tag{display:inline-block;font-size:15px;font-weight:800;color:#fff;border-radius:8px;padding:2px 10px;margin-right:8px;vertical-align:2px}
.dir-tag.add{background:var(--ok)}
.dir-tag.sub{background:var(--bad)}
.eq-line{margin-top:2px;font-size:clamp(16px,1.8vw,18px);font-weight:700;color:var(--ok-deep);min-height:24px}
.pad{flex:none;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.num{min-width:var(--touch);min-height:var(--touch);border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s,color .15s,transform .1s}
.num:hover{border-color:var(--ok)}
.num.sel{background:var(--ok);border-color:var(--ok);color:#fff;transform:translateY(-2px)}
.num.dim{opacity:.45}
.ctrl{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:6px}
.btn{min-height:var(--touch);padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:800;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--ok),var(--ok-deep));border-color:transparent;color:#fff;box-shadow:0 4px 10px rgba(21,128,61,.25)}
.btn.add{background:linear-gradient(135deg,#34d399,#059669);border-color:transparent;color:#fff}
.btn.sub{background:linear-gradient(135deg,#fca5a5,#ef4444);border-color:transparent;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:inline-flex;align-items:center;gap:2px}
.stepper button{min-width:var(--touch);min-height:var(--touch);border-radius:12px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer;color:var(--ink);font-family:inherit}
.stepper .sv{min-width:46px;text-align:center;font-size:22px;font-weight:800;color:var(--accent)}
.fb{
  flex:none; min-height:54px; border-radius:14px; padding:10px 14px;
  background:#f6f9ff; border:1px solid #dbe7f5; font-size:19px; line-height:1.5;
  margin:4px 0 6px; text-align:left;
}
.fb.good{background:#f0fdf4;border-color:#bbf7d0}
.fb.wrong{background:#fef2f2;border-color:#fecaca}
.fb .tag{font-weight:800}
.say{flex:none;font-size:17px;color:var(--muted);min-height:20px;text-align:left}
.demo{
  position:fixed;inset:0;z-index:50;background:rgba(240,253,244,.96);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;
}
.demo h2{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;text-align:center}
.demo .sub{font-size:clamp(17px,2vw,20px);font-weight:700;color:var(--muted);text-align:center;min-height:30px}
.demo-stage{position:relative;width:min(560px,92vw);height:170px;background:#fff;border:2px solid #d7f0e2;border-radius:16px;overflow:hidden}
.demo-line{position:absolute;left:26px;right:26px;top:86px;height:8px;background:#bfe8d0;border-radius:4px}
.demo-tick{position:absolute;top:-9px;width:3px;height:24px;background:var(--ok-deep);transform:translateX(-50%)}
.demo-tick label{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:17px;font-weight:800}
.demo-frog{position:absolute;top:34px;width:50px;height:44px;transform:translateX(-50%);transition:left .55s var(--ease);z-index:3}
.demo-frog svg{width:100%;height:100%;display:block}
.demo-arrow{position:absolute;top:104px;height:5px;border-radius:3px;opacity:.9;transition:width .2s;z-index:2}
.demo-btn{margin-top:4px;min-height:58px;padding:12px 30px;border-radius:16px;border:none;background:linear-gradient(135deg,var(--ok),var(--ok-deep));color:#fff;font-size:20px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 14px rgba(21,128,61,.3)}
.demo .skip{position:absolute;top:14px;right:16px;min-height:44px;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
@media (max-width:640px){
  .pad{gap:4px}
  .num{min-width:48px;min-height:48px;font-size:18px}
  .stage{padding-left:10px;padding-right:10px}
}
@media (max-height:760px){
  body{padding:4px 8px}
  .top{margin-bottom:4px}
  .task{margin:6px 0 4px;line-height:1.3}
  .fb{min-height:44px;padding:7px 12px;font-size:17px;margin:3px 0}
  .say{display:none}
  .stage{min-height:160px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <h1>🐸 小青蛙跳数轴</h1>
    <span class="badge">6–9 岁 · 加减</span>
    <div class="tabs">
      <button type="button" class="tab on" id="tabCh">挑战</button>
      <button type="button" class="tab" id="tabFree">自由玩</button>
    </div>
  </div>

  <div class="stage" id="stage" role="img" aria-label="0到12的数轴">
    <div class="hop-layer" id="hopLayer"></div>
    <div class="line" id="line"></div>
    <div class="frog" id="frog" aria-hidden="true">
      <div class="hop-up">
        <svg viewBox="0 0 56 46" xmlns="http://www.w3.org/2000/svg">

          <ellipse cx="28" cy="31" rx="13" ry="8" fill="#eafbe9"/>

          <circle cx="40" cy="13" r="9.5" fill="#2fbf71"/>

          <path d="M21 30 Q28 37 35 30" stroke="#15803d" stroke-width="2.2" fill="none" stroke-linecap="round"/>

</main>

<div class="demo" id="demo" role="dialog" aria-label="开场演示">
  <button type="button" class="skip" id="demoSkip">跳过 →</button>
  <h2>小青蛙跳数轴</h2>
  <div class="demo-stage" id="demoStage">
    <div class="demo-line" id="demoLine"></div>
    <div class="demo-frog" id="demoFrog">
      <svg viewBox="0 0 56 46" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="28" cy="27" rx="21" ry="13" fill="#2fbf71"/>
        <ellipse cx="28" cy="31" rx="13" ry="8" fill="#eafbe9"/>
        <circle cx="16" cy="13" r="9.5" fill="#2fbf71"/>
        <circle cx="40" cy="13" r="9.5" fill="#2fbf71"/>
        <circle cx="18" cy="12" r="5" fill="#fff"/>
        <circle cx="38" cy="12" r="5" fill="#fff"/>
        <circle cx="19.5" cy="12" r="2.6" fill="#1e3a5f"/>
        <circle cx="36.5" cy="12" r="2.6" fill="#1e3a5f"/>
        <path d="M21 30 Q28 37 35 30" stroke="#15803d" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path d="M11 37 Q5 31 3 25" stroke="#2fbf71" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <path d="M45 37 Q51 31 53 25" stroke="#2fbf71" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="demo-arrow" id="demoArrow"></div>
  </div>
  <div class="sub" id="demoSub">向右跳是加，向左跳是减。看完就能玩！</div>
  <button type="button" class="demo-btn" id="demoGo" hidden>开始玩 ▶</button>
</div>

<script>
(function(){
  'use strict';
  const MAX=12, N=MAX+1;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $=id=>document.getElementById(id);
  const stage=$('stage'), line=$('line'), pad=$('pad');
  const frog=$('frog'), hopLayer=$('hopLayer');
  const task=$('task'), eqLine=$('eqLine'), fb=$('fb'), say=$('say');
  const btnGo=$('btnGo'), btnNext=$('btnNext'), btnSay=$('btnSay');

  /* ---------- 数轴与青蛙 ---------- */
  function buildTicks(container, max){
    container.querySelectorAll('.tick').forEach(t=>t.remove());
    for(let i=0;i<=max;i++){
      const t=document.createElement('div');
      t.className='tick';
      t.style.left=(i/max*100)+'%';
      t.innerHTML='<label>'+i+'</label>';
      container.appendChild(t);
    }
  }
  function buildHopLayer(){
    hopLayer.innerHTML='';
    for(let i=0;i<MAX;i++){
      const c=document.createElement('div');
      c.className='hop-cell';
      c.style.left=(i/MAX*100)+'%';
      c.style.width=(1/MAX*100)+'%';
      hopLayer.appendChild(c);
    }
  }
  function placeFrog(pos, animate){
    frog.style.left=(pos/MAX*100)+'%';
    if(!animate){ frog.style.transition='none'; void frog.offsetWidth; frog.style.transition=''; }
  }
  function clearMarks(){
    stage.querySelectorAll('.mark,.ring,.star').forEach(m=>m.remove());
  }
  function markAt(pos, kind){
    const m=document.createElement('div');
    m.className='mark '+kind;
    m.style.left=(pos/MAX*100)+'%';
    m.style.top='22px';
    stage.appendChild(m);
    return m;
  }
  function ringAt(pos){
    const r=document.createElement('div');
    r.className='ring';
    r.style.left=(pos/MAX*100)+'%';
    r.style.top='22px';
    stage.appendChild(r);
    setTimeout(()=>r.remove(),800);
  }
  function starAt(pos){
    const s=document.createElement('div');
    s.className='star';
    s.textContent='★';
    s.style.left=(pos/MAX*100)+'%';
    s.style.top='18px';
    stage.appendChild(s);
    setTimeout(()=>s.remove(),900);
  }
  function lightHop(a,b,color,cb){
    const cells=hopLayer.children;
    const lo=Math.min(a,b), hi=Math.max(a,b);
    let i=lo, done=0;
    (function step(){
      if(i>=hi){ if(cb) setTimeout(cb,90); return; }
      const c=cells[i];
      c.style.background=color;
      c.classList.add('lit');
      i++;
      if(reduce){ step(); } else { setTimeout(step, 70); }
    })();
  }
  function clearHop(){
    [...hopLayer.children].forEach(c=>c.classList.remove('lit'));
  }
  function jump(start,target,dir,onDone){
    clearHop();
    clearMarks();
    placeFrog(start,false);
    const color = dir==='+' ? '#86efac' : '#fecaca';
    lightHop(start,target,color,()=>{
      const inner=frog.querySelector('.hop-up');
      inner.classList.remove('hop-up');
      void inner.offsetWidth;
      inner.classList.add('hop-up');
      placeFrog(target,true);
      setTimeout(()=>{
        inner.classList.remove('hop-up');
        inner.classList.add('land');
        setTimeout(()=>inner.classList.remove('land'),340);
        ringAt(target);
        if(onDone) onDone();
      },560);
    });
  }

  /* ---------- 数字按键 ---------- */
  const numBtns=[];
  function buildPad(){
    pad.innerHTML='';
    for(let i=0;i<=MAX;i++){
      const b=document.createElement('button');
      b.type='button'; b.className='num'; b.textContent=i;
      b.setAttribute('aria-label','数字 '+i);
      b.onclick=()=>onNum(i);
      pad.appendChild(b);
      numBtns.push(b);
    }
  }
  function refreshPad(sel, dimSet){
    numBtns.forEach((b,i)=>{
      b.classList.toggle('sel', i===sel);
      b.classList.toggle('dim', dimSet && dimSet.has(i));
    });
  }

  /* ---------- 挑战模式 ---------- */
  const levels=[
    {q:'从 2 向右跳 3 格，停在哪？', start:2, jump:3, dir:'+', ans:5, tip:'向右跳是加，数越跳越大。'},
    {q:'从 6 向左跳 2 格，停在哪？', start:6, jump:2, dir:'-', ans:4, tip:'向左跳是减，数越跳越小。'},
    {q:'从 3 向右跳 4 格，停在哪？', start:3, jump:4, dir:'+', ans:7, tip:'一格一格数：4、5、6、7。'},
    {q:'从 9 向左跳 5 格，停在哪？', start:9, jump:5, dir:'-', ans:4, tip:'跳远了也别怕，一格一格往回数。'},
    {q:'从 4 向右跳 6 格，停在哪？', start:4, jump:6, dir:'+', ans:10, tip:'跳得越远，数变得越大。'},
    {q:'🐰 举一反三：小兔从 8 向左跳 6 格，停在哪？', start:8, jump:6, dir:'-', ans:2, tip:'换只小兔也一样：向左跳就是减！'}
  ];
  let levelIdx=0, picked=null, chDone=false, waiting=true;

  function showLevel(){
    const L=levels[levelIdx];
    picked=null; chDone=false; waiting=true;
    clearHop(); clearMarks();
    placeFrog(L.start,false);
    refreshPad(null, null);
    task.innerHTML='<span class="dir-tag '+(L.dir==='+'?'add':'sub')+'">'+(L.dir==='+'?'向右跳 = 加':'向左跳 = 减')+'</span>'+L.q;
    eqLine.textContent='';
    fb.className='fb';
    fb.innerHTML='<span class="tag">先想一想：</span>青蛙会落在哪个数？点下面的数字，再按「跳！」。';
    say.textContent='';
    btnGo.hidden=false; btnNext.hidden=true;
    btnGo.textContent='跳！';
  }
  function nextLevel(){
    levelIdx++;
    if(levelIdx>=levels.length){
      task.innerHTML='🎉 全部通关！';
      eqLine.textContent='你学会啦：向右跳=加，向左跳=减，跳几格就数几格。';
      fb.className='fb good';
      fb.innerHTML='<span class="tag">太棒了！</span>小青蛙谢谢你陪它跳完数轴。';
      btnGo.hidden=true; btnNext.hidden=false;
      btnNext.textContent='↻ 再玩一遍';
      btnNext.onclick=()=>{ levelIdx=0; showLevel(); };
      refreshPad(null,null);
      return;
    }
    showLevel();
  }
  function wrongPick(L, p){
    fb.className='fb wrong';
    const plus = L.dir==='+';
    if(plus && p < L.start){
      fb.innerHTML='<span class="tag">方向反啦：</span>向右跳要往<b>大数</b>走，你点到左边的 '+p+' 了。<br>向右跳是加：'+L.start+' → '+(L.start+1)+' → '+(L.start+2)+' … 再点一个更大的数试试。';
      markAt(p,'wrong'); markAt(L.ans,'good');
    } else if(!plus && p > L.start){
      fb.innerHTML='<span class="tag">方向反啦：</span>向左跳要往<b>小数</b>走，你点到右边的 '+p+' 了。<br>向左跳是减：'+L.start+' → '+(L.start-1)+' → '+(L.start-2)+' … 再点一个更小的数试试。';
      markAt(p,'wrong'); markAt(L.ans,'good');
    } else {
      const step = plus ? 1 : -1;
      const path=[];
      for(let k=1;k<=L.jump;k++) path.push(L.start+step*k);
      fb.innerHTML='<span class="tag">格数数错啦：</span>'+L.dirTagText()+'从 '+L.start+' 数 '+L.jump+' 格：<b>'+path.join('、')+'</b>。<br>你点到 '+p+'，'+ (Math.abs(p-L.ans)>0 ? (Math.abs(p-L.ans)+' 格之差，') : '') +'再数一次试试。';
      markAt(p,'wrong'); markAt(L.ans,'good');
    }
  }
  levels.forEach(L=>{ L.dirTagText=()=>L.dir==='+'?'向右跳：':'向左跳：'; });

  function checkAnswer(){
    if(waiting || chDone || picked===null) return;
    const L=levels[levelIdx];
    waiting=false;
    if(picked===L.ans){
      chDone=true;
      btnGo.disabled=true;
      jump(L.start,L.ans,L.dir,()=>{
        eqLine.textContent = L.start+' '+(L.dir==='+'?'+':'−')+' '+L.jump+' = '+L.ans;
        starAt(L.ans);
        fb.className='fb good';
        fb.innerHTML='<span class="tag">答对啦！</span>'+L.tip+'　'+(L.dir==='+'?L.start+'+'+L.jump+'='+L.ans:L.start+'−'+L.jump+'='+L.ans);
        say.textContent='我会说：从 '+L.start+(L.dir==='+'?' 向右跳 ':' 向左跳 ')+L.jump+' 格，到 '+L.ans+'。';
        btnGo.disabled=false;
        btnNext.hidden=false;
        btnNext.textContent=(levelIdx===levels.length-1)?'通关！🎉':'下一关 ▶';
        btnNext.onclick=nextLevel;
      });
    } else {
      wrongPick(L,picked);
      say.textContent='';
      setTimeout(()=>{ waiting=true; }, 500);
    }
  }

  /* ---------- 自由模式 ---------- */
  let fStart=3, fJump=2, fDir='+', fRunning=false;
  function renderFree(){
    clearHop(); clearMarks();
    placeFrog(fStart,false);
    task.innerHTML='<span class="dir-tag '+(fDir==='+'?'add':'sub')+'">'+(fDir==='+'?'向右跳 = 加':'向左跳 = 减')+'</span>点数字选起点，青蛙从 <b>'+fStart+'</b> '+ (fDir==='+'?'向右':'向左') +'跳 <b>'+fJump+'</b> 格。';
    eqLine.textContent='';
    refreshPad(fStart, null);
    fb.className='fb';
    fb.innerHTML='<span class="tag">试试看：</span>换起点、换格数、换方向，看青蛙落在哪。';
    say.textContent='';
    btnGo.hidden=false; btnNext.hidden=true;
    btnGo.textContent='跳！';
    $('stepJump').textContent=fJump;
  }
  function runFree(){
    if(fRunning) return;
    const target = fDir==='+' ? fStart+fJump : fStart-fJump;
    if(target<0 || target>MAX){
      fb.className='fb wrong';
      fb.innerHTML='<span class="tag">跳出数轴啦：</span>青蛙不能跳出 0～'+MAX+'。换小一点的格数，或换个方向。';
      return;
    }
    fRunning=true;
    btnGo.disabled=true;
    jump(fStart,target,fDir,()=>{
      eqLine.textContent = fStart+' '+(fDir==='+'?'+':'−')+' '+fJump+' = '+target;
      ringAt(target);
      fb.className='fb good';
      fb.innerHTML='<span class="tag">落点：</span>'+target+'。'+(fDir==='+'?'向右跳是加，数变大了。':'向左跳是减，数变小了。');
      say.textContent='我会说：从 '+fStart+(fDir==='+'?' 向右跳 ':' 向左跳 ')+fJump+' 格，到 '+target+'。';
      btnGo.disabled=false;
      fRunning=false;
    });
  }

  /* ---------- 模式切换与按键 ---------- */
  let mode='challenge';
  function setMode(m){
    mode=m;
    $('tabCh').classList.toggle('on', m==='challenge');
    $('tabFree').classList.toggle('on', m==='free');
    clearHop(); clearMarks(); say.textContent='';
    if(m==='challenge'){ showLevel(); }
    else { renderFree(); }
  }
  function onNum(i){
    if(mode==='challenge'){
      if(waiting && !chDone){ picked=i; refreshPad(i,null); }
    } else {
      if(fRunning) return;
      fStart=i; renderFree();
    }
  }
  btnGo.onclick=()=>{ if(mode==='challenge') checkAnswer(); else runFree(); };
  btnSay.onclick=()=>{
    if(say.textContent){
      const s=say.textContent; say.textContent='';
      setTimeout(()=>{ say.textContent=s; },50);
    } else if(mode==='challenge' && !chDone){
      const L=levels[levelIdx];
      say.textContent='提示：先看方向——'+(L.dir==='+'?'向右跳 = 加，往大数走。':'向左跳 = 减，往小数走。')+'再从起点一格一格数 '+L.jump+' 格。';
    } else if(mode==='free'){
      const t=fDir==='+'?fStart+fJump:fStart-fJump;
      say.textContent='我会说：从 '+fStart+(fDir==='+'?' 向右跳 ':' 向左跳 ')+fJump+' 格，到 '+t+'。';
    }
  };
  $('tabCh').onclick=()=>setMode('challenge');
  $('tabFree').onclick=()=>setMode('free');

  /* 自由模式参数（次级控件） */
  const ctrl=$('ctrl');
  const freeCtrl=document.createElement('span');
  freeCtrl.id='freeCtrl';
  freeCtrl.style.display='none';
  freeCtrl.innerHTML='<span class="stepper" style="margin-left:6px"><button type="button" id="jM" aria-label="少跳一格">−</button><span class="sv" id="stepJump">2</span><button type="button" id="jP" aria-label="多跳一格">+</button></span>';
  ctrl.appendChild(freeCtrl);
  function syncFreeCtrl(){
    freeCtrl.style.display = mode==='free' ? 'inline-flex' : 'none';
    $('stepJump').textContent=fJump;
  }
  freeCtrl.querySelector('#jM').onclick=()=>{ if(fRunning)return; fJump=Math.max(1,fJump-1); syncFreeCtrl(); renderFree(); };
  freeCtrl.querySelector('#jP').onclick=()=>{ if(fRunning)return; fJump=Math.min(8,fJump+1); syncFreeCtrl(); renderFree(); };

  /* ---------- 开场演示 ---------- */
  const demo=$('demo'), demoFrog=$('demoFrog'), demoSub=$('demoSub'), demoGo=$('demoGo');
  const demoArrow=$('demoArrow');
  buildTicks($('demoLine'),8);
  function demoTickPos(v){ return 26+(v/8)*(100-52); }
  function demoJump(from,to,dir,txt,delay,cb){
    const color = dir==='+' ? '#86efac' : '#fecaca';
    const a=Math.min(from,to), b=Math.max(from,to);
    demoArrow.style.left=demoTickPos(a)+'px';
    demoArrow.style.width=(demoTickPos(b)-demoTickPos(a))+'px';
    demoArrow.style.background=color;
    setTimeout(()=>{ demoSub.textContent=txt; },delay);
    setTimeout(()=>{
      demoFrog.style.left=demoTickPos(to)+'px';
      setTimeout(cb,620);
    },delay+260);
  }
  function startDemo(){
    if(reduce){
      demoFrog.style.left=demoTickPos(2)+'px';
      demoSub.textContent='向右跳是加（2→5），向左跳是减（5→3）。';
      demoGo.hidden=false;
      return;
    }
    demoFrog.style.left=demoTickPos(2)+'px';
    demoSub.textContent='向右跳是加，向左跳是减。看完就能玩！';
    let t=400;
    demoJump(2,5,'+','向右跳 3 格：2 → 5。向右跳就是<b>加</b>！',t,()=>{
      t+=1200;
      demoJump(5,3,'-','再向左跳 2 格：5 → 3。向左跳就是<b>减</b>！',t,()=>{
        setTimeout(()=>{ demoGo.hidden=false; },900);
      });
    });
  }
  function closeDemo(){
    demo.remove();
    setMode('challenge');
  }
  $('demoSkip').onclick=closeDemo;
  demoGo.onclick=closeDemo;

  /* ---------- 初始化 ---------- */
  buildTicks(line,MAX);
  buildHopLayer();
  buildPad();
  startDemo();
  syncFreeCtrl();
})();
</script>
</body>
</html>
