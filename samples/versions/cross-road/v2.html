    red:{
      progress:'红灯 · 等一等',
      text:'跳跳来到路口，红灯亮着。你想怎么做？',
      scene:function(){resetScene();},
      choices:[
        {kind:'ok', text:'🛑 站在人行道上，等绿灯亮', fb:'对！红灯停，站在人行道等。眼睛看着灯，不乱跑。', node:'green', svg:null},
        {kind:'bad', text:'🚗 有人看到「没车」，就跑过马路，会怎样？', danger:'rush', cons:'rush'},
        {kind:'bad', text:'🚶 有人站在马路中间等灯，行吗？', danger:'middle', cons:'middle'}
      ]
    },
    green:{
      progress:'绿灯 · 过马路',
      text:'绿灯亮了！过斑马线时要注意什么？',
      scene:function(){setLight('green');car.style.display='none';setTransform(bunny,BUNNY_START,0);},
      choices:[
        {kind:'ok', text:'👀 左右看一看，再走斑马线过去', fb:'对！绿灯行，也要左右看，走斑马线。', node:'success', svg:null, walk:true},
        {kind:'bad', text:'🏃 有人绿灯一亮就赶紧跑过去，会怎样？', danger:'run', cons:'run'},
        {kind:'bad', text:'🧸 有人边走边低头玩玩具，行吗？', danger:'play', cons:'play'}
      ]
    },
    transfer:{
      progress:'举一反三 · 没有红绿灯的路口',
      text:'小区门口没有红绿灯。跳跳想过去，怎么办？',
      scene:function(){
        $('light').style.display='none';
        setTransform(bunny,BUNNY_START,0);
        car.style.display='';
        setTransform(car,CAR_FAR,0);
      },
      choices:[
        {kind:'ok', text:'👀 站在路边左右看，没车了，牵大人走过去', fb:'对！没有灯，更要自己左右看。', node:'done', svg:null, walk:true},
        {kind:'bad', text:'🏃 有人看到「没车」，就自己跑过去，会怎样？', danger:'run2', cons:'run2'}
      ]
    },
    success:{
      progress:'✓ 安全到达',
      text:'跳跳安全到对面啦！记住三件事：红灯停、绿灯行；过马路左右看；走斑马线、牵大人的手。',
      scene:function(){setLight('green');car.style.display='none';setTransform(bunny,BUNNY_FAR,0);},
      choices:[]
    },
    done:{
      progress:'★ 完成',
      text:'你真棒！没有红绿灯的地方，也要左右看、牵大人。路上安全最重要！',
      scene:function(){setLight('green');car.style.display='none';setTransform(bunny,BUNNY_FAR,0);},
      choices:[]
    }
  };

  var node='red', answered=false;

  function showCons(cls,html,text){
    var c=$('cons');
    c.className='cons show '+cls;
    $('consSvg').innerHTML=html||'';
    $('consTxt').innerHTML=text;
  }
  function hideCons(){$('cons').className='cons';}

  function render(){
    var n=NODES[node]; answered=false;
    $('progress').textContent=n.progress;
    $('nodeText').textContent=n.text;
    n.scene();
    hideCons();
    $('btnNext').hidden=true;
    $('btnRetry').hidden=true;
    var box=$('choices'); box.innerHTML='';
    if(n.choices.length===0){
      if(node==='success'){ $('btnNext').hidden=false; $('btnNext').textContent='新路口挑战 →'; }
      return;
    }
    n.choices.forEach(function(c){
      var b=document.createElement('button');
      b.type='button'; b.className='btn'; b.textContent=c.text;
      b.addEventListener('click',function(){choose(c,b);});
      box.appendChild(b);
    });
  }

  function choose(c,btn){
    if(answered) return; answered=true;
    var all=Array.prototype.slice.call($('choices').children);
    all.forEach(function(el){el.disabled=true;});
    btn.classList.add(c.kind==='ok'?'ok':'bad');
    if(c.kind==='bad'){
      btn.classList.add('shake');
      runDanger(c);
    }else{
      runOk(c,btn);
    }
  }

  function runOk(c){
    var n=NODES[node];
    if(node==='red'){
      setLight('green');
      showCons('ok', '<svg viewBox="0 0 200 100" role="img" aria-label="绿灯亮了"><rect width="200" height="100" rx="14" fill="#ecfdf5"/><circle cx="100" cy="50" r="26" fill="#22c55e"/><text x="100" y="58" text-anchor="middle" font-size="30" fill="#fff">✓</text></svg>',
        '<span class="c-title">对啦！</span>'+c.fb);
      node=c.node;
      $('btnNext').hidden=false;
      $('btnNext').textContent='下一步 →';
    }else if(node==='green'){
      setTransform(bunny,BUNNY_FAR,1500);
      showCons('ok', '<svg viewBox="0 0 200 100" role="img" aria-label="走斑马线"><rect width="200" height="100" rx="14" fill="#ecfdf5"/><text x="100" y="58" text-anchor="middle" font-size="30">🚶</text></svg>',
        '<span class="c-title">对啦！</span>'+c.fb);
      node=c.node;
      setTimeout(function(){ $('btnNext').hidden=false; $('btnNext').textContent='到达对面 →'; }, 1650);
    }else if(node==='transfer'){
      setTransform(bunny,BUNNY_FAR,1500);
      showCons('ok', '<svg viewBox="0 0 200 100" role="img" aria-label="牵手过马路"><rect width="200" height="100" rx="14" fill="#ecfdf5"/><text x="100" y="58" text-anchor="middle" font-size="30">🤝</text></svg>',
        '<span class="c-title">对啦！</span>'+c.fb);
      node=c.node;
      setTimeout(function(){ $('btnNext').hidden=false; $('btnNext').textContent='完成 →'; }, 1650);
    }
  }

  function runDanger(c){
    var dur;
    if(c.danger==='rush'){
      setTransform(bunny,'translate(150px,162px)',500);
      setTimeout(function(){ setTransform(car,'translate(150px,132px)',900); },480);
      setTimeout(function(){ bunny.classList.add('shake'); setTimeout(function(){bunny.classList.remove('shake');},600); },1250);
    }else if(c.danger==='middle'){
      setTransform(bunny,'translate(150px,162px)',500);
      setTimeout(function(){ setTransform(car,'translate(210px,132px)',1200); },480);
    }else if(c.danger==='run'){
      setTransform(bunny,'translate(150px,168px) rotate(78deg)',550);
      setTimeout(function(){ setTransform(car,'translate(120px,132px)',800); },520);
    }else if(c.danger==='play'){
      setTransform(bunny,'translate(138px,196px)',400);
      setTimeout(function(){ setTransform(car,'translate(210px,132px)',1000); },380);
      setTimeout(function(){ bunny.classList.add('shake'); setTimeout(function(){bunny.classList.remove('shake');},600); },1200);
    }else if(c.danger==='run2'){
      setTransform(bunny,'translate(150px,162px)',500);
      setTimeout(function(){ setTransform(car,'translate(150px,132px)',800); },480);
      setTimeout(function(){ bunny.classList.add('shake'); setTimeout(function(){bunny.classList.remove('shake');},600); },1150);
    }
    var cc=CONS[c.cons];
    setTimeout(function(){
      showCons('bad', cc.svg,
        '<span class="c-title">'+cc.title+'</span><br>错在哪：'+cc.why+'<br>会怎样：'+cc.what+'<br><span class="c-do">马上这样做：</span>'+cc.do);
      $('btnRetry').hidden=false;
    }, 150);
  }

  $('btnNext').addEventListener('click',function(){render();});
  $('btnRetry').addEventListener('click',function(){resetScene();render();});
  $('btnReset').addEventListener('click',function(){node='red';resetScene();render();});
  $('btnSay').addEventListener('click',function(){
    showCons('ok', '<svg viewBox="0 0 200 100" role="img" aria-label="我会说"><rect width="200" height="100" rx="14" fill="#ecfdf5"/><text x="100" y="58" text-anchor="middle" font-size="30">🗣️</text></svg>',
      '<span class="c-title">我会说：</span>红灯停，绿灯行；过马路左右看，走斑马线，牵大人的手。');
  });

  /* 开场演示 */
  var demoT=$('demoTxt'), dR=$('dR'), dG=$('dG'), dB=$('dBunny');
  function demoRed(){dR.setAttribute('fill','#ef4444');dG.setAttribute('fill','#3f4a5a');}
  function demoGreen(){dR.setAttribute('fill','#3f4a5a');dG.setAttribute('fill','#22c55e');}
  var timers=[];
  function startDemo(){
    var d=$('demo'); d.classList.remove('hide');
    if(reduced){
      demoRed(); demoT.textContent='红灯停，绿灯行；走斑马线，左右看。';
      $('demoStart').hidden=false;
      return;
    }
    demoRed(); demoT.textContent='红灯亮 → 停！站在人行道等';
    timers.push(setTimeout(function(){demoGreen();demoT.textContent='绿灯亮 → 左右看一看';},2400));
    timers.push(setTimeout(function(){
      if(reduced)return;
      dB.style.transition='transform 1300ms '+EASE;
      dB.style.transform='translate(160px,40px)';
      demoT.textContent='走斑马线 → 到对面';
    },3800));
    timers.push(setTimeout(function(){demoT.textContent='过马路三件事：看灯、左右看、走斑马线';},5600));
    timers.push(setTimeout(function(){$('demoStart').hidden=false;},8200));
  }
  function endDemo(){
    timers.forEach(clearTimeout);
    $('demo').classList.add('hide');
    render();
  }
  $('demoSkip').addEventListener('click',endDemo);
  $('demoStart').addEventListener('click',endDemo);
  startDemo();
})();
</script>
<script id="aid-fit-js">/* AID_FIT_V1 */
(function(){
  var html=document.documentElement;
  function measure(){
    var card=document.querySelector('main.card');
    if(!card) return;
    html.classList.remove('aid-compact');
    card.style.overflowY='hidden';
    void card.offsetHeight;
    var scene=$('scene');
    var sceneH=scene?scene.clientHeight:999;
    if(card.scrollHeight>card.clientHeight+8 || sceneH<150 || innerHeight<740) html.classList.add('aid-compact');
    void card.offsetHeight;
    if(card.scrollHeight>card.clientHeight+8) card.style.overflowY='auto';
  }
  addEventListener('resize',measure);
  addEventListener('load',measure);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',measure);
  else requestAnimationFrame(measure);
  setTimeout(measure,80);
  setTimeout(measure,400);
  var card=document.querySelector('main.card');
  if(card && typeof MutationObserver==='function'){
    var t;
    new MutationObserver(function(){clearTimeout(t);t=setTimeout(measure,40);}).observe(card,{childList:true,subtree:true,characterData:true});
  }
})();
</script>
