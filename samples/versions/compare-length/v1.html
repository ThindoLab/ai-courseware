<!doctype html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v1">
<meta name="aid-version-at" content="2026-08-14">

<meta charset="utf-8">

<title>谁更长 · 比一比</title>
<!-- 风格：学前测量启蒙 / 场景：中幼儿+家庭 / 核心：对齐一端再比长度 -->
<style>
:root{--accent:#0ea5e9;--ok:#10b981;--ink:#1f2a44;--muted:#667085;--line:#bae6fd;--ease:cubic-bezier(0.25,1,0.5,1);--touch:52px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#e0f2fe,#fef9c3);min-height:100vh;padding:14px 12px 28px}
.card{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 28px rgba(14,165,233,.12);padding:18px 16px 22px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{margin:0;font-size:22px;font-weight:800}
.badge{font-size:14px;font-weight:700;color:#0369a1;background:#e0f2fe;padding:5px 12px;border-radius:999px}
.story{background:linear-gradient(135deg,#e0f2fe,#fef9c3);border-left:5px solid var(--accent);border-radius:0 14px 14px 0;padding:12px;margin-bottom:12px;font-size:16px;line-height:1.7}
.stage{background:#f0f9ff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.rail{position:relative;margin:18px 0;padding-left:8px}
.rail .base{position:absolute;left:0;top:0;bottom:0;width:4px;background:#f59e0b;border-radius:2px}
.bar{height:36px;border-radius:8px;margin:12px 0;display:flex;align-items:center;padding-left:10px;font-weight:800;color:#fff;font-size:15px;transition:width .45s var(--ease),margin-left .45s var(--ease);min-width:24px}
.bar.a{background:linear-gradient(90deg,#38bdf8,#0284c7)}
.bar.b{background:linear-gradient(90deg,#a78bfa,#7c3aed)}
.bar.skew{margin-left:36px} /* 未对齐：故意错位，演示错误比法 */
.rail.aligned .bar.skew{margin-left:0}
.ruler{display:flex;gap:0;margin:8px 0 0 0;padding-left:0}
.ruler i{flex:1;height:8px;border-left:1px solid #94a3b8;font-size:10px;color:var(--muted);position:relative}
.verdict{text-align:center;font-size:20px;font-weight:800;margin-top:10px;color:#0369a1}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:10px 0}
.step button{min-width:var(--touch);min-height:var(--touch);border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer;font-family:inherit}
.step .v{min-width:40px;text-align:center;font-size:22px;font-weight:800;color:var(--accent)}
.quiz{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.qbtn{min-height:52px;padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.qbtn.ok{border-color:var(--ok);background:#ecfdf5}
.qbtn.bad{border-color:#ef4444;background:#fef2f2}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.btn{min-height:var(--touch);padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,var(--accent),#0284c7);color:#fff;border:none}
.fb{min-height:52px;border-radius:14px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:16px;line-height:1.55;margin:10px 0}
.thinking{background:#fffbeb;border-radius:12px;padding:10px;font-size:15px;border:1px dashed #fcd34d}
.thinking .tag{font-weight:800;color:#b45309}
.say{margin-top:8px;font-size:15px;min-height:22px}
@media (prefers-reduced-motion:reduce){.bar{transition:none!important}}
</style><style id="aid-fit">/* AID_FIT_V1 */
html,body{height:100%!important;max-height:100dvh!important;overflow:hidden!important}
body{
  min-height:100dvh!important;height:100dvh!important;
  display:flex!important;flex-direction:column!important;
  padding:clamp(6px,1.2vh,14px) clamp(8px,1.5vw,18px)!important;
  box-sizing:border-box!important;
}
body>.card,main.card{
  flex:1 1 auto!important;min-height:0!important;width:100%!important;
  max-width:min(1240px,100%)!important;margin:0 auto!important;
  display:flex!important;flex-direction:column!important;
  overflow:hidden!important;
  padding:clamp(10px,1.5vh,20px) clamp(12px,1.8vw,24px) clamp(10px,1.3vh,16px)!important;
}
.stage,.scene,.stage-wrap,.viz{
  flex:1 1 42%!important;min-height:min(280px,38vh)!important;overflow:hidden!important;
  display:flex!important;flex-direction:column!important;justify-content:center!important;
}
.stage svg,.scene svg,#diagram{
  flex:1 1 auto;width:100%!important;height:100%!important;max-height:100%!important;min-height:0;
}
.ctrl,.choices,.btn-row,.top,.topbar,.fb,.progress{flex:none}
.slots,.grid,.bins,.pool,.ten{flex:1 1 auto!important;min-height:0}
html.aid-compact .story,html.aid-compact .thinking,html.aid-compact .say{display:none!important}
html.aid-compact .fb{min-height:0!important;padding:8px 10px!important;margin:6px 0!important;font-size:14px!important}
html.aid-compact h1{font-size:clamp(18px,2.2vw,22px)!important}
html.aid-compact .ctrl{gap:8px}
html.aid-compact .btn{min-height:44px;padding:8px 14px}
html.aid-compact .controls{display:grid!important;grid-template-columns:1fr 1fr;gap:6px 12px;max-height:30vh;overflow:auto}
html.aid-tight .legend,html.aid-tight .hints,html.aid-tight .thinking{display:none!important}
html.aid-tight .story{display:none!important}
html.aid-tight .stage,html.aid-tight .scene{min-height:min(200px,32vh)!important}
@media (min-width:960px) and (min-height:780px){
  body{font-size:17px}
  .top h1,.topbar h1{font-size:clamp(24px,2.1vw,30px)}
}
</style>
</head>
<body>
<main class="card">
  <div class="top"><h1>谁更长</h1><span class="badge">4–7 岁 · 比长短</span></div>
  <div class="story">比较长短时，要先把<strong>左端对齐</strong>（橙色竖线），再看谁伸得更远。不要只看位置歪不歪。</div>
  <div class="stage" role="img" aria-label="对齐比长短">
    <div class="rail">
      <div class="base" title="对齐线"></div>
      <div class="bar a skew" id="barA">蓝条</div>
      <div class="bar b" id="barB">紫条</div>
    </div>
    <div class="verdict" id="verdict">—</div>
  </div>
  <div class="row">
    <label style="font-weight:700">蓝条</label>
    <div class="step"><button type="button" id="aM">−</button><span class="v" id="aV">5</span><button type="button" id="aP">+</button></div>
    <input type="range" id="A" min="1" max="10" value="5" aria-label="蓝条长度">
  </div>
  <div class="row">
    <label style="font-weight:700">紫条</label>
    <div class="step"><button type="button" id="bM">−</button><span class="v" id="bV">7</span><button type="button" id="bP">+</button></div>
    <input type="range" id="B" min="1" max="10" value="7" aria-label="紫条长度">
  </div>
  <div class="quiz">
    <button type="button" class="qbtn" data-a="a">蓝更长</button>
    <button type="button" class="qbtn" data-a="b">紫更长</button>
    <button type="button" class="qbtn" data-a="eq">一样长</button>
  </div>
  <div class="btn-row">
    <button type="button" class="btn primary" id="btnAlign">▶ 对齐再比</button>
    <button type="button" class="btn" id="btnReset">↻ 重新开始</button>
    <button type="button" class="btn" id="btnSay">🗣️ 我会说</button>
  </div>
  <div class="fb" id="fb" aria-live="polite">调长度，点「对齐再比」，看谁更长。</div>
  <p class="thinking"><span class="tag">我怎么想：</span><span id="think">对齐左端后，右端更靠外的更长。</span></p>
  <div class="say" id="say"></div>
</main>
<script>
(function(){
  let A=5,B=7, unit=28, aligned=false;
  const $=id=>document.getElementById(id);
  function winner(){
    if(A>B) return 'a';
    if(B>A) return 'b';
    return 'eq';
  }
  function draw(){
    A=+$('A').value; B=+$('B').value;
    $('aV').textContent=A; $('bV').textContent=B;
    $('barA').style.width=(A*unit)+'px';
    $('barB').style.width=(B*unit)+'px';
    $('barA').textContent='蓝 '+A;
    $('barB').textContent='紫 '+B;
    document.querySelector('.rail').classList.toggle('aligned', aligned);
    const w=winner();
    if(!aligned){
      $('verdict').textContent = '还没对齐 — 别急着比！';
      $('think').textContent = '蓝条故意错开了。先点「对齐再比」，左端贴橙线。';
    } else {
      $('verdict').textContent = w==='a'?'蓝条更长':w==='b'?'紫条更长':'一样长';
      $('think').textContent = w==='eq'?'两端对齐后右端也对齐 → 一样长。':'右端更靠外的更长。';
    }
  }
  function bind(m,p,r){
    $(m).onclick=()=>{ r.value=Math.max(+r.min,+r.value-1); draw(); };
    $(p).onclick=()=>{ r.value=Math.min(+r.max,+r.value+1); draw(); };
    r.oninput=draw;
  }
  bind('aM','aP',$('A')); bind('bM','bP',$('B'));
  $('btnAlign').onclick=()=>{
    aligned=true;
    draw();
    $('fb').style.background='#ecfdf5';
    $('fb').textContent='左端已经贴齐橙线。现在看右端：谁更靠右谁更长。';
  };
  document.querySelector('.quiz').onclick=e=>{
    const b=e.target.closest('.qbtn'); if(!b) return;
    if(!aligned){
      $('fb').style.background='#fff7ed';
      $('fb').textContent='还没对齐！先点「对齐再比」，不然比出来会骗人。';
      return;
    }
    draw();
    const ans=winner();
    document.querySelectorAll('.qbtn').forEach(x=>x.classList.remove('ok','bad'));
    if(b.dataset.a===ans){
      b.classList.add('ok');
      $('fb').style.background='#ecfdf5';
      $('fb').textContent='对！'+(ans==='eq'?'一样长。':ans==='a'?'蓝更长。':'紫更长。');
    } else {
      b.classList.add('bad');
      $('fb').style.background='#fff7ed';
      $('fb').textContent='再看橙线对齐后，哪条的右端更靠外。';
    }
  };
  $('btnReset').onclick=()=>{
    $('A').value=5; $('B').value=7; aligned=false; draw();
    $('fb').style.background=''; $('fb').textContent='调长度，点「对齐再比」，看谁更长。';
    $('say').textContent='';
    document.querySelectorAll('.qbtn').forEach(x=>x.classList.remove('ok','bad'));
  };
  // 改长度后若已对齐仍保持；用户可再次点对齐
  const _bind=bind;
  // when length changes, keep aligned state (left stays flush once aligned)
  $('btnSay').onclick=()=>{
    const w=winner();
    $('say').textContent=w==='eq'?'我会说：对齐后一样长。':w==='a'?'我会说：蓝条更长。':'我会说：紫条更长。';
  };
  draw();
})();
</script><script id="aid-fit-js">/* AID_FIT_V1 */
(function(){
  var html=document.documentElement;
  function measure(){
    var card=document.querySelector("main.card, body>.card");
    if(!card) return;
    html.classList.remove("aid-compact","aid-tight");
    card.style.overflowY="hidden";
    void card.offsetHeight;
    var stage=card.querySelector(".stage,.scene,.stage-wrap,.viz");
    var stageH=stage?stage.clientHeight:999;
    if(card.scrollHeight>card.clientHeight+8 || stageH<240 || innerHeight<820) html.classList.add("aid-compact");
    void card.offsetHeight;
    stageH=stage?stage.clientHeight:999;
    if(card.scrollHeight>card.clientHeight+8 || stageH<200) html.classList.add("aid-tight");
    void card.offsetHeight;
    if(card.scrollHeight>card.clientHeight+8) card.style.overflowY="auto";
  }
  addEventListener("resize",measure);
  addEventListener("load",measure);
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",measure);
  else requestAnimationFrame(measure);
  setTimeout(measure,80);
  setTimeout(measure,400);
  var card=document.querySelector("main.card, body>.card");
  if(card && typeof MutationObserver==="function"){
    var t;
    new MutationObserver(function(){
      clearTimeout(t); t=setTimeout(measure,40);
    }).observe(card,{childList:true,subtree:true,characterData:true});
  }
})();
</script>
</body>
</html>
