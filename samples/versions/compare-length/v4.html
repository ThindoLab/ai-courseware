<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v4">
<meta name="aid-version-at" content="2026-08-14T10-09-13">
<meta name="aid-version-note" content="系统重跑 2026-08-14T10-09-13">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谁更长·比一比</title>
<style>
  :root{
    --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d;
    --card:#ffffff; --paper:#f4f7fb; --line:#c9d8ec;
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100dvh; overflow:hidden; margin:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .app{
    width:min(1240px,100%); height:100dvh;
    display:flex; flex-direction:column;
    padding:14px clamp(14px,3vw,40px) 14px;
  }
  header{display:flex; align-items:baseline; justify-content:space-between; padding:2px 2px 8px;}
  .title{font-size:clamp(22px,4.2vw,38px); font-weight:800; letter-spacing:.5px;}
  .stage-note{font-size:clamp(16px,2vw,19px); color:#5b7394; font-weight:700;}

  .card{
    flex:1; min-height:0; background:var(--card);
    border-radius:var(--r); box-shadow:0 8px 24px rgba(30,58,95,.10);
    display:flex; flex-direction:column; padding:clamp(12px,2.2vw,26px);
    position:relative; overflow:hidden;
  }
  .prompt{
    font-size:clamp(21px,3.4vw,30px); font-weight:800; line-height:1.35;
    text-align:center; padding:4px 0 2px; flex-shrink:0;
  }
  .stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative;}
  .plot{width:100%; height:100%; display:block;}
  .hint{
    font-size:clamp(17px,2.2vw,21px); color:#5b7394; text-align:center;
    padding:4px 0 2px; flex-shrink:0;
  }
  .choices{
    display:flex; justify-content:center; gap:clamp(10px,3vw,26px);
    flex-wrap:wrap; padding:6px 0 2px; flex-shrink:0;
  }
  .pick{
    min-width:clamp(140px,20vw,230px); min-height:56px;
    border:3px solid var(--line); background:#fff; color:var(--ink);
    border-radius:16px; font-size:clamp(20px,2.8vw,27px); font-weight:800;
    cursor:pointer; padding:10px 24px; transition:transform .15s, border-color .2s, background .2s;
  }
  .pick:active{transform:scale(.96);}
  .pick.right{border-color:var(--ok); background:#eafaf1; color:#1d7a4a;}
  .pick.wrong{border-color:var(--bad); background:#fdecec; color:#b43b3b;}
  .pick:disabled{opacity:.92; cursor:default;}
  .pick.shake{animation:shk .4s;}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .go{
    min-height:56px; border:none; border-radius:16px; background:var(--accent); color:#fff;
    font-size:clamp(19px,2.5vw,24px); font-weight:800; padding:10px 28px; cursor:pointer;
    transition:transform .15s, filter .2s, opacity .2s;
  }
  .go:active{transform:scale(.96);}
  .go:hover{filter:brightness(1.06);}
  .go:disabled{opacity:.45; cursor:default;}

  .fb{
    min-height:66px; margin-top:auto; border-radius:14px; padding:10px 16px;
    font-size:clamp(18px,2.3vw,22px); line-height:1.5; flex-shrink:0;
    display:flex; align-items:center; gap:12px; opacity:0; transform:translateY(8px);
    transition:opacity .25s, transform .25s;
  }
  .fb.show{opacity:1; transform:none;}
  .fb .fb-icon{font-size:28px; flex-shrink:0;}
  .fb.ok{background:#eafaf1; color:#1d7a4a;}
  .fb.bad{background:#fdecec; color:#b43b3b;}
  .fb.info{background:#eaf2fc; color:var(--accent);}
  .fb b{font-weight:800;}

  /* 开场演示 overlay */
  .ov{
    position:absolute; inset:0; background:var(--card); z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:16px; text-align:center;
  }
  .ov.hidden{display:none;}
  .ov-title{font-size:clamp(24px,4vw,34px); font-weight:800;}
  .ov-sub{font-size:clamp(17px,2.2vw,21px); color:#5b7394; max-width:600px; line-height:1.65;}
  .ov-stage{width:min(600px,94%); flex:0 0 auto;}
  .ov-btn{
    min-height:54px; border:none; border-radius:16px; background:var(--accent); color:#fff;
    font-size:clamp(18px,2.4vw,23px); font-weight:800; padding:10px 30px; cursor:pointer; margin-top:4px;
  }
  .ov-skip{
    min-height:48px; background:#fff; border:2px solid var(--line); color:#5b7394;
    border-radius:14px; font-size:clamp(16px,2vw,19px); padding:6px 20px; cursor:pointer; margin-top:8px;
  }

  /* 结束页 */
  .end{
    position:absolute; inset:0; background:var(--card); z-index:30;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    padding:18px; text-align:center;
  }
  .end.show{display:flex;}
  .end-title{font-size:clamp(30px,5vw,46px); font-weight:800; color:var(--ok);}
  .end-sub{font-size:clamp(18px,2.4vw,23px); color:#5b7394; max-width:560px; line-height:1.7;}
  .end-rule{
    font-size:clamp(19px,2.5vw,24px); font-weight:800; color:var(--ink);
    background:#eaf2fc; border-radius:14px; padding:10px 22px;
  }
  .end-btn{
    min-height:56px; border:none; border-radius:16px; background:var(--accent); color:#fff;
    font-size:clamp(19px,2.5vw,24px); font-weight:800; padding:10px 34px; cursor:pointer; margin-top:8px;
  }
  .end-btn:active{transform:scale(.96);}

  .arrow-anim{stroke-dasharray:8 8; animation:dashmove .9s linear infinite;}
  @keyframes dashmove{to{stroke-dashoffset:-16;}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important;}
    .arrow-anim{stroke-dasharray:none; animation:none;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">谁更长 · 比一比</div>
    <div class="stage-note" id="stageNote">第 1 关 · 两条小蛇</div>
  </header>

  <main class="card" id="card">
    <!-- 开场演示 overlay -->
    <div class="ov" id="ov" role="dialog" aria-label="开场演示">
      <div class="ov-title">先看我怎么比！</div>
      <div class="ov-sub">红蛇偷懒，<b>没有和蓝蛇把头对齐</b>。直接看尾巴，好像一样长……真的一样长吗？点「把头对齐」，再看！</div>
      <div class="ov-stage">
        <svg class="plot" id="ovPlot" viewBox="0 0 600 210" role="img" aria-label="演示：没对齐会看错，对齐才看得准">
          <line x1="70" y1="40" x2="70" y2="160" stroke="#c9d8ec" stroke-width="3" stroke-dasharray="6 8"/>
          <g id="ovRed" transform="translate(50,0)">
            <path d="M120 70 H320" stroke="#e85d5d" stroke-width="22" stroke-linecap="round" fill="none"/>
            <circle cx="108" cy="70" r="14" fill="#f6c1c1" stroke="#e85d5d" stroke-width="3"/>
            <circle cx="104" cy="66" r="2.6" fill="#1e3a5f"/>
            <circle cx="318" cy="70" r="10" fill="#e85d5d"/>
          </g>
          <g id="ovBlue">
            <path d="M70 140 H330" stroke="#2f6fbf" stroke-width="22" stroke-linecap="round" fill="none"/>
            <circle cx="58" cy="140" r="14" fill="#c3d7f0" stroke="#2f6fbf" stroke-width="3"/>
            <circle cx="54" cy="136" r="2.6" fill="#1e3a5f"/>
            <circle cx="328" cy="140" r="10" fill="#2f6fbf"/>
          </g>
          <text id="ovTag" x="420" y="70" text-anchor="middle" font-size="21" font-weight="800" fill="#1e3a5f" opacity="0">?</text>
        </svg>
      </div>
      <button class="ov-btn" id="ovPlay">▶ 把头对齐</button>
      <button class="ov-skip" id="ovSkip">开始玩 →</button>
    </div>

    <div class="prompt" id="prompt">谁的尾巴更长？点它！</div>
    <div class="stage">
      <svg class="plot" id="plot" viewBox="0 0 640 380" role="img" aria-label="比长短主图"></svg>
    </div>
    <div class="hint" id="hint">两头已经对齐，看另一头谁更靠右。</div>
    <div class="choices" id="choices"></div>
    <div class="fb" id="fb" aria-live="polite"><span class="fb-icon" id="fbIcon"></span><span id="fbText"></span></div>

    <!-- 结束页 -->
    <div class="end" id="end" role="dialog" aria-label="完成">
      <svg width="180" height="120" viewBox="0 0 180 120" role="img" aria-label="庆祝">
        <text x="90" y="78" text-anchor="middle" font-size="64">🎉</text>
        <text x="30" y="26" font-size="26" fill="#f59e0b">★</text>
        <text x="140" y="30" font-size="22" fill="#e85d5d">★</text>
        <text x="24" y="96" font-size="20" fill="#2f6fbf">★</text>
        <text x="146" y="96" font-size="26" fill="#2fbf71">★</text>
      </svg>
      <div class="end-title">你学会比长短啦！</div>
      <div class="end-rule">一头对齐，再看另一头 👀</div>
      <div class="end-sub">以后比跳绳、比蜡笔、比谁的袖子长，都用这个办法。</div>
      <button class="end-btn" id="again">🔁 再玩一次</button>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const plot = $("plot"), prompt = $("prompt"), hint = $("hint"),
        choices = $("choices"), fb = $("fb"), fbIcon = $("fbIcon"),
        fbText = $("fbText"), stageNote = $("stageNote"), card = $("card");

  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs){
    const n = document.createElementNS(NS, tag);
    for(const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* ---------- 开场演示：先看错，再对齐 ---------- */
  const ov = $("ov"), ovPlay = $("ovPlay"), ovSkip = $("ovSkip");
  function demoReset(){
    const red = $("ovRed"), tag = $("ovTag");
    red.style.transition = "none";
    red.setAttribute("transform", "translate(50,0)");
    tag.setAttribute("opacity", 0);
  }
  function demoRun(){
    const red = $("ovRed"), tag = $("ovTag");
    red.style.transition = "transform .6s cubic-bezier(.25,1,.5,1)";
    // 第一拍：问号出现——好像一样长？
    tag.setAttribute("opacity", 1);
    tag.textContent = "一样长？";
    // 第二拍：把头对齐（红蛇整体左移 50），真相出现
    setTimeout(()=>{ red.setAttribute("transform", "translate(0,0)"); }, 700);
    setTimeout(()=>{ tag.textContent = "蓝蛇更长！"; }, 1400);
    setTimeout(()=>{ ovPlay.blur(); }, 2200);
  }
  demoReset(); demoRun();
  ovPlay.addEventListener("click", ()=>{ demoReset(); demoRun(); });
  ovSkip.addEventListener("click", ()=>{ ov.classList.add("hidden"); startLevel(); });

  /* ---------- 关卡数据 ---------- */
  let level = 0, picked = false;
  const PADL = 70, W = 640, H = 380;
  const LEVELS = [
    {
      note:"第 1 关 · 两条小蛇",
      prompt:"谁的尾巴更长？点它！",
      hint:"两头已经对齐，看另一头谁更靠右。",
      rows:[
        {name:"红红", len:210, color:"#e85d5d", head:"#f6c1c1", offset:0},
        {name:"蓝蓝", len:300, color:"#2f6fbf", head:"#c3d7f0", offset:0}
      ],
      right:1
    },
    {
      note:"第 2 关 · 三根毛线",
      prompt:"哪根毛线最长？点它！",
      hint:"三根都对齐啦，看哪根冒出最多。",
      rows:[
        {name:"红毛线", len:170, color:"#e85d5d", head:"#f6c1c1", offset:0},
        {name:"黄毛线", len:280, color:"#f59e0b", head:"#fcd07a", offset:0},
        {name:"蓝毛线", len:230, color:"#2f6fbf", head:"#c3d7f0", offset:0}
      ],
      right:1
    },
    {
      note:"第 3 关 · 谁在偷懒",
      prompt:"哪条小蛇更长？先帮它们把头对齐！",
      hint:"绿绿的头没对齐。先点「⇥ 对齐」，再点答案。",
      rows:[
        {name:"绿绿", len:250, color:"#2fbf71", head:"#a4e8c5", offset:50},
        {name:"橙橙", len:280, color:"#f59e0b", head:"#fcd07a", offset:0}
      ],
      right:1, needAlign:true
    }
  ];

  let currentLevel = null;

  function drawLevel(lv){
    plot.innerHTML = "";
    const top = 86, gap = 34, rowH = 26;
    lv.rows.forEach((r, i)=>{
      const y = top + i * (gap + rowH);
      const x1 = PADL, x2 = PADL + r.len;
      const g = el("g", {});
      g.dataset.row = i;
      const bar = el("path", {d:`M${x1} ${y} H${x2}`, stroke:r.color,
        "stroke-width":"22", "stroke-linecap":"round", fill:"none"});
      const head = el("circle", {cx:x1-12, cy:y, r:14, fill:r.head, stroke:r.color, "stroke-width":"3"});
      const eye = el("circle", {cx:x1-16, cy:y-4, r:2.6, fill:"#1e3a5f"});
      const cap = el("circle", {cx:x2, cy:y, r:10, fill:r.color});
      g.append(bar, head, eye, cap);
      g.style.transform = "translateX(" + (r.offset||0) + "px)";
      g.style.transition = "transform .5s cubic-bezier(.25,1,.5,1)";
      plot.appendChild(g);
    });
    // 对齐参考虚线（起点）
    const al = el("line", {x1:PADL, y1:58, x2:PADL, y2:320,
      stroke:"#c9d8ec", "stroke-width":"3", "stroke-dasharray":"6 8"});
    plot.appendChild(al);
    // 名字标签
    lv.rows.forEach((r, i)=>{
      const y = top + i * (gap + rowH);
      const t = el("text", {x:PADL+8, y:y+42, "text-anchor":"start",
        "font-size":"18", "font-weight":"800", fill:"#5b7394"});
      t.textContent = r.name;
      plot.appendChild(t);
    });
  }

  function buildChoices(){
    choices.innerHTML = "";
    if(currentLevel.needAlign){
      const b = document.createElement("button");
      b.className = "go"; b.textContent = "⇥ 对齐";
      b.addEventListener("click", doAlign);
      choices.appendChild(b);
    }
    currentLevel.rows.forEach((r, i)=>{
      const b = document.createElement("button");
      b.className = "pick"; b.textContent = r.name; b.dataset.idx = i;
      b.addEventListener("click", ()=>onPick(i, b));
      choices.appendChild(b);
    });
  }

  function doAlign(){
    if(picked) return;
    currentLevel.rows.forEach((r, i)=>{
      if(r.offset && r.offset > 0){
        const g = plot.querySelector(`[data-row="${i}"]`);
        r.offset = 0;
        g.style.transform = "translateX(0px)";
      }
    });
    const b = choices.querySelector(".go");
    if(b){ b.disabled = true; }
    fbIcon.textContent = "✅";
    fbText.innerHTML = "对齐啦！现在再看，谁的另一头更靠右？";
    fb.className = "fb show info";
    setTimeout(()=>{ fb.classList.remove("show","ok","bad","info"); }, 2200);
  }

  /* ---------- 点选判断 ---------- */
  function onPick(i, btn){
    if(picked) return;
    const rows = currentLevel.rows;
    if(currentLevel.needAlign && rows.some(r=>r.offset > 0)){
      picked = true;
      btn.classList.add("wrong","shake");
      showFb("bad","还没对齐就比，眼睛会被骗！绿绿的头往前伸了，看起来更长，其实不一定。先点「<b>⇥ 对齐</b>」，再点答案。");
      setTimeout(()=>{ picked = false; btn.classList.remove("wrong","shake"); fb.classList.remove("show","ok","bad","info"); }, 3000);
      return;
    }
    const right = i === currentLevel.right;
    const others = choices.querySelectorAll(".pick");
    if(right){
      picked = true;
      btn.classList.add("right");
      others.forEach(o=>{ if(o.dataset.idx != i) o.disabled = true; });
      showFb("ok", okText(currentLevel, i));
      markWinner(i);
      setTimeout(nextOrEnd, 1500);
    }else{
      picked = true;
      btn.classList.add("wrong","shake");
      showFb("bad", badText(currentLevel, i));
      setTimeout(()=>{ picked = false; btn.classList.remove("wrong","shake"); fb.classList.remove("show","ok","bad","info"); }, 2800);
    }
  }

  function okText(lv, i){
    const r = lv.rows[i];
    if(lv.needAlign) return "对啦！对齐以后，<b>" + r.name + "</b>的另一头更靠右，所以它更长。";
    return "对啦！<b>" + r.name + "</b>的另一头多出一大截，它最长。";
  }
  function badText(lv, i){
    const r = lv.rows[i], rr = lv.rows[lv.right];
    if(lv.needAlign){
      return "对齐以后再看：<b>" + rr.name + "</b>的另一头更靠右。刚才绿绿看起来长，是因为头没对齐，眼睛被骗啦。";
    }
    return "再仔细看另一头：<b>" + rr.name + "</b>更靠右，多出一截。比长短要看<b>另一头</b>，不是看谁的头。";
  }

  function markWinner(i){
    const rows = currentLevel.rows;
    const winner = rows[i];
    const y = 86 + i * 60;
    let secondLen = -1;
    rows.forEach((r, j)=>{ if(j !== i && r.len > secondLen) secondLen = r.len; });
    const xs = PADL + secondLen;
    const xe = PADL + winner.len;
    if(xe > xs){
      const arrow = el("line", {x1:xs, y1:y, x2:xe-14, y2:y,
        stroke:"#2f6fbf","stroke-width":"6","stroke-linecap":"round",class:"arrow-anim"});
      const head = el("path", {d:`M${xe-2} ${y} l-14 -7 v14 z`, fill:"#2f6fbf"});
      plot.appendChild(arrow); plot.appendChild(head);
      const tag = el("text", {x:(xs+xe)/2, y:y-24, "text-anchor":"middle",
        "font-size":"20","font-weight":"800", fill:"#1e3a5f"});
      tag.textContent = "多出的";
      plot.appendChild(tag);
    }
  }

  function showFb(kind, html){
    fbIcon.textContent = kind==="ok" ? "🎉" : kind==="bad" ? "🤔" : "✅";
    fbText.innerHTML = html;
    fb.className = "fb show " + kind;
  }

  function startLevel(){
    currentLevel = LEVELS[level];
    picked = false;
    stageNote.textContent = currentLevel.note;
    prompt.textContent = currentLevel.prompt;
    hint.textContent = currentLevel.hint;
    drawLevel(currentLevel);
    buildChoices();
    fb.classList.remove("show","ok","bad","info");
  }

  function nextOrEnd(){
    if(level < LEVELS.length-1){
      level++;
      startLevel();
    }else{
      // 举一反三：跳绳
      currentLevel = {
        note:"举一反三 · 跳绳",
        prompt:"哪根跳绳更长？点它！",
        hint:"方法没变：一头对齐，看另一头。",
        rows:[
          {name:"小红", len:220, color:"#e85d5d", head:"#f6c1c1", offset:0},
          {name:"小蓝", len:320, color:"#2f6fbf", head:"#c3d7f0", offset:0}
        ],
        right:1
      };
      picked = false;
      stageNote.textContent = currentLevel.note;
      prompt.textContent = currentLevel.prompt;
      hint.textContent = currentLevel.hint;
      drawLevel(currentLevel);
      buildChoices();
      fb.classList.remove("show","ok","bad","info");
    }
  }

  /* ---------- 举一反三点选 ---------- */
  function bonusPick(i, btn){
    if(picked) return;
    const right = i === currentLevel.right;
    const others = choices.querySelectorAll(".pick");
    if(right){
      picked = true;
      btn.classList.add("right");
      others.forEach(o=>{ if(o.dataset.idx != i) o.disabled = true; });
      showFb("ok","对！<b>小蓝</b>更长。方法还是一样的：一头对齐，比另一头。你学会啦！");
      markWinner(i);
      setTimeout(showEnd, 1600);
    }else{
      picked = true;
      btn.classList.add("wrong","shake");
      showFb("bad","对齐以后看另一头：<b>小蓝</b>更靠右，多出一截，它更长。");
      setTimeout(()=>{ picked = false; btn.classList.remove("wrong","shake"); fb.classList.remove("show","ok","bad","info"); }, 2800);
    }
  }
  function buildBonusChoices(){
    choices.innerHTML = "";
    currentLevel.rows.forEach((r, i)=>{
      const b = document.createElement("button");
      b.className = "pick"; b.textContent = r.name; b.dataset.idx = i;
      b.addEventListener("click", ()=>bonusPick(i, b));
      choices.appendChild(b);
    });
  }

  /* ---------- 结束页 ---------- */
  const end = $("end");
  function showEnd(){
    end.classList.add("show");
  }
  $("again").addEventListener("click", ()=>{
    end.classList.remove("show");
    level = 0;
    startLevel();
  });

  /* 让 bonus 关卡复用同一套按钮构建 */
  const _origBuild = buildChoices;
  buildChoices = function(){
    if(currentLevel && currentLevel.note && currentLevel.note.indexOf("举一反三") === 0){
      buildBonusChoices();
      return;
    }
    _origBuild();
  };
})();
</script>
</body>
</html>
