<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v3">
<meta name="aid-version-at" content="2026-08-17T10-03-41">
<meta name="aid-iteration" content="R6">
<meta name="aid-version-note" content="迭代R6 系统重跑 2026-08-17T10-03-41">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相遇 · 相向而行</title>
<!-- aid-contract {"levels":[{"answers":["mid"],"options":["left","mid","right"]},{"answers":["rabbit"],"options":["rabbit","bear","same"]},{"answers":["right"],"options":["left","mid","right"]},{"answers":["left"],"options":["left","mid","right"]}]} -->
<style>
  :root{
    --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d; --card:#fff;
    --rabbit:#f59e0b; --bear:#14b8a6; --line:#d7e0ee; --soft:#eef3f9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100dvh;overflow:hidden}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:#dfe8f4;
    display:flex;align-items:center;justify-content:center;
  }
  .app{
    width:min(1240px,100%);height:100dvh;display:flex;flex-direction:column;
    background:var(--card);border-radius:22px;box-shadow:0 12px 40px rgba(30,58,95,.18);
    overflow:hidden;
  }
  @media(max-width:760px){ .app{border-radius:0} }

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px 8px}
  h1{font-size:clamp(22px,2.4vw,32px);font-weight:800;letter-spacing:.5px}
  .sub{font-size:clamp(15px,1.4vw,19px);color:#6b7f9e;font-weight:600}
  .steps{display:flex;gap:7px;margin-left:auto}
  .step{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:#e8eef7;color:#6b7f9e;font-weight:800;font-size:18px}
  .step.on{background:var(--accent);color:#fff}
  .step.done{background:#d3e7fb;color:var(--accent)}

  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 10px}
  svg#road{width:100%;max-height:100%}

  .panel{display:flex;flex-direction:column;gap:10px;padding:10px 22px 14px;border-top:1px solid var(--line);background:#fbfdff}
  .speeds{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .sgroup{display:flex;align-items:center;gap:9px}
  .sgroup .who{font-weight:800;font-size:21px}
  .chips{display:flex;gap:8px}
  .chip{min-width:70px;height:52px;padding:0 14px;border-radius:14px;border:2px solid #c9d6e8;
    background:#fff;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .chip:active{transform:scale(.96)}
  .chip.sel-r{background:#fdeecb;border-color:var(--rabbit);color:#8a5a00}
  .chip.sel-b{background:#d8f3ee;border-color:var(--bear);color:#0b6b5e}
  .chip[disabled]{cursor:default;opacity:.95}
  .midrow{display:flex;justify-content:center}
  .go{height:56px;min-width:230px;border:none;border-radius:18px;background:var(--accent);
    color:#fff;font-size:25px;font-weight:800;letter-spacing:4px;cursor:pointer}
  .go:active{transform:scale(.98)}
  .go:disabled{background:#c8d4e6;cursor:not-allowed}
  .qwrap{display:flex;flex-direction:column;gap:8px;align-items:center}
  .qtitle{font-size:clamp(19px,1.8vw,23px);font-weight:800;text-align:center}
  .qrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .opt{min-width:120px;height:56px;padding:0 18px;border-radius:16px;border:2px solid #c9d6e8;
    background:#fff;font-size:21px;font-weight:700;color:var(--ink);cursor:pointer;transition:transform .12s}
  .opt:active{transform:scale(.97)}
  .opt.right{background:#e3f8ec;border-color:var(--ok);color:#14804a}
  .opt.wrong{background:#fdecec;border-color:var(--bad);color:#b33a3a}
  .opt:disabled{cursor:default}
  .shake{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  #status{text-align:center;font-size:clamp(18px,1.8vw,22px);min-height:38px;font-weight:700}

  footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 22px;
    border-top:1px solid var(--line);background:#fbfdff}
  #stepName{font-size:18px;font-weight:700;color:#6b7f9e}
  #next{height:56px;min-width:170px;border:none;border-radius:16px;background:var(--accent);
    color:#fff;font-size:22px;font-weight:800;cursor:pointer}
  #next:disabled{background:#c8d4e6;color:#8aa0bd;cursor:not-allowed}

  .celebrate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:#f6fafd;text-align:center;padding:26px;height:100dvh;width:min(1240px,100%)}
  .celebrate h2{font-size:clamp(30px,4vw,46px);font-weight:800}
  .celebrate p{font-size:clamp(20px,2.2vw,26px);line-height:1.7;font-weight:600;color:var(--ink)}
  .celebrate .tip{font-size:18px;color:#6b7f9e;line-height:1.6}
  #again{height:60px;min-width:230px;border:none;border-radius:18px;background:var(--accent);
    color:#fff;font-size:24px;font-weight:800;cursor:pointer;margin-top:8px}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <h1>相遇 · 相向而行</h1>
      <span class="sub">同时出发 · 面对面走</span>
      <div id="steps" class="steps">
        <span class="step">1</span><span class="step">2</span><span class="step">3</span><span class="step">4</span><span class="step">★</span>
      </div>
    </header>

    <main class="stage">
      <svg id="road" viewBox="0 0 640 230" role="img" aria-label="一条小路，小兔在左端、小熊在右端，面对面相向而行">
        <rect x="0" y="150" width="640" height="80" fill="#e7f3e3"/>
        <rect x="50" y="156" width="540" height="22" rx="4" fill="#f2e2c0" stroke="#e2cc9c"/>
        <g id="ticks"></g>
        <g id="segWrap" opacity="0">
          <line x1="50" y1="66" x2="590" y2="66" stroke="#d7e0ee" stroke-width="3"/>
          <rect id="segR" x="50" y="48" width="0" height="14" rx="4" fill="#f59e0b"/>
          <text id="segRT" x="50" y="40" font-size="15" font-weight="800" fill="#a16207" text-anchor="middle"></text>
          <rect id="segB" x="590" y="48" width="0" height="14" rx="4" fill="#14b8a6"/>
          <text id="segBT" x="590" y="40" font-size="15" font-weight="800" fill="#0f766e" text-anchor="middle"></text>
        </g>
        <g id="flag" opacity="0">
          <line x1="0" y1="156" x2="0" y2="116" stroke="#2f6fbf" stroke-width="3"/>
          <path d="M0 116 L21 124 L0 132 Z" fill="#2f6fbf"/>
          <circle id="ring" cx="0" cy="167" r="21" fill="none" stroke="#2f6fbf" stroke-width="3.5" opacity="0"/>
        </g>
        <g id="charR">
          <g fill="none" stroke="#b7791f" stroke-width="3" stroke-linecap="round">
            <path d="M-4 -8 V0 M4 -8 V0"/>
          </g>
          <ellipse cx="0" cy="-16" rx="12" ry="15" fill="#fde9d2" stroke="#e0b96a" stroke-width="2"/>
          <ellipse cx="3" cy="-12" rx="6" ry="7" fill="#fffaf0"/>
          <circle cx="2" cy="-34" r="12" fill="#fde9d2" stroke="#e0b96a" stroke-width="2"/>
          <ellipse cx="-4" cy="-47" rx="3" ry="9" fill="#fde9d2" stroke="#e0b96a" stroke-width="2"/>
          <ellipse cx="6" cy="-48" rx="3" ry="10" fill="#fde9d2" stroke="#e0b96a" stroke-width="2"/>
          <ellipse cx="-4" cy="-47" rx="1.6" ry="6" fill="#f6b26b"/>
          <ellipse cx="6" cy="-48" rx="1.6" ry="7" fill="#f6b26b"/>
          <circle cx="8" cy="-36" r="1.9" fill="#1e3a5f"/>
          <circle cx="11" cy="-33" r="1.9" fill="#1e3a5f"/>
          <circle cx="13.5" cy="-30" r="1.6" fill="#f6b26b"/>
          <path d="M-5 -20 Q2 -15 9 -20" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="-11" cy="-12" r="3.5" fill="#fff" stroke="#e0b96a" stroke-width="1.5"/>
        </g>
        <g id="charB">
          <g fill="none" stroke="#8a6a45" stroke-width="3" stroke-linecap="round">
            <path d="M-4 -8 V0 M4 -8 V0"/>
          </g>
          <ellipse cx="0" cy="-16" rx="12" ry="15" fill="#d9b48f" stroke="#b08968" stroke-width="2"/>
          <ellipse cx="-3" cy="-12" rx="6" ry="7" fill="#c7efe6"/>
          <circle cx="-2" cy="-34" r="12" fill="#d9b48f" stroke="#b08968" stroke-width="2"/>
          <circle cx="-11" cy="-42" r="4.5" fill="#d9b48f" stroke="#b08968" stroke-width="2"/>
          <circle cx="6" cy="-42" r="4.5" fill="#d9b48f" stroke="#b08968" stroke-width="2"/>
          <circle cx="-11" cy="-42" r="2.2" fill="#c7a07a"/>
          <circle cx="6" cy="-42" r="2.2" fill="#c7a07a"/>
          <circle cx="-8" cy="-36" r="1.9" fill="#1e3a5f"/>
          <circle cx="-11" cy="-33" r="1.9" fill="#1e3a5f"/>
          <circle cx="-13.5" cy="-30" r="1.6" fill="#8a5a3b"/>
          <path d="M-5 -20 Q2 -15 9 -20" fill="none" stroke="#14b8a6" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="11" cy="-12" r="3.5" fill="#c9a27e" stroke="#b08968" stroke-width="1.5"/>
        </g>
      </svg>
    </main>

    <section class="panel">
      <div id="speeds" class="speeds"></div>
      <div class="midrow"><button id="go" class="go">出发！</button></div>
      <div id="qwrap" class="qwrap" style="display:none"></div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <footer>
      <span id="stepName">第 1 关 · 走走看</span>
      <button id="next" disabled>下一关</button>
    </footer>
  </div>

  <div class="celebrate" id="celebrate" hidden>
    <svg viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="金星与圆环">
      <circle cx="60" cy="60" r="49" fill="none" stroke="#2f6fbf" stroke-width="4"/>
      <path d="M60 22 L69 47 L96 47 L74 62 L81 88 L60 73 L39 88 L46 62 L24 47 L51 47 Z" fill="#f59e0b"/>
      <circle cx="60" cy="60" r="32" fill="none" stroke="#f59e0b" stroke-width="3"/>
    </svg>
    <h2>你懂啦！</h2>
    <p>同时出发，走的时间一样长：<br>走得快的，走的路更长；<br>相遇点，离走得慢的那边更近。</p>
    <p class="tip">家长这样说：时间一样长，走得快的走得远，<br>所以碰上的地方更靠近走得慢的那一头。</p>
    <button id="again">再玩一次</button>
  </div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const VX0=50, VX1=590, GY=178;
  const SPEED_LABEL={1:'慢·1格',2:'中·2格',3:'快·3格'};
  const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SVGNS='http://www.w3.org/2000/svg';
  const LEVELS=[
    {name:'走走看',L:10,sp:{r:2,b:2},q:{type:'where',before:false,ans:'mid',opts:[['left','靠小兔那边'],['mid','正中间'],['right','靠小熊那边']]}},
    {name:'谁走得远',L:10,sp:{r:3,b:1},q:{type:'who',before:false,ans:'rabbit',opts:[['rabbit','小兔'],['bear','小熊'],['same','一样远']]}},
    {name:'猜猜哪碰',L:12,sp:{r:2,b:1},q:{type:'where',before:true,ans:'right',opts:[['left','靠小兔那边'],['mid','正中间'],['right','靠小熊那边']]}},
    {name:'新路再猜',L:16,sp:{r:1,b:3},q:{type:'where',before:true,ans:'left',opts:[['left','靠小兔那边'],['mid','正中间'],['right','靠小熊那边']]}}
  ];
  let cur, levelIdx=-1, running=false, answered=false;

  const charR=$('charR'), charB=$('charB');
  const segR=$('segR'), segB=$('segB'), segRT=$('segRT'), segBT=$('segBT');
  const segWrap=$('segWrap'), flag=$('flag'), ring=$('ring'), ticksG=$('ticks');
  const speeds=$('speeds'), qwrap=$('qwrap'), statusEl=$('status');
  const goBtn=$('go'), nextBtn=$('next'), stepsEl=$('steps'), stepName=$('stepName');

  function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
  function fmt(n){return Math.round(n*10)/10;}
  function pxW(){return VX1-VX0;}

  function setChar(c,x){ c.style.transform='translate('+x+'px,'+GY+'px)'; }
  function resetChars(){ setChar(charR,VX0); setChar(charB,VX1); }

  async function walkChar(c,from,to,step){
    let x=from; const dir=Math.sign(to-from);
    c.style.transition='transform .3s cubic-bezier(.25,1,.5,1)';
    while(Math.abs(to-x)>0.01){
      const nx=Math.abs(to-x)<=step?to:x+dir*step;
      c.style.transform='translate('+nx+'px,'+GY+'px)';
      x=nx; await sleep(330);
    }
  }

  function showSegments(){
    const w=pxW(), rPx=w*cur.rCells/cur.L, bPx=w*cur.bCells/cur.L;
    segR.setAttribute('width',rPx);
    segB.setAttribute('x',VX1-bPx); segB.setAttribute('width',bPx);
    segRT.textContent='小兔 '+fmt(cur.rCells)+' 格';
    segBT.textContent='小熊 '+fmt(cur.bCells)+' 格';
    segRT.setAttribute('x',VX0+rPx/2);
    segBT.setAttribute('x',VX1-bPx/2);
    segWrap.setAttribute('opacity',1);
  }
  function hideSegments(){ segWrap.setAttribute('opacity',0); }
  function clearFlag(){ flag.setAttribute('opacity',0); ring.setAttribute('opacity',0); }
  function placeFlag(x,ringOn){ flag.style.transform='translate('+x+'px,0)'; flag.setAttribute('opacity',1); ring.setAttribute('opacity',ringOn?1:0); }

  function buildTicks(){
    ticksG.innerHTML='';
    const step= cur.L>=14?4:2;
    const w=pxW();
    for(let c=0;c<=cur.L;c+=step){
      const x=VX0+w*c/cur.L;
      const t=document.createElementNS(SVGNS,'line');
      t.setAttribute('x1',x);t.setAttribute('y1',156);t.setAttribute('x2',x);t.setAttribute('y2',178);
      t.setAttribute('stroke','#d9c08f');t.setAttribute('stroke-width',2);
      ticksG.appendChild(t);
      const lb=document.createElementNS(SVGNS,'text');
      lb.setAttribute('x',x);lb.setAttribute('y',198);lb.setAttribute('text-anchor','middle');
      lb.setAttribute('font-size',13);lb.setAttribute('fill','#8aa0bd');lb.setAttribute('font-weight',700);
      lb.textContent=c; ticksG.appendChild(lb);
    }
  }

  function sGroup(name,key,val,editable){
    const g=document.createElement('div'); g.className='sgroup';
    const who=document.createElement('span'); who.className='who'; who.textContent=name+'：';
    g.appendChild(who);
    const chips=document.createElement('div'); chips.className='chips';
    [1,2,3].forEach(v=>{
      const c=document.createElement('button'); c.className='chip'; c.textContent=SPEED_LABEL[v];
      if(v===val) c.classList.add(key==='r'?'sel-r':'sel-b');
      if(editable){
        c.addEventListener('click',function(){
          cur.sp[key]=v;
          chips.querySelectorAll('.chip').forEach(function(x){x.classList.remove('sel-r','sel-b');});
          c.classList.add(key==='r'?'sel-r':'sel-b');
          resetChars(); hideSegments(); clearFlag();
          statusEl.textContent='调好了速度，按「出发」，看看它俩会在哪儿碰！';
        });
      } else { c.disabled=true; }
      chips.appendChild(c);
    });
    g.appendChild(chips);
    return g;
  }

  function qtitleText(){
    if(cur.q.type==='who') return '它俩同时出发、面对面走，谁走的路更长？';
    return cur.q.before ? '猜一猜：它俩会在哪儿碰到？' : '它俩在哪儿碰到？';
  }

  function wrongText(id){
    const eq=Math.abs(cur.sp.r-cur.sp.b)<0.01;
    if(cur.q.type==='who'){
      if(id==='bear') return '再想想：它俩同时出发，走的时间一样长。小兔步子更大，走的路更长呀。';
      return '它们走的时间一样长，可速度不一样：小兔快，所以小兔走得更远。';
    }
    if(eq) return '它俩速度一样，步子一样大，正好在正中间碰到。';
    return cur.sp.r>cur.sp.b
      ? '小兔快，它走的路更长，所以碰到的地方更靠近小熊出发的那边。'
      : '小熊快，它走的路更长，所以碰到的地方更靠近小兔出发的那边。';
  }

  function conclusion(){
    const rf=fmt(cur.rCells), bf=fmt(cur.bCells);
    const equal=Math.abs(cur.rCells-cur.bCells)<0.01;
    const meetLabel= equal?'正中间':(cur.rCells>cur.bCells?'靠小熊那边':'靠小兔那边');
    return '小兔走 '+rf+' 格，小熊走 '+bf+' 格 → 在'+meetLabel+'碰到啦！';
  }

  function buildPanel(){
    speeds.innerHTML=''; qwrap.innerHTML='';
    speeds.appendChild(sGroup('小兔','r',cur.sp.r,false));
    speeds.appendChild(sGroup('小熊','b',cur.sp.b,false));
    const t=document.createElement('div'); t.className='qtitle'; t.textContent=qtitleText();
    qwrap.appendChild(t);
    const row=document.createElement('div'); row.className='qrow';
    cur.q.opts.forEach(function(pair){
      const b=document.createElement('button'); b.className='opt'; b.textContent=pair[1]; b.dataset.id=pair[0];
      b.addEventListener('click',function(){ onAnswer(pair[0],b); });
      row.appendChild(b);
    });
    qwrap.appendChild(row);
    qwrap.style.display= cur.q.before ? 'flex' : 'none';
  }

  function enableFreePlay(){
    speeds.innerHTML='';
    speeds.appendChild(sGroup('小兔','r',cur.sp.r,true));
    speeds.appendChild(sGroup('小熊','b',cur.sp.b,true));
    statusEl.textContent='答对啦！现在可以随便调速度，再按「出发」试试！';
  }

  function onAnswer(id,btn){
    if(answered) return;
    const ok=id===cur.q.ans;
    if(ok){
      answered=true;
      qwrap.querySelectorAll('.opt').forEach(function(o){o.disabled=true;});
      btn.classList.add('right');
      if(cur.q.before){
        goBtn.disabled=false;
        statusEl.textContent='猜对啦！按「出发」去验证一下！';
      }else{
        ring.setAttribute('opacity',1);
        statusEl.textContent='对！'+conclusion();
        nextBtn.disabled=false;
        if(levelIdx===0) enableFreePlay();
      }
    }else{
      btn.classList.add('wrong','shake');
      setTimeout(function(){ btn.classList.remove('wrong','shake'); },380);
      statusEl.textContent=wrongText(id);
    }
  }

  function updateSteps(){
    const pills=stepsEl.children;
    for(let k=0;k<4;k++){
      pills[k].classList.toggle('on',k===levelIdx);
      pills[k].classList.toggle('done',k<levelIdx);
    }
    pills[4].classList.toggle('done',levelIdx===3);
  }

  function loadLevel(i){
    levelIdx=i; cur=LEVELS[i]; running=false; answered=false;
    cur.rCells=cur.L*cur.sp.r/(cur.sp.r+cur.sp.b);
    cur.bCells=cur.L-cur.rCells;
    buildTicks(); buildPanel();
    resetChars(); hideSegments(); clearFlag();
    statusEl.textContent = cur.q.before
      ? '猜一猜：它俩会在哪儿碰到？'
      : '按「出发」，先看它俩走起来！';
    goBtn.disabled = cur.q.before;
    nextBtn.disabled=true;
    nextBtn.textContent = levelIdx===3 ? '完成' : '下一关';
    stepName.textContent = '第 '+(levelIdx+1)+' 关 · '+cur.name;
    updateSteps();
  }

  goBtn.addEventListener('click', async function(){
    if(running||goBtn.disabled) return;
    running=true; goBtn.disabled=true; nextBtn.disabled=true;
    statusEl.textContent='出发！面对面走起来……';
    resetChars(); hideSegments(); clearFlag();
    const w=pxW(), px=w/cur.L, stepR=cur.sp.r*px, stepB=cur.sp.b*px, meetX=VX0+cur.rCells*px;
    if(REDUCED){
      setChar(charR,meetX); setChar(charB,meetX);
      await sleep(80);
    }else{
      await Promise.all([walkChar(charR,VX0,meetX,stepR), walkChar(charB,VX1,meetX,stepB)]);
    }
    showSegments(); placeFlag(meetX,false);
    if(cur.q.before){
      if(answered){ ring.setAttribute('opacity',1); statusEl.textContent='对！'+conclusion(); nextBtn.disabled=false; }
    }else{
      qwrap.style.display='flex';
      statusEl.textContent='看完了，选一选：'+conclusion();
    }
    running=false; goBtn.disabled=false;
  });

  nextBtn.addEventListener('click', function(){
    if(nextBtn.disabled) return;
    if(levelIdx===3) showCelebrate(); else loadLevel(levelIdx+1);
  });

  function showCelebrate(){
    $('app').style.display='none';
    const c=$('celebrate'); c.hidden=false;
  }
  $('again').addEventListener('click', function(){
    const c=$('celebrate'); c.hidden=true;
    $('app').style.display='flex';
    loadLevel(0);
  });

  loadLevel(0);
})();
</script>
</body>
</html>
