<style>
:root{
  --accent:#f43f5e; --ink:#1f2a44; --muted:#667085; --line:#fecdd3;
  --ease:cubic-bezier(0.25,1,0.5,1); --touch:52px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:-apple-system,"PingFang SC",system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(160deg,#fff1f2,#e0f2fe); min-height:100vh; padding:14px 12px 28px;
}
.card{
  max-width:760px; margin:0 auto; background:#fff; border:1px solid var(--line);
  border-radius:20px; box-shadow:0 12px 28px rgba(244,63,94,.12); padding:18px 16px 22px;
}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{margin:0;font-size:22px;font-weight:800}
.badge{font-size:14px;font-weight:700;color:#be123c;background:#ffe4e6;padding:5px 12px;border-radius:999px}
.mode{margin-left:auto;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.story{
  background:linear-gradient(135deg,#ffe4e6,#e0f2fe); border-left:5px solid var(--accent);
  border-radius:0 14px 14px 0; padding:12px; margin-bottom:12px; font-size:16px; line-height:1.7;
}
.stage{
  background:linear-gradient(180deg,#fff1f2,#f0f9ff); border:1px solid var(--line);
  border-radius:16px; padding:14px 12px; margin-bottom:12px; position:relative;
}
.road{
  position:relative; height:100px; margin:10px 8px 20px;
  background:repeating-linear-gradient(90deg,#e2e8f0 0 12px,#f1f5f9 12px 24px);
  border-radius:12px; border:2px solid #cbd5e1;
}
.road .line{
  position:absolute; left:8%; right:8%; top:50%; height:4px; background:#94a3b8; transform:translateY(-50%);
  border-radius:2px;
}
.road .mark{
  position:absolute; top:58%; transform:translateX(-50%);
  font-size:11px; font-weight:800; color:#64748b; white-space:nowrap;
}
.road .mark.on{color:#e11d48}
.actor{
  position:absolute; top:18px; font-size:40px; line-height:1;
  transition: left .55s var(--ease), right .55s var(--ease);
  z-index:2;
}
.actor.left{ left:8%; }
.actor.right{ right:8%; }
.meet-flag{
  position:absolute; top:8px; left:50%; transform:translateX(-50%) scale(0);
  font-size:22px; transition: transform .4s var(--ease); z-index:3;
}
.meet-flag.show{ transform:translateX(-50%) scale(1); }
.labels{
  display:flex; justify-content:space-between; font-size:13px; font-weight:700; color:var(--muted);
  padding:0 4%;
}
.dist-bar{
  height:14px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin:8px 4%;
}
.dist-bar i{
  display:block; height:100%; width:100%; background:linear-gradient(90deg,#fb7185,#38bdf8);
  transition: width .55s var(--ease); border-radius:999px;
}
.meta{text-align:center;font-size:15px;font-weight:700;margin-top:8px}
.ctrl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.row label{font-weight:700;font-size:14px;min-width:4.5em}
.step button{
  min-width:var(--touch);min-height:var(--touch);border-radius:14px;border:2px solid var(--line);
  background:#fff;font-size:22px;font-weight:800;cursor:pointer;font-family:inherit;
}
.step .v{min-width:40px;text-align:center;font-size:20px;font-weight:800;color:var(--accent)}
input[type=range]{width:min(180px,40vw)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{
  min-height:var(--touch);padding:12px 18px;border-radius:14px;border:2px solid var(--line);
  background:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
}
.btn.primary{background:linear-gradient(135deg,var(--accent),#e11d48);color:#fff;border:none}
.fb{min-height:52px;border-radius:14px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:16px;line-height:1.55;margin:10px 0}
.fb.ok{background:#ecfdf5;border-color:#6ee7b7}
.thinking{background:#fffbeb;border-radius:12px;padding:10px;font-size:15px;border:1px dashed #fcd34d}
.thinking .tag{font-weight:800;color:#b45309}
.say{margin-top:8px;font-size:15px;min-height:22px}
@media (prefers-reduced-motion:reduce){
  .actor,.dist-bar i,.meet-flag{transition:none!important}
}
body.static .actor, body.static .dist-bar i, body.static .meet-flag{transition:none!important}

<body>
<main class="card">
  <div class="top">
    <h1>小兔与小猴相遇</h1>
    <span class="badge">7–10 岁 · 相向而行</span>
    <label class="mode"><input type="checkbox" id="staticMode"> 静态</label>
  </div>
  <div class="story">
    两端相向走来。中间距离会<strong>越来越短</strong>，直到碰到。
    相遇时间 = 总距离 ÷（兔速 + 猴速）。点「走一步」看位置移动。
  </div>
  <div class="stage" role="img" aria-label="相遇路线图解">
    <div class="labels"><span>🐰 家</span><span>相遇点附近</span><span>🐵 家</span></div>
    <div class="road" id="road">
      <div class="line"></div>
      <span class="mark" id="m1" style="left:30%">1/3</span>
      <span class="mark" id="m2" style="left:50%">2/3</span>
      <span class="mark" id="m3" style="left:70%">相遇≈</span>
      <div class="meet-flag" id="flag">⭐</div>
      <div class="actor left" id="rabbit">🐰</div>
      <div class="actor right" id="monkey">🐵</div>
    </div>
    <div class="dist-bar" aria-hidden="true"><i id="gapBar"></i></div>
    <div class="meta" id="meta">剩余距离 — · 已走时间 —</div>
  </div>
  <div class="ctrl">
    <div class="row">
      <label>总距离</label>
      <div class="step">
        <button type="button" id="dMinus">−</button>
        <span class="v" id="dVal">100</span>
        <button type="button" id="dPlus">+</button>
      </div>
      <input type="range" id="dist" min="40" max="200" value="100" step="10" aria-label="距离">
      <span>米</span>
    </div>
    <div class="row">
      <label>兔速度</label>
      <div class="step">
        <button type="button" id="rvMinus">−</button>
        <span class="v" id="rvVal">20</span>
        <button type="button" id="rvPlus">+</button>
      </div>
      <input type="range" id="rv" min="5" max="50" value="20" step="5" aria-label="兔速">
      <span>米/时</span>
    </div>
    <div class="row">
      <label>猴速度</label>
      <div class="step">
        <button type="button" id="mvMinus">−</button>
        <span class="v" id="mvVal">30</span>
        <button type="button" id="mvPlus">+</button>
      </div>
      <input type="range" id="mv" min="5" max="50" value="30" step="5" aria-label="猴速">
      <span>米/时</span>
    </div>
    <div class="btn-row">
      <button type="button" class="btn primary" id="btnGo">▶ 走一步 / 重放</button>
      <button type="button" class="btn" id="btnReset">↻ 重新开始</button>
      <button type="button" class="btn" id="btnSay">🗣️ 我会说</button>
    </div>
  </div>
  <div class="fb" id="fb" aria-live="polite">调好速度和距离，点「走一步」看两人靠近，距离条变短。</div>
  <p class="thinking"><span class="tag">我怎么想：</span><span id="think">两个人一起「吃掉」中间的路，每小时吃掉 兔速+猴速。</span></p>
  <div class="say" id="say"></div>
</main>
<script>
(function(){
  let dist=100, rv=20, mv=30, t=0, playing=false;
  const $ = id => document.getElementById(id);

  function meetT(){
    const sum = rv+mv;
    if(sum<=0) return Infinity;
    return dist / sum;
  }
  function place(time){
    const T = meetT();
    const tt = Math.min(time, T);
    const leftFrac = (rv * tt) / dist;   // 0..1 from left
    const rightFrac = (mv * tt) / dist;  // 0..1 from right
    const leftPct = 8 + leftFrac * 84;
    const rightPct = 8 + rightFrac * 84;
    $('rabbit').style.left = leftPct + '%';
    $('rabbit').style.right = 'auto';
    $('monkey').style.right = rightPct + '%';
    $('monkey').style.left = 'auto';
    const remain = Math.max(0, dist - (rv+mv)*tt);
    $('gapBar').style.width = (remain/dist*100) + '%';
    $('meta').textContent = remain < 0.05
      ? '相遇！时间 ' + T.toFixed(2) + ' 小时 · 兔走 ' + (rv*T).toFixed(1) + 'm · 猴走 ' + (mv*T).toFixed(1) + 'm'
      : '剩余约 ' + remain.toFixed(1) + ' m · 已走 ' + tt.toFixed(2) + ' 小时（全程 ' + T.toFixed(2) + '）';
    $('flag').classList.toggle('show', remain < 0.05);
    if(remain < 0.05){
      $('fb').className = 'fb ok';
      $('fb').textContent = '碰上了！时间 = '+dist+' ÷ ('+rv+'+'+mv+') = '+T.toFixed(2)+' 小时。';
      $('think').textContent = '相向速度相加，共同走完总距离。';
    }
  }

  function syncLabels(){
    dist=+$('dist').value; rv=+$('rv').value; mv=+$('mv').value;
    $('dVal').textContent=dist; $('rvVal').textContent=rv; $('mvVal').textContent=mv;
    t = 0;
    // reset positions without anim jump if needed
    place(0);
    $('fb').className='fb';
    $('fb').textContent='参数已更新。点「走一步」看相遇过程。';
    $('think').textContent='每小时两人一共走近 '+(rv+mv)+' 米。';
    $('say').textContent='';
  }

  function bind(m,p,r){
    $(m).onclick=()=>{ r.value=Math.max(+r.min,+r.value-(+r.step||1)); syncLabels(); };
    $(p).onclick=()=>{ r.value=Math.min(+r.max,+r.value+(+r.step||1)); syncLabels(); };
    r.oninput=syncLabels;
  }
  bind('dMinus','dPlus',$('dist'));
  bind('rvMinus','rvPlus',$('rv'));
  bind('mvMinus','mvPlus',$('mv'));

  $('btnGo').onclick=()=>{
    const T = meetT();
    if(!isFinite(T) || rv+mv<=0){ $('fb').textContent='速度和为 0，走不到。把速度调大一点。'; return; }
    // 分 4 步：起点 → 1/3 → 2/3 → 相遇，便于课堂讲解
    const steps = [0, T/3, 2*T/3, T];
    let i = 0;
    $('fb').className='fb';
    $('fb').textContent='开始走…看距离条变短。';
    function tick(){
      place(steps[i]);
      ['m1','m2','m3'].forEach((id,j)=> { const el=$(id); if(el) el.classList.toggle('on', j===i-1 || (i===3&&j===2)); });
      if(i===1) $('fb').textContent='走了约 1/3 时间，两人靠近了。';
      if(i===2) $('fb').textContent='走了约 2/3，快碰上了。';
      if(i===3) $('fb').textContent='相遇！看 ⭐ 与距离条是否到 0。';
      i++;
      if(i < steps.length) setTimeout(tick, 520);
    }
    place(0);
    setTimeout(tick, 60);
  };
  $('btnReset').onclick=()=>{
    $('dist').value=100; $('rv').value=20; $('mv').value=30; syncLabels();
  };
  $('btnSay').onclick=()=>{
    const T=meetT();
    $('say').textContent = '我会说：距离 '+dist+' 米，速度和 '+(rv+mv)+'，相遇要 '+T.toFixed(2)+' 小时。';
  };
  $('staticMode').onchange=e=>document.body.classList.toggle('static', e.target.checked);
  syncLabels();
})();
</script><script id="aid-fit-js">/* AID_FIT_V1 */
(function(){
  var html=document.documentElement;
  function measure(){
    var card=document.querySelector("main.card, body>.card");
    if(!card) return;
    html.classList.remove("aid-compact","aid-tight");
    card.style.overflowY="hidden";
    void card.offsetHeight;
    var stage=card.querySelector(".stage,.scene,.stage-wrap,.viz");
    var stageH=stage?stage.clientHeight:999;
    if(card.scrollHeight>card.clientHeight+8 || stageH<240 || innerHeight<820) html.classList.add("aid-compact");
    void card.offsetHeight;
    stageH=stage?stage.clientHeight:999;
    if(card.scrollHeight>card.clientHeight+8 || stageH<200) html.classList.add("aid-tight");
    void card.offsetHeight;
    if(card.scrollHeight>card.clientHeight+8) card.style.overflowY="auto";
  }
  addEventListener("resize",measure);
  addEventListener("load",measure);
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",measure);
  else requestAnimationFrame(measure);
  setTimeout(measure,80);
  setTimeout(measure,400);
  var card=document.querySelector("main.card, body>.card");
  if(card && typeof MutationObserver==="function"){
    var t;
    new MutationObserver(function(){
      clearTimeout(t); t=setTimeout(measure,40);
    }).observe(card,{childList:true,subtree:true,characterData:true});
  }
})();
</script>
</body>
