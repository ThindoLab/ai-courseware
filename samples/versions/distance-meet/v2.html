<head>

<style>
:root{
  --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d;
  --card:#fff; --bg:#eef3fa; --warm:#ef8354; --line:#c9d6e8;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100dvh; overflow:hidden;}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink);}
#app{height:100dvh; display:flex; flex-direction:column; max-width:min(1240px,100%); margin:0 auto; width:100%;}
.dots{display:flex; gap:10px; justify-content:center; padding:14px 0 2px;}
.dots i{width:14px; height:14px; border-radius:50%; background:#c9d6e8; transition:background .3s;}
.dots i.on{background:var(--accent);}
.scene{display:none; flex:1; min-height:0; flex-direction:column; padding:6px clamp(14px,3vw,36px) 18px;}
.scene.active{display:flex;}
.head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
.tag{font-size:clamp(16px,2vw,20px); color:#fff; background:var(--accent); border-radius:999px; padding:4px 14px; font-weight:700;}
h1{font-size:clamp(26px,4.5vw,42px); line-height:1.15;}
.sub{font-size:clamp(20px,2.6vw,26px); line-height:1.5; margin:8px 0 4px; color:#33527a;}
.sub b{color:var(--accent);}
.stage{flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; margin:6px 0;}
.stage svg{width:100%; height:100%; max-height:100%; display:block;}
.clock{position:absolute; top:4px; right:6px; background:#fff; border:2px solid var(--line); color:var(--accent); font-weight:800; font-size:clamp(22px,3vw,30px); border-radius:14px; padding:4px 14px; z-index:2;}
.controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:8px;}
.controls.bottom{justify-content:flex-end;}
.lbl{font-size:clamp(20px,2.4vw,26px); font-weight:700; margin-right:2px;}
.btn{min-height:56px; min-width:70px; padding:10px 22px; border:0; border-radius:16px; background:var(--accent); color:#fff; font-size:clamp(20px,2.4vw,26px); font-weight:700; cursor:pointer; touch-action:manipulation; transition:transform .15s, background .2s;}
.btn:active{transform:scale(.96);}
.btn.ghost{background:#fff; color:var(--ink); border:2px solid var(--line);}
.btn.ok{background:var(--ok);}
.btn:disabled{opacity:.38; cursor:default; transform:none;}
.chip{min-height:56px; min-width:70px; padding:8px 18px; border-radius:16px; border:2px solid var(--line); background:#fff; color:var(--ink); font-size:clamp(20px,2.4vw,26px); font-weight:700; cursor:pointer; touch-action:manipulation; transition:transform .15s, border-color .2s, background .2s;}
.chip:active{transform:scale(.96);}
.chip.sel{border-color:var(--accent); background:#e3efff; color:var(--accent);}
.chip:disabled{opacity:.38; cursor:default;}
.feedback{font-size:clamp(20px,2.6vw,26px); line-height:1.5; min-height:2.4em; margin-top:10px;}
.feedback.bad{color:var(--bad);}
.feedback.ok{color:var(--ok);}
.qtext{font-size:clamp(21px,2.8vw,28px); font-weight:800; margin-top:10px;}
.gaptext{font-size:clamp(20px,2.4vw,26px); font-weight:800; color:var(--accent); margin-left:auto;}
/* overlay */
#ov{position:fixed; inset:0; background:#1e3a5f; color:#fff; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:18px; text-align:center;}
#ov h2{font-size:clamp(30px,6vw,54px); letter-spacing:.02em;}
.ov-stage{width:min(92vw,820px); height:min(46vh,320px); display:flex; align-items:center; justify-content:center;}
.ov-stage svg{width:100%; height:100%;}
.ov-text{font-size:clamp(22px,3.2vw,32px); min-height:2em; max-width:760px; line-height:1.5;}
.ov-btns{display:flex; gap:14px; margin-top:8px;}
.star{opacity:0; transition:opacity .25s;}
.star.on{opacity:1;}
.burst{transform-origin:center; animation:pop .5s cubic-bezier(.25,1,.5,1);}
@keyframes pop{0%{transform:scale(.2); opacity:.9;} 70%{transform:scale(1.15);} 100%{transform:scale(1);}}
@media (max-height:560px){.sub{display:none;} .feedback{min-height:1.6em; margin-top:4px;}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;} .star{transition:none;}}
</style>
</head>
<body>

        <g id="s1R"><rect x="0" y="0" width="44" height="24" rx="9" fill="#ef8354"/><path d="M34 0 L26 -10 L12 -10 L6 0 Z" fill="#ffe3d0"/><circle cx="12" cy="24" r="7" fill="#1e3a5f"/><circle cx="32" cy="24" r="7" fill="#1e3a5f"/></g>

  <!-- 第 2 关：猜猜几秒相遇 -->
  <section class="scene" id="s2">
    <div class="head"><span class="tag">第 2 关</span><h1>猜猜几秒相遇？</h1></div>
    <p class="sub">这条路共 <b>12 格</b>。选两车速度，再猜几秒相遇，按「出发」验证！</p>
    <div class="stage">
      <div class="clock" id="s2Clock">第 0.0 秒</div>
      <svg viewBox="0 0 800 300" role="img" aria-label="两车相向而行">
        <rect x="70" y="196" width="660" height="18" rx="9" fill="#e8eef7"/>
        <g id="s2Ticks"></g>
        <g id="s2B"><rect x="0" y="0" width="44" height="24" rx="9" fill="#2f6fbf"/><path d="M10 0 L18 -10 L32 -10 L38 0 Z" fill="#bfdbfe"/><circle cx="12" cy="24" r="7" fill="#1e3a5f"/><circle cx="32" cy="24" r="7" fill="#1e3a5f"/></g>
        <g id="s2R"><rect x="0" y="0" width="44" height="24" rx="9" fill="#ef8354"/><path d="M34 0 L26 -10 L12 -10 L6 0 Z" fill="#ffe3d0"/><circle cx="12" cy="24" r="7" fill="#1e3a5f"/><circle cx="32" cy="24" r="7" fill="#1e3a5f"/></g>
        <g id="s2Star" class="star"><g class="burst"><text x="0" y="0" text-anchor="middle" font-size="46" font-weight="900" fill="#fbbf24">嘭！</text><path d="M-30 -16 L-58 -34 M-16 -26 L-26 -52 M0 -30 L0 -60 M16 -26 L26 -52 M30 -16 L58 -34 M34 0 L66 0 M30 16 L58 34 M16 26 L26 52 M0 30 L0 60 M-16 26 L-26 52 M-30 16 L-58 34 M-34 0 L-66 0" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/></g></g>
      </svg>
    </div>
    <div class="controls">
      <span class="lbl">蓝车速度</span>
      <button class="chip spd" data-b="2">2 格</button>
      <button class="chip spd" data-b="3">3 格</button>
      <button class="chip spd" data-b="4">4 格</button>
      <span class="lbl">橙车速度</span>
      <button class="chip spd" data-r="1">1 格</button>
      <button class="chip spd" data-r="2">2 格</button>
      <button class="chip spd" data-r="3">3 格</button>
    </div>
    <div class="controls">
      <span class="lbl">猜相遇时间</span>
      <button class="chip guess" data-t="2">2 秒</button>
      <button class="chip guess" data-t="3">3 秒</button>
      <button class="chip guess" data-t="4">4 秒</button>
      <button class="chip guess" data-t="5">5 秒</button>
      <button class="btn" id="s2Go">出发！</button>
    </div>
    <div class="feedback" id="s2Fb"></div>
    <div class="controls bottom">
      <button class="btn ghost" id="s2Reset">重玩</button>
      <button class="btn" id="s2Next" hidden>下一关 ▸</button>
    </div>
  </section>

  <!-- 第 3 关：举一反三 · 火车 -->
  <section class="scene" id="s3">
    <div class="head"><span class="tag">第 3 关</span><h1>换两列火车试试</h1></div>
    <p class="sub">隧道长 <b>20 格</b>。快车每秒 <b>3 格</b>，慢车每秒 <b>2 格</b>，面对面开。猜几秒相遇？</p>
    <div class="stage">
      <div class="clock" id="s3Clock">第 0.0 秒</div>
      <svg viewBox="0 0 800 300" role="img" aria-label="两列火车相向而行">
        <rect x="70" y="196" width="660" height="18" rx="9" fill="#e8eef7"/>

        <g id="s3A"><rect x="0" y="0" width="56" height="26" rx="6" fill="#2f6fbf"/><rect x="14" y="-14" width="10" height="14" fill="#2f6fbf"/><circle cx="19" cy="-7" r="3" fill="#fbbf24"/><rect x="10" y="4" width="13" height="13" rx="3" fill="#bfdbfe"/><circle cx="12" cy="26" r="6" fill="#1e3a5f"/><circle cx="44" cy="26" r="6" fill="#1e3a5f"/></g>
        <g id="s3B"><rect x="0" y="0" width="56" height="26" rx="6" fill="#ef8354"/><rect x="32" y="-14" width="10" height="14" fill="#ef8354"/><circle cx="37" cy="-7" r="3" fill="#fbbf24"/><rect x="33" y="4" width="13" height="13" rx="3" fill="#ffe3d0"/><circle cx="12" cy="26" r="6" fill="#1e3a5f"/><circle cx="44" cy="26" r="6" fill="#1e3a5f"/></g>
        <g id="s3Star" class="star"><g class="burst"><text x="0" y="0" text-anchor="middle" font-size="46" font-weight="900" fill="#fbbf24">哐！</text><path d="M-30 -16 L-58 -34 M-16 -26 L-26 -52 M0 -30 L0 -60 M16 -26 L26 -52 M30 -16 L58 -34 M34 0 L66 0 M30 16 L58 34 M16 26 L26 52 M0 30 L0 60 M-16 26 L-26 52 M-30 16 L-58 34 M-34 0 L-66 0" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/></g></g>
      </svg>
    </div>
    <div class="controls">
      <span class="lbl">猜相遇时间</span>
      <button class="chip g3" data-t="3">3 秒</button>
      <button class="chip g3" data-t="4">4 秒</button>
      <button class="chip g3" data-t="5">5 秒</button>
      <button class="btn" id="s3Go">出发！</button>
    </div>
    <div class="feedback" id="s3Fb"></div>
    <div class="controls bottom">
      <button class="btn ghost" id="s3Reset">重玩</button>
      <button class="btn" id="s3Next" hidden>从头再玩 ↺</button>

</div>

<!-- 开场演示 -->
<div id="ov">
  <h2>两车面对面开</h2>
  <div class="ov-stage">
    <svg viewBox="0 0 800 300" role="img" aria-label="两车相向而行动画">
      <rect x="70" y="196" width="660" height="18" rx="9" fill="#e8eef7"/>
      <g id="ovTicks"></g>
      <g id="ovB"><rect x="0" y="0" width="44" height="24" rx="9" fill="#2f6fbf"/><path d="M10 0 L18 -10 L32 -10 L38 0 Z" fill="#bfdbfe"/><circle cx="12" cy="24" r="7" fill="#1e3a5f"/><circle cx="32" cy="24" r="7" fill="#1e3a5f"/></g>
      <g id="ovR"><rect x="0" y="0" width="44" height="24" rx="9" fill="#ef8354"/><path d="M34 0 L26 -10 L12 -10 L6 0 Z" fill="#ffe3d0"/><circle cx="12" cy="24" r="7" fill="#1e3a5f"/><circle cx="32" cy="24" r="7" fill="#1e3a5f"/></g>
      <g id="ovStar" class="star"><g class="burst"><text x="0" y="0" text-anchor="middle" font-size="46" font-weight="900" fill="#fbbf24">嘭！</text><path d="M-30 -16 L-58 -34 M-16 -26 L-26 -52 M0 -30 L0 -60 M16 -26 L26 -52 M30 -16 L58 -34 M34 0 L66 0 M30 16 L58 34 M16 26 L26 52 M0 30 L0 60 M-16 26 L-26 52 M-30 16 L-58 34 M-34 0 L-66 0" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/></g></g>
    </svg>
  </div>
  <p class="ov-text" id="ovText">蓝车和红车，面对面开……</p>
  <div class="ov-btns">
    <button class="btn ghost" id="ovSkip">跳过 ▸</button>
    <button class="btn" id="ovGo" disabled>开始 ›</button>
  </div>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s));};
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raf=null;
  function stopAnim(){ if(raf){cancelAnimationFrame(raf); raf=null;} }
  function runAnim(dur,onFrame,onEnd){
    stopAnim();
    var t0=performance.now();
    function frame(now){
      var t=Math.min((now-t0)/1000,dur);
      onFrame(t);
      if(t>=dur){ raf=null; if(onEnd)onEnd(); return; }
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }
  function setPos(g,x,y){ if(g) g.setAttribute('transform','translate('+x+','+y+')'); }
  function ticks(id,n,x0,x1){
    var g=$(id); if(!g) return;
    var html='', step=(x1-x0)/n, i, x;
    for(i=0;i<=n;i++){ x=x0+i*step; html+='<line x1="'+x+'" y1="198" x2="'+x+'" y2="212" stroke="#c9d6e8" stroke-width="2"/>'; }
    html+='<line x1="'+x0+'" y1="214" x2="'+x0+'" y2="172" stroke="#1e3a5f" stroke-width="3"/><path d="M'+x0+' 172 L'+(x0+16)+' 179 L'+x0+' 186 Z" fill="#fbbf24"/>';
    html+='<line x1="'+x1+'" y1="214" x2="'+x1+'" y2="172" stroke="#1e3a5f" stroke-width="3"/><path d="M'+x1+' 172 L'+(x1-16)+' 179 L'+x1+' 186 Z" fill="#fbbf24"/>';
    g.innerHTML=html;
  }
  function showStar(g,x,y){ if(!g) return; g.setAttribute('transform','translate('+x+','+y+')'); g.classList.add('on'); }
  function hideStar(g){ if(g) g.classList.remove('on'); }

  ticks('#s1Ticks',9,70,730);
  ticks('#s2Ticks',12,70,730);
  ticks('#s3Ticks',20,70,730);
  ticks('#ovTicks',9,70,730);

  var scenes=['s1','s2','s3'];
  var dots=$$('#dots i');
  function goTo(n){
    stopAnim();
    scenes.forEach(function(id,i){
      $('#'+id).classList.toggle('active', i===n);
      dots[i].classList.toggle('on', i===n);
    });
    $('#ov').style.display='none';
    if(n===1) s2Init();
    if(n===2) s3Init();
  }

  /* ---------- 开场演示 ---------- */
  var ovB=$('#ovB'), ovR=$('#ovR'), ovStar=$('#ovStar'), ovText=$('#ovText'), ovGo=$('#ovGo');
  var step9=(730-70)/9;
  setPos(ovB,70,166); setPos(ovR,730-44,166);
  function ovStart(){
    if(reduce){
      showStar(ovStar, 70+2*3*step9, 150);
      ovText.textContent='它们面对面开，速度合起来，就会相遇！';
      ovGo.disabled=false;
      return;
    }
    ovText.textContent='蓝车和橙车，面对面开……';
    runAnim(3, function(t){
      setPos(ovB, 70+2*t*step9, 166);
      setPos(ovR, 730-1*t*step9-44, 166);
    }, function(){
      showStar(ovStar, 70+2*3*step9, 150);
      ovText.textContent='嘭！3 秒后，它们相遇啦！';
      setTimeout(function(){
        ovText.textContent='面对面开 = 速度合起来 → 相遇。开始玩吧！';
        ovGo.disabled=false;
      }, 1200);
    });
  }
  ovStart();
  $('#ovSkip').addEventListener('click', function(){ goTo(0); });
  ovGo.addEventListener('click', function(){ goTo(0); });

  /* ---------- 第 1 关 ---------- */
  var s1Go=$('#s1Go'), s1Reset=$('#s1Reset'), s1Next=$('#s1Next'), s1Fb=$('#s1Fb');
  var s1B=$('#s1B'), s1R=$('#s1R'), s1Star=$('#s1Star'), s1Clock=$('#s1Clock'), s1Gap=$('#s1Gap'), s1Quiz=$('#s1Quiz');
  var step1=(730-70)/9;
  var s1n=0, s1solved=false;
  function s1ResetState(){
    stopAnim(); s1n=0; s1solved=false;
    setPos(s1B,70,166); setPos(s1R,730-44,166);
    hideStar(s1Star);
    s1Clock.textContent='第 0 秒'; s1Gap.textContent='距离：9 格';
    s1Go.disabled=false; s1Fb.textContent=''; s1Fb.className='feedback';
    s1Quiz.hidden=true; s1Next.hidden=true;
    $$('#s1Quiz .chip').forEach(function(c){c.classList.remove('sel');});
  }
  s1Reset.addEventListener('click', s1ResetState);
  s1Go.addEventListener('click', function(){
    if(s1n>=3 || s1solved) return;
    s1n++;
    setPos(s1B, 70+2*s1n*step1, 166);
    setPos(s1R, 730-1*s1n*step1-44, 166);
    var gap=9-3*s1n;
    s1Clock.textContent='第 '+s1n+' 秒';
    s1Gap.textContent='距离：'+(gap>0?gap+' 格':'0 格');
    if(s1n>=3){
      s1Go.disabled=true;
      showStar(s1Star, 70+2*3*step1, 150);
      s1Clock.textContent='相遇啦！';
      s1Quiz.hidden=false;
      s1Fb.textContent='第 3 秒，两车相遇！它们 1 秒合走 3 格。';
      s1Fb.className='feedback';
    }
  });
  $$('#s1Quiz .chip').forEach(function(c){
    c.addEventListener('click', function(){
      if(s1solved) return;
      var v=parseInt(c.dataset.v,10);
      if(v===3){
        s1solved=true;
        c.classList.add('sel');
        s1Fb.textContent='对！2 + 1 = 3 格。它们面对面，1 秒合走 3 格，距离就缩短 3 格。';
        s1Fb.className='feedback ok';
        s1Next.hidden=false;
      }else{
        s1Fb.textContent='蓝车走 2 格，橙车走 1 格，合起来是 2 + 1 = 3 格，不是 '+v+' 格。它们面对面，距离每秒缩短 3 格。';
        s1Fb.className='feedback bad';
      }
    });
  });
  s1Next.addEventListener('click', function(){ goTo(1); });

  /* ---------- 第 2 关 ---------- */
  var s2Go=$('#s2Go'), s2Reset=$('#s2Reset'), s2Next=$('#s2Next'), s2Fb=$('#s2Fb');
  var s2B=$('#s2B'), s2R=$('#s2R'), s2Star=$('#s2Star'), s2Clock=$('#s2Clock');
  var step2=(730-70)/12;
  var v1=2, v2=1, guess=null, s2running=false;
  function s2Sum(){ return v1+v2; }
  function s2Valid(){ return 12 % s2Sum() === 0; }
  function s2Meet(){ return 12/s2Sum(); }
  function s2Init(){
    stopAnim(); s2running=false; guess=null;
    setPos(s2B,70,166); setPos(s2R,730-44,166);
    hideStar(s2Star); s2Clock.textContent='第 0.0 秒';
    s2Fb.textContent=''; s2Fb.className='feedback';
    s2Next.hidden=true; s2Reset.textContent='重玩';
    $$('#s2 .chip.guess').forEach(function(c){c.classList.remove('sel');});
    s2Update();
  }
  function s2Update(){
    $$('#s2 .chip.spd[data-b]').forEach(function(c){c.classList.toggle('sel', parseInt(c.dataset.b,10)===v1);});
    $$('#s2 .chip.spd[data-r]').forEach(function(c){c.classList.toggle('sel', parseInt(c.dataset.r,10)===v2);});
    var gs=$$('#s2 .chip.guess');
    if(!s2Valid()){
      gs.forEach(function(c){c.disabled=true;});
      s2Go.disabled=true;
      s2Fb.textContent='12 ÷ '+s2Sum()+' 不是整秒，换组速度更好猜。';
      s2Fb.className='feedback bad';
    }else{
      gs.forEach(function(c){c.disabled=false;});
      s2Go.disabled=(guess===null);
      if(!s2running && s2Fb.className.indexOf('bad')>=0) s2Fb.textContent='';
    }
  }
  $$('#s2 .chip.spd').forEach(function(c){
    c.addEventListener('click', function(){
      if(s2running) return;
      if(c.dataset.b){ v1=parseInt(c.dataset.b,10); } else { v2=parseInt(c.dataset.r,10); }
      guess=null;
      setPos(s2B,70,166); setPos(s2R,730-44,166);
      hideStar(s2Star); s2Clock.textContent='第 0.0 秒';
      s2Next.hidden=true; s2Reset.textContent='重玩';
      $$('#s2 .chip.guess').forEach(function(g){g.classList.remove('sel');});
      s2Update();
      s2Fb.textContent=''; s2Fb.className='feedback';
    });
  });
  $$('#s2 .chip.guess').forEach(function(c){
    c.addEventListener('click', function(){
      if(s2running || !s2Valid()) return;
      guess=parseInt(c.dataset.t,10);
      $$('#s2 .chip.guess').forEach(function(g){g.classList.remove('sel');});
      c.classList.add('sel');
      s2Fb.textContent=''; s2Fb.className='feedback';
      s2Go.disabled=false;
    });
  });
  s2Go.addEventListener('click', function(){
    if(s2running || !s2Valid() || guess===null) return;
    s2running=true;
    s2Go.disabled=true;
    $$('#s2 .chip.guess').forEach(function(c){c.disabled=true;});
    var T=s2Meet();
    runAnim(T, function(t){
      setPos(s2B, 70+v1*t*step2, 166);
      setPos(s2R, 730-v2*t*step2-44, 166);
      s2Clock.textContent='第 '+t.toFixed(1)+' 秒';
    }, function(){
      s2running=false;
      showStar(s2Star, 70+v1*T*step2, 150);
      s2Clock.textContent='第 '+T+' 秒';
      var S=s2Sum(), gone=guess*S;
      if(guess===T){
        s2Fb.textContent='叮！第 '+T+' 秒相遇，你猜对啦！每 1 秒合走 '+S+' 格，12 ÷ '+S+' = '+T+' 秒。';
        s2Fb.className='feedback ok';
        s2Next.hidden=false;
      }else if(gone>12){
        s2Fb.textContent='你猜 '+guess+' 秒：'+guess+' 秒能合走 '+gone+' 格，早就超过 12 格啦！每 1 秒合走 '+S+' 格，12 ÷ '+S+' = '+T+' 秒，第 '+T+' 秒就相遇。';
        s2Fb.className='feedback bad';
        s2Reset.textContent='再看一次';
      }else{
        s2Fb.textContent='你猜 '+guess+' 秒：'+guess+' 秒只合走 '+gone+' 格，还差 '+(12-gone)+' 格。每 1 秒合走 '+S+' 格，12 ÷ '+S+' = '+T+' 秒，第 '+T+' 秒才相遇。';
        s2Fb.className='feedback bad';
        s2Reset.textContent='再看一次';
      }
    });
  });
  s2Reset.addEventListener('click', s2Init);
  s2Next.addEventListener('click', function(){ goTo(2); });

  /* ---------- 第 3 关（举一反三） ---------- */
  var s3Go=$('#s3Go'), s3Reset=$('#s3Reset'), s3Next=$('#s3Next'), s3Fb=$('#s3Fb');
  var s3A=$('#s3A'), s3B=$('#s3B'), s3Star=$('#s3Star'), s3Clock=$('#s3Clock');
  var step3=(730-70)/20;
  var s3guess=null, s3running=false;
  function s3Init(){
    stopAnim(); s3running=false; s3guess=null;
    setPos(s3A,70,166); setPos(s3B,730-56,166);
    hideStar(s3Star); s3Clock.textContent='第 0.0 秒';
    s3Fb.textContent=''; s3Fb.className='feedback';
    s3Next.hidden=true; s3Reset.textContent='重玩';
    $$('#s3 .chip.g3').forEach(function(c){c.classList.remove('sel');});
    s3Go.disabled=true;
  }
  $$('#s3 .chip.g3').forEach(function(c){
    c.addEventListener('click', function(){
      if(s3running) return;
      s3guess=parseInt(c.dataset.t,10);
      $$('#s3 .chip.g3').forEach(function(g){g.classList.remove('sel');});
      c.classList.add('sel');
      s3Fb.textContent=''; s3Fb.className='feedback';
      s3Go.disabled=false;
    });
  });
  s3Go.addEventListener('click', function(){
    if(s3running || s3guess===null) return;
    s3running=true;
    s3Go.disabled=true;
    $$('#s3 .chip.g3').forEach(function(c){c.disabled=true;});
    runAnim(4, function(t){
      setPos(s3A, 70+3*t*step3, 166);
      setPos(s3B, 730-2*t*step3-56, 166);
      s3Clock.textContent='第 '+t.toFixed(1)+' 秒';
    }, function(){
      s3running=false;
      showStar(s3Star, 70+3*4*step3, 150);
      s3Clock.textContent='第 4 秒';
      if(s3guess===4){
        s3Fb.textContent='哐！第 4 秒相遇，你猜对啦！每 1 秒合走 3+2=5 格，20 ÷ 5 = 4 秒。';
        s3Fb.className='feedback ok';
      }else if(s3guess===3){
        s3Fb.textContent='你猜 3 秒：3 秒只合走 3×5=15 格，还差 5 格。每 1 秒合走 5 格，20 ÷ 5 = 4 秒，第 4 秒才相遇。';
        s3Fb.className='feedback bad';
        s3Reset.textContent='再看一次';
      }else{
        s3Fb.textContent='你猜 5 秒：5 秒能合走 25 格，早就超过 20 格啦！每 1 秒合走 5 格，20 ÷ 5 = 4 秒，第 4 秒相遇。';
        s3Fb.className='feedback bad';
        s3Reset.textContent='再看一次';
      }
      s3Fb.textContent += ' 记住：相向而行，速度加起来！路程 ÷ 速度和 = 相遇时间。';
      s3Next.hidden=false;
    });
  });
  s3Reset.addEventListener('click', s3Init);
  s3Next.addEventListener('click', function(){
    s1ResetState(); s2Init(); s3Init();
    goTo(0);
  });

  /* 初始状态 */
  s1ResetState();
  s2Init();
  s3Init();
})();
</script>
</body>
</html>
