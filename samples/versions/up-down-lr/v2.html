<!doctype html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08-40-46">
<meta name="aid-version-note" content="系统重跑 2026-08-14T08-40-46">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上下左右 · 小火车去旅行</title>
<!-- param-visual · 方位认知 / 3-6岁 · 学前 -->
<style>
:root{
  --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d;
  --card:#fff; --line:#dbe7f5; --soft:#f4f8fd;
  --ease:cubic-bezier(.25,1,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  height:100dvh;display:flex;flex-direction:column;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(170deg,#eaf3ff 0%,#fdf6e8 100%);
  padding:clamp(8px,1.4vh,16px);
}
.card{
  flex:1;min-height:0;width:100%;max-width:min(1240px,100%);margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  display:flex;flex-direction:column;overflow:hidden;
  padding:clamp(10px,1.6vh,18px) clamp(12px,2vw,26px);
}
.top{flex:none;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(26px,3.2vw,34px);font-weight:800}
.badge{font-size:20px;font-weight:700;color:#fff;background:var(--accent);padding:4px 14px;border-radius:999px}
.prog{font-size:20px;font-weight:700;color:#5b6b83;margin-left:auto}
.story{flex:none;margin:10px 0 6px;font-size:clamp(24px,2.6vw,30px);font-weight:700;line-height:1.4;min-height:1.4em}
.story b{color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage svg{width:100%;height:100%;max-height:100%}
.dirs{flex:none;display:flex;gap:10px;justify-content:center;margin:6px 0}
.dir{
  flex:1;max-width:170px;min-width:72px;min-height:64px;font-size:24px;font-weight:800;
  border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);
  cursor:pointer;font-family:inherit;transition:transform .2s var(--ease),background .3s;
}
.dir:active{transform:scale(.96)}
.dir:disabled{opacity:.38;cursor:default}
.dir.ok{border-color:var(--ok);background:#ecfdf5}
.dir.bad{border-color:var(--bad);background:#fef2f2;animation:shake .5s}
.fb{
  flex:none;min-height:60px;border-radius:14px;padding:10px 14px;
  background:var(--soft);border:1px solid var(--line);
  font-size:24px;line-height:1.5;display:flex;align-items:center;
}
.fb.good{background:#ecfdf5;border-color:var(--ok)}
.fb.bad{background:#fef2f2;border-color:var(--bad)}
.hit{cursor:pointer}
.hit.shake{animation:shake .5s}
.hit.inactive{opacity:.32;pointer-events:none}
.hidden{display:none}
.move{transition:transform .55s var(--ease)}
.star{transform-box:fill-box;transform-origin:center}
.star.pop{animation:pop .55s var(--ease)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

/* 开场 overlay */
.overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(30,58,95,.45);backdrop-filter:blur(3px);
}
.ov-card{
  width:min(560px,92vw);max-height:94dvh;overflow:auto;
  background:#fff;border-radius:20px;padding:22px 22px 18px;text-align:center;
  box-shadow:0 20px 50px rgba(30,58,95,.3);
}
.ov-card h2{margin:0 0 6px;font-size:clamp(26px,4vw,34px);font-weight:800}
.ov-stage{width:min(420px,90%);margin:0 auto}
.ov-stage svg{width:100%;height:auto}
.ov-tip{font-size:24px;line-height:1.55;margin:10px 0 6px;color:#33486b}
.ov-done{font-size:26px;font-weight:800;color:var(--ok);min-height:1.6em}
.ov-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{
  min-height:64px;min-width:140px;padding:12px 22px;border-radius:16px;
  font-size:24px;font-weight:800;cursor:pointer;font-family:inherit;
  border:2px solid var(--line);background:#fff;color:var(--ink);
}
.btn.big{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{background:#fff}
.ov-ask{font-size:28px;font-weight:800;fill:var(--accent)}
.ov-train{transition:transform .6s var(--ease)}
.ov-star{animation:pop .55s var(--ease);transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-height:620px){
  .prog{display:none}
  .story{margin:6px 0 2px}
  .fb{min-height:48px;padding:6px 10px;font-size:22px}
}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <h1>上下左右</h1>
    <span class="badge">3–6 岁 · 方位</span>
    <span class="prog" id="prog">第 1 关 · 1/3</span>
  </div>
  <p class="story" id="story">🚂 司机说：把火车开到 <b>上面</b>！</p>
  <div class="stage" id="stage">
    <svg viewBox="0 0 400 400" role="img" aria-label="方位场">
      <rect x="2" y="2" width="396" height="396" rx="22" fill="#f8fafc" stroke="#e2ecf8"/>
      <!-- 轨道十字 -->
      <g stroke="#cbd8ea" stroke-width="5" stroke-dasharray="7 7" stroke-linecap="round">
        <line x1="200" y1="200" x2="200" y2="58"/>
        <line x1="200" y1="200" x2="200" y2="342"/>
        <line x1="200" y1="200" x2="58" y2="200"/>
        <line x1="200" y1="200" x2="342" y2="200"/>
      </g>
      <!-- 中心站台 -->
      <circle cx="200" cy="200" r="30" fill="#fff" stroke="#bfdbfe" stroke-width="3"/>

      <!-- ===== 目标物 A 套：树 / 河 / 蘑菇 / 花 ===== -->
      <g id="setA">
        <g id="t_up">
          <rect x="190" y="80" width="20" height="36" rx="6" fill="#8b5e3c"/>
          <circle cx="200" cy="64" r="28" fill="#4caf6d"/>
          <circle cx="188" cy="72" r="16" fill="#5cc47f"/>
          <circle cx="212" cy="72" r="15" fill="#5cc47f"/>
        </g>
        <g id="t_down">
          <rect x="138" y="322" width="124" height="22" rx="11" fill="#5ac8fa"/>
          <path d="M152 333 q8 -7 16 0 t16 0 t16 0 t16 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M232 333 q8 -7 16 0 t16 0 t16 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
        </g>
        <g id="t_left">
          <rect x="80" y="198" width="20" height="28" rx="6" fill="#f1f0ea"/>
          <path d="M90 200 a26 26 0 0 1 0 -44 z" fill="#e85d5d"/>
          <circle cx="78" cy="180" r="4" fill="#fff"/>
          <circle cx="97" cy="172" r="4" fill="#fff"/>
        </g>
        <g id="t_right">
          <circle cx="322" cy="186" r="9" fill="#ffc93c"/>
          <circle cx="306" cy="178" r="9" fill="#ffd97a"/>
          <circle cx="338" cy="178" r="9" fill="#ffd97a"/>
          <circle cx="306" cy="198" r="9" fill="#ffd97a"/>
          <circle cx="338" cy="198" r="9" fill="#ffd97a"/>
          <circle cx="322" cy="200" r="10" fill="#f59e0b"/>
        </g>
      </g>
      <!-- ===== 目标物 B 套：蝴蝶 / 鱼 / 骨头 / 毛线球（举一反三） ===== -->
      <g id="setB" class="hidden">
        <text x="200" y="84" text-anchor="middle" font-size="46">🦋</text>
        <text x="200" y="352" text-anchor="middle" font-size="46">🐟</text>
        <text x="62" y="226" text-anchor="middle" font-size="46">🦴</text>
        <text x="338" y="226" text-anchor="middle" font-size="46">🧶</text>
      </g>

      <!-- 可点命中区（每个目标一个，r=56 保证触控） -->
      <g id="hits">
        <circle class="hit" data-d="up"    cx="200" cy="62"  r="56" fill="transparent"/>
        <circle class="hit" data-d="down"  cx="200" cy="338" r="56" fill="transparent"/>
        <circle class="hit" data-d="left"  cx="62"  cy="200" r="56" fill="transparent"/>
        <circle class="hit" data-d="right" cx="338" cy="200" r="56" fill="transparent"/>
      </g>

      <!-- 星星（相对方位关用） -->
      <text id="star" class="hidden star" font-size="42" text-anchor="middle">⭐</text>

      <!-- ===== 小火车（豆人司机） ===== -->
      <g id="train" class="move">
        <circle cx="248" cy="166" r="6" fill="#b7c4d8" opacity=".85"/>
        <rect x="158" y="180" width="84" height="34" rx="14" fill="#2f6fbf"/>
        <rect x="170" y="186" width="30" height="12" rx="6" fill="#7fb3e8"/>
        <circle cx="178" cy="218" r="8" fill="#172a46"/>
        <circle cx="224" cy="218" r="8" fill="#172a46"/>
        <circle cx="206" cy="168" r="14" fill="#f6b93b"/>
        <circle cx="201" cy="165" r="3" fill="#fff"/>
        <circle cx="212" cy="165" r="3" fill="#fff"/>
        <circle cx="206" cy="174" r="2.5" fill="#172a46"/>
      </g>

      <!-- ===== 小猫（举一反三关） ===== -->
      <g id="cat" class="move hidden">
        <path d="M184 168 L176 144 L196 160 Z" fill="#f59e0b"/>
        <path d="M216 168 L224 144 L204 160 Z" fill="#f59e0b"/>
        <circle cx="200" cy="184" r="26" fill="#f59e0b"/>
        <circle cx="191" cy="180" r="3.5" fill="#fff"/>
        <circle cx="209" cy="180" r="3.5" fill="#fff"/>
        <circle cx="191" cy="181" r="1.8" fill="#172a46"/>
        <circle cx="209" cy="181" r="1.8" fill="#172a46"/>
        <path d="M176 190 q-5 6 0 10 M224 190 q5 6 0 10" stroke="#172a46" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M228 210 q14 2 14 14 q-12 0 -14 -8" stroke="#f59e0b" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <div class="dirs" id="dirs">
    <button type="button" class="dir" data-d="up">⬆ 上</button>
    <button type="button" class="dir" data-d="down">⬇ 下</button>
    <button type="button" class="dir" data-d="left">⬅ 左</button>
    <button type="button" class="dir" data-d="right">➡ 右</button>
  </div>
  <div class="fb" id="fb" aria-live="polite">听司机的话，点正确的方向，火车就会开过去！</div>
</main>

<!-- 开场演示 -->
<div class="overlay" id="overlay">
  <div class="ov-card">
    <h2>小火车要去哪？</h2>
    <div class="ov-stage">
      <svg viewBox="0 0 400 280" role="img" aria-label="演示">
        <rect x="2" y="2" width="396" height="276" rx="20" fill="#f8fafc" stroke="#e2ecf8"/>
        <line x1="200" y1="150" x2="200" y2="40" stroke="#cbd8ea" stroke-width="5" stroke-dasharray="7 7" stroke-linecap="round"/>
        <circle cx="200" cy="60" r="26" fill="#4caf6d"/>
        <rect x="192" y="84" width="16" height="26" rx="5" fill="#8b5e3c"/>
        <g class="ov-train" id="ovTrain">
          <rect x="158" y="136" width="84" height="30" rx="13" fill="#2f6fbf"/>
          <circle cx="178" cy="170" r="7" fill="#172a46"/>
          <circle cx="224" cy="170" r="7" fill="#172a46"/>
          <circle cx="206" cy="126" r="13" fill="#f6b93b"/>
          <circle cx="201" cy="123" r="2.6" fill="#fff"/>
          <circle cx="212" cy="123" r="2.6" fill="#fff"/>
        </g>
        <text id="ovStar" class="hidden ov-star" x="200" y="120" text-anchor="middle" font-size="36">⭐</text>
        <text id="ovAsk" class="ov-ask" x="200" y="240" text-anchor="middle">司机说：开到「上面」⬆</text>
      </svg>
    </div>
    <p class="ov-tip">听司机的话，点正确的方向，火车就会开过去！</p>
    <div class="ov-done" id="ovDone"></div>
    <div class="ov-btns">
      <button type="button" class="btn big" id="btnStart">开始玩 ▶</button>
      <button type="button" class="btn ghost" id="btnSkip">跳过演示</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DIRS={
    up:  {label:'上', arrow:'⬆'},
    down:{label:'下', arrow:'⬇'},
    left:{label:'左', arrow:'⬅'},
    right:{label:'右', arrow:'➡'}
  };
  var MOVE={up:'0,-92',down:'0,92',left:'-92,0',right:'92,0'};
  var STAR_POS={up:[200,128],down:[200,272],left:[128,200],right:[272,200]};
  var HINT={
    up:  '上 = 往头顶看，图的上面那一格。',
    down:'下 = 往脚底看，图的下面那一格。',
    left:'左 = 你左手那边（屏幕左边）。',
    right:'右 = 你右手那边（屏幕右边）。'
  };

  var LEVELS=[
    {name:'认识上下', dirs:['up','down'], qn:3, mode:'go',  theme:null,
     intro:'先学「上」和「下」！'},
    {name:'认识左右', dirs:['left','right'], qn:3, mode:'go', theme:null,
     intro:'左和右，像你的两只小手！'},
    {name:'四方都会', dirs:['up','down','left','right'], qn:3, mode:'go', theme:null,
     intro:'上、下、左、右，全都会啦！'},
    {name:'星星在哪边', dirs:['up','down','left','right'], qn:3, mode:'rel', theme:'star',
     intro:'⭐ 星星藏起来啦，它在火车的哪边？'},
    {name:'小猫找吃的', dirs:['up','down','left','right'], qn:2, mode:'rel', theme:'cat',
     objs:{up:'蝴蝶', down:'小鱼', left:'骨头', right:'毛线球'},
     intro:'小猫饿了，帮它找到吃的！'}
  ];

  var state={li:0,qi:0,locked:false,order:[]};
  var train=$('train'), cat=$('cat'), star=$('star');
  var fb=$('fb'), prog=$('prog'), story=$('story');

  function shuffle(a){
    a=a.slice();
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i];a[i]=a[j];a[j]=t;
    }
    return a;
  }
  function q(){ return state.order[state.qi]; }
  function setTheme(theme){
    $('setA').classList.toggle('hidden',theme==='cat');
    $('setB').classList.toggle('hidden',theme!=='cat');
    train.classList.toggle('hidden',theme==='cat');
    cat.classList.toggle('hidden',theme!=='cat');
  }
  function enableDirs(dirs){
    var btns=document.querySelectorAll('.dir');
    var hits=document.querySelectorAll('.hit');
    for(var i=0;i<btns.length;i++){
      btns[i].disabled=dirs.indexOf(btns[i].dataset.d)===-1;
    }
    for(var j=0;j<hits.length;j++){
      hits[j].classList.toggle('inactive',dirs.indexOf(hits[j].dataset.d)===-1);
    }
  }
  function resetDirState(){
    document.querySelectorAll('.dir').forEach(function(b){b.classList.remove('ok','bad');});
    document.querySelectorAll('.hit').forEach(function(h){h.classList.remove('shake');});
  }
  function placeStar(){
    if(q().mode!=='rel'||q().theme!=='star'){ star.classList.add('hidden'); return; }
    star.setAttribute('x',STAR_POS[q().ans][0]);
    star.setAttribute('y',STAR_POS[q().ans][1]);
    star.classList.remove('hidden');
    star.classList.remove('pop');
    void star.getBoundingClientRect();
    star.classList.add('pop');
  }
  function say(text,kind){
    fb.textContent=text;
    fb.classList.remove('good','bad');
    if(kind) fb.classList.add(kind);
  }
  function loadLevel(){
    var lv=LEVELS[state.li];
    setTheme(lv.theme);
    state.order=shuffle(lv.dirs).slice(0,lv.qn).map(function(d){
      return lv.objs ? {ans:d, obj:lv.objs[d]} : {ans:d, obj:null};
    });
    state.qi=0;
    prog.textContent='第 '+(state.li+1)+' / '+LEVELS.length+' 关 · 1/'+lv.qn;
    if(lv.theme==='cat'){
      story.innerHTML='🐱 小猫说：帮我找 <b>吃的</b>！';
    }else{
      story.innerHTML='🚂 司机说：把火车开到 <b>上面</b>！';
    }
    say(lv.intro,'');
    enableDirs(lv.dirs);
    resetDirState();
  }
  function loadQuestion(){
    var lv=LEVELS[state.li], cur=q();
    prog.textContent='第 '+(state.li+1)+' / '+LEVELS.length+' 关 · '+(state.qi+1)+'/'+lv.qn;
    resetDirState();
    placeStar();
    // 角色回中心
    train.style.transform='translate(0,0)';
    cat.style.transform='translate(0,0)';
    if(lv.mode==='go'){
      story.innerHTML='🚂 司机说：把火车开到 <b>'+DIRS[cur.ans].label+'</b>！'+DIRS[cur.ans].arrow;
      say('火车要开向「'+DIRS[cur.ans].label+'」，点它！','');
    }else if(lv.theme==='cat'){
      story.innerHTML='🐱 小猫饿了！<b>'+cur.obj+'</b>在哪边？点那边！';
      say(cur.obj+'在哪个方向？点那边！','');
    }else{
      story.innerHTML='⭐ 星星在火车的<b>'+DIRS[cur.ans].label+'</b>边，点那边！';
      say('星星在哪个方向？点那边！','');
    }
  }
  function nextQuestion(){
    var lv=LEVELS[state.li];
    state.qi++;
    if(state.qi<lv.qn){ loadQuestion(); return; }
    if(state.li<LEVELS.length-1){
      state.li++;
      loadLevel();
      return;
    }
    // 全部完成
    setTheme(null);
    train.style.transform='translate(0,0)';
    story.innerHTML='🎉 上下左右，你全都会啦！';
    say('太棒了！给小火车鼓鼓掌！再玩一次就点下面。','good');
    prog.textContent='全部完成 🎉';
    document.querySelectorAll('.dir').forEach(function(b){b.disabled=true;});
    var again=document.createElement('button');
    again.type='button'; again.className='btn big';
    again.style.cssText='margin:8px auto 0;display:block;min-height:64px;font-size:24px;font-weight:800;';
    again.textContent='↻ 再玩一次';
    again.onclick=function(){ again.remove(); state.li=0; loadLevel(); loadQuestion(); };
    fb.parentNode.insertBefore(again,fb.nextSibling);
  }
  function correct(){
    var lv=LEVELS[state.li], cur=q();
    state.locked=true;
    var mover=(lv.theme==='cat')?cat:train;
    mover.style.transform='translate('+MOVE[cur.ans]+')';
    if(cur.mode==='go'){
      say('对！火车开到了「'+DIRS[cur.ans].label+'」！','good');
    }else if(cur.theme==='cat'){
      say('对！'+cur.obj+'在「'+DIRS[cur.ans].label+'」边，小猫找到啦！','good');
    }else{
      say('对！星星在「'+DIRS[cur.ans].label+'」边！','good');
    }
    setTimeout(function(){
      if(lv.theme==='star') star.classList.add('hidden');
      state.locked=false;
      nextQuestion();
    },1350);
  }
  function wrong(picked){
    var lv=LEVELS[state.li], cur=q();
    var A=DIRS[cur.ans], P=DIRS[picked];
    state.locked=true;
    document.querySelectorAll('.dir').forEach(function(b){
      if(b.dataset.d===cur.ans) b.classList.add('ok');
      if(b.dataset.d===picked) b.classList.add('bad');
    });
    document.querySelectorAll('.hit').forEach(function(h){
      if(h.dataset.d===picked) h.classList.add('shake');
    });
    var base;
    if(cur.mode==='go') base='你点了「'+P.label+'」，口令是「'+A.label+'」。';
    else if(cur.theme==='cat') base=cur.obj+'不在「'+P.label+'」，它在「'+A.label+'」。';
    else base='星星不在「'+P.label+'」，它在「'+A.label+'」。';
    say(base+HINT[cur.ans]+' 再试一次！','bad');
    setTimeout(function(){
      state.locked=false;
      resetDirState();
    },1100);
  }
  function pick(dir){
    if(state.locked) return;
    if(dir===q().ans) correct(); else wrong(dir);
  }

  // 绑定
  document.getElementById('dirs').addEventListener('click',function(e){
    var b=e.target.closest('.dir');
    if(!b||b.disabled) return;
    pick(b.dataset.d);
  });
  document.getElementById('hits').addEventListener('click',function(e){
    var h=e.target.closest('.hit');
    if(!h||h.classList.contains('inactive')) return;
    pick(h.dataset.d);
  });

  // 开场演示（可跳过；不循环；reduced-motion 出静帧）
  function finishIntro(){
    var ov=$('overlay');
    if(ov) ov.remove();
    state.li=0; loadLevel(); loadQuestion();
  }
  $('btnStart').onclick=finishIntro;
  $('btnSkip').onclick=finishIntro;
  function runIntro(){
    if(reduce){
      // 静帧：火车已在上方，说明一句
      $('ovTrain').style.transform='translate(0,-66px)';
      $('ovStar').classList.remove('hidden');
      $('ovAsk').textContent='火车开到了「上面」！';
      $('ovDone').textContent='点下面的方向，火车就会开过去！';
      return;
    }
    setTimeout(function(){ $('ovAsk').textContent='司机说：开到「上面」⬆'; },350);
    setTimeout(function(){
      $('ovTrain').style.transform='translate(0,-66px)';
    },1000);
    setTimeout(function(){
      $('ovStar').classList.remove('hidden');
    },2100);
    setTimeout(function(){
      $('ovAsk').textContent='火车开到了「上面」！';
      $('ovDone').textContent='点对方向，火车就开过去！';
    },3000);
  }
  runIntro();
})();
</script>
</body>
</html>
