<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08-40-46">
<meta name="aid-version-note" content="系统重跑 2026-08-14T08-40-46">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>和倍问题 · 哥哥弟弟分橘子</title>
<style>
  :root{
    --ink:#1e3a5f;
    --accent:#2f6fbf;
    --ok:#2fbf71;
    --bad:#e85d5d;
    --card:#fff;
    --paper:#f4f7fb;
    --r:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100dvh;overflow:hidden}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
  }
  .stage{flex:1;display:flex;flex-direction:column;gap:10px;max-width:min(1240px,100%);width:100%;margin:0 auto;padding:12px 16px 14px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:clamp(18px,2.6vw,26px);font-weight:800;letter-spacing:.5px}
  header .sub{font-size:15px;color:#5b7aa6;background:#e8effa;padding:4px 12px;border-radius:999px}
  .card{background:var(--card);border-radius:var(--r);box-shadow:0 4px 18px rgba(30,58,95,.08);flex:1;display:flex;flex-direction:column;padding:10px 16px 12px;min-height:0}
  .card.hidden{display:none}
  .scene-top{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center}
  .scene-top .q{font-size:clamp(16px,2vw,20px);font-weight:700}
  .btn{
    border:none;border-radius:14px;font-weight:800;cursor:pointer;
    font-size:16px;min-height:48px;padding:0 18px;
    transition:transform .12s ease, box-shadow .12s ease, background .2s ease;
    font-family:inherit;
  }
  .btn:active{transform:scale(.96)}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 #1d4f8d}
  .btn-primary:hover{background:#3b7ed0}
  .btn-ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
  .btn-sm{min-height:44px;font-size:15px;padding:0 14px}
  .mult-btn{background:#eef3fb;color:var(--ink);border:2px solid #c9d8ee;min-width:68px}
  .mult-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 #1d4f8d}
  .mult-btn .big{font-size:22px;font-weight:900;display:block;line-height:1.1}
  .mult-btn .lbl{font-size:13px;font-weight:600;opacity:.85}
  .svg-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 0}
  .svg-wrap svg{width:100%;height:100%;max-height:340px}
  .formulas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
  .fstep{background:#f2f6fc;border-radius:12px;padding:8px 10px;border:2px solid transparent}
  .fstep.active{border-color:var(--accent);background:#e9f1fc}
  .fstep .fh{display:flex;align-items:center;gap:6px;font-size:14px;color:#5b7aa6;font-weight:700}
  .fstep .num{background:var(--accent);color:#fff;border-radius:999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .fstep .fx{font-size:clamp(16px,1.8vw,20px);font-weight:900;margin-top:3px;letter-spacing:.3px;color:var(--ink)}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
  .controls .cap{font-size:15px;font-weight:700;color:#5b7aa6}
  .conclusion{text-align:center;font-size:clamp(16px,2vw,20px);font-weight:900;color:var(--accent);min-height:28px;margin-top:2px}
  /* practice */
  .p-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .p-progress{font-size:14px;font-weight:700;color:#5b7aa6}
  .p-head .right{display:flex;gap:8px}
  .p-q{font-size:clamp(18px,2.4vw,24px);font-weight:800;line-height:1.5;text-align:center;margin:6px 0 10px}
  .options{display:flex;flex-direction:column;gap:10px;max-width:560px;width:100%;margin:0 auto}
  .opt{
    border:2px solid #c9d8ee;background:#f7faff;border-radius:14px;min-height:56px;
    font-size:clamp(17px,2.2vw,22px);font-weight:800;color:var(--ink);
    display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;padding:8px 12px;
    transition:transform .12s ease, background .2s ease, border-color .2s ease;
  }
  .opt .u{font-size:14px;color:#5b7aa6;font-weight:700}
  .opt:hover{border-color:var(--accent)}
  .opt:active{transform:scale(.97)}
  .opt.correct{background:#e8f9ef;border-color:var(--ok);color:#157347}
  .opt.wrong{background:#fdecec;border-color:var(--bad);color:#a33a3a}
  .opt:disabled{cursor:default;opacity:.85}
  .feedback{max-width:640px;width:100%;margin:12px auto 0;border-radius:14px;padding:12px 14px;min-height:64px;display:none;gap:12px;align-items:flex-start;border:2px solid transparent}
  .feedback.show{display:flex}
  .feedback.good{background:#e8f9ef;border-color:var(--ok)}
  .feedback.bad{background:#fdecec;border-color:var(--bad)}
  .feedback .ic{font-size:26px;line-height:1.2}
  .feedback .ft{font-size:16px;line-height:1.65;font-weight:600}
  .feedback .ft .cmp{display:block;background:#fff;border-radius:10px;padding:6px 10px;margin-top:6px;font-size:15px;font-weight:700;color:var(--ink)}
  .footer{display:flex;justify-content:center;gap:12px;padding-top:2px}
  .shake{animation:shk .4s ease}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
  .finish{text-align:center;font-size:clamp(17px,2.2vw,22px);font-weight:800;margin:14px 0 6px;line-height:1.6}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
  @media (max-height:640px){
    .formulas .fx{font-size:15px}
    .svg-wrap svg{max-height:200px}
    .feedback{padding:8px 10px;min-height:52px}
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <h1>和倍问题</h1>
    <span class="sub">哥哥弟弟分橘子</span>
  </header>

  <!-- ============ 演示幕 ============ -->
  <section id="scene" class="card">
    <div class="scene-top">
      <div class="q">一筐橘子共 <b id="sumTxt">24</b> 个：哥哥拿的是弟弟的 <b id="nTxt">3</b> 倍。</div>
    </div>
    <div class="svg-wrap">
      <svg id="mainSvg" viewBox="0 0 640 280" role="img" aria-label="份数条：哥哥的条是弟弟的若干倍，合起来正好装满一筐">
        <!-- 大数条（哥哥） -->
        <g>
          <rect id="bigTrack" x="52" y="84" width="536" height="62" rx="14" fill="#e8effa"/>
          <rect id="bigBar" x="52" y="84" width="402" height="62" rx="14" fill="#2f6fbf"/>
          <g id="bigLines"></g>
          <text id="bigLabel" x="318" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#1e3a5f">哥哥 18 个</text>
        </g>
        <!-- 小数条（弟弟） -->
        <g>
          <rect id="smallTrack" x="52" y="188" width="536" height="62" rx="14" fill="#fdf1dd"/>
          <rect id="smallBar" x="52" y="188" width="134" height="62" rx="14" fill="#f59e0b"/>
          <text id="smallLabel" x="119" y="176" text-anchor="middle" font-size="17" font-weight="800" fill="#1e3a5f">弟弟 6 个</text>
        </g>
        <!-- 筐 -->
        <g id="basket" transform="translate(606,120)">
          <path d="M-30 42 L-26 -8 Q0 -26 26 -8 L30 42 Z" fill="none" stroke="#8a6a3f" stroke-width="5" stroke-linejoin="round"/>
          <path d="M-22 -2 Q0 8 22 -2" fill="none" stroke="#8a6a3f" stroke-width="4"/>
          <text x="0" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6a3f">一共24个</text>
        </g>
      </svg>
    </div>

    <div class="formulas">
      <div class="fstep" id="fs1">
        <div class="fh"><span class="num">1</span>先数份数</div>
        <div class="fx" id="fLine1">3 + 1 = 4 份</div>
      </div>
      <div class="fstep" id="fs2">
        <div class="fh"><span class="num">2</span>每份多少个</div>
        <div class="fx" id="fLine2">24 ÷ 4 = 6</div>
      </div>
      <div class="fstep" id="fs3">
        <div class="fh"><span class="num">3</span>哥哥几个</div>
        <div class="fx" id="fLine3">6 × 3 = 18</div>
      </div>
    </div>

    <div class="controls">
      <span class="cap">哥哥是弟弟的</span>
      <button class="btn mult-btn" data-n="2"><span class="big">2</span><span class="lbl">倍</span></button>
      <button class="btn mult-btn on" data-n="3"><span class="big">3</span><span class="lbl">倍</span></button>
      <button class="btn mult-btn" data-n="6"><span class="big">6</span><span class="lbl">倍</span></button>
      <button class="btn btn-primary" id="startBtn">去闯关 ▶</button>
    </div>
    <div class="conclusion" id="concl">弟弟 6 个，哥哥 18 个，合起来正好 24 个 ✔</div>
  </section>

  <!-- ============ 练习幕 ============ -->
  <section id="practice" class="card hidden">
    <div class="p-head">
      <span class="p-progress" id="pProg">第 1 / 3 题</span>
      <div class="right">
        <button class="btn btn-ghost btn-sm" id="resetBtn">↻ 重来</button>
        <button class="btn btn-ghost btn-sm" id="backBtn">← 回演示</button>
      </div>
    </div>
    <div class="p-q" id="pQ"></div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <div class="finish" id="finish"></div>
    <div class="footer" id="foot"></div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var SUM = 24;
  var n = 3;

  var bigBar = document.getElementById('bigBar');
  var smallBar = document.getElementById('smallBar');
  var bigLines = document.getElementById('bigLines');
  var bigLabel = document.getElementById('bigLabel');
  var smallLabel = document.getElementById('smallLabel');
  var sumTxt = document.getElementById('sumTxt');
  var nTxt = document.getElementById('nTxt');
  var fLine1 = document.getElementById('fLine1');
  var fLine2 = document.getElementById('fLine2');
  var fLine3 = document.getElementById('fLine3');
  var concl = document.getElementById('concl');

  var TRACK = {x:52, w:536};
  var BIG_Y = 84, H = 62;

  function setRect(r, x, w){
    r.setAttribute('x', x);
    r.setAttribute('width', w);
  }
  function animateNum(el, from, to, suffix){
    var t0 = null, dur = 420;
    function step(ts){
      if(!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      p = 1 - Math.pow(1 - p, 3);
      var v = Math.round(from + (to - from) * p);
      el.textContent = v + suffix;
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function render(animate){
    var small = SUM / (n + 1);
    var big = small * n;
    var totalW = TRACK.w;
    var smallW = totalW / (n + 1);
    var bigW = totalW * n / (n + 1);
    var smallX = TRACK.x;
    var bigX = TRACK.x;

    // 分隔线：大条里 n-1 条，表示「份」
    bigLines.innerHTML = '';
    for(var i = 1; i < n; i++){
      var line = document.createElementNS('http://www.w3.org/2000/svg','line');
      var x = bigX + bigW * i / n;
      line.setAttribute('x1', x); line.setAttribute('y1', BIG_Y + 2);
      line.setAttribute('x2', x); line.setAttribute('y2', BIG_Y + H - 2);
      line.setAttribute('stroke', '#fff'); line.setAttribute('stroke-width', '3');
      line.setAttribute('stroke-dasharray','6 5');
      bigLines.appendChild(line);
    }

    // 标签：放在条右端内侧；小条太窄时移到条右侧
    bigLabel.setAttribute('x', bigX + bigW - 14);
    bigLabel.setAttribute('text-anchor', 'end');
    smallLabel.setAttribute('x', smallX + smallW - 14);
    smallLabel.setAttribute('text-anchor', 'end');
    if(smallW < 100){
      smallLabel.setAttribute('x', smallX + smallW + 66);
      smallLabel.setAttribute('text-anchor', 'start');
    }

    // 数字滚动
    var oldSmall = parseFloat(smallBar.getAttribute('data-v')) || SUM/4;
    var oldBig = parseFloat(bigBar.getAttribute('data-v')) || SUM*3/4;
    if(animate){
      animateNum(smallLabel, Math.round(oldSmall), Math.round(small), ' 个');
      animateNum(bigLabel, Math.round(oldBig), Math.round(big), ' 个');
    } else {
      smallLabel.textContent = '弟弟 ' + Math.round(small) + ' 个';
      bigLabel.textContent = '哥哥 ' + Math.round(big) + ' 个';
    }

    setRect(smallBar, smallX, smallW);
    setRect(bigBar, bigX, bigW);
    smallBar.setAttribute('data-v', small);
    bigBar.setAttribute('data-v', big);

    // 算式与结论
    sumTxt.textContent = SUM;
    nTxt.textContent = n;
    fLine1.textContent = n + ' + 1 = ' + (n+1) + ' 份';
    fLine2.textContent = SUM + ' ÷ ' + (n+1) + ' = ' + Math.round(small);
    fLine3.textContent = Math.round(small) + ' × ' + n + ' = ' + Math.round(big);
    concl.textContent = '弟弟 ' + Math.round(small) + ' 个，哥哥 ' + Math.round(big) + ' 个，合起来正好 ' + SUM + ' 个 ✔';
  }

  document.querySelectorAll('.mult-btn').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.mult-btn').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      n = parseInt(b.getAttribute('data-n'), 10);
      render(true);
    });
  });

  // ---------- 练习 ----------
  var scene = document.getElementById('scene');
  var practice = document.getElementById('practice');
  var backBtn = document.getElementById('backBtn');
  var resetBtn = document.getElementById('resetBtn');
  var pQ = document.getElementById('pQ');
  var opts = document.getElementById('opts');
  var fb = document.getElementById('fb');
  var finish = document.getElementById('finish');
  var foot = document.getElementById('foot');
  var pProg = document.getElementById('pProg');

  var questions = [
    {
      q: '🍊 哥哥和弟弟一共有 24 个橘子，哥哥的是弟弟的 3 倍。弟弟有几个橘子？',
      right: 6,
      opts: [
        { t:'6 个', v:6, u:'' },
        { t:'8 个', v:8, u:'24 ÷ 3' },
        { t:'12 个', v:12, u:'24 ÷ 2' }
      ],
      good: '对！弟弟 1 份，哥哥 3 份，一共 4 份：24 ÷ (3+1) = 6。',
      wrong: {
        '8': '差一点：8 是把 24 只分成了 3 份（24÷3=8），可弟弟自己也要算 1 份呀！<span class="cmp">你算的：24 ÷ 3 = 8（只有哥哥那 3 份）<br>✓ 对的：24 ÷ (3+1) = 6（弟弟 1 份 + 哥哥 3 份 = 4 份）</span>先数份数，再算每份。',
        '12': '不对哦：12 是把 24 平均分成了 2 份，可哥哥不是和弟弟一样多呀，哥哥是弟弟的 3 倍。<span class="cmp">✓ 对的：一共 3+1=4 份，24 ÷ 4 = 6，弟弟 6 个，哥哥 6×3=18 个</span>'
      }
    },
    {
      q: '🍎 哥哥和弟弟一共有 24 个苹果，哥哥的是弟弟的 2 倍。弟弟有几个苹果？',
      right: 8,
      opts: [
        { t:'12 个', v:12, u:'24 ÷ 2' },
        { t:'8 个', v:8, u:'' },
        { t:'6 个', v:6, u:'24 ÷ 4' }
      ],
      good: '对！弟弟 1 份，哥哥 2 份，一共 3 份：24 ÷ (2+1) = 8。',
      wrong: {
        '12': '差一点：12 是把 24 分成了 2 份，可弟弟和哥哥不是一样多呀。哥哥是弟弟的 2 倍，就是哥哥 2 份、弟弟 1 份，一共 3 份，不是 2 份。<span class="cmp">你算的：24 ÷ 2 = 12（当成了 1 份对 1 份）<br>✓ 对的：24 ÷ (2+1) = 8（弟弟 1 份 + 哥哥 2 份）</span>',
        '6': '注意份数：6 是 24 ÷ 4 得到的，可哥哥 2 倍是「哥哥 2 份 + 弟弟 1 份 = 3 份」，不是 4 份哦。<span class="cmp">✓ 对的：24 ÷ (2+1) = 8，弟弟 8 个，哥哥 8×2=16 个，8+16=24 ✔</span>'
      }
    },
    {
      q: '🐱 小猫和小狗一共钓了 30 条鱼，小猫钓的是小狗的 4 倍。小狗钓了几条鱼？',
      right: 6,
      opts: [
        { t:'5 条', v:5, u:'30 ÷ 6' },
        { t:'24 条', v:24, u:'30 ÷ 5 × 4' },
        { t:'6 条', v:6, u:'' }
      ],
      good: '棒！小狗 1 份，小猫 4 份，一共 5 份：30 ÷ (4+1) = 6，小猫 6×4=24 条，6+24=30 ✔',
      wrong: {
        '5': '差一点点：5 是把 30 分成了 6 份，可小狗 1 份 + 小猫 4 份 = 5 份，不是 6 份。<span class="cmp">✓ 对的：30 ÷ (4+1) = 6（一共 5 份）</span>',
        '24': '24 是小猫的条数呀，题目问的是小狗。先找 1 份：小狗 1 份，小猫 4 份，一共 5 份，30 ÷ 5 = 6。<span class="cmp">✓ 小狗：30 ÷ (4+1) = 6 条</span>'
      }
    }
  ];
  var qi = 0, answered = false;

  function renderQ(){
    answered = false;
    fb.className = 'feedback';
    fb.innerHTML = '';
    finish.textContent = '';
    foot.innerHTML = '';
    var q = questions[qi];
    pProg.textContent = '第 ' + (qi+1) + ' / ' + questions.length + ' 题';
    pQ.textContent = q.q;
    opts.innerHTML = '';
    var order = [0,1,2].sort(function(){ return Math.random() - .5; });
    order.forEach(function(idx){
      var o = q.opts[idx];
      var b = document.createElement('button');
      b.className = 'opt';
      b.innerHTML = o.t + (o.u ? ' <span class="u">(' + o.u + ')</span>' : '');
      b.setAttribute('data-v', o.v);
      b.addEventListener('click', function(){ pick(o.v, b); });
      opts.appendChild(b);
    });
  }

  function pick(v, btn){
    if(answered) return;
    answered = true;
    var q = questions[qi];
    var rv = q.right;
    document.querySelectorAll('.opt').forEach(function(x){ x.disabled = true; });
    if(v === rv){
      btn.classList.add('correct');
      fb.className = 'feedback good show';
      fb.innerHTML = '<span class="ic">🎉</span><span class="ft">' + q.good + '</span>';
      setTimeout(function(){
        qi++;
        if(qi < questions.length){ renderQ(); }
        else {
          pProg.textContent = '完成 ✔';
          pQ.textContent = '你真棒！和倍问题三步走：先数份数 → 再算每份 → 最后乘倍数。';
          opts.innerHTML = '';
          finish.textContent = '举一反三：妈妈和宝宝一共 40 颗糖，妈妈的是宝宝的 4 倍，宝宝几颗？提示：先算 4+1=5 份。';
          var b = document.createElement('button');
          b.className = 'btn btn-primary';
          b.textContent = '再看一遍演示';
          b.addEventListener('click', goScene);
          foot.appendChild(b);
          var b2 = document.createElement('button');
          b2.className = 'btn btn-ghost';
          b2.textContent = '↻ 再玩一遍';
          b2.addEventListener('click', goPractice);
          foot.appendChild(b2);
        }
      }, 1100);
    } else {
      btn.classList.add('wrong');
      btn.classList.add('shake');
      fb.className = 'feedback bad show';
      var why = q.wrong[String(v)] || '再想想：先数一共有几份，再用总数 ÷ 份数。';
      fb.innerHTML = '<span class="ic">💡</span><span class="ft">' + why + '</span>';
      setTimeout(function(){
        answered = false;
        btn.classList.remove('wrong');
        btn.classList.remove('shake');
        document.querySelectorAll('.opt').forEach(function(x){ x.disabled = false; });
      }, 750);
    }
  }

  function goPractice(){
    qi = 0;
    renderQ();
    scene.classList.add('hidden');
    practice.classList.remove('hidden');
  }
  function goScene(){
    practice.classList.add('hidden');
    scene.classList.remove('hidden');
  }
  backBtn.addEventListener('click', goScene);
  resetBtn.addEventListener('click', goPractice);
  document.getElementById('startBtn').addEventListener('click', goPractice);

  render(false);
})();
</script>
</body>
</html>
