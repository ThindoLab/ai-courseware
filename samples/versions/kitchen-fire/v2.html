<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>油锅起火怎么办</title>
<style>
:root{
  --ink:#1e3a5f;
  --accent:#2f6fbf;
  --ok:#2fbf71;
  --bad:#e85d5d;
  --card:#fff;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,#eef4fb 0%,#e3ecf7 100%);
  font-size:20px;
  line-height:1.45;
}
.stage{height:100dvh;display:flex;flex-direction:column;max-width:1240px;margin:0 auto;padding:14px clamp(10px,2.5vw,28px) calc(10px + env(safe-area-inset-bottom))}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 10px}
.head h1{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:.5px}
.head-right{display:flex;align-items:center;gap:10px}
.badge{font-size:16px;font-weight:700;color:#fff;background:var(--bad);padding:5px 12px;border-radius:999px}
.reset{
  min-height:44px;width:44px;border-radius:50%;border:2px solid #c9d8ec;background:#fff;color:var(--accent);
  font-size:20px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s;
}
.reset:hover{border-color:var(--accent);background:#f4f8fd}
.reset:active{transform:scale(.95)}
.card{flex:1;display:none;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:0 10px 30px rgba(30,58,95,.12);overflow:hidden;min-height:0}
.card.active{display:flex}
.card-top{padding:14px 22px 6px}
.card-top h2{font-size:clamp(19px,2.6vw,24px);font-weight:800;margin-bottom:2px}
.card-top .sub{font-size:16px;color:#5b7290}
.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 16px}
.main svg{width:100%;height:100%;max-height:100%}
.ops{display:flex;flex-direction:column;gap:10px;padding:10px 22px 18px}
.op{
  width:100%;min-height:56px;border:2px solid #c9d8ec;border-radius:14px;background:#fff;
  font-size:20px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;
  padding:10px 16px;display:flex;align-items:center;gap:10px;
  transition:border-color .15s,background .15s,transform .08s;
}
.op:hover{border-color:var(--accent);background:#f4f8fd}
.op:active{transform:scale(.985)}
.op.ok{border-color:var(--ok);background:#eafaf1;color:#176b41}
.op.bad{border-color:var(--bad);background:#fdecec;color:#9d2b2b;animation:shake .35s}
.op .tag{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#eef4fb}
.op.ok .tag{background:#d6f3e2}
.op.bad .tag{background:#fbdcdc}
.feedback{display:none;border-radius:14px;padding:12px 16px;font-size:19px;line-height:1.5;margin-top:2px}
.feedback.show{display:block}
.feedback.bad-fb{background:#fdecec;border:2px solid var(--bad);color:#7c1f1f}
.feedback.good-fb{background:#eafaf1;border:2px solid var(--ok);color:#176b41}
.feedback b{font-weight:800}
.step-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.step{
  flex:1 1 0;min-width:130px;background:#f4f8fd;border:2px solid #d7e3f2;border-radius:14px;
  padding:12px 10px;text-align:center;opacity:.45;transition:opacity .25s,transform .25s;
}
.step.on{opacity:1;transform:translateY(-3px);border-color:var(--accent);background:#eaf2fc}
.step .n{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;align-items:center;justify-content:center;font-size:18px;margin-bottom:6px}
.step .t{font-weight:800;font-size:18px;margin-bottom:2px}
.step .d{font-size:16px;color:#5b7290}
.btns{display:flex;gap:10px;justify-content:center}
.btn{min-height:56px;padding:12px 22px;border-radius:14px;border:2px solid var(--accent);background:var(--accent);color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent)}
.btn:disabled{opacity:.5}
.wrong-panel{display:none;flex-direction:column;gap:12px;padding:6px 22px 18px;overflow-y:auto;max-height:100%}
.wrong-panel.show{display:flex}
.wrong-panel h3{font-size:21px;font-weight:800;color:var(--bad)}
.wrong-panel p{font-size:19px;line-height:1.55}
.wrong-panel .act{background:#eafaf1;border:2px solid var(--ok);border-radius:12px;padding:10px 14px;font-size:18px;color:#176b41}
.fire{transform-origin:50% 100%;animation:fire .5s ease-in-out infinite alternate}
.fire2{animation:fire2 .7s ease-in-out infinite alternate}
.steam{animation:steam 1.6s ease-in-out infinite}
@keyframes fire{from{transform:scaleY(.92) scaleX(.96)}to{transform:scaleY(1.06) scaleX(1.03)}}
@keyframes fire2{from{opacity:.75;transform:translateX(-2px)}to{opacity:1;transform:translateX(2px)}}
@keyframes steam{from{opacity:0;transform:translateY(2px)}to{opacity:.5;transform:translateY(-14px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.smoke{animation:smoke 1.2s ease-out infinite}
@keyframes smoke{from{opacity:.65;transform:translate(0,0) scale(.9)}to{opacity:0;transform:translate(6px,-20px) scale(1.15)}}
.praise{background:var(--ok);color:#fff;font-weight:800;font-size:18px;text-align:center;padding:10px;border-radius:12px;margin-top:10px;display:none}
.praise.show{display:block}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media (max-height:640px){
  .card-top{padding:8px 18px 2px}
  .card-top h2{font-size:18px}
  .card-top .sub{display:none}
  .ops{padding:6px 18px 10px;gap:6px}
  .op{min-height:48px;font-size:17px;padding:7px 12px}
  .op .tag{width:36px;height:36px;font-size:19px}
  .feedback{font-size:16px;padding:8px 12px}
  .step .d{display:none}
  .step .t{font-size:16px}
  .btn{min-height:48px;font-size:17px;padding:8px 16px}
  .wrong-panel p{font-size:16px}
  .wrong-panel .act{font-size:16px}
}
</style>
</head>
<body>
<div class="stage">

  <div class="head">
    <h1>🔥 油锅起火怎么办</h1>
    <div class="head-right">
      <span class="badge">安全小课堂</span>
      <button class="reset" id="resetBtn" title="重新开始" aria-label="重新开始">↻</button>
    </div>
  </div>

  <!-- ===== 第 1 幕：情境 + 先选会怎样 ===== -->
  <section class="card active" id="c1">
    <div class="card-top">
      <h2>厨房里，油锅突然着火了！</h2>
      <div class="sub">看一看火焰，想一想：第一步先做什么？</div>
    </div>
    <div class="main">
      <svg viewBox="0 0 600 300" role="img" aria-label="油锅着火的厨房">
        <rect x="30" y="180" width="540" height="14" rx="7" fill="#dbe7f3"/>
        <rect x="110" y="120" width="380" height="64" rx="12" fill="#f2f6fb" stroke="#c9d8ec" stroke-width="3"/>
        <rect x="120" y="128" width="360" height="16" rx="8" fill="#e4edf8"/>
        <g class="fire">
          <path d="M300 184 C270 158 258 150 276 128 C284 138 286 144 292 148 C292 128 300 112 312 96 C320 116 326 128 326 142 C334 132 340 126 344 124 C346 140 342 152 336 160 C352 156 358 160 354 170 C344 178 322 184 300 184 Z" fill="#f97316"/>
        </g>
        <g class="fire2">
          <path d="M290 184 C280 168 278 160 288 148 C294 154 296 158 300 160 C300 148 306 140 314 132 C318 144 322 152 322 160 C328 154 334 152 336 154 C336 164 330 172 322 176 C312 182 300 184 290 184 Z" fill="#fbbf24"/>
        </g>
        <circle class="smoke" cx="300" cy="112" r="6" fill="#94a3b8"/>
        <circle class="smoke" cx="318" cy="100" r="5" fill="#94a3b8" style="animation-delay:.4s"/>
        <circle class="smoke" cx="286" cy="104" r="4" fill="#94a3b8" style="animation-delay:.8s"/>
        <path d="M470 120 V72 H560 V120" fill="none" stroke="#1e3a5f" stroke-width="4" stroke-linecap="round"/>
        <text x="515" y="60" text-anchor="middle" font-size="20" font-weight="800" fill="#1e3a5f">锅盖</text>
        <g transform="translate(430,60)">
          <circle cx="0" cy="0" r="9" fill="none" stroke="#1e3a5f" stroke-width="3"/>
          <path d="M-6 0 H6 M0 -6 V6" stroke="#1e3a5f" stroke-width="2.4" stroke-linecap="round"/>
        </g>
        <text x="120" y="226" font-size="18" font-weight="700" fill="#e85d5d">火焰冒出来了！</text>
      </svg>
    </div>
    <div class="ops">
      <button class="op" data-a="1"><span class="tag">🧯</span><span>先把燃气灶的火关掉</span></button>
      <button class="op" data-a="0"><span class="tag">🚿</span><span>往油锅里倒一盆水</span></button>
      <button class="op" data-a="0"><span class="tag">🏃</span><span>端起油锅跑到客厅去</span></button>
    </div>
    <div class="feedback" id="fb1"></div>
  </section>

  <!-- ===== 第 2 幕：正确行动链 ===== -->
  <section class="card" id="c2">
    <div class="card-top">
      <h2>记住灭火三步：关火 → 盖盖 → 等凉</h2>
      <div class="sub">点一下每一步，看锅里的火焰怎么变小。</div>
    </div>
    <div class="main">
      <svg viewBox="0 0 600 260" role="img" aria-label="盖锅盖灭火过程">
        <rect x="40" y="60" width="520" height="150" rx="14" fill="#f8fbff" stroke="#c9d8ec" stroke-width="3"/>
        <rect x="150" y="120" width="300" height="52" rx="10" fill="#eef4fb" stroke="#c9d8ec" stroke-width="3"/>
        <text x="300" y="202" text-anchor="middle" font-size="19" font-weight="800" fill="#5b7290" id="stateLabel">🔥 火还在烧</text>
        <g id="flameG">
          <g class="fire">
            <path d="M300 172 C278 152 268 146 282 128 C290 136 293 142 298 146 C298 130 304 118 314 106 C321 122 326 132 326 144 C333 136 338 130 341 128 C343 142 340 152 334 160 C346 156 352 160 348 168 C340 176 320 180 300 180 Z" fill="#f97316"/>
          </g>
          <g class="fire2">
            <path d="M292 172 C284 160 282 154 290 144 C295 149 297 153 300 155 C300 145 305 138 312 132 C315 142 319 149 319 156 C324 151 330 150 332 152 C332 160 327 166 320 170 C312 175 300 176 292 172 Z" fill="#fbbf24"/>
          </g>
        </g>
        <g id="lidG" style="opacity:0">
          <path d="M180 124 Q300 92 420 124 L404 136 Q300 108 196 136 Z" fill="#8ba8c8" stroke="#1e3a5f" stroke-width="3" stroke-linejoin="round"/>
          <rect x="286" y="100" width="28" height="14" rx="4" fill="#6d8fb5" stroke="#1e3a5f" stroke-width="2"/>
        </g>
        <g id="steamG" style="opacity:0">
          <path class="steam" d="M270 96 q6 -14 0 -24" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path class="steam" d="M300 92 q6 -14 0 -24" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round" style="animation-delay:.4s"/>
          <path class="steam" d="M330 96 q6 -14 0 -24" stroke="#94a3b8" stroke-width="4" fill="none" stroke-linecap="round" style="animation-delay:.8s"/>
        </g>
        <text x="300" y="44" text-anchor="middle" font-size="19" font-weight="800" fill="#2f6fbf" id="stepTitle">① 先关火：热源断了，火苗不再变旺</text>
      </svg>
    </div>
    <div class="step-row" id="steps">
      <div class="step" data-step="0"><span class="n">1</span><div class="t">关火</div><div class="d">关掉燃气灶开关</div></div>
      <div class="step" data-step="1"><span class="n">2</span><div class="t">盖盖</div><div class="d">盖紧锅盖，火没了氧气</div></div>
      <div class="step" data-step="2"><span class="n">3</span><div class="t">等凉</div><div class="d">别打开，等它完全凉</div></div>
    </div>
    <div class="btns" style="padding-bottom:16px">
      <button class="btn ghost" id="playSteps">▶ 一步一步来</button>
    </div>
  </section>

  <!-- ===== 第 3 幕：选择判断 ===== -->
  <section class="card" id="c3">
    <div class="card-top">
      <h2>轮到你了：哪种做法才对？</h2>
      <div class="sub">点一点，错的做法会告诉我们为什么危险。</div>
    </div>
    <div class="main">
      <svg viewBox="0 0 600 250" role="img" aria-label="选择判断">
        <rect x="60" y="40" width="480" height="170" rx="14" fill="#f8fbff" stroke="#c9d8ec" stroke-width="3"/>
        <g id="sceneGood" style="opacity:1">
          <rect x="150" y="110" width="200" height="44" rx="9" fill="#eef4fb" stroke="#c9d8ec" stroke-width="3"/>
          <g class="fire">
            <path d="M250 154 C236 140 230 136 240 124 C245 130 248 134 251 137 C251 127 256 120 262 114 C266 124 269 130 269 138 C274 133 278 130 280 129 C281 138 278 144 274 148 C268 152 258 154 250 154 Z" fill="#f97316"/>
          </g>
          <path d="M150 118 L90 80 L120 110" fill="none" stroke="#8ba8c8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M90 76 Q95 64 108 64" stroke="#1e3a5f" stroke-width="3" fill="none" stroke-linecap="round"/>
          <text x="300" y="196" text-anchor="middle" font-size="18" font-weight="800" fill="#5b7290">盖着锅盖，火苗慢慢变小</text>
        </g>
        <g id="sceneBad" style="opacity:0">
          <rect x="150" y="110" width="200" height="44" rx="9" fill="#eef4fb" stroke="#c9d8ec" stroke-width="3"/>
          <g class="fire">
            <path d="M250 154 C232 136 224 130 240 116 C250 124 254 130 259 134 C259 120 266 108 276 96 C284 114 290 126 290 140 C299 130 305 126 308 124 C311 138 307 148 300 154 C288 160 266 162 250 154 Z" fill="#f97316"/>
          </g>
          <g class="fire2">
            <path d="M268 154 C258 142 256 136 264 128 C268 132 270 136 272 138 C272 130 276 124 282 120 C284 130 286 136 286 142 C290 138 294 136 296 138 C296 146 292 150 286 152 C280 154 272 154 268 154 Z" fill="#fbbf24"/>
          </g>
          <path d="M216 132 C230 104 248 92 276 92" fill="none" stroke="#7faeef" stroke-width="5" stroke-linecap="round"/>
          <circle cx="286" cy="88" r="8" fill="#7faeef"/>
          <text x="300" y="196" text-anchor="middle" font-size="18" font-weight="800" fill="#e85d5d">火越烧越大，油花四溅</text>
        </g>
      </svg>
    </div>
    <div class="ops">
      <button class="op" data-right="1"><span class="tag">🧯</span><span>关火，盖上锅盖等它凉</span></button>
      <button class="op" data-right="0"><span class="tag">🌊</span><span>往油锅泼一盆水</span></button>
      <button class="op" data-right="0"><span class="tag">🥣</span><span>撒一把面粉去压火</span></button>
    </div>
    <div class="feedback" id="fb3"></div>
  </section>

  <!-- ===== 第 4 幕：举一反三 ===== -->
  <section class="card" id="c4">
    <div class="card-top">
      <h2>换一个场景，你还会吗？</h2>
      <div class="sub">锅盖的秘诀是「盖上、隔开空气」。还有哪里也要这样？</div>
    </div>
    <div class="main">
      <svg viewBox="0 0 600 250" role="img" aria-label="举一反三场景">
        <rect x="40" y="40" width="520" height="170" rx="14" fill="#f8fbff" stroke="#c9d8ec" stroke-width="3"/>
        <g class="fire">
          <path d="M300 150 C278 130 268 124 282 106 C290 114 293 120 298 124 C298 108 304 96 314 84 C321 100 326 110 326 122 C333 114 338 108 341 106 C343 120 340 130 334 138 C346 134 352 138 348 146 C340 154 320 158 300 158 Z" fill="#f97316"/>
        </g>
        <text x="300" y="192" text-anchor="middle" font-size="18" font-weight="800" fill="#5b7290">垃圾桶里的小火苗，也可以「盖上」</text>
      </svg>
    </div>
    <div class="ops">
      <button class="op" data-a="1"><span class="tag">🔥</span><span>找大人来，用锅盖或湿布盖上</span></button>
      <button class="op" data-a="0"><span class="tag">🌬️</span><span>自己用嘴使劲吹，把火吹灭</span></button>
    </div>
    <div class="feedback" id="fb4"></div>
    <div class="praise" id="praise4">太棒了！你和家人一起就是灭火小分队 👏</div>
  </section>

</div>

<script>
(function(){
  var cur = 1, total = 4;
  function show(n){
    document.querySelectorAll('.card').forEach(function(c,i){c.classList.toggle('active', i===n-1)});
    cur = n;
  }
  function fb(el, cls, html){ el.className='feedback '+cls+' show'; el.innerHTML=html; }
  document.getElementById('resetBtn').addEventListener('click', function(){ location.reload(); });

  // ---- 第 1 幕 ----
  var c1 = document.getElementById('c1');
  c1.querySelectorAll('.op').forEach(function(b){
    b.addEventListener('click', function(){
      var right = b.getAttribute('data-a')==='1';
      if(right){
        b.classList.add('ok');
        c1.querySelectorAll('.op').forEach(function(x){x.disabled=true});
        fb(document.getElementById('fb1'),'good-fb','<b>对！</b> 先关火，火苗就不再变旺，锅里的油温也不会继续升高。这就是灭火的第一步。');
        setTimeout(function(){ show(2); }, 1100);
      }else{
        b.classList.add('bad');
        if(b.querySelector('.tag').textContent==='🚿'){
          fb(document.getElementById('fb1'),'bad-fb','<b>千万不能泼水！</b> 油比水轻，水一进热油会立刻炸开，油花带着火苗溅到手上、脸上和厨房各处，火会更大、更容易烫伤。<br><span style="color:#7c1f1f">现在该怎么做：</span> 马上松手站开一步，喊大人来；正确做法是先关火，再用锅盖盖住。');
        }else{
          fb(document.getElementById('fb1'),'bad-fb','<b>端锅跑最危险！</b> 热油晃动会洒出来，一路洒一路烧，还会烫伤端锅的手和腿；跑动带起风，火会跟着油追着烧，客厅也会烧起来。<br><span style="color:#7c1f1f">现在该怎么做：</span> 千万别端！先关火，再盖锅盖，让火在锅里闷灭。');
        }
        setTimeout(function(){ b.classList.remove('bad'); }, 600);
      }
    });
  });

  // ---- 第 2 幕 ----
  var steps = 0, stepBtns = document.querySelectorAll('#steps .step');
  var flameG = document.getElementById('flameG');
  var lidG = document.getElementById('lidG');
  var steamG = document.getElementById('steamG');
  var stateLabel = document.getElementById('stateLabel');
  var stepTitle = document.getElementById('stepTitle');
  function stepTo(i){
    steps = i;
    stepBtns.forEach(function(s,idx){ s.classList.toggle('on', idx<=i); });
    if(i===0){
      stateLabel.textContent='🔥 火还在烧，但不会再变旺';
      stepTitle.textContent='① 先关火：热源断了，火苗不再变旺';
      flameG.style.transition='opacity .3s';
      flameG.style.opacity=1;
      lidG.style.opacity=0;
      steamG.style.opacity=0;
    }else if(i===1){
      stepTitle.textContent='② 盖锅盖：火苗没了氧气，乖乖变小';
      lidG.style.transition='opacity .45s cubic-bezier(.25,1,.5,1), transform .45s cubic-bezier(.25,1,.5,1)';
      lidG.style.transform='translateY(-6px)';
      lidG.style.opacity=1;
      flameG.style.transition='opacity 1.2s ease';
      setTimeout(function(){ flameG.style.opacity=.15; stateLabel.textContent='🔥 火苗变小、变小…'; }, 500);
    }else if(i===2){
      stepTitle.textContent='③ 等凉：盖着别打开，等它完全凉透';
      flameG.style.opacity=0;
      steamG.style.opacity=1;
      stateLabel.textContent='💨 火灭了，等锅凉透再打开';
      setTimeout(function(){
        document.querySelector('#c2 .btns').insertAdjacentHTML('beforeend','<button class="btn" id="go3">下一步，来试试 ▶</button>');
        document.getElementById('go3').addEventListener('click', function(){ show(3); });
      }, 600);
    }
  }
  document.getElementById('playSteps').addEventListener('click', function(){
    if(steps<2) stepTo(steps+1);
  });

  // ---- 第 3 幕 ----
  var c3 = document.getElementById('c3');
  c3.querySelectorAll('.op').forEach(function(b){
    b.addEventListener('click', function(){
      var right = b.getAttribute('data-right')==='1';
      if(right){
        b.classList.add('ok');
        c3.querySelectorAll('.op').forEach(function(x){x.disabled=true});
        document.getElementById('sceneBad').style.opacity=0;
        document.getElementById('sceneGood').style.opacity=1;
        fb(document.getElementById('fb3'),'good-fb','<b>对！</b> 关火 + 盖锅盖，火没有了氧气，就会慢慢灭掉。等锅凉透再打开。');
        setTimeout(function(){ show(4); }, 1100);
      }else{
        b.classList.add('bad');
        document.getElementById('sceneBad').style.transition='opacity .3s';
        document.getElementById('sceneGood').style.opacity=0;
        document.getElementById('sceneBad').style.opacity=1;
        if(b.querySelector('.tag').textContent==='🌊'){
          fb(document.getElementById('fb3'),'bad-fb','<b>泼水＝火上浇油！</b> 水遇到滚烫的油会瞬间炸开，火苗和热油飞溅出来，烧到厨房、烧到人。<br><span style="color:#7c1f1f">马上该怎么做：</span> 站开、别碰锅，喊大人；用锅盖盖住油锅，火就会缺氧熄灭。');
        }else{
          fb(document.getElementById('fb3'),'bad-fb','<b>面粉撒不得！</b> 面粉粉末飘在空气里，遇到火会“轰”地一下爆开，厨房会瞬间全是火，非常危险。<br><span style="color:#7c1f1f">马上该怎么做：</span> 别撒任何东西！先关火，再用锅盖盖住油锅。');
        }
        setTimeout(function(){ b.classList.remove('bad'); }, 600);
      }
    });
  });

  // ---- 第 4 幕 ----
  var c4 = document.getElementById('c4');
  c4.querySelectorAll('.op').forEach(function(b){
    b.addEventListener('click', function(){
      var right = b.getAttribute('data-a')==='1';
      if(right){
        b.classList.add('ok');
        c4.querySelectorAll('.op').forEach(function(x){x.disabled=true});
        fb(document.getElementById('fb4'),'good-fb','<b>对！</b> 盖子（或湿布）能隔开空气，火没有氧气就会灭。但要记住：一定要找大人来，小朋友不能自己靠近火。');
        document.getElementById('praise4').classList.add('show');
      }else{
        b.classList.add('bad');
        fb(document.getElementById('fb4'),'bad-fb','<b>吹不灭，还可能烫到脸！</b> 小火苗用嘴吹，火会往前扑，离得太近会烫伤；火要是大一点，吹气只会让火烧得更旺。<br><span style="color:#7c1f1f">马上该怎么做：</span> 离开火远一点，立刻喊大人；大人会用锅盖或湿布盖住火。');
        setTimeout(function(){ b.classList.remove('bad'); }, 600);
      }
    });
  });
})();
</script>
</body>
</html>
