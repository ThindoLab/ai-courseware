<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08-40-46">
<meta name="aid-version-note" content="系统重跑 2026-08-14T08-40-46">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周长 vs 面积｜绳子绕一圈 · 格子铺满</title>
<style>
  :root{
    --bg:#fbf6ec;
    --card:#ffffff;
    --ink:#3a332b;
    --sub:#8a7f6f;
    --red:#e05252;
    --red-soft:#fdecec;
    --blue:#2f7fc4;
    --blue-soft:#e9f3fb;
    --orange:#e8940c;
    --green:#4aa96c;
    --line:#e5dccb;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    font-size:17px;
    line-height:1.5;
    overflow-x:hidden;
  }
  .wrap{max-width:820px;margin:0 auto;padding:14px 16px 26px;}

  /* ---------- header ---------- */
  header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
  header h1{font-size:24px;letter-spacing:.5px;}
  header .tag{font-size:15px;color:var(--sub);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin:6px 0 10px;}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;}
  .legend .l-red i{background:var(--red);}
  .legend .l-blue i{background:var(--blue);}

  /* ---------- stage ---------- */
  .stage{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:var(--radius);
    padding:10px 10px 14px;
    text-align:center;
    position:relative;
  }
  .stage-title{font-size:17px;font-weight:600;margin-bottom:2px;}
  .stage-sub{font-size:14px;color:var(--sub);margin-bottom:8px;min-height:21px;}
  .svg-box{width:100%;display:flex;justify-content:center;align-items:center;min-height:120px;}
  .svg-box svg{max-width:100%;height:auto;display:block;}
  .stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .stat{
    border-radius:12px;padding:6px 14px;font-size:16px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;min-height:44px;
  }
  .stat .num{font-size:22px;line-height:1;}
  .stat.red{background:var(--red-soft);color:var(--red);}
  .stat.blue{background:var(--blue-soft);color:var(--blue);}
  .stat .small{font-weight:400;font-size:14px;opacity:.85;}

  /* ---------- controls ---------- */
  .controls{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap;}
  .btn{
    flex:1;min-width:130px;min-height:48px;border:none;border-radius:14px;
    font-size:17px;font-weight:600;cursor:pointer;padding:10px 14px;
    background:#fff;border:2px solid var(--line);color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 3px 0 #b96f04;}
  .btn.primary:active{box-shadow:0 1px 0 #b96f04;transform:translateY(2px);}
  .btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  /* ---------- shape cards ---------- */
  .cards-label{font-size:15px;color:var(--sub);margin:14px 0 6px;}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .card{
    background:var(--card);border:2px solid var(--line);border-radius:14px;
    padding:8px 4px 6px;cursor:pointer;min-height:88px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    transition:transform .12s ease, border-color .12s ease;
  }
  .card:active{transform:scale(.96);}
  .card.sel{border-color:var(--orange);background:#fff7e8;box-shadow:0 2px 0 #e8c48a;}
  .card svg{width:100%;max-width:96px;height:auto;}
  .card .cname{font-size:15px;font-weight:600;}
  .card .csub{font-size:13px;color:var(--sub);}

  /* ---------- compare pair ---------- */
  .pair{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .pair .one{flex:1;min-width:150px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 6px;}
  .pair .one .pname{font-size:15px;font-weight:600;margin-bottom:4px;}
  .pair .one svg{max-width:100%;height:auto;}
  .pair .one .pstat{font-size:13px;margin-top:4px;}
  .pair .vs{font-size:22px;font-weight:800;color:var(--orange);}

  /* ---------- quiz ---------- */
  .quiz{display:none;}
  .quiz.on{display:block;}
  .quiz-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .quiz-head .qtag{background:var(--green);color:#fff;border-radius:10px;padding:4px 12px;font-size:14px;font-weight:600;}
  .quiz-question{font-size:19px;font-weight:700;margin:4px 0 10px;}
  .quiz .pair .one{cursor:pointer;border-width:3px;position:relative;}
  .quiz .pair .one:hover{border-color:var(--orange);}
  .feedback{
    display:none;margin-top:10px;border-radius:14px;padding:12px 14px;
    font-size:16px;text-align:left;min-height:44px;
  }
  .feedback.ok{display:block;background:#e8f6ee;color:#1d6b3d;border:2px solid #bfe3cd;}
  .feedback.no{display:block;background:#fdecec;color:#a33;border:2px solid #f3c2c2;}
  .feedback .fb-title{font-weight:700;margin-bottom:4px;}
  .q-next{display:none;margin-top:10px;}
  .q-next.show{display:inline-block;}

  /* ---------- extension ---------- */
  .extend{
    margin-top:16px;background:#fff;border:2px dashed #d8c9a8;border-radius:var(--radius);
    padding:12px 14px;font-size:16px;
  }
  .extend b{color:var(--orange);}

  /* ---------- overlay ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;background:#fff8ec;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:20px;text-align:center;
  }
  .overlay.hide{display:none;}
  .overlay h2{font-size:22px;}
  .overlay p{font-size:16px;color:var(--sub);max-width:560px;}
  .overlay .demo{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;max-width:480px;width:100%;}
  .overlay .demo svg{width:100%;height:auto;}
  .overlay .btn{max-width:260px;}

  /* ---------- svg animations ---------- */
  .rope{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
  .rope.animate{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.6s ease forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .tile{fill:#eaf2fa;stroke:#c4d9ea;stroke-width:1;}
  .tile.filled{fill:var(--blue);stroke:#dcebf7;}
  .tile.filled-slow{fill:var(--blue);stroke:#dcebf7;transition:fill .25s ease;}
  .cell{fill:#f4efe4;stroke:#d9cfba;stroke-width:1;}
  .cell.hot{fill:var(--red-soft);stroke:var(--red);}
  .flag{font-size:15px;font-weight:700;}
  .flag-red{fill:var(--red);}
  .flag-blue{fill:var(--blue);}

  @media (max-width:520px){
    body{font-size:16px;}
    header h1{font-size:21px;}
    .cards{grid-template-columns:repeat(4,1fr);gap:6px;}
    .card .csub{font-size:12px;}
    .stat{font-size:15px;}
    .stat .num{font-size:19px;}
  }
  @media (prefers-reduced-motion: reduce){
    .rope.animate{animation:none;stroke-dashoffset:0;}
    .tile.filled-slow{transition:none;}
    .btn,.card{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ======= 开场演示（可跳过） ======= -->
  <div class="overlay" id="overlay" role="dialog" aria-label="开场演示">
    <h2>先看一个小魔术 👀</h2>
    <div class="demo" id="demoBox">
      <svg id="demoSvg" viewBox="0 0 300 150" width="300" height="150" aria-hidden="true">
        <rect x="52" y="25" width="196" height="100" fill="#eaf2fa" stroke="#c4d9ea" stroke-width="2"/>
      </svg>
    </div>
    <p id="demoText">这一圈红红的，是<b>周长</b>：围一圈的绳子。</p>
    <button class="btn primary" id="skipBtn">我懂啦，开始玩 ▶</button>
  </div>

  <header>
    <h1>周长 vs 面积</h1>
    <span class="tag">绳子绕一圈 · 格子铺满</span>
  </header>

  <div class="legend">
    <span class="l-red"><i></i>红绳 = 周长（绕一圈的长度）</span>
    <span class="l-blue"><i></i>蓝格 = 面积（铺满的面）</span>
  </div>

  <!-- ======= 探索区 ======= -->
  <section id="explore">
    <div class="stage">
      <div class="stage-title" id="stageTitle">长 6 宽 2</div>
      <div class="stage-sub" id="stageSub">点下面任意图形，看它的绳子和格子</div>
      <div class="svg-box" id="svgBox"></div>
      <div class="stats">
        <div class="stat red">🧵 栅栏 <span class="num" id="statPer">16</span> <span class="small">段</span></div>
        <div class="stat blue">🌱 草地 <span class="num" id="statArea">12</span> <span class="small">格</span></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btnReplay">↻ 重放动画</button>
      <button class="btn primary" id="btnCompare">🔍 并排比一比</button>
      <button class="btn" id="btnQuiz">🎯 我来挑战</button>
    </div>

    <div class="cards-label">点图形看变化：</div>
    <div class="cards" id="cards"></div>

    <!-- 并排对比 -->
    <div class="stage" id="compareBox" style="display:none;margin-top:12px;">
      <div class="stage-title">并排比一比</div>
      <div class="stage-sub" id="compareSub"></div>
      <div class="pair" id="pairBox"></div>
      <div class="controls" style="margin-top:8px;">
        <button class="btn" id="cmpBack">⬅ 返回</button>
        <button class="btn" id="cmpNext">下一组 ➡</button>
      </div>
    </div>
  </section>

  <!-- ======= 挑战区 ======= -->
  <section class="quiz" id="quiz">
    <div class="stage">
      <div class="quiz-head">
        <span class="qtag" id="qTag">第 1 题</span>
        <span style="font-size:15px;color:var(--sub);" id="qKind">周长</span>
      </div>
      <div class="quiz-question" id="qQuestion">哪个图形的栅栏更长？</div>
      <div class="pair" id="qPair"></div>
      <div class="feedback" id="qFeedback"></div>
      <div class="controls">
        <button class="btn primary q-next" id="qNext">下一题 ▶</button>
        <button class="btn" id="qExit" style="display:none;">⬅ 回去再玩玩</button>
      </div>
    </div>
  </section>

  <!-- ======= 举一反三 ======= -->
  <div class="extend">
    💡 <b>举一反三：</b>操场中间是草坪（面积），跑道绕草坪一圈（周长）。如果操场变成长方形、再变回正方形，草坪和跑道会一样变吗？回家数一数：课桌面铺了多少本书（面积）？桌边要围多长彩带（周长）？
  </div>

</div>

<script>
(function(){
  "use strict";
  var U = 34, G = 4; // 格子边长、间距(viewBox 单位)
  var RED = "#e05252", BLUE = "#2f7fc4";
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- 图形数据 ----------
  var SHAPES = [
    {id:"A", w:6, h:2, name:"长6 宽2", per:16, area:12, tip:"栅栏 16 段，草地 12 格"},
    {id:"B", w:4, h:4, name:"边长4 正方", per:16, area:16, tip:"栅栏 16 段，草地 16 格"},
    {id:"C", w:8, h:2, name:"长8 宽2", per:20, area:16, tip:"栅栏 20 段，草地 16 格"},
    {id:"D", w:5, h:3, name:"长5 宽3", per:16, area:15, tip:"栅栏 16 段，草地 15 格"}
  ];
  var current = SHAPES[0];

  // ---------- 对比组 ----------
  var PAIRS = [
    {a:0, b:1, title:"栅栏一样长，草地一样大吗？", sub:"A 和 B 的周长都是 16 段，草地却一个是 12 格、一个是 16 格。红绳一样长 ≠ 草地一样大！"},
    {a:1, b:2, title:"草地一样大，栅栏一样长吗？", sub:"B 和 C 的草地都是 16 格，栅栏却一个是 16 段、一个是 20 段。草地一样大 ≠ 栅栏一样长！"}
  ];
  var pairIdx = 0;

  // ---------- SVG 生成 ----------
  function shapeSVG(s, opts){
    opts = opts || {};
    var W = s.w*U + (s.w-1)*G, H = s.h*U + (s.h-1)*G;
    var pad = 18, vbW = W + pad*2, vbH = H + pad*2;
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + vbW + " " + vbH);
    svg.setAttribute("width", vbW);
    svg.setAttribute("height", vbH);
    var g = document.createElementNS(ns, "g");
    g.setAttribute("transform", "translate(" + pad + "," + pad + ")");
    svg.appendChild(g);

    // 格子
    var i, j;
    for (i = 0; i < s.h; i++){
      for (j = 0; j < s.w; j++){
        var r = document.createElementNS(ns, "rect");
        r.setAttribute("x", j*(U+G));
        r.setAttribute("y", i*(U+G));
        r.setAttribute("width", U);
        r.setAttribute("height", U);
        r.setAttribute("rx", 3);
        r.setAttribute("class", "tile");
        r.setAttribute("data-i", i*s.w + j);
        g.appendChild(r);
      }
    }
    // 外轮廓绳
    var p = document.createElementNS(ns, "path");
    var d = "M -3 -3 H " + (W+3) + " V " + (H+3) + " H -3 Z";
    p.setAttribute("d", d);
    p.setAttribute("class", "rope");
    if (!reduced && opts.animate !== false) p.classList.add("animate");
    g.appendChild(p);
    return svg;
  }

  // 填充格子动画
  function fillTiles(svg, s, slow){
    var tiles = svg.querySelectorAll("rect.tile");
    var total = s.w * s.h, t = 0;
    var order = [];
    for (var i = 0; i < total; i++) order.push(i);
    // 逐行填充
    order.sort(function(a,b){ return a - b; });
    if (reduced){
      tiles.forEach(function(r){ r.classList.add("filled"); });
      return;
    }
    tiles.forEach(function(r){
      var delay = (r.getAttribute("data-i")|0) * 22;
      (function(rr, d){
        setTimeout(function(){
          rr.classList.add("filled-slow");
          rr.style.fill = BLUE;
        }, d);
      })(r, delay);
    });
  }

  // ---------- 主图渲染 ----------
  function renderMain(){
    var s = current;
    document.getElementById("stageTitle").textContent = s.name;
    document.getElementById("stageSub").textContent = s.tip;
    document.getElementById("statPer").textContent = s.per;
    document.getElementById("statArea").textContent = s.area;
    var box = document.getElementById("svgBox");
    box.innerHTML = "";
    var svg = shapeSVG(s);
    box.appendChild(svg);
    if (!reduced){
      setTimeout(function(){ fillTiles(svg, s, true); }, 300);
    } else {
      fillTiles(svg, s, true);
    }
    // 卡片高亮
    var cards = document.querySelectorAll(".card");
    cards.forEach(function(c){
      c.classList.toggle("sel", c.getAttribute("data-id") === s.id);
    });
  }

  // ---------- 卡片 ----------
  function buildCards(){
    var wrap = document.getElementById("cards");
    SHAPES.forEach(function(s, idx){
      var d = document.createElement("div");
      d.className = "card";
      d.setAttribute("data-id", s.id);
      d.setAttribute("role", "button");
      d.setAttribute("tabindex", "0");
      d.setAttribute("aria-label", s.name + "，栅栏" + s.per + "段，草地" + s.area + "格");
      var mini = shapeSVG(s, {animate:false});
      mini.querySelectorAll("rect.tile").forEach(function(r){
        r.classList.add("filled");
        r.style.fill = BLUE;
      });
      d.appendChild(mini);
      var n = document.createElement("div");
      n.className = "cname";
      n.textContent = s.name;
      var sub = document.createElement("div");
      sub.className = "csub";
      sub.textContent = "🧵" + s.per + "  🌱" + s.area;
      d.appendChild(n);
      d.appendChild(sub);
      d.addEventListener("click", function(){
        current = s;
        renderMain();
      });
      d.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); d.click(); }
      });
      wrap.appendChild(d);
    });
  }

  // ---------- 并排对比 ----------
  function renderPair(){
    var p = PAIRS[pairIdx];
    var a = SHAPES[p.a], b = SHAPES[p.b];
    document.getElementById("compareSub").textContent = p.sub;
    var box = document.getElementById("pairBox");
    box.innerHTML = "";

    [a, b].forEach(function(s){
      var one = document.createElement("div");
      one.className = "one";
      var nm = document.createElement("div");
      nm.className = "pname";
      nm.textContent = s.name;
      one.appendChild(nm);
      var svg = shapeSVG(s);
      one.appendChild(svg);
      var st = document.createElement("div");
      st.className = "pstat";
      st.innerHTML = '<span style="color:' + RED + '">🧵 ' + s.per + '</span>　<span style="color:' + BLUE + '">🌱 ' + s.area + '</span>';
      one.appendChild(st);
      box.appendChild(one);
      if (!reduced){
        setTimeout(function(){
          var rp = svg.querySelector(".rope");
          rp.classList.add("animate");
          rp.style.strokeDasharray = 1000;
          rp.style.strokeDashoffset = 1000;
          setTimeout(function(){ fillTiles(svg, s, true); }, 400);
        }, 150);
      } else {
        fillTiles(svg, s, true);
      }
    });

    var vs = document.createElement("div");
    vs.className = "vs";
    vs.textContent = "?";
    box.insertBefore(vs, box.children[1]);
  }

  // ---------- 挑战 ----------
  var QUIZ = [
    {
      kind: "周长",
      q: "哪个图形的栅栏（周长）更长？",
      a: 0, b: 2,
      answer: 2,
      wrong: function(){
        return "你点的是长 8 宽 2 呀？再数数：<br>红色绳子绕一圈——A 要绕 <b>16 段</b>，C 要绕 <b>20 段</b>。<br>绕的段数多，栅栏才更长。C 的绳子更长哦 ✅";
      },
      right: "对！C 的栅栏 20 段，比 A 的 16 段长。<br>栅栏看的是<b>绕一圈的绳子</b>（周长）。"
    },
    {
      kind: "面积",
      q: "哪个图形的草地（面积）更大？",
      a: 0, b: 1,
      answer: 1,
      wrong: function(){
        return "A 长得又长又扁，是不是骗到你啦？<br>草地看的是<b>铺满的格子数</b>：A 有 <b>12 格</b>，B 有 <b>16 格</b>。<br>格子多才更大，B 的草地更大 ✅";
      },
      right: "对！B 的草地 16 格，比 A 的 12 格多。<br>草地看的是<b>铺满的格子数</b>（面积）。"
    },
    {
      kind: "发现",
      q: "A 和 B 的栅栏一样长（都是 16 段），那它们的草地一样大吗？",
      a: 0, b: 1,
      answer: 1,
      wrong: function(){
        return "栅栏一样长，草地可不一定一样大！<br>数一数：A 的草地 <b>12 格</b>，B 的草地 <b>16 格</b>。<br>周长一样 ≠ 面积一样，B 的草地更大 ✅";
      },
      right: "对！A 草地 12 格，B 草地 16 格。<br><b>周长一样，面积不一定一样</b>——这就是周长和面积最大的不同！"
    }
  ];
  var qIdx = 0;

  function startQuiz(){
    document.getElementById("explore").style.display = "none";
    document.getElementById("quiz").classList.add("on");
    document.getElementById("qExit").style.display = "none";
    qIdx = 0;
    showQuestion();
  }
  function exitQuiz(){
    document.getElementById("quiz").classList.remove("on");
    document.getElementById("explore").style.display = "";
  }
  function showQuestion(){
    var q = QUIZ[qIdx];
    document.getElementById("qTag").textContent = "第 " + (qIdx+1) + " 题";
    document.getElementById("qKind").textContent = q.kind === "周长" ? "🧵 看周长" : (q.kind === "面积" ? "🌱 看面积" : "🔍 找不同");
    document.getElementById("qQuestion").textContent = q.q;
    document.getElementById("qFeedback").className = "feedback";
    document.getElementById("qFeedback").innerHTML = "";
    document.getElementById("qNext").classList.remove("show");
    var box = document.getElementById("qPair");
    box.innerHTML = "";
    [q.a, q.b].forEach(function(si){
      var s = SHAPES[si];
      var one = document.createElement("div");
      one.className = "one";
      one.setAttribute("role", "button");
      one.setAttribute("tabindex", "0");
      one.setAttribute("aria-label", "选 " + s.name);
      var nm = document.createElement("div");
      nm.className = "pname";
      nm.textContent = s.name;
      one.appendChild(nm);
      var svg = shapeSVG(s, {animate:false});
      svg.querySelectorAll("rect.tile").forEach(function(r){
        r.classList.add("filled");
        r.style.fill = BLUE;
      });
      one.appendChild(svg);
      var st = document.createElement("div");
      st.className = "pstat";
      st.innerHTML = '<span style="color:' + RED + '">🧵 ' + s.per + '</span>　<span style="color:' + BLUE + '">🌱 ' + s.area + '</span>';
      one.appendChild(st);
      one.addEventListener("click", function(){ answerQuestion(si, one); });
      one.addEventListener("keydown", function(e){
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); one.click(); }
      });
      box.appendChild(one);
    });
    var vs = document.createElement("div");
    vs.className = "vs";
    vs.textContent = "比";
    box.insertBefore(vs, box.children[1]);
  }
  function answerQuestion(picked, el){
    var q = QUIZ[qIdx];
    var fb = document.getElementById("qFeedback");
    var ones = document.querySelectorAll("#qPair .one");
    ones.forEach(function(o){ o.style.pointerEvents = "none"; });
    if (picked === q.answer){
      fb.className = "feedback ok";
      fb.innerHTML = "🎉 " + q.right;
      el.style.borderColor = "var(--green)";
    } else {
      fb.className = "feedback no";
      fb.innerHTML = "🤔 再想想——" + q.wrong;
      el.style.borderColor = "var(--red)";
      var rightEl = ones[q.answer === q.a ? 0 : 1];
      if (rightEl) rightEl.style.borderColor = "var(--green)";
    }
    if (qIdx < QUIZ.length - 1){
      document.getElementById("qNext").classList.add("show");
    } else {
      document.getElementById("qExit").style.display = "inline-block";
      document.getElementById("qExit").textContent = "🎉 全通关！回去再玩玩";
    }
  }

  // ---------- 开场演示 ----------
  function runDemo(){
    var txt = document.getElementById("demoText");
    var box = document.getElementById("demoBox");
    box.innerHTML = "";
    var s = {w:6, h:2};
    var newSvg = shapeSVG(s);
    newSvg.setAttribute("width", 300);
    newSvg.setAttribute("height", 150);
    box.appendChild(newSvg);
    if (reduced){
      newSvg.querySelectorAll("rect.tile").forEach(function(r){
        r.classList.add("filled");
        r.style.fill = BLUE;
      });
      txt.innerHTML = "红绳绕一圈 = <b>周长</b>；蓝格铺满 = <b>面积</b>。点下面按钮开始玩！";
      return;
    }
    txt.innerHTML = "先看红绳子：绕图形<b>一圈</b>——这一圈的长度就是 <b>周长</b> 🧵";
    setTimeout(function(){
      txt.innerHTML = "再看蓝格子：把图形<b>铺满</b>——铺满的面就是 <b>面积</b> 🌱";
      fillTiles(newSvg, s, true);
      setTimeout(function(){
        txt.innerHTML = "🧵 周长 = 围一圈的绳子　|　🌱 面积 = 铺满的格子<br>它们不是一回事哦！点下面按钮开始玩！";
      }, 1400);
    }, 1800);
  }

  // ---------- 事件 ----------
  document.getElementById("skipBtn").addEventListener("click", function(){
    document.getElementById("overlay").classList.add("hide");
  });
  document.getElementById("btnReplay").addEventListener("click", function(){
    renderMain();
    document.getElementById("svgBox").scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"nearest"});
  });
  document.getElementById("btnCompare").addEventListener("click", function(){
    document.getElementById("compareBox").style.display = "";
    document.getElementById("compareBox").scrollIntoView({behavior: reduced ? "auto" : "smooth", block:"nearest"});
    pairIdx = 0;
    renderPair();
  });
  document.getElementById("cmpNext").addEventListener("click", function(){
    pairIdx = (pairIdx + 1) % PAIRS.length;
    renderPair();
  });
  document.getElementById("cmpBack").addEventListener("click", function(){
    document.getElementById("compareBox").style.display = "none";
  });
  document.getElementById("btnQuiz").addEventListener("click", startQuiz);
  document.getElementById("qNext").addEventListener("click", function(){
    qIdx++;
    showQuestion();
  });
  document.getElementById("qExit").addEventListener("click", exitQuiz);

  // ---------- 启动 ----------
  buildCards();
  renderMain();
  runDemo();
})();
</script>
</body>
</html>
