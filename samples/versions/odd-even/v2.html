<!doctype html>
<html lang="zh-CN">
<head>

<title>奇偶分队 · 两两拉手找落单</title>
<style>
:root{
  --ink:#1e3a5f;
  --accent:#2f6fbf;
  --accent-soft:#e3eefb;
  --ok:#2fbf71;
  --ok-soft:#e7f8ef;
  --bad:#e85d5d;
  --bad-soft:#fdecec;
  --card:#ffffff;
  --muted:#667085;
  --line:#d7e3f1;
  --ease:cubic-bezier(.25,1,.5,1);
  --touch:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(165deg,#f2f7fd 0%,#e8f1fb 100%);
  display:flex;flex-direction:column;
  padding:clamp(6px,1.2vh,14px) clamp(8px,1.6vw,20px) clamp(8px,1.4vh,16px);
}
.card{
  flex:1 1 auto;min-height:0;width:100%;max-width:min(1240px,100%);margin:0 auto;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  box-shadow:0 12px 30px rgba(30,58,95,.10);
  display:flex;flex-direction:column;overflow:hidden;
  padding:clamp(10px,1.6vh,20px) clamp(12px,2vw,26px);
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;margin-bottom:8px}
.top h1{font-size:clamp(20px,2.6vw,26px);font-weight:800;letter-spacing:.5px}
.badge{font-size:clamp(13px,1.4vw,15px);font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 14px;border-radius:999px}
.progress{font-size:clamp(13px,1.4vw,15px);font-weight:700;color:var(--muted)}
.story{flex:none;font-size:clamp(15px,1.8vw,18px);line-height:1.6;background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:0 12px 12px 0;padding:10px 14px;margin-bottom:10px}
.stage{
  flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  border:1px solid var(--line);border-radius:16px;background:#fbfdff;
  padding:clamp(8px,1.4vh,14px);margin-bottom:10px;overflow:hidden;
}
.camps{flex:none;display:flex;gap:clamp(8px,1.6vw,16px);justify-content:center;padding:2px 0 8px}
.camp{
  flex:1 1 0;max-width:290px;min-height:clamp(56px,8vh,84px);
  border:2px dashed var(--line);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:clamp(16px,2vw,20px);font-weight:800;color:var(--muted);
  transition:border-color .25s var(--ease),background .25s var(--ease),transform .15s var(--ease);
  cursor:pointer;user-select:none;
}
.camp .sub{font-size:clamp(12px,1.3vw,14px);font-weight:600;color:var(--muted)}
.camp.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);transform:translateY(-2px)}
.camp.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.camp.filled .nums{font-weight:700;color:var(--accent);font-size:clamp(13px,1.5vw,16px)}
.camp .count{font-size:clamp(11px,1.2vw,13px);color:var(--muted);font-weight:600}
.diagram{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.diagram svg{width:100%;height:100%;max-height:100%;min-height:0;display:block}
.pool{flex:none;display:flex;flex-wrap:wrap;gap:clamp(8px,1.4vw,14px);justify-content:center;padding:6px 0 2px;min-height:clamp(64px,10vh,92px)}
.card{
  min-width:var(--touch);min-height:var(--touch);padding:10px 16px;
  border-radius:16px;border:2px solid var(--line);background:#fff;
  font-size:clamp(24px,3vw,32px);font-weight:800;color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:none;user-select:none;
  transition:transform .18s var(--ease),border-color .18s var(--ease),box-shadow .18s var(--ease),opacity .25s var(--ease);
}
.card.lift{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 10px 18px rgba(47,111,191,.18)}
.card.dragging{opacity:.55;position:relative;z-index:30;transform:scale(1.06)}
.card.done{opacity:.25;pointer-events:none;transform:scale(.9)}
.card.wrong{animation:shake .4s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.ctrl{flex:none;display:flex;gap:10px;justify-content:center;align-items:center;padding:6px 0 2px;flex-wrap:wrap}
.btn{
  min-height:var(--touch);padding:10px 20px;border-radius:14px;border:2px solid var(--line);
  background:#fff;font-size:clamp(16px,1.8vw,19px);font-weight:700;color:var(--ink);
  cursor:pointer;font-family:inherit;transition:background .2s var(--ease),transform .15s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.fb{flex:none;min-height:clamp(34px,4.5vh,46px);border-radius:12px;padding:8px 14px;font-size:clamp(15px,1.7vw,18px);line-height:1.5;margin-top:8px;background:#f4f8fd;border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok);color:#14603a}
.fb.bad{background:var(--bad-soft);border-color:var(--bad);color:#8f2b2b}
.fb.celebrate{background:#fff7e6;border-color:#f5b942;color:#8a5a00}
/* 开场演示 overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center}
.overlay.hidden{display:none}
.demo{width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(30,58,95,.16);padding:clamp(14px,2.5vh,24px);text-align:center}
.demo h2{font-size:clamp(20px,2.6vw,26px);margin-bottom:6px}
.demo .dl{font-size:clamp(15px,1.8vw,18px);color:var(--muted);margin-bottom:10px}
.demo .dstage{height:clamp(110px,20vh,170px);display:flex;align-items:center;justify-content:center}
.demo svg{max-height:100%;max-width:100%}
.demo .dbadge{font-size:clamp(16px,2vw,20px);font-weight:800;min-height:28px;margin-top:8px}
.demo .dbadge.odd{color:var(--accent)}
.demo .dbadge.even{color:var(--ok)}
.demo .dbtn{min-height:var(--touch);padding:10px 26px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:clamp(16px,1.8vw,19px);font-weight:800;cursor:pointer;margin-top:12px;font-family:inherit}
.demo .skip{position:absolute;top:clamp(10px,2vh,20px);right:clamp(12px,2vw,24px);min-height:44px;min-width:76px;border:none;background:transparent;color:var(--muted);font-size:16px;font-weight:700;cursor:pointer;border:2px solid var(--line);border-radius:12px;background:#fff}
/* 完成页 */
.finish{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:10px}
.finish .big{font-size:clamp(34px,6vw,56px)}
.finish h2{font-size:clamp(22px,3vw,30px)}
.finish .rule{font-size:clamp(16px,2vw,20px);background:var(--accent-soft);border-radius:12px;padding:12px 18px;line-height:1.7;max-width:520px}
.finish .again{min-height:var(--touch);padding:12px 28px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:clamp(17px,2vw,20px);font-weight:800;cursor:pointer}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
<style id="aid-fit">
html,body{height:100%!important;max-height:100dvh!important;overflow:hidden!important}
@media (max-height:720px){
  .story{display:none}
  .top{margin-bottom:4px}
  .stage{padding:6px 10px;margin-bottom:6px}
  .pool{min-height:52px;gap:6px}
  .card{min-height:48px;padding:8px 12px;font-size:22px}
  .fb{margin-top:4px;min-height:26px;padding:5px 10px;font-size:15px}
  .camp{min-height:48px}
}
</style>

<body>
<main class="card" id="app">
  <div class="top">
    <h1>奇偶分队</h1>
    <span class="badge" id="badge">第 1 关 · 1–6</span>
    <span class="progress" id="progress">0 / 4 归队</span>
  </div>
  <div class="story" id="story">数字卡片要<strong>归队</strong>。点卡片，看看它的圆点能不能<strong>两两拉手</strong>：全配成对 → <strong>偶数营</strong>；剩 1 个没伴 → <strong>奇数营</strong>。拖进对应的营，或点卡片再点营。</div>
  <div class="stage" id="stage">
    <div class="camps" id="camps">
      <div class="camp" id="campOdd" role="button" tabindex="0" aria-label="奇数营">
        <span>奇数营 <span class="sub">剩 1 个没伴</span></span>
        <span class="nums" id="oddNums"></span>
        <span class="count" id="oddCount"></span>
      </div>
      <div class="camp" id="campEven" role="button" tabindex="0" aria-label="偶数营">
        <span>偶数营 <span class="sub">刚好配成对</span></span>
        <span class="nums" id="evenNums"></span>
        <span class="count" id="evenCount"></span>
      </div>
    </div>
    <div class="diagram" id="diagram" aria-label="配对演示图"></div>
  </div>
  <div class="pool" id="pool" aria-label="待归队的数字卡片"></div>
  <div class="ctrl">
    <button type="button" class="btn" id="btnReset">↻ 重来</button>
  </div>
  <div class="fb" id="fb" aria-live="polite">先点一张数字卡片，看看它是奇数还是偶数。</div>
</main>

<!-- 开场演示 -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="开场演示">
  <button type="button" class="skip" id="btnSkip">跳过 ›</button>
  <div class="demo">
    <h2>先看一遍怎么玩</h2>
    <div class="dl" id="demoLine">5 个小球，能两两拉手吗？</div>
    <div class="dstage"><svg id="demoSvg" viewBox="0 0 320 140" role="img" aria-label="小球两两配对演示"></svg></div>
    <div class="dbadge" id="demoBadge"></div>
    <button type="button" class="dbtn" id="btnDemoGo">开始玩！</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 数据 ---------- */
  var LEVELS=[
    {label:'第 1 关 · 1–6',  nums:shuffle([1,2,3,4,5,6]).slice(0,4)},
    {label:'第 2 关 · 7–12', nums:shuffle([7,8,9,10,11,12]).slice(0,4)},
    {label:'举一反三 · 袜子配对 13–20', nums:shuffle([13,14,15,16,17,18,19,20]).slice(0,4)}
  ];
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  var level=0, pool=[], oddArr=[], evenArr=[], selected=null, doneCount=0;

  /* 卡片元素辅助：清掉所有卡片的选中高亮（pool 是数字数组，不能 forEach 元素） */
  function clearLift(){
    document.querySelectorAll('#pool .card').forEach(function(x){x.classList.remove('lift');});
  }

  /* ---------- SVG 配对演示 ---------- */
  var NS='http://www.w3.org/2000/svg';
  function elSvg(tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);return e;}
  function drawPairing(container,n,mode){
    container.innerHTML='';
    var W=Math.min(520,Math.max(300,n*46+40)), H=132;
    var svg=elSvg('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':n+' 个圆点配对演示'});
    var cx0=26, cy=66, gap=Math.min(42,(W-40)/n), pairs=Math.floor(n/2), odd=n%2===1;
    var dots=[];
    for(var i=0;i<n;i++){
      var r=elSvg('circle',{cx:cx0+i*gap,cy:cy,r:14,fill:odd&&i===n-1?'#f6b26b':'#8ec5f4',stroke:odd&&i===n-1?'#e69138':'#2f6fbf','stroke-width':2});
      svg.appendChild(r);dots.push(r);
    }
    var bonds=[];
    for(var p=0;p<pairs;p++){
      var line=elSvg('line',{x1:cx0+(p*2)*gap,y1:cy,x2:cx0+(p*2+1)*gap,y2:cy,stroke:'#f5b942','stroke-width':3,'stroke-linecap':'round',opacity:0});
      svg.appendChild(line);bonds.push(line);
    }
    var cloud=null;
    if(odd){
      var last=dots[n-1];
      cloud=elSvg('ellipse',{cx:last.getAttribute('cx'),cy:cy,rx:26,ry:34,fill:'none',stroke:'#e69138','stroke-width':2.5,'stroke-dasharray':'6 4',opacity:0});
      svg.appendChild(cloud);
    }
    container.appendChild(svg);

    if(reduced||mode==='static'){
      for(var p=0;p<pairs;p++){
        bonds[p].setAttribute('opacity',1);
        dots[p*2].setAttribute('cx',cx0+(p*2+1)*gap-12);
        dots[p*2+1].setAttribute('cx',cx0+(p*2+1)*gap-6);
      }
      if(cloud)cloud.setAttribute('opacity',1);
      return;
    }
    /* 动画：成对圆点向中间靠拢 + 连线亮起；落单点原地圈出 */
    for(var p=0;p<pairs;p++){
      (function(pairIdx,left,right,line){
        setTimeout(function(){
          left.style.transition='cx .5s '+window._ease;
          right.style.transition='cx .5s '+window._ease;
          left.setAttribute('cx',(cx0+(pairIdx*2+1)*gap-14));
          right.setAttribute('cx',(cx0+(pairIdx*2+1)*gap+2));
          setTimeout(function(){
            line.style.transition='opacity .3s '+window._ease;
            line.setAttribute('opacity',1);
          },260);
        },pairIdx*220+120);
      })(p,dots[p*2],dots[p*2+1],bonds[p]);
    }
    if(cloud){
      setTimeout(function(){
        cloud.style.transition='opacity .4s '+window._ease;
        cloud.setAttribute('opacity',1);
      },pairs*220+180);
    }
  }

  /* ---------- 关卡流程 ---------- */
  function loadLevel(lv){
    level=lv; pool=LEVELS[lv].nums.slice(); oddArr=[]; evenArr=[]; selected=null; doneCount=0;
    $('badge').textContent=LEVELS[lv].label;
    $('progress').textContent='0 / '+pool.length+' 归队';
    renderPool(); renderCamps(); clearDiag();
    $('fb').className='fb';
    $('fb').textContent= lv===2 ? '换新东西啦：袜子要两两配对，还是一样的玩法！' : '点一张数字卡片，看看它去哪个营。';
  }
  function clearDiag(){
    $('diagram').innerHTML='';
  }
  function renderPool(){
    var poolEl=$('pool');poolEl.innerHTML='';
    pool.forEach(function(v){
      var b=document.createElement('button');
      b.className='card'; b.type='button'; b.dataset.v=v;
      b.textContent=v;
      b.addEventListener('pointerdown',onCardDown);
      poolEl.appendChild(b);
    });
  }
  function renderCamps(){
    $('oddNums').textContent=oddArr.join(' · ');
    $('evenNums').textContent=evenArr.join(' · ');
    $('oddCount').textContent=oddArr.length+' 张';
    $('evenCount').textContent=evenArr.length+' 张';
    $('progress').textContent=doneCount+' / '+pool.length+' 归队';
  }

  /* ---------- 点卡片 → 看配对 ---------- */
  function showPair(v){
    var diag=$('diagram');diag.innerHTML='';
    var box=document.createElement('div');
    box.style.cssText='display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;height:100%';
    box.innerHTML='<div style="font-size:clamp(16px,2vw,20px);font-weight:800">'+v+' 个小球，两两拉手试试</div>';
    var wrap=document.createElement('div');
    wrap.style.cssText='flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center';
    box.appendChild(wrap);
    diag.appendChild(box);
    drawPairing(wrap,v,'anim');
    var pairs=Math.floor(v/2);
    setTimeout(function(){
      var isOdd=v%2===1;
      var el=document.createElement('div');
      el.style.cssText='font-size:clamp(16px,2vw,20px);font-weight:800;color:'+(isOdd?'var(--accent)':'var(--ok)');
      el.textContent=isOdd?('剩 1 个没伴 → '+v+' 是奇数'):('全部配对 → '+v+' 是偶数');
      box.appendChild(el);
      var line=$('fb');line.className='fb';
      line.style.background='';
      line.textContent=isOdd?('凑成 '+pairs+' 对，还剩 1 个没伴，'+v+' 是奇数，去奇数营。'):('正好 '+pairs+' 对，'+v+' 是偶数，去偶数营。');
    },pairs*220+420);
  }

  /* ---------- 拖拽（跟手）+ 点选兜底 ---------- */
  var dragEl=null,dragX=0,dragY=0,offX=0,offY=0,placed=false;
  function onCardDown(e){
    e.preventDefault();
    var b=e.currentTarget;
    if(b.classList.contains('done'))return;
    /* 点选兜底：点击（未拖动）就选中看配对 */
    if(!dragEl){
      selected=b;
      clearLift();
      b.classList.add('lift');
      showPair(+b.dataset.v);
    }
    if(e.pointerType==='mouse'&&e.button!==0)return;
    dragEl=b;placed=false;
    dragX=e.clientX;dragY=e.clientY;
    var r=b.getBoundingClientRect();
    offX=dragX-r.left;offY=dragY-r.top;
    b.classList.add('dragging');
    b.style.left=r.left+'px';b.style.top=r.top+'px';
    b.style.position='fixed';b.style.margin='0';
    b.style.transform='translate3d(0,0,0) scale(1.06)';
    b.style.transition='none';
    b.setPointerCapture(e.pointerId);
    window.addEventListener('pointermove',onDragMove);
    window.addEventListener('pointerup',onDragUp);
  }
  function onDragMove(e){
    if(!dragEl)return;
    dragX=e.clientX;dragY=e.clientY;
    dragEl.style.left=(dragX-offX)+'px';
    dragEl.style.top=(dragY-offY)+'px';
    /* 营区高亮 */
    $('campOdd').classList.remove('hot');$('campEven').classList.remove('hot');
    var over=document.elementFromPoint(e.clientX,e.clientY);
    var c=over&&over.closest?over.closest('.camp'):null;
    if(c)c.classList.add('hot');
  }
  function onDragUp(e){
    if(!dragEl)return;
    window.removeEventListener('pointermove',onDragMove);
    window.removeEventListener('pointerup',onDragUp);
    var el=dragEl;dragEl=null;
    var over=document.elementFromPoint(e.clientX,e.clientY);
    var camp=over&&over.closest?over.closest('.camp'):null;
    el.classList.remove('dragging','lift');
    el.style.position='';el.style.left='';el.style.top='';el.style.margin='';
    el.style.transform='';
    el.style.transition='';
    if(camp&&!placed){
      placed=true;
      placeCard(el,camp.id==='campOdd'?'odd':'even');
    }else{
      /* 没拖进营：视为点了卡片，保持选中看配对 */
      selected=el;
      clearLift();
      el.classList.add('lift');
    }
    $('campOdd').classList.remove('hot');$('campEven').classList.remove('hot');
  }

  function placeCard(el,kind){
    var v=+el.dataset.v,isOdd=v%2===1;
    var right=(kind==='odd')===isOdd;
    if(right){
      if(kind==='odd')oddArr.push(v);else evenArr.push(v);
      el.classList.add('done');doneCount++;
      renderCamps();
      $('fb').className='fb ok';
      $('fb').textContent=(isOdd?('对！'+v+' 两两拉手剩 1 个，是奇数，进奇数营。'):('对！'+v+' 刚好配成对，是偶数，进偶数营。'))+' 个位是 '+(v%10)+'。';
      if(doneCount===pool.length)setTimeout(win,600);
    }else{
      el.classList.add('wrong');
      setTimeout(function(){el.classList.remove('wrong')},450);
      $('fb').className='fb bad';
      $('fb').textContent=isOdd
        ?('再看看：'+v+' 两两拉手后还剩 1 个没伴，所以是奇数，应该去奇数营。')
        :('再看看：'+v+' 刚好全配成对，所以是偶数，应该去偶数营。');
      showPair(v);
    }
  }

  function win(){
    if(level<2){
      $('fb').className='fb celebrate';
      $('fb').textContent='全部归队！下一关数字更大，加油！';
      setTimeout(function(){loadLevel(level+1)},1100);
    }else{
      $('fb').className='fb celebrate';
      $('fb').textContent='太棒啦！全部归队！';
      setTimeout(showFinish,700);
    }
  }
  function showFinish(){
    var card=$('app');
    card.innerHTML='<div class="finish">'+
      '<div class="big">🏆</div>'+
      '<h2>奇偶分队完成！</h2>'+
      '<div class="rule">你发现了吗？<br>偶数个位都是 <strong>0、2、4、6、8</strong>；<br>奇数个位都是 <strong>1、3、5、7、9</strong>。</div>'+
      '<button type="button" class="again" id="btnAgain">再玩一次</button>'+
      '</div>';
    $('btnAgain').onclick=function(){location.reload();};
  }

  /* ---------- 控件 ---------- */
  $('btnReset').onclick=function(){loadLevel(level);};
  $('campOdd').addEventListener('click',function(){
    if(selected&&!selected.classList.contains('done')){
      var el=selected;selected=null;el.classList.remove('lift');placeCard(el,'odd');
    }
  });
  $('campEven').addEventListener('click',function(){
    if(selected&&!selected.classList.contains('done')){
      var el=selected;selected=null;el.classList.remove('lift');placeCard(el,'even');
    }
  });

  /* ---------- 开场演示 ---------- */
  window._ease='cubic-bezier(.25,1,.5,1)';
  var demoTimer=null;
  function demoReset(){
    clearTimeout(demoTimer);
    $('demoLine').textContent='5 个小球，能两两拉手吗？';
    $('demoBadge').textContent='';$('demoBadge').className='dbadge';
    var wrap=$('demoSvg');wrap.innerHTML='';
    drawPairing(wrap,5,'anim');
    demoTimer=setTimeout(function(){
      $('demoBadge').textContent='5 剩 1 个 → 奇数';
      $('demoBadge').className='dbadge odd';
    },1900);
  }
  $('btnSkip').onclick=function(){closeOverlay();};
  $('btnDemoGo').onclick=function(){closeOverlay();};
  function closeOverlay(){
    clearTimeout(demoTimer);
    $('overlay').classList.add('hidden');
  }
  demoReset();
  loadLevel(0);
})();
</script>
</body>
</html>
