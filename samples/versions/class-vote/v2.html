<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08-40-46">
<meta name="aid-version-note" content="系统重跑 2026-08-14T08-40-46">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>班级点心投票 · 条形统计图</title>
<style>
  :root{
    --ink:#1e3a5f;
    --accent:#f59e0b;
    --accent-deep:#d97706;
    --ok:#2fbf71;
    --bad:#e85d5d;
    --card:#ffffff;
    --bg:#eef3f9;
    --line:#c9d6e4;
    --muted:#5b7a9d;
    --cell:#e8f1fb;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100dvh;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
  }
  button{font-family:inherit;border:none;cursor:pointer;touch-action:manipulation;}

  /* ---------- 场景容器 ---------- */
  #app{height:100dvh;display:flex;flex-direction:column;max-width:min(1240px,100%);margin:0 auto;padding:10px clamp(10px,2vw,26px) 12px;}
  .scene{display:none;flex-direction:column;flex:1;min-height:0;}
  .scene.on{display:flex;}

  .topbar{display:flex;align-items:center;gap:10px;padding-bottom:8px;}
  .topbar h1{font-size:clamp(20px,3.2vw,30px);font-weight:900;letter-spacing:.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .step-chip{font-size:clamp(13px,2vw,16px);font-weight:800;color:var(--accent-deep);background:#fff7e6;border:2px solid var(--accent);border-radius:999px;padding:4px 14px;white-space:nowrap;}
  .icon-btn{
    min-width:52px;min-height:52px;border-radius:14px;background:var(--card);border:2px solid var(--line);
    font-size:clamp(18px,2.4vw,24px);font-weight:800;color:var(--ink);padding:6px 12px;
  }
  .icon-btn:active{transform:scale(.96);}

  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  .stage svg{width:100%;height:100%;max-height:100%;}

  .dock{margin-top:auto;padding-top:8px;display:flex;flex-direction:column;gap:10px;}
  .hint{
    font-size:clamp(16px,2.2vw,20px);font-weight:700;color:var(--ink);text-align:left;
    background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:10px 16px;
    display:flex;align-items:center;gap:10px;
  }
  .hint .badge{
    background:var(--accent);color:#fff;font-weight:900;border-radius:999px;
    min-width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none;
  }
  .big-btn{
    min-height:64px;border-radius:var(--r);background:var(--accent);color:#fff;
    font-size:clamp(20px,3vw,28px);font-weight:900;padding:10px 22px;box-shadow:0 4px 0 var(--accent-deep);
    transition:transform .12s,box-shadow .12s;
  }
  .big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep);}
  .big-btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);}
  .big-btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--accent-deep);}

  .opt-row{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;}
  .opt{
    flex:1;min-width:110px;min-height:64px;border-radius:var(--r);background:var(--card);
    border:3px solid var(--line);font-size:clamp(18px,2.4vw,24px);font-weight:900;color:var(--ink);
    padding:8px 12px;display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .15s,transform .12s;
  }
  .opt small{font-size:clamp(13px,1.8vw,16px);font-weight:700;color:var(--muted);}
  .opt:active{transform:scale(.97);}
  .opt.right{border-color:var(--ok);background:#eafaf1;color:#157a44;}
  .opt.wrong{border-color:var(--bad);background:#fdeeee;color:#b33737;animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .feedback{
    border-radius:var(--r);padding:10px 16px;font-size:clamp(16px,2.2vw,20px);font-weight:800;line-height:1.5;text-align:left;
    display:none;border:2px solid;
  }
  .feedback.show{display:block;}
  .feedback.good{background:#eafaf1;border-color:var(--ok);color:#157a44;}
  .feedback.bad{background:#fdeeee;border-color:var(--bad);color:#b33737;}
  .feedback small{display:block;font-weight:700;font-size:clamp(13px,1.8vw,16px);color:var(--muted);margin-top:4px;}

  .sub-row{display:flex;gap:10px;}
  .sub-row .big-btn{flex:1;}

  /* ---------- SVG 样式 ---------- */
  svg text{user-select:none;}
  .bar-num{font-size:26px;font-weight:900;fill:var(--ink);text-anchor:middle;}
  .bar-num.small{font-size:20px;}
  .axis{stroke:var(--line);stroke-width:3;}
  .tick{stroke:var(--line);stroke-width:2;}
  .tick-label{font-size:15px;font-weight:700;fill:var(--muted);text-anchor:end;}
  .cell{fill:var(--cell);stroke:#c3d6ea;stroke-width:1.5;transform:translateY(22px);opacity:0;
        transition:transform .28s cubic-bezier(.25,1,.5,1),opacity .28s;}
  .cell.on{transform:translateY(0);opacity:1;}
  .cell.hot{fill:#ffe3a8;stroke:var(--accent);stroke-width:2.5;}
  .cell.diff{fill:#ffd77a;stroke:var(--accent);stroke-width:2.5;}
  .kid{transition:transform .32s cubic-bezier(.25,1,.5,1),opacity .25s;}
  .kid.done{opacity:.12;}
  .spark{opacity:0;transition:opacity .2s,transform .45s cubic-bezier(.25,1,.5,1);}
  .spark.pop{opacity:1;transform:translateY(-6px);}
  .dish-name{font-size:clamp(15px,2.2vw,20px);font-weight:900;fill:var(--ink);text-anchor:middle;}
  .crown{opacity:0;transform:scale(.4);transform-origin:center;transition:opacity .25s,transform .45s cubic-bezier(.25,1,.5,1);}
  .crown.on{opacity:1;transform:scale(1);animation:bob 1.4s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.05) translateY(-4px)}}
  .quest-label{font-size:clamp(18px,2.6vw,26px);font-weight:900;fill:var(--ink);text-anchor:middle;}
  .sub-label{font-size:16px;font-weight:700;fill:var(--muted);text-anchor:middle;}
  .opt-icon{pointer-events:none;}

  /* ---------- 开场演示 ---------- */
  #overlay{
    position:fixed;inset:0;z-index:50;background:rgba(30,58,95,.92);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;
  }
  #overlay.hide{display:none;}
  #overlay h2{font-size:clamp(22px,4vw,36px);font-weight:900;}
  #overlay p{font-size:clamp(16px,2.6vw,22px);font-weight:700;color:#cfe3ff;max-width:560px;line-height:1.6;}
  #demoBox{background:var(--card);border-radius:18px;padding:10px;width:min(620px,92vw);}
  #demoBox svg{width:100%;display:block;}
  #overlay .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .ov-btn{
    min-height:60px;border-radius:16px;padding:10px 26px;font-size:clamp(18px,2.8vw,24px);font-weight:900;
    background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-deep);
  }
  .ov-btn.ghost{background:transparent;border:2px solid #cfe3ff;color:#cfe3ff;box-shadow:none;}

  /* ---------- 庆祝 ---------- */
  #celebrate{position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:var(--r);background:linear-gradient(180deg,#fff7e6,#ffe9c2);}
  #celebrate .star{position:absolute;font-size:26px;opacity:0;animation:fall 1.1s ease-out forwards;}
  @keyframes fall{0%{opacity:0;transform:translateY(-30px) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translateY(120px) rotate(40deg)}}
  #celebrate .king{font-size:clamp(46px,9vw,88px);line-height:1;}
  #celebrate h2{font-size:clamp(26px,5vw,44px);font-weight:900;text-align:center;}
  #celebrate p{font-size:clamp(18px,3vw,26px);font-weight:800;color:var(--muted);text-align:center;}
  .cele-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;z-index:2;}

  .q-wrap{display:none;flex-direction:column;gap:10px;}
  .q-wrap.on{display:flex;}
  .q-title{font-size:clamp(18px,2.6vw,24px);font-weight:900;text-align:left;}

  /* ---------- 矮屏 ---------- */
  @media (max-height:660px){
    .hint{font-size:15px;padding:6px 12px;}
    .hint .badge{min-width:28px;height:28px;font-size:16px;}
    #overlay p{font-size:15px;}
    #overlay h2{font-size:22px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .cell{transform:none;opacity:0;}
    .cell.on{opacity:1;}
    .kid.done{opacity:.12;}
    .crown.on{animation:none;transform:scale(1);}
  }
</style>
</head>
<body>

<!-- ============ 开场演示 ============ -->
<div id="overlay">
  <h2>班级点心投票</h2>
  <p>全班投票决定下午点心吃什么。<br>点一下点心，一个小豆人就投一票，柱子长一格。</p>
  <div id="demoBox">
    <svg viewBox="0 0 620 200" role="img" aria-label="演示：点饼干，柱子长一格">
      <g id="demoBar">
        <line x1="60" y1="170" x2="320" y2="170" stroke="#c9d6e4" stroke-width="3"/>
        <rect id="demoCell" x="140" y="146" width="90" height="24" rx="5" fill="#e8f1fb" stroke="#c3d6ea" stroke-width="1.5" opacity="0"/>
        <rect x="140" y="146" width="90" height="24" rx="5" fill="#ffe3a8" stroke="#f59e0b" stroke-width="2.5" opacity="0" id="demoCell2"/>
        <text x="185" y="136" text-anchor="middle" font-size="20" font-weight="900" fill="#1e3a5f" id="demoNum">0</text>
      </g>
      <g stroke="#1e3a5f" stroke-width="2" stroke-linecap="round" fill="none" id="demoKid">
        <circle cx="0" cy="0" r="13" fill="#2f6fbf"/>
        <circle cx="-4.5" cy="-3" r="2.2" fill="#fff" stroke="none"/>
        <circle cx="4.5" cy="-3" r="2.2" fill="#fff" stroke="none"/>
        <circle cx="-4.5" cy="-3" r="1" fill="#1e3a5f" stroke="none"/>
        <circle cx="4.5" cy="-3" r="1" fill="#1e3a5f" stroke="none"/>
        <path d="M-10 10 L-14 20 M10 10 L14 20 M-6 22 L-10 34 M6 22 L10 34"/>
      </g>
      <g transform="translate(420,150)">
        <circle cx="0" cy="26" r="34" fill="#e8c07d" stroke="#1e3a5f" stroke-width="2.5"/>
        <circle cx="0" cy="16" r="4" fill="#fff" stroke="none"/>
        <circle cx="-14" cy="24" r="4" fill="#fff" stroke="none"/>
        <circle cx="14" cy="24" r="4" fill="#fff" stroke="none"/>
        <circle cx="-9" cy="42" r="4" fill="#fff" stroke="none"/>
        <circle cx="9" cy="42" r="4" fill="#fff" stroke="none"/>
        <ellipse cx="0" cy="70" rx="46" ry="9" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
        <text x="0" y="102" text-anchor="middle" font-size="18" font-weight="900" fill="#1e3a5f">小饼干</text>
      </g>
      <text x="90" y="36" font-size="16" font-weight="800" fill="#5b7a9d">点一下 → 豆人去投一票</text>
    </svg>
  </div>
  <div class="row">
    <button class="ov-btn ghost" id="skipDemo">跳过</button>
    <button class="ov-btn" id="startDemo">开始投票</button>
  </div>
</div>

<div id="app">

  <!-- ============ 幕 1：投票 ============ -->
  <section class="scene on" id="scene-vote">
    <div class="topbar">
      <span class="step-chip">第 1 步 · 投票</span>
      <h1>点心投票</h1>
      <button class="icon-btn" id="undoBtn" disabled>退一票</button>
    </div>
    <div class="stage">
      <svg viewBox="0 0 800 460" role="img" aria-label="点心投票条形图">
        <!-- 豆人队伍 -->
        <g id="kidRow"></g>
        <text x="16" y="80" font-size="15" font-weight="800" fill="#5b7a9d">小朋友</text>

        <!-- 轴 -->
        <line class="axis" x1="96" y1="318" x2="786" y2="318"/>
        <g id="yTicksVote"></g>

        <!-- 四根柱子 -->
        <g id="colsVote"></g>

        <!-- 点心盘（可点） -->
        <g id="dishesVote"></g>
      </svg>
    </div>
    <div class="dock">
      <div class="hint">
        <span class="badge" id="voteCount">0</span>
        <span id="voteHint">点点心，帮小豆人投票。一人 1 票，一共 12 个小朋友。</span>
      </div>
      <button class="big-btn" id="finishBtn" style="display:none">投完啦，数一数 →</button>
    </div>
  </section>

  <!-- ============ 幕 2：数一数 ============ -->
  <section class="scene" id="scene-count">
    <div class="topbar">
      <span class="step-chip">第 2 步 · 数一数</span>
      <h1 id="countTitle">数一数，比一比</h1>
    </div>
    <div class="stage">
      <svg viewBox="0 0 800 400" role="img" aria-label="点心票数条形图">
        <line class="axis" x1="96" y1="320" x2="786" y2="320"/>
        <g id="yTicksCount"></g>
        <g id="colsCount"></g>
        <g id="crownG"></g>
      </svg>
    </div>
    <div class="dock">
      <div class="q-wrap on" id="q1">
        <div class="q-title">Q1：哪种点心票数<b style="color:var(--accent-deep)">最多</b>？</div>
        <div class="opt-row" id="q1Opts"></div>
        <div class="feedback" id="q1Fb"></div>
      </div>
      <div class="q-wrap" id="q2">
        <div class="q-title">Q2：哪种点心票数<b style="color:var(--accent-deep)">最少</b>？</div>
        <div class="opt-row" id="q2Opts"></div>
        <div class="feedback" id="q2Fb"></div>
      </div>
      <div class="q-wrap" id="q3">
        <div class="q-title">Q3：最多的比最少的<b style="color:var(--accent-deep)">多几票</b>？</div>
        <div class="opt-row" id="q3Opts"></div>
        <div class="feedback" id="q3Fb"></div>
      </div>
      <button class="big-btn" id="nextBtn" style="display:none">下一题 →</button>
      <button class="big-btn" id="resultBtn" style="display:none">公布冠军 🏆</button>
    </div>
  </section>

  <!-- ============ 幕 3：冠军 + 举一反三入口 ============ -->
  <section class="scene" id="scene-win">
    <div class="topbar">
      <span class="step-chip">第 3 步 · 公布</span>
      <h1>投票结果</h1>
    </div>
    <div id="celebrate">
      <div class="king" id="kingEmoji">👑</div>
      <h2 id="winTitle">冠军是小饼干！</h2>
      <p id="winDesc">它得了 5 票，是全班最喜欢的点心。</p>
      <div class="cele-btns">
        <button class="big-btn ghost" id="replayBtn">再投一次</button>
        <button class="big-btn" id="springBtn">换个题目：春游投票 →</button>
      </div>
    </div>
  </section>

  <!-- ============ 幕 4：举一反三（春游投票） ============ -->
  <section class="scene" id="scene-spring">
    <div class="topbar">
      <span class="step-chip">举一反三</span>
      <h1>春游去哪儿？</h1>
    </div>
    <div class="stage">
      <svg viewBox="0 0 800 440" role="img" aria-label="春游投票条形图">
        <g id="kidRowS"></g>
        <text x="16" y="80" font-size="15" font-weight="800" fill="#5b7a9d">小朋友</text>
        <line class="axis" x1="96" y1="318" x2="730" y2="318"/>
        <g id="yTicksSpring"></g>
        <g id="colsSpring"></g>
        <g id="dishesSpring"></g>
      </svg>
    </div>
    <div class="dock">
      <div class="hint">
        <span class="badge" id="voteCountS">0</span>
        <span id="voteHintS">6 个小朋友投票：动物园、海洋馆、科技馆，你想去哪就点哪。</span>
      </div>
      <div class="q-wrap" id="springQ" style="display:none">
        <div class="q-title">Q：哪个地方票数<b style="color:var(--accent-deep)">最多</b>？</div>
        <div class="opt-row" id="springOpts"></div>
        <div class="feedback" id="springFb"></div>
      </div>
      <button class="big-btn" id="springNext" style="display:none">结果出来啦，比一比 →</button>
      <button class="big-btn" id="springAgain" style="display:none">再投一次</button>
    </div>
  </section>

</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ================= 工具 ================= */
  function makeKid(x,y,scale){
    var s = scale||1;
    var g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','kid');
    g.innerHTML =
      '<circle class="kbody" r="'+(13*s)+'" fill="#2f6fbf" stroke="#1e3a5f" stroke-width="2"/>'+
      '<circle cx="'+(4.5*s)+'" cy="'+(-3*s)+'" r="'+(2.4*s)+'" fill="#fff" stroke="none"/>'+
      '<circle cx="'+(4.5*s)+'" cy="'+(-3*s)+'" r="'+(1.1*s)+'" fill="#1e3a5f" stroke="none"/>'+
      '<circle cx="'+(4.5*s)+'" cy="'+(1*s)+'" r="'+(1.1*s)+'" fill="#1e3a5f" stroke="none"/>'+
      '<path d="M-10 10 L-15 20 M10 10 L15 20 M-6 23 L-11 35 M6 23 L11 35" transform="scale('+s+')" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>';
    g.setAttribute('transform','translate('+x+','+y+')');
    return g;
  }

  function setKidPos(g,x,y,animate){
    if(!animate || REDUCED){ g.style.transition='none'; }
    else { g.style.transition='transform .32s cubic-bezier(.25,1,.5,1), opacity .25s'; }
    g.style.transform='translate('+x+'px,'+y+'px)';
  }

  function buildCols(svgId, colsId, centers, cellW, cellH, maxN, baseY, withCells){
    var g = $('#'+colsId);
    g.innerHTML='';
    centers.forEach(function(cx,i){
      var col = document.createElementNS('http://www.w3.org/2000/svg','g');
      col.setAttribute('data-col',i);
      col.innerHTML = '<text class="bar-num small" x="'+cx+'" y="'+(baseY-cellH*maxN-14)+'"></text>';
      if(withCells){
        var cells='';
        for(var n=1;n<=maxN;n++){
          cells += '<rect class="cell" x="'+(cx-cellW/2)+'" y="'+(baseY-n*cellH)+'" width="'+cellW+'" height="'+(cellH-3)+'" rx="4"/>';
        }
        col.insertAdjacentHTML('beforeend',cells);
      }
      g.appendChild(col);
    });
  }

  function setCol(colEl, n, cellH, maxN, baseY){
    var num = colEl.querySelector('.bar-num');
    num.textContent = n;
    num.setAttribute('y', baseY - n*cellH - 16);
    var cells = colEl.querySelectorAll('.cell');
    for(var i=0;i<cells.length;i++){
      var idx = i+1;
      if(idx<=n){ cells[i].classList.add('on'); }
      else { cells[i].classList.remove('on'); }
    }
  }

  function sparkAt(svgEl, x, y){
    var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('class','spark');
    c.setAttribute('cx',x); c.setAttribute('cy',y);
    c.setAttribute('r','7'); c.setAttribute('fill','#f59e0b');
    svgEl.appendChild(c);
    requestAnimationFrame(function(){ c.classList.add('pop'); });
    setTimeout(function(){ if(c.parentNode) c.parentNode.removeChild(c); },500);
  }

  /* ================= 数据 ================= */
  var NAMES = ['小饼干','草莓果冻','酸奶','纸杯蛋糕'];
  var COLORS = ['#e8c07d','#f7c8d8','#cfe8f7','#f9e2b8'];
  var CENTERS = [130,330,530,730];
  var CELLW = 76, CELLH = 20, BASEY = 318, MAXN = 12;
  var kids = [];        // 12 个豆人
  var votes = [0,0,0,0];
  var total = 0, lock = false;

  /* ================= 幕 1 初始化 ================= */
  function drawKidsRow(svgId, n, y, scale, arr){
    var g = $('#'+svgId); g.innerHTML='';
    arr.length = 0;
    for(var i=0;i<n;i++){
      var x = 40 + i*61;
      var k = makeKid(x,y,scale||1);
      g.appendChild(k);
      arr.push({el:k, x:x, y:y, used:false});
    }
  }

  function buildDishes(svgId, centers, names, colors, onClick){
    var g = $('#'+svgId); g.innerHTML='';
    centers.forEach(function(cx,i){
      var grp = document.createElementNS('http://www.w3.org/2000/svg','g');
      var dish = dishesSVG(colors[i], i);
      grp.innerHTML = dish;
      var content = grp.querySelector('.dish-inner');
      content.setAttribute('transform','translate('+cx+',390)');
      grp.innerHTML += '<rect x="'+(cx-60)+'" y="318" width="120" height="142" fill="transparent" class="dish-hit"/>';
      grp.insertAdjacentHTML('beforeend','<text class="dish-name" x="'+cx+'" y="452">'+names[i]+'</text>');
      grp.querySelector('.dish-hit').addEventListener('click', function(ev){
        ev.stopPropagation(); onClick(i);
      });
      g.appendChild(grp);
    });
  }

  function dishesSVG(color, kind){
    var base = '<g class="dish-inner" stroke="#1e3a5f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">';
    if(kind===0){ // 饼干
      base += '<circle cx="0" cy="-8" r="34" fill="'+color+'"/>'+
              '<circle cx="0" cy="-18" r="4.5" fill="#fff" stroke="none"/>'+
              '<circle cx="-15" cy="-8" r="4.5" fill="#fff" stroke="none"/>'+
              '<circle cx="15" cy="-8" r="4.5" fill="#fff" stroke="none"/>'+
              '<circle cx="-10" cy="6" r="4.5" fill="#fff" stroke="none"/>'+
              '<circle cx="10" cy="6" r="4.5" fill="#fff" stroke="none"/>';
    } else if(kind===1){ // 草莓果冻
      base += '<path d="M-26 30 L-20 -12 Q0 -26 20 -12 L26 30 Q0 42 -26 30 Z" fill="'+color+'"/>'+
              '<path d="M0 -24 Q-6 -34 -14 -32 M0 -24 Q6 -34 14 -32" fill="none"/>'+
              '<circle cx="-10" cy="6" r="5" fill="#e85d5d" stroke="none"/>'+
              '<circle cx="6" cy="12" r="5" fill="#e85d5d" stroke="none"/>'+
              '<circle cx="10" cy="-2" r="5" fill="#e85d5d" stroke="none"/>';
    } else if(kind===2){ // 酸奶
      base += '<path d="M-24 28 L-20 -16 Q0 -30 20 -16 L24 28 Q0 40 -24 28 Z" fill="'+color+'"/>'+
              '<rect x="-18" y="-30" width="36" height="12" rx="4" fill="#fff"/>'+
              '<path d="M10 -30 L22 -46 M16 -44 L22 -50" fill="none" stroke="#1e3a5f" stroke-width="2.5"/>';
    } else { // 纸杯蛋糕
      base += '<path d="M-24 30 L-18 -2 Q0 -18 18 -2 L24 30 Q0 42 -24 30 Z" fill="#f0d9b5"/>'+
              '<path d="M-20 -8 Q-26 -20 -18 -30 Q-8 -40 0 -28 Q8 -40 18 -30 Q26 -20 20 -8 Q10 -18 0 -12 Q-10 -18 -20 -8 Z" fill="'+color+'"/>'+
              '<circle cx="0" cy="-26" r="4.5" fill="#e85d5d"/>';
    }
    base += '<ellipse cx="0" cy="44" rx="46" ry="9" fill="#fff"/>'+
            '</g>';
    return base;
  }

  function buildYticks(svgId, baseY, cellH, maxN, x1){
    var g = $('#'+svgId); g.innerHTML='';
    var line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',baseY); line.setAttribute('x2',x1); line.setAttribute('y2',baseY-cellH*maxN-4);
    line.setAttribute('class','axis'); g.appendChild(line);
    for(var v=0;v<=maxN;v+=3){
      var y = baseY - v*cellH;
      var tk = document.createElementNS('http://www.w3.org/2000/svg','line');
      tk.setAttribute('x1',x1); tk.setAttribute('y1',y); tk.setAttribute('x2',x1+8); tk.setAttribute('y2',y);
      tk.setAttribute('class','tick'); g.appendChild(tk);
      var tx = document.createElementNS('http://www.w3.org/2000/svg','text');
      tx.setAttribute('x',x1-8); tx.setAttribute('y',y+5);
      tx.setAttribute('class','tick-label'); tx.textContent = v;
      g.appendChild(tx);
    }
  }

  /* 投票逻辑 */
  function doVote(i){
    if(lock || total>=12 || votes[i]>=12) return;
    lock = true;
    // 找出一个未投豆人
    var k = null;
    for(var j=0;j<kids.length;j++){ if(!kids[j].used){ k=kids[j]; break; } }
    if(!k){ lock=false; return; }
    k.used = true;
    var dishX = CENTERS[i], dishY = 350;
    setKidPos(k.el, dishX, dishY, true);
    setTimeout(function(){
      k.el.classList.add('done');
      votes[i]++; total++;
      var col = document.querySelector('#colsVote [data-col="'+i+'"]');
      setCol(col, votes[i], CELLH, MAXN, BASEY);
      sparkAt($('scene-vote').querySelector('svg'), dishX, BASEY - votes[i]*CELLH + 10);
      $('voteCount').textContent = total;
      if(total>=12){
        $('finishBtn').style.display='block';
        $('voteHint').textContent = '12 个小朋友都投完啦！';
      }
      lock = false;
    }, REDUCED?0:320);
  }

  function undoVote(){
    if(lock || total===0) return;
    // 找最后投出的豆人（used 且最晚）
    var last = -1;
    for(var j=kids.length-1;j>=0;j--){ if(kids[j].used){ last=j; break; } }
    if(last<0) return;
    // 找它投给了谁：由它位置判断（简化：减少票数最多的点心？不行）
    // 记录历史：lastVote 数组存每次投的 index
    var idx = history.pop();
    if(idx===undefined) return;
    var k = kids[last];
    k.used=false; k.el.classList.remove('done');
    setKidPos(k.el, k.x, k.y, true);
    votes[idx] = Math.max(0, votes[idx]-1);
    total--;
    var col = document.querySelector('#colsVote [data-col="'+idx+'"]');
    setCol(col, votes[idx], CELLH, MAXN, BASEY);
    $('voteCount').textContent = total;
    $('finishBtn').style.display='none';
    $('voteHint').textContent = '退掉 1 票，再点点心重新投。';
  }
  var history = [];

  /* ================= 幕 1 装配 ================= */
  function setupVote(){
    votes=[0,0,0,0]; total=0; history=[]; lock=false;
    buildCols('scene-vote','colsVote',CENTERS,CELLW,CELLH,MAXN,BASEY,true);
    buildYticks('yTicksVote',BASEY,CELLH,MAXN,96);
    buildDishes('dishesVote',CENTERS,NAMES,COLORS,function(i){
      history.push(i);
      doVote(i);
    });
    drawKidsRow('kidRow',12,34,0.85,kids);
    $('voteCount').textContent='0';
    $('finishBtn').style.display='none';
    $('voteHint').textContent='点点心，帮小豆人投票。一人 1 票，一共 12 个小朋友。';
    $('undoBtn').disabled = true;
    updateUndo();
  }

  function updateUndo(){
    $('undoBtn').disabled = (total===0 || lock);
  }

  $('undoBtn').addEventListener('click', function(){
    undoVote(); updateUndo();
  });

  $('finishBtn').addEventListener('click', function(){
    showScene('scene-count');
    setupCount();
  });

  /* ================= 幕 2：数一数 ================= */
  var qMax, qMin, diff;
  function setupCount(){
    qMax = [], qMin = [];
    var maxV = Math.max.apply(null,votes), minV = Math.min.apply(null,votes);
    votes.forEach(function(v,i){ if(v===maxV) qMax.push(i); if(v===minV) qMin.push(i); });
    diff = maxV - minV;

    buildCols('scene-count','colsCount',CENTERS,CELLW+12,CELLH,MAXN,320,true);
    buildYticks('yTicksCount',320,CELLH,MAXN,96);
    var g = $('colsCount');
    // 竖排数字放大 + 点心名
    CENTERS.forEach(function(cx,i){
      var col = g.querySelector('[data-col="'+i+'"]');
      var num = col.querySelector('.bar-num');
      num.classList.remove('small');
      num.setAttribute('y', 320 - votes[i]*CELLH - 18);
      num.textContent = votes[i];
      col.insertAdjacentHTML('beforeend','<text class="dish-name" x="'+cx+'" y="362">'+NAMES[i]+'</text>');
      // 高亮满格
      var cells = col.querySelectorAll('.cell');
      for(var n=0;n<cells.length;n++){
        if(n+1<=votes[i]) cells[n].classList.add('hot');
      }
    });
    $('crownG').innerHTML='';
    showQ('q1'); hideFb('q1Fb'); hideFb('q2Fb'); hideFb('q3Fb');
    $('nextBtn').style.display='none';
    $('resultBtn').style.display='none';
    $('countTitle').textContent = '数一数，比一比';
    buildOpts('q1Opts', NAMES, q1Pick);
    buildOpts('q2Opts', NAMES, q2Pick);
    buildDiffOpts();
  }

  function buildOpts(id, names, handler){
    var box = $(id); box.innerHTML='';
    names.forEach(function(name,i){
      var b = document.createElement('button');
      b.className='opt';
      b.innerHTML = name;
      b.addEventListener('click', function(){ handler(i,b); });
      box.appendChild(b);
    });
  }

  function buildDiffOpts(){
    var box = $('q3Opts'); box.innerHTML='';
    var opts=[diff];
    var cands=[diff+1, diff+2];
    if(diff-1>0) cands.unshift(diff-1);
    for(var i=0;i<cands.length && opts.length<3;i++){
      if(opts.indexOf(cands[i])<0) opts.push(cands[i]);
    }
    while(opts.length<3){ opts.push(diff+1+opts.length); }
    opts.forEach(function(v){
      var b=document.createElement('button');
      b.className='opt';
      b.textContent = v+' 票';
      b.addEventListener('click', function(){ q3Pick(v,b); });
      box.appendChild(b);
    });
  }

  function markPick(btn, ok){
    btn.classList.remove('right','wrong');
    btn.classList.add(ok?'right':'wrong');
  }
  function showFb(id, cls, html){
    var el = $(id); el.className='feedback '+cls+' show'; el.innerHTML=html;
  }
  function hideFb(id){ $(id).className='feedback'; }

  function q1Pick(i,btn){
    var ok = qMax.indexOf(i)>=0;
    markPick(btn, ok);
    if(ok){
      showFb('q1Fb','good','对啦！<b>'+NAMES[i]+'</b> '+votes[i]+' 票，柱子最高。');
      setTimeout(function(){ $('nextBtn').style.display='block'; }, REDUCED?0:500);
    } else {
      var hi = qMax.map(function(x){return NAMES[x];}).join('、');
      showFb('q1Fb','bad','再比一比：你点的 <b>'+NAMES[i]+'</b> 是 '+votes[i]+' 票，它的柱子矮。<br>柱子<b>最高</b>的是 '+hi+'（'+Math.max.apply(null,votes)+' 票）。柱子越高，票越多。');
    }
  }
  function q2Pick(i,btn){
    var ok = qMin.indexOf(i)>=0;
    markPick(btn, ok);
    if(ok){
      showFb('q2Fb','good','对啦！<b>'+NAMES[i]+'</b> '+votes[i]+' 票，柱子最矮。');
      setTimeout(function(){ $('nextBtn').style.display='block'; }, REDUCED?0:500);
    } else {
      var lo = qMin.map(function(x){return NAMES[x];}).join('、');
      showFb('q2Fb','bad','再比一比：你点的 <b>'+NAMES[i]+'</b> 是 '+votes[i]+' 票，它的柱子不矮。<br>柱子<b>最矮</b>的是 '+lo+'（'+Math.min.apply(null,votes)+' 票）。柱子越矮，票越少。');
    }
  }
  function q3Pick(v,btn){
    var ok = (v===diff);
    markPick(btn, ok);
    if(ok){
      showFb('q3Fb','good','对啦！最多 '+Math.max.apply(null,votes)+' 票，最少 '+Math.min.apply(null,votes)+' 票，差 <b>'+diff+' 票</b>。');
      highlightDiff();
      setTimeout(function(){ $('resultBtn').style.display='block'; }, REDUCED?0:500);
    } else {
      showFb('q3Fb','bad','最多是 '+Math.max.apply(null,votes)+' 票，最少是 '+Math.min.apply(null,votes)+' 票。<br>多的减少的：'+Math.max.apply(null,votes)+' − '+Math.min.apply(null,votes)+' = <b>'+diff+'</b>。再数数两根柱子差几个格子。');
    }
  }

  function highlightDiff(){
    var g=$('colsCount');
    qMax.forEach(function(i){
      var col=g.querySelector('[data-col="'+i+'"]');
      var cells=col.querySelectorAll('.cell');
      for(var n=0;n<cells.length;n++){
        if(n+1>Math.min.apply(null,votes) && n+1<=votes[i]){
          cells[n].classList.remove('hot'); cells[n].classList.add('diff');
        }
      }
    });
  }

  function showQ(id){
    ['q1','q2','q3'].forEach(function(q){ $(q).className = (q===id)?'q-wrap on':'q-wrap'; });
  }

  $('nextBtn').addEventListener('click', function(){
    var cur = document.querySelector('.q-wrap.on');
    $('nextBtn').style.display='none';
    if(cur.id==='q1'){ showQ('q2'); }
    else if(cur.id==='q2'){ showQ('q3'); }
  });

  $('resultBtn').addEventListener('click', function(){
    showScene('scene-win');
    setupWin();
  });

  /* ================= 幕 3：冠军 ================= */
  function setupWin(){
    var champ = qMax.length===1 ? qMax[0] : (votes[qMax[0]]>votes[qMax[1]]?qMax[0]:qMax[0]);
    var champIdx = qMax[0];
    $('winTitle').textContent = (qMax.length>1 ? '并列冠军：' : '冠军是 ') + NAMES[champIdx]+'！';
    $('winDesc').textContent = '它得了 '+votes[champIdx]+' 票，是全班最喜欢的点心。';
    var c=$('celebrate');
    c.querySelectorAll('.star').forEach(function(s){ s.remove(); });
    if(!REDUCED){
      var em=['🌟','⭐','✨','🎉','🌟','✨'];
      for(var i=0;i<10;i++){
        var s=document.createElement('span');
        s.className='star';
        s.textContent=em[i%em.length];
        s.style.left=(8+Math.random()*84)+'%';
        s.style.top=(15+Math.random()*40)+'%';
        s.style.animationDelay=(Math.random()*0.6)+'s';
        c.appendChild(s);
      }
    }
  }

  $('replayBtn').addEventListener('click', function(){
    showScene('scene-vote'); setupVote();
  });
  $('springBtn').addEventListener('click', function(){
    showScene('scene-spring'); setupSpring();
  });

  /* ================= 幕 4：举一反三（春游） ================= */
  var SNAMES=['动物园','海洋馆','科技馆'];
  var SCENTERS=[200,400,600];
  var sKids=[], sVotes=[0,0,0], sTotal=0, sLock=false, sHistory=[];

  function springSVG(kind){
    var g='<g class="dish-inner" stroke="#1e3a5f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">';
    if(kind===0){ // 树
      g+='<path d="M0 -30 L-24 6 L24 6 Z" fill="#9fdc9a"/><rect x="-6" y="6" width="12" height="26" fill="#c9a06c"/>';
    } else if(kind===1){ // 波浪+鱼
      g+='<path d="M-30 -6 Q-20 -16 -10 -6 Q0 4 10 -6 Q20 -16 30 -6" fill="none"/>'+
          '<path d="M-30 8 Q-20 -2 -10 8 Q0 18 10 8 Q20 -2 30 8" fill="none"/>'+
          '<path d="M-12 -2 Q-2 -12 8 -2 L2 -6 Q-4 -2 -12 -2 Z" fill="#ffd27a"/>';
    } else { // 火箭
      g+='<path d="M0 -36 Q10 -18 8 0 L-8 0 Q-10 -18 0 -36 Z" fill="#cfe8f7"/>'+
          '<circle cx="0" cy="-10" r="3.5" fill="#fff" stroke="none"/>'+
          '<path d="M-6 0 L-4 14 L4 14 L6 0 Z" fill="#f59e0b"/>'+
          '<path d="M-12 14 Q0 22 12 14" fill="none"/>';
    }
    g+='<ellipse cx="0" cy="44" rx="46" ry="9" fill="#fff"/></g>';
    return g;
  }

  function buildDishesS(){
    var g=$('dishesSpring'); g.innerHTML='';
    SCENTERS.forEach(function(cx,i){
      g.insertAdjacentHTML('beforeend', springSVG(i));
      var inner=g.querySelectorAll('.dish-inner');
      inner[inner.length-1].setAttribute('transform','translate('+cx+',388)');
      g.insertAdjacentHTML('beforeend','<rect x="'+(cx-60)+'" y="318" width="120" height="140" fill="transparent" class="dish-hit"/>');
      g.insertAdjacentHTML('beforeend','<text class="dish-name" x="'+cx+'" y="450">'+SNAMES[i]+'</text>');
      var hit=g.querySelectorAll('.dish-hit');
      hit[hit.length-1].addEventListener('click',function(ev){
        ev.stopPropagation(); sHistory.push(i); doVoteS(i);
      });
    });
  }

  function doVoteS(i){
    if(sLock || sTotal>=6 || sVotes[i]>=6) return;
    sLock=true;
    var k=null;
    for(var j=0;j<sKids.length;j++){ if(!sKids[j].used){ k=sKids[j]; break; } }
    if(!k){ sLock=false; return; }
    k.used=true;
    var dishX=SCENTERS[i], dishY=348;
    setKidPos(k.el, dishX, dishY, true);
    setTimeout(function(){
      k.el.classList.add('done');
      sVotes[i]++; sTotal++;
      var col=document.querySelector('#colsSpring [data-col="'+i+'"]');
      setCol(col, sVotes[i], CELLH, MAXN, 318);
      sparkAt($('scene-spring').querySelector('svg'), dishX, 318 - sVotes[i]*CELLH + 10);
      $('voteCountS').textContent=sTotal;
      if(sTotal>=6){
        $('springNext').style.display='block';
        $('voteHintS').textContent='6 个小朋友都投完啦！';
      }
      sLock=false;
    }, REDUCED?0:320);
  }

  function setupSpring(){
    sVotes=[0,0,0]; sTotal=0; sHistory=[];
    buildCols('scene-spring','colsSpring',SCENTERS,CELLW+10,CELLH,6,318,true);
    buildYticks('yTicksSpring',318,CELLH,6,96);
    buildDishesS();
    drawKidsRow('kidRowS',6,34,0.85,sKids);
    $('voteCountS').textContent='0';
    $('springNext').style.display='none';
    $('springAgain').style.display='none';
    $('springQ').style.display='none';
    $('voteHintS').textContent='6 个小朋友投票：动物园、海洋馆、科技馆，你想去哪就点哪。';
    $('springFb').className='feedback';
    $('springOpts').innerHTML='';
  }

  $('springNext').addEventListener('click', function(){
    $('springNext').style.display='none';
    $('springQ').style.display='flex';
    var maxV=Math.max.apply(null,sVotes);
    var champs=sVotes.map(function(v,i){return v===maxV?i:-1;}).filter(function(x){return x>=0;});
    $('springOpts').innerHTML='';
    SNAMES.forEach(function(name,i){
      var b=document.createElement('button');
      b.className='opt'; b.innerHTML=name;
      b.addEventListener('click',function(){
        var ok=champs.indexOf(i)>=0;
        markPick(b,ok);
        if(ok){
          showFb('springFb','good','对啦！去 <b>'+SNAMES[i]+'</b> 的小朋友最多，'+sVotes[i]+' 票。<br><small>举一反三：换一个投票题目，条形图还是一样好用：点一点、柱子长一格、比高低。</small>');
          $('springAgain').style.display='block';
        } else {
          var hi=champs.map(function(x){return SNAMES[x];}).join('、');
          showFb('springFb','bad','柱子最高的是 <b>'+hi+'</b>（'+maxV+' 票）。'+SNAMES[i]+' 的柱子矮一些，票数少。');
        }
      });
      $('springOpts').appendChild(b);
    });
  });

  $('springAgain').addEventListener('click', function(){
    setupSpring();
  });

  /* ================= 场景切换 ================= */
  function showScene(id){
    var scenes=document.querySelectorAll('.scene');
    for(var i=0;i<scenes.length;i++){ scenes[i].classList.remove('on'); }
    $(id).classList.add('on');
  }

  /* ================= 开场演示 ================= */
  var demoPlaying=false;
  $('skipDemo').addEventListener('click', function(){
    $('overlay').classList.add('hide');
    setupVote();
  });
  $('startDemo').addEventListener('click', function(){
    $('overlay').classList.add('hide');
    setupVote();
    // 播一遍演示动画
    playDemo();
  });

  function playDemo(){
    if(demoPlaying) return; demoPlaying=true;
    var kid=$('demoKid'), cell=$('demoCell'), num=$('demoNum');
    var n=0;
    function step(){
      if(n>=2){ demoPlaying=false; return; }
      kid.style.transition='transform .35s cubic-bezier(.25,1,.5,1)';
      kid.style.transform='translate(360px,120px)';
      setTimeout(function(){
        n++;
        cell.setAttribute('opacity','1');
        num.textContent=n;
        setTimeout(function(){
          kid.style.transition='none';
          kid.style.transform='translate(40px,120px)';
          setTimeout(step,350);
        },280);
      },350);
    }
    step();
  }

  /* 初始化 */
  setupVote();
})();
</script>
</body>
</html>
