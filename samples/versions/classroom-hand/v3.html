<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.card{height:100dvh;display:flex;flex-direction:column;max-width:min(1100px,100%);margin:0 auto;padding:clamp(8px,1.4vh,14px) clamp(12px,2vw,22px);gap:10px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:none}
.topbar h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800}
.badge{font-size:16px;font-weight:700;color:var(--accent);background:#e3eefb;padding:4px 12px;border-radius:999px}
.spacer{flex:1}
.dots{display:flex;gap:7px}
.dot{width:14px;height:14px;border-radius:50%;background:#c8d9ee}
.dot.on{background:var(--accent)}
.reset{min-width:52px;height:52px;border-radius:16px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-size:24px;font-weight:800;cursor:pointer;touch-action:manipulation;flex:none}
.stage{flex:1;min-height:0;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
.qline{flex:none;text-align:center;font-size:clamp(20px,2.3vw,25px);font-weight:700;line-height:1.4;padding:0 8px}
.say{flex:none;text-align:center;font-size:clamp(20px,2.2vw,24px);font-weight:700;color:var(--muted);line-height:1.4;margin:0;padding:0 8px}
.choices{display:flex;flex-direction:column;gap:9px;flex:none}
.btn{min-height:var(--touch);padding:12px 16px;border-radius:15px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);font-size:clamp(20px,2.2vw,24px);font-weight:700;cursor:pointer;font-family:inherit;text-align:left;touch-action:manipulation;transition:border-color .2s,background .2s,transform .12s}
.btn:active{transform:scale(.985)}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ok{border-color:var(--ok);background:#e9fbf1}
.btn.bad{border-color:var(--bad);background:#fdf0f0}
.btn.mini{flex:none;min-height:52px;margin-left:14px;padding:8px 24px;background:var(--accent);color:#fff;border:none;border-radius:13px;font-size:20px;text-align:center;cursor:pointer;font-family:inherit;font-weight:800}
.feedback{flex:none;min-height:66px;border-radius:15px;padding:10px 14px;font-size:clamp(20px,2.2vw,24px);line-height:1.5;background:#f7fafd;border:1.5px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.feedback.ok{background:#e9fbf1;border-color:#8adbb0}
.feedback.bad{background:#fff5f0;border-color:#f4b8a0}
.feedback .why{font-weight:800;margin-right:4px}
.feedback.ok .why{color:var(--ok)}
.feedback.bad .why{color:var(--bad)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .32s ease}
.finish{position:fixed;inset:0;background:rgba(238,244,251,.97);z-index:20;display:none;align-items:center;justify-content:center}
.finish.show{display:flex}
.fin-card{background:var(--card);border:3px solid var(--ok);border-radius:22px;padding:32px 38px;max-width:min(600px,92vw);text-align:center}
.big-ok{width:92px;height:92px;border-radius:50%;background:var(--ok);color:#fff;font-size:52px;line-height:92px;margin:0 auto 16px}
.fin-card h2{font-size:clamp(26px,4vw,38px);margin:0 0 10px}
.fin-card p{font-size:clamp(20px,2.5vw,25px);color:var(--muted);margin:0 0 22px;line-height:1.6}
.btn.again{min-height:56px;padding:10px 34px;border:0;background:var(--accent);color:#fff;border-radius:16px;font-size:22px;font-weight:800;cursor:pointer;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:660px){.qline{display:none}.say{display:none}.feedback{min-height:58px;font-size:19px}}
#mfill{transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s var(--ease)}
#wave,#hurt,#qMark,#mateSad{transition:opacity .3s var(--ease)}
.ears{opacity:0;transition:opacity .3s var(--ease)}
</style>

<script>
(function(){
  "use strict";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var hero = document.getElementById("hero");
  var armR = document.getElementById("armR");
  var mouth = document.getElementById("mouth");
  var hurt = document.getElementById("hurt");
  var wave = document.getElementById("wave");
  var qMark = document.getElementById("qMark");
  var mateSad = document.getElementById("mateSad");
  var mateMouth = document.getElementById("mateMouth");
  var mfill = document.getElementById("mfill");
  var mdB = document.getElementById("mdB");
  var boardText = document.getElementById("boardText");
  var stateText = document.getElementById("stateText");
  var qline = document.getElementById("qline");
  var sayLine = document.getElementById("sayLine");
  var choicesEl = document.getElementById("choices");
  var fb = document.getElementById("fb");
  var dotsEl = document.getElementById("dots");
  var ears = document.querySelectorAll(".ears");
  var finish = document.getElementById("finish");

  var LEVELS = [
    {
      title:"第 1 关 · 老师提问了",
      board:"3 + 5 = ?",
      say:"老师问“3＋5＝？”你知道答案，特别想说。你会怎么做？",
      sayLine:"我会说：想发言，先安静举手，等老师点名。",
      choices:[
        {t:"安静举起右手，等老师点名", kind:"ok"},
        {t:"站起来大声喊“等于8！”", kind:"bad"},
        {t:"小声告诉同桌答案", kind:"bad"}
      ],
      effect:function(c){
        if(c.kind==="ok"){
          raiseArm(true); setMeter(18); setNoise(false); waveOn(false);
          stateText.textContent="举着手，安静等老师点名";
        }else if(c.t==="站起来大声喊“等于8！”"){
          setMouth(true); waveOn(true); setNoise(true); setMeter(88);
          stateText.textContent="一喊，全班都扭头看你";
        }else{
          setMouth(true); waveOn(false); setNoise(false); setMeter(35);
          stateText.textContent="答案只说给了同桌一个人";
        }
      },
      good:"真棒！想发言就安静举手：手举直、安静等，老师看到就会点你，点到了再站起来说。",
      bads:{
        "站起来大声喊“等于8！”":"喊出来，全班都会扭头看你，老师的话也被打断，后面的小朋友听不清了。应该先把手举起来，等老师点到你，再站起来好好说。",
        "小声告诉同桌答案":"答案只说给同桌一个人听，别的小朋友没听见，老师也不知道你会。想让大家听见，就举手等老师点名，站起来说给全班听。"
      }
    },
    {
      title:"第 2 关 · 老师还没看到我",
      board:"还有谁想说？",
      say:"你举起了手，可老师还在看别的小朋友。你会怎么做？",
      sayLine:"我会说：举手以后就安静等，不喊也不晃。",
      choices:[
        {t:"安静举着手，耐心等", kind:"ok"},
        {t:"边举手边喊“老师！叫我！”", kind:"bad"},
        {t:"手举得高高的，左右摇晃", kind:"bad"}
      ],
      effect:function(c){
        if(c.kind==="ok"){
          raiseArm(true); setMeter(18); setNoise(false); waveOn(false);
          stateText.textContent="安静等，老师会看到你";
        }else if(c.t==="边举手边喊“老师！叫我！”"){
          setMouth(true); waveOn(true); setNoise(true); setMeter(88);
          stateText.textContent="喊声打断了上课";
        }else{
          raiseArm(true); waveArm(1100); setMeter(62); setNoise(false);
          stateText.textContent="手晃来晃去，挡住后面";
        }
      },
      good:"对！举手以后就安静等。老师先照顾别的小朋友，下一个就会看到你。",
      bads:{
        "边举手边喊“老师！叫我！”":"又举手又喊，声音会打断上课，别的小朋友也没法专心听。喊不是办法，安静举着手，老师看到自然会点你。",
        "手举得高高的，左右摇晃":"手晃来晃去，会挡住后面小朋友的视线，也像在催老师。正确的举手是：手放桌上、举直、不动、安静等。"
      }
    },
    {
      title:"第 3 关 · 小美在发言",
      board:"小美在回答……",
      say:"小美正在回答问题，你突然想到更好的答案。你会怎么做？",
      sayLine:"我会说：别人发言认真听，听完再举手。",
      choices:[
        {t:"先安静听完，记住想法", kind:"ok"},
        {t:"马上打断小美说出来", kind:"bad"},
        {t:"举着手大喊“我也有更好的”", kind:"bad"}
      ],
      effect:function(c){
        if(c.kind==="ok"){
          mateMouthOpen(false); mateSadOn(false); raiseArm(false); setMeter(18); setNoise(false); waveOn(false);
          stateText.textContent="安静听完，尊重别人";
        }else if(c.t==="马上打断小美说出来"){
          mateMouthOpen(false); mateSadOn(true); setMouth(true); setMeter(72);
          stateText.textContent="小美的话被打断了";
        }else{
          setMouth(true); waveOn(true); setNoise(true); setMeter(86);
          stateText.textContent="喊声盖住了小美的声音";
        }
      },
      good:"对！别人发言要安静听，把小美的话听完。记住你的想法，等老师说“还有谁想说”，再举手。",
      bads:{
        "马上打断小美说出来":"小美才说一半就被打断，她想说的话没说完，心里会难过，大家也听不清。等别人说完，你再举手说，才是礼貌。",
        "举着手大喊“我也有更好的”":"喊声会盖住小美的声音。想发言也要等一等：先听别人说完，再举手，等老师点到你才说。"
      }
    },
    {
      title:"第 4 关 · 举一反三 · 有事先举手",
      board:"自习课",
      say:"自习课上，你突然肚子疼，很难受。你会怎么做？",
      sayLine:"我会说：不舒服先举手报告老师，等老师同意。",
      choices:[
        {t:"举手告诉老师，等老师同意", kind:"ok"},
        {t:"自己悄悄溜出教室", kind:"bad"},
        {t:"一直忍着不说话", kind:"bad"}
      ],
      effect:function(c){
        if(c.kind==="ok"){
          raiseArm(true); setMeter(18); teacherQ(false); hurtOn(false);
          stateText.textContent="举手报告，老师来帮你";
        }else if(c.t==="自己悄悄溜出教室"){
          heroX(600,1200); setMeter(28); teacherQ(true);
          stateText.textContent="老师不知道你去哪儿了";
        }else{
          heroTremble(1000); hurtOn(true); setMeter(18); teacherQ(false);
          stateText.textContent="老师还不知道你难受";
        }
      },
      good:"对！不只是发言，有事（不舒服、想去洗手间）也要先举手报告老师，等老师同意再行动。",
      bads:{
        "自己悄悄溜出教室":"偷偷溜出去，老师不知道你去哪儿，找不到你会着急，你自己一个人也不安全。应该先举手告诉老师，等老师同意，再让大人陪你去。",
        "一直忍着不说话":"一直忍着，肚子可能越来越疼，老师也没法帮你。难受一定要说出来：举手报告老师，老师会马上帮你。"
      }
    }
  ];
  var lastIndex = LEVELS.length - 1;
  var stage = 0, solved = false, rafId = null;

  /* ---------- 动画工具（真动，reduced-motion 直达终态） ---------- */
  function clearAnim(){ if(rafId){ cancelAnimationFrame(rafId); rafId=null; } }
  function animate(dur, fn, onEnd){
    if(reduce){ fn(1); if(onEnd) onEnd(); return; }
    var t0 = performance.now();
    function step(now){
      var p = Math.min(1, (now - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      fn(e);
      if(p < 1){ rafId = requestAnimationFrame(step); }
      else { rafId = null; if(onEnd) onEnd(); }
    }
    rafId = requestAnimationFrame(step);
  }
  function setArm(deg){ armR.setAttribute("transform", "rotate(" + deg + " 25 45)"); }
  function raiseArm(on){ animate(480, function(e){ setArm((on ? -78 : 0) * e); }); }
  function waveArm(dur){
    animate(dur, function(e){ setArm(-70 - 8 * Math.sin(e * Math.PI * 6)); }, function(){ setArm(-78); });
  }
  function setMouth(open){
    mouth.setAttribute("d", open ? "M-8 66 L0 79 L8 66" : "M-7 71 Q0 76 7 71");
  }
  function mateMouthOpen(open){
    mateMouth.setAttribute("d", open ? "M-5 45 L0 56 L5 45" : "M-4 46 Q0 50 4 46");
  }
  function setNoise(on){
    for(var i = 0; i < ears.length; i++){ ears[i].style.opacity = on ? "1" : "0"; }
  }
  function waveOn(on){ wave.style.opacity = on ? "1" : "0"; }
  function hurtOn(on){ hurt.style.opacity = on ? "1" : "0"; }
  function teacherQ(on){ qMark.style.opacity = on ? "1" : "0"; }
  function mateSadOn(on){ mateSad.style.opacity = on ? "1" : "0"; }
  function setMeter(v){
    mfill.style.transform = "scaleY(" + (v / 100) + ")";
    var c = v < 35 ? "#2fbf71" : (v < 70 ? "#f59e0b" : "#e85d5d");
    mfill.setAttribute("fill", c);
    mdB.textContent = v < 35 ? "18" : (v < 70 ? "55" : "88");
    mdB.setAttribute("fill", c);
  }
  function heroX(x, dur){
    animate(dur || 1100, function(e){
      hero.setAttribute("transform", "translate(" + (265 + (x - 265) * e) + ",150)");
    });
  }
  function heroTremble(dur){
    animate(dur || 1000, function(e){
      var j = e < 1 ? Math.sin(e * Math.PI * 22) * 2.5 : 0;
      hero.setAttribute("transform", "translate(" + (265 + j) + ",150)");
    });
  }
  function resetStage(){
    clearAnim();
    setArm(0); setMouth(false); waveOn(false); hurtOn(false); teacherQ(false); mateSadOn(false);
    setNoise(false); setMeter(18); mateMouthOpen(false);
    hero.setAttribute("transform", "translate(265,150)");
  }

  /* ---------- 渲染 ---------- */
  function renderDots(){
    dotsEl.innerHTML = "";
    for(var i = 0; i < LEVELS.length; i++){
      var d = document.createElement("div");
      d.className = "dot" + (i <= stage ? " on" : "");
      dotsEl.appendChild(d);
    }
  }
  function render(){
    var s = LEVELS[stage];
    solved = false;
    resetStage();
    boardText.textContent = s.board;
    qline.textContent = s.say;
    sayLine.textContent = s.sayLine;
    if(stage === 2){ mateMouthOpen(true); }
    choicesEl.innerHTML = "";
    s.choices.forEach(function(c, i){
      var b = document.createElement("button");
      b.className = "btn"; b.type = "button"; b.textContent = c.t;
      b.addEventListener("click", function(){ pick(s, c, i); });
      choicesEl.appendChild(b);
    });
    fb.className = "feedback"; fb.innerHTML = "";
    renderDots();
  }

  function pick(s, c, i){
    if(solved) return;
    clearAnim();
    var btns = choicesEl.querySelectorAll(".btn");
    s.effect(c);
    if(c.kind === "ok"){
      solved = true;
      for(var j = 0; j < btns.length; j++){ btns[j].disabled = true; }
      btns[i].classList.add("ok");
      var nb = document.createElement("button");
      nb.className = "btn mini"; nb.type = "button";
      nb.textContent = "下一关 →";
      nb.addEventListener("click", next);
      fb.className = "feedback ok";
      fb.innerHTML = "<span class='why'>✓ 做对了</span>" + s.good;
      fb.appendChild(nb);
    }else{
      btns[i].classList.add("bad");
      fb.className = "feedback bad";
      fb.classList.remove("shake"); void fb.offsetWidth; fb.classList.add("shake");
      fb.innerHTML = "<span class='why'>再想想</span>" + s.bads[c.t];
    }
  }

  function next(){
    stage++;
    if(stage < LEVELS.length){ render(); }
    else { finish.classList.add("show"); }
  }
  function resetAll(){
    finish.classList.remove("show");
    stage = 0;
    render();
  }

  document.getElementById("resetBtn").addEventListener("click", resetAll);
  document.getElementById("againBtn").addEventListener("click", resetAll);
  render();
})();
</script>
</body>
</html>
