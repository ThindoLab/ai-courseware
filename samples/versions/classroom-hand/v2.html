<!doctype html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08:25:38">
<meta name="aid-version-note" content="当前稿">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂举手 · 想发言这样做</title>
<!-- 题型：情境决策·课堂常规 / 核心认知动作：举手步骤·对错对照 / 年龄：7-9 岁 / 场景：教室 -->
<style>
:root{
  --accent:#2f6fbf; --ok:#2fbf71; --warn:#f59e0b; --bad:#e85d5d;
  --ink:#1e3a5f; --muted:#5b6f8c; --line:#d9e4f2; --card:#ffffff;
  --ease:cubic-bezier(0.25,1,0.5,1); --touch:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,"PingFang SC",system-ui,sans-serif;
  color:var(--ink); background:#eef4fb;
  display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  padding:clamp(8px,1.2vh,14px) clamp(10px,1.8vw,20px);
}
.card{
  flex:1; min-height:0; width:100%; max-width:min(1100px,100%); margin:0 auto;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  display:flex; flex-direction:column; overflow:hidden;
  padding:clamp(10px,1.6vh,18px) clamp(14px,2.2vw,26px) clamp(12px,1.8vh,18px);
}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;flex:none}
.topbar h1{margin:0;font-size:clamp(20px,2.6vw,28px);font-weight:800}
.badge{font-size:14px;font-weight:700;color:var(--accent);background:#e3eefb;padding:5px 12px;border-radius:999px}
.progress{font-size:15px;font-weight:700;color:var(--muted);flex:none;margin-bottom:6px}
.stage{
  flex:1; min-height:0; display:flex; flex-direction:column;
  background:linear-gradient(180deg,#f2f7fd,#fbfdff); border:1px solid var(--line);
  border-radius:16px; padding:6px 10px 4px; overflow:hidden;
}
.stage svg{flex:1; min-height:0; width:100%; height:auto; max-height:100%}
.choices{display:flex;flex-direction:column;gap:10px;margin:12px 0 8px;flex:none}
.btn{
  min-height:var(--touch); padding:13px 16px; border-radius:14px; border:2px solid var(--line);
  background:#fff; font-size:clamp(17px,2vw,21px); font-weight:700; cursor:pointer; font-family:inherit;
  text-align:left; transition:border-color .2s, background .2s;
}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.55; cursor:not-allowed}
.btn.ok{border-color:var(--ok); background:#e9fbf1}
.btn.bad{border-color:var(--bad); background:#fdf0f0}
.consequence{
  border-radius:14px; padding:10px 14px; margin-bottom:8px; display:none; flex:none;
  background:#f7fafd; border:1px solid var(--line); font-size:clamp(16px,1.9vw,20px); line-height:1.6;
}
.consequence.show{display:block}
.consequence.ok{background:#e9fbf1;border-color:#8adbb0}
.consequence.bad{background:#fff5f0;border-color:#f4b8a0}
.consequence .why{font-weight:800;margin-bottom:2px}
.btn-row{display:flex;gap:10px;justify-content:center;flex:none;margin-bottom:2px}
.btn.small{min-height:48px;font-size:17px;text-align:center}
.btn.primary{background:var(--accent);color:#fff;border:none;text-align:center}
.say{font-size:clamp(15px,1.6vw,18px);color:var(--muted);margin:2px 0 0;line-height:1.5;flex:none}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:wobble .4s ease}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}
.show{animation:pop .3s var(--ease)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.aid-compact .say,html.aid-compact .progress{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="topbar">
    <h1>课堂举手</h1>
    <span class="badge">教室常规 · 想发言这样做</span>
  </div>
  <div class="progress" id="progress">第 1 关 · 老师提问了</div>

  <div class="stage">
    <svg id="sceneSvg" viewBox="0 0 720 340" role="img" aria-label="教室场景">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e8f1fb"/><stop offset="1" stop-color="#f6fafd"/>
        </linearGradient>
      </defs>
      <!-- 教室 -->
      <rect x="20" y="24" width="680" height="300" rx="18" fill="url(#wall)"/>
      <rect x="40" y="40" width="120" height="70" rx="10" fill="#fff" stroke="#c6d8ec" stroke-width="2"/>
      <text x="100" y="80" text-anchor="middle" font-size="30">老师</text>
      <!-- 讲台 -->
      <rect x="56" y="104" width="88" height="16" rx="5" fill="#bcd3ec"/>
      <!-- 学生桌 -->
      <rect x="210" y="150" width="180" height="14" rx="6" fill="#a9c3e0"/>
      <rect x="450" y="150" width="180" height="14" rx="6" fill="#a9c3e0"/>
      <!-- 学生豆人（主角色，坐在左桌） -->
      <g id="hero" transform="translate(300,140)">
        <!-- 身体 -->
        <ellipse cx="0" cy="62" rx="24" ry="26" fill="#1e3a5f"/>
        <circle cx="-7" cy="54" r="3.2" fill="#fff"/>
        <circle cx="7" cy="54" r="3.2" fill="#fff"/>
        <!-- 右臂：默认放在桌上；举起时绕肩旋转 -->
        <g id="armR" transform="rotate(0 20 44)">
          <path d="M20 44 L52 62" stroke="#1e3a5f" stroke-width="9" stroke-linecap="round"/>
          <circle cx="52" cy="62" r="6" fill="#1e3a5f"/>
        </g>
        <!-- 左臂（不动） -->
        <path d="M-20 46 L-46 62" stroke="#1e3a5f" stroke-width="9" stroke-linecap="round"/>
        <circle cx="-46" cy="62" r="6" fill="#1e3a5f"/>
        <!-- 嘴巴（默认为合） -->
        <path id="mouth" d="M-6 66 Q0 70 6 66" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 旁边同学（安静听） -->
      <g transform="translate(240,168)" opacity=".75">
        <ellipse cx="0" cy="42" rx="18" ry="19" fill="#5b6f8c"/>
        <circle cx="-5" cy="36" r="2.4" fill="#fff"/>
        <circle cx="5" cy="36" r="2.4" fill="#fff"/>
      </g>
      <!-- 右边同学（安静听） -->
      <g transform="translate(540,160)" opacity=".75">
        <ellipse cx="0" cy="50" rx="18" ry="19" fill="#5b6f8c"/>
        <circle cx="-5" cy="44" r="2.4" fill="#fff"/>
        <circle cx="5" cy="44" r="2.4" fill="#fff"/>
      </g>
      <!-- 声波：只在喊叫时出现 -->
      <g id="wave" opacity="0">
        <path d="M308 76 q12 -14 24 0 q12 14 24 0" stroke="#e85d5d" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M312 64 q10 -12 20 0 q10 12 20 0" stroke="#e85d5d" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 状态文字 -->
      <text id="stateText" x="360" y="300" text-anchor="middle" font-size="22" font-weight="800" fill="#1e3a5f"></text>
    </svg>
  </div>

  <div class="choices" id="choices"></div>
  <div class="consequence" id="consequence"></div>
  <div class="btn-row" id="nextRow" style="display:none">
    <button class="btn small primary" id="nextBtn">下一关 →</button>
  </div>
  <p class="say" id="sayLine">想发言？先安静举手，等老师看到你。</p>
</main>

<script>
(function(){
  "use strict";
  var svg=document.getElementById("sceneSvg");
  var armR=document.getElementById("armR");
  var mouth=document.getElementById("mouth");
  var wave=document.getElementById("wave");
  var stateText=document.getElementById("stateText");
  var choicesEl=document.getElementById("choices");
  var consEl=document.getElementById("consequence");
  var nextRow=document.getElementById("nextRow");
  var nextBtn=document.getElementById("nextBtn");
  var progressEl=document.getElementById("progress");
  var sayLine=document.getElementById("sayLine");

  var reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var stage=0;
  var rafId=null;

  // 手臂举起：JS 插值旋转角度，保证真动（reduced-motion 直接到终态）
  function raiseHero(raise){
    if(rafId){cancelAnimationFrame(rafId); rafId=null;}
    var from=raise?0:-78, to=raise?-78:0;
    if(reduceMotion){armR.setAttribute("transform","rotate("+to+" 20 44)"); return;}
    var t0=performance.now(), dur=450;
    function step(now){
      var p=Math.min(1,(now-t0)/dur);
      var e=1-Math.pow(1-p,3);
      var deg=from+(to-from)*e;
      armR.setAttribute("transform","rotate("+deg.toFixed(1)+" 20 44)");
      if(p<1){rafId=requestAnimationFrame(step);}else{rafId=null;}
    }
    rafId=requestAnimationFrame(step);
  }
  function setMouth(open){
    mouth.setAttribute("d", open?"M-6 62 L0 72 L6 62":"M-6 66 Q0 70 6 66");
  }
  function showWave(on){
    wave.style.transition="opacity .3s "+"cubic-bezier(.25,1,.5,1)";
    wave.setAttribute("opacity", on?"1":"0");
  }
  function resetHero(){
    raiseHero(false); setMouth(false); showWave(false);
  }

  var scenes=[
    {
      title:"第 1 关 · 老师提问了",
      say:"老师问了一个问题，你知道答案，特别想说。你该怎么做？",
      state:"老师提问中……",
      choices:[
        {t:"安静地把右手举起来，等老师看到我", kind:"ok"},
        {t:"直接站起来大声喊出答案", kind:"bad"},
        {t:"小声告诉同桌答案", kind:"bad"}
      ],
      effect:function(kind){
        if(kind==="ok"){
          raiseHero(true);
          stateText.textContent="举手，等老师点名";
        }else{
          setMouth(true); showWave(true);
          stateText.textContent="教室里一下乱了";
        }
      },
      good:"真棒！想发言先举手：手举直，安静等。老师看到就会点你。",
      bads:{
        "直接站起来大声喊出答案":"喊出来，全班都会扭头看你，老师的话也被打断，后面的小朋友就听不清了。应该先把手举起来，等老师点到你，再站起来好好说。",
        "小声告诉同桌答案":"答案只说给同桌一个人听，别的小朋友没听见，老师也不知道你会。想让大家听见，就举手等老师点名，站起来说给全班听。"
      }
    },
    {
      title:"第 2 关 · 举手以后",
      say:"你举起了手，可是老师还在看别的小朋友。你该怎么做？",
      state:"举着手等一会儿……",
      choices:[
        {t:"安静举着手，耐心等老师看到我", kind:"ok"},
        {t:"一边举手一边喊“老师！老师！叫我！”", kind:"bad"},
        {t:"手举得高高的，还左右摇晃", kind:"bad"}
      ],
      effect:function(kind){
        if(kind==="ok"){
          raiseHero(true);
          stateText.textContent="耐心等，老师会看到你";
        }else{
          setMouth(true); showWave(true);
          stateText.textContent="喊声和摇晃会打扰大家";
        }
      },
      good:"对！举手以后就安静等。老师先照顾别的小朋友，下一个就会看到你。",
      bads:{
        "一边举手一边喊“老师！老师！叫我！”":"又举手又喊，声音会把上课打断，别的小朋友也没法专心听。喊不是办法，安静举着手，老师看到自然会点你。",
        "手举得高高的，还左右摇晃":"手晃来晃去，会挡住后面小朋友的视线，也像在催老师。正确的举手是：手放桌上、举直、不动，安静等。"
      }
    },
    {
      title:"第 3 关 · 别人在发言",
      say:"老师点名让小美回答了。小美正说到一半，你突然想到更好的答案。你该怎么做？",
      state:"小美正在发言……",
      choices:[
        {t:"先安静听完，记住我的想法，等会说", kind:"ok"},
        {t:"马上打断她，把我想的说出来", kind:"bad"},
        {t:"举着手大声喊“我也有更好的！”", kind:"bad"}
      ],
      effect:function(kind){
        if(kind==="ok"){
          stateText.textContent="安静听完，尊重别人";
        }else{
          setMouth(true); showWave(true);
          stateText.textContent="小美的话被打断了";
        }
      },
      good:"对！别人发言时要安静听。把你的想法记在心里，等老师说“还有谁想说”再举手。",
      bads:{
        "马上打断她，把我想的说出来":"小美才说一半就被打断，她想说的话没说完，心里会难过，大家也听不清。等别人说完，你再举手说，才是礼貌。",
        "举着手大声喊“我也有更好的！”":"喊声会盖住小美的声音。想发言也要等一等：先听别人说完，再举手，老师点到你才说。"
      }
    },
    {
      title:"第 4 关 · 举一反三",
      say:"快下课了，你突然肚子疼，很难受。这时候你该怎么做？",
      state:"你有点不舒服……",
      choices:[
        {t:"举手告诉老师，等老师同意再行动", kind:"ok"},
        {t:"自己悄悄跑出教室", kind:"bad"},
        {t:"忍着不说话，一直憋到下课", kind:"bad"}
      ],
      effect:function(kind){
        if(kind==="ok"){
          raiseHero(true);
          stateText.textContent="举手报告，老师来帮你";
        }else{
          setMouth(true); showWave(true);
          stateText.textContent="老师还不知道你难受";
        }
      },
      good:"对！不只是发言，有事（不舒服、想去洗手间）也先举手报告老师，等老师同意再行动。",
      bads:{
        "自己悄悄跑出教室":"偷偷跑出去，老师不知道你去哪，找不到你会担心，你自己一个人也不安全。应该举手告诉老师，等老师同意。",
        "忍着不说话，一直憋到下课":"一直忍着，肚子可能越来越疼，老师也帮不上忙。难受要说出来：举手报告，老师会马上帮你。"
      },
      last:true
    }
  ];

  function render(){
    var s=scenes[stage];
    progressEl.textContent=s.title;
    sayLine.textContent=s.say;
    resetHero();
    stateText.textContent=s.state;
    choicesEl.innerHTML="";
    s.choices.forEach(function(c,i){
      var b=document.createElement("button");
      b.className="btn"; b.textContent=c.t;
      b.style.minHeight="52px";
      b.addEventListener("click",function(){pick(i);});
      choicesEl.appendChild(b);
    });
    consEl.className="consequence";
    consEl.innerHTML="";
    nextRow.style.display="none";
  }

  function pick(i){
    var s=scenes[stage];
    var c=s.choices[i];
    var btns=choicesEl.querySelectorAll(".btn");
    btns.forEach(function(b){b.disabled=true;});
    s.effect(c.kind);
    consEl.className="consequence show "+(c.kind==="ok"?"ok":"bad");
    consEl.innerHTML="";
    if(c.kind==="ok"){
      btns[i].classList.add("ok");
      consEl.innerHTML="<div class='why'>✓ 做对了</div>"+s.good;
    }else{
      btns[i].classList.add("bad");
      consEl.classList.add("shake");
      var msg=s.bads[c.t];
      consEl.innerHTML="<div class='why'>再想想</div>"+msg;
    }
    if(s.last){
      nextBtn.textContent=c.kind==="ok"?"完成 🎉":"再学一次";
    }else{
      nextBtn.textContent="下一关 →";
    }
    nextRow.style.display="flex";
  }

  nextBtn.addEventListener("click",function(){
    if(stage<scenes.length-1){
      stage++; render();
    }else{
      stage=0; render();
    }
  });

  render();
})();
</script>
</body>
</html>
