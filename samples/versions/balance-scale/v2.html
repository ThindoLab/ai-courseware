<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v2">
<meta name="aid-version-at" content="2026-08-14T08:25:38">
<meta name="aid-version-note" content="当前稿">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小猴的天平</title>
<style>
  :root{
    --ink:#1e3a5f; --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d;
    --card:#ffffff; --bg:#eef4fb; --wood:#c98a4b; --wood-dark:#a86a33;
    --r:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100dvh; overflow:hidden; margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);}
  #app{height:100dvh; display:flex; flex-direction:column; max-width:min(1240px,100%); margin:0 auto; padding:10px 14px calc(10px + env(safe-area-inset-bottom));}
  header{display:flex; align-items:center; gap:10px; padding:4px 2px 8px;}
  .logo{width:40px; height:40px; flex:none;}
  h1{font-size:clamp(20px, 3.2vw, 30px); margin:0; line-height:1.1;}
  .badge{margin-left:auto; background:#fff; border:2px solid var(--accent); color:var(--accent);
    font-weight:800; border-radius:999px; padding:6px 14px; font-size:clamp(15px,2vw,20px); white-space:nowrap;}
  main{flex:1; display:flex; flex-direction:column; min-height:0;}
  .scene{flex:1; display:flex; flex-direction:column; min-height:0; background:var(--card);
    border-radius:var(--r); box-shadow:0 8px 24px rgba(30,58,95,.10); overflow:hidden;}
  .scene-head{padding:10px 18px 2px; font-size:clamp(17px,2.4vw,24px); font-weight:800; text-align:left;}
  .scene-sub{padding:0 18px; font-size:clamp(15px,2vw,20px); color:#5b7391; text-align:left;}
  .stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative;}
  svg.main-svg{width:100%; height:100%; display:block;}
  .control{flex:none; padding:8px 14px 14px; display:flex; flex-direction:column; gap:8px;}
  .tray{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:64px;}
  .fruit-btn{width:58px; height:58px; min-width:52px; min-height:52px; border-radius:16px;
    background:#fff; border:2.5px solid var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .15s cubic-bezier(.25,1,.5,1), box-shadow .15s;
    box-shadow:0 3px 0 rgba(30,58,95,.18); touch-action:manipulation;}
  .fruit-btn svg{width:40px; height:40px;}
  .fruit-btn:hover{transform:translateY(-2px); box-shadow:0 5px 0 rgba(30,58,95,.18);}
  .fruit-btn:active{transform:translateY(1px) scale(.96); box-shadow:0 1px 0 rgba(30,58,95,.18);}
  .fruit-btn.drag{position:fixed; z-index:50; pointer-events:none; margin:0;}
  .fruit-btn.used{opacity:.28; filter:grayscale(.6); pointer-events:none;}
  .fruit-btn.locked{opacity:.45; pointer-events:none;}
  .result-line{min-height:34px; font-size:clamp(16px,2.2vw,22px); font-weight:800; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:8px;}
  .result-line.ok{color:var(--ok);} .result-line.bad{color:var(--bad);}
  .actions{display:flex; justify-content:center; gap:12px; flex-wrap:wrap;}
  button.act{min-width:52px; min-height:52px; border-radius:14px; border:2px solid var(--ink);
    background:#fff; color:var(--ink); font-size:clamp(16px,2.2vw,20px); font-weight:800;
    padding:8px 20px; cursor:pointer; box-shadow:0 3px 0 rgba(30,58,95,.18);
    transition:transform .15s cubic-bezier(.25,1,.5,1);}
  button.act:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(30,58,95,.18);}
  button.act.primary{background:var(--accent); color:#fff;}
  button.act.ghost{background:transparent;}
  .hint{font-size:clamp(14px,1.8vw,18px); color:#5b7391; text-align:center;}
  /* overlay demo */
  .overlay{position:fixed; inset:0; z-index:100; background:rgba(30,58,95,.72);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px;}
  .overlay.hidden{display:none;}
  .demo-card{background:#fff; border-radius:22px; padding:18px 20px; max-width:620px; width:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:12px; align-items:center;}
  .demo-card .dtitle{font-size:clamp(18px,2.6vw,26px); font-weight:800;}
  .demo-card .dtext{font-size:clamp(15px,2vw,20px); text-align:center; color:#5b7391;}
  .demo-svg{width:100%; max-height:40vh;}
  .overlay .skip{background:#fff; color:var(--ink); border:2px solid var(--ink); border-radius:14px;
    min-height:52px; padding:8px 26px; font-size:clamp(16px,2.2vw,20px); font-weight:800; cursor:pointer;}
  /* pop msg */
  .pop{position:fixed; left:50%; bottom:16%; transform:translateX(-50%); z-index:80;
    background:var(--ink); color:#fff; border-radius:14px; padding:12px 18px;
    font-size:clamp(15px,2vw,20px); font-weight:700; max-width:min(600px,90vw);
    box-shadow:0 10px 30px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .25s;}
  .pop.show{opacity:1;}
  .pop.bad{background:var(--bad);}
  .pop.ok{background:var(--ok);}
  .shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97);}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="22" fill="#c98a4b" opacity=".25"/>
      <ellipse cx="24" cy="27" rx="14" ry="13" fill="#8a5a2b"/>
      <circle cx="19" cy="22" r="2.6" fill="#fff"/><circle cx="29" cy="22" r="2.6" fill="#fff"/>
      <circle cx="19.8" cy="23" r="1.2" fill="#1e3a5f"/><circle cx="29.8" cy="23" r="1.2" fill="#1e3a5f"/>
      <path d="M21 30 Q24 34 27 30" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="20" r="4" fill="#8a5a2b"/><circle cx="36" cy="20" r="4" fill="#8a5a2b"/>
      <circle cx="10" cy="17" r="2.2" fill="#a86a33"/><circle cx="34" cy="17" r="2.2" fill="#a86a33"/>
      <path d="M30 38 Q38 42 42 34" fill="none" stroke="#8a5a2b" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>小猴的天平</h1>
    <div class="badge" id="stageBadge">第 1 关</div>
  </header>

  <main>
    <section class="scene">
      <div class="scene-head" id="sceneTitle">谁的果子更重？</div>
      <div class="scene-sub" id="sceneSub">把果子放进盘里，看看天平怎么动</div>
      <div class="stage" id="stage">
        <svg id="scaleSvg" class="main-svg" viewBox="0 0 640 420" role="img" aria-label="天平">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#dcebfc"/><stop offset="1" stop-color="#f7fbfe"/>
            </linearGradient>
            <g id="fruit-apple">
              <circle cx="0" cy="0" r="17" fill="#e05252"/>
              <path d="M0,-17 Q4,-24 10,-24" fill="none" stroke="#7a4a21" stroke-width="3" stroke-linecap="round"/>
              <ellipse cx="8" cy="-22" rx="6" ry="3.4" fill="#5aa75a" transform="rotate(-24 8 -22)"/>
            </g>
            <g id="fruit-peach">
              <circle cx="0" cy="0" r="16" fill="#ffb37e"/>
              <path d="M-6,-13 Q0,-21 6,-13" fill="none" stroke="#d98a5a" stroke-width="2"/>
              <path d="M0,-16 Q6,-23 13,-20" fill="none" stroke="#5aa75a" stroke-width="3" stroke-linecap="round"/>
            </g>
            <g id="fruit-watermelon">
              <path d="M-20,2 A20,20 0 0 1 20,2 Z" fill="#3fa34d"/>
              <path d="M-14,1 A14,14 0 0 1 14,1 Z" fill="#ff8a7a"/>
              <circle cx="-6" cy="-4" r="1.8" fill="#3fa34d"/><circle cx="3" cy="-7" r="1.8" fill="#3fa34d"/><circle cx="8" cy="-2" r="1.8" fill="#3fa34d"/>
            </g>
            <g id="fruit-banana">
              <path d="M-16,8 Q-20,-10 0,-14 Q18,-16 20,-6 Q16,-8 4,-6 Q-10,-4 -12,6 Z" fill="#f7c948"/>
              <path d="M-16,8 Q-14,0 -8,-6" fill="none" stroke="#b98a2f" stroke-width="2"/>
            </g>
            <g id="fruit-grape">
              <circle cx="-6" cy="6" r="5" fill="#9b6bbd"/><circle cx="3" cy="8" r="5" fill="#9b6bbd"/>
              <circle cx="10" cy="3" r="5" fill="#b087cd"/><circle cx="-2" cy="-2" r="5" fill="#b087cd"/>
              <circle cx="7" cy="-5" r="5" fill="#9b6bbd"/>
              <path d="M2,-10 Q6,-16 10,-18" fill="none" stroke="#5aa75a" stroke-width="3" stroke-linecap="round"/>
            </g>
          </defs>
          <rect x="0" y="0" width="640" height="420" fill="url(#sky)"/>
          <!-- ground -->
          <rect x="0" y="368" width="640" height="52" fill="#cfe3b8"/>
          <ellipse cx="320" cy="372" rx="280" ry="10" fill="#bcd9a4"/>
          <!-- stand -->
          <rect id="stand" x="302" y="120" width="36" height="252" rx="8" fill="var(--wood-dark)"/>
          <circle cx="320" cy="132" r="10" fill="var(--wood)"/>
          <polygon id="fulcrum" points="320,108 296,132 344,132" fill="var(--wood-dark)"/>
          <!-- beam (rotates around fulcrum 320,132) -->
          <g id="beamGroup" style="transform-origin:320px 132px;">
            <rect id="beam" x="120" y="124" width="400" height="16" rx="8" fill="var(--wood)"/>
            <path d="M130 140 L196 150 L196 140 Z" fill="var(--wood-dark)"/>
            <path d="M510 140 L444 150 L444 140 Z" fill="var(--wood-dark)"/>
            <circle cx="130" cy="146" r="5" fill="#7a4a21"/>
            <circle cx="510" cy="146" r="5" fill="#7a4a21"/>
          </g>
          <!-- left pan -->
          <g id="panLGroup">
            <line id="ropeL1" x1="130" y1="148" x2="96" y2="240" stroke="#8a5a2b" stroke-width="3"/>
            <line id="ropeL2" x1="130" y1="148" x2="164" y2="240" stroke="#8a5a2b" stroke-width="3"/>
            <path id="panL" d="M70 240 A60 18 0 0 0 190 240 Z" fill="#f3d9a4" stroke="#c98a4b" stroke-width="3"/>
            <g id="fruitL"></g>
          </g>
          <!-- right pan -->
          <g id="panRGroup">
            <line id="ropeR1" x1="510" y1="148" x2="476" y2="240" stroke="#8a5a2b" stroke-width="3"/>
            <line id="ropeR2" x1="510" y1="148" x2="544" y2="240" stroke="#8a5a2b" stroke-width="3"/>
            <path id="panR" d="M450 240 A60 18 0 0 0 570 240 Z" fill="#f3d9a4" stroke="#c98a4b" stroke-width="3"/>
            <g id="fruitR"></g>
          </g>
          <!-- monkey guide -->
          <g id="monkey" transform="translate(540,300)">
            <ellipse cx="0" cy="18" rx="24" ry="26" fill="#8a5a2b"/>
            <circle cx="0" cy="-10" r="15" fill="#8a5a2b"/>
            <circle cx="-7" cy="-12" r="3" fill="#fff"/><circle cx="7" cy="-12" r="3" fill="#fff"/>
            <circle cx="-5.5" cy="-11" r="1.4" fill="#1e3a5f"/><circle cx="8.5" cy="-11" r="1.4" fill="#1e3a5f"/>
            <path d="M-5,-2 Q0,4 5,-2" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-linecap="round"/>
            <circle cx="-13" cy="2" r="5" fill="#8a5a2b"/><circle cx="13" cy="2" r="5" fill="#8a5a2b"/>
            <path d="M20,20 Q34,26 38,16" fill="none" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/>
          </g>
          <!-- speech bubble -->
          <g id="speech">
            <rect id="speechBox" x="352" y="196" width="232" height="52" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
            <path d="M412 248 L396 268 L438 250 Z" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
            <text id="speechText" x="468" y="230" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a5f">放一个果子试试</text>
          </g>
        </svg>
      </div>

      <div class="control">
        <div class="result-line" id="resultLine" aria-live="polite"></div>
        <div class="tray" id="tray"></div>
        <div class="actions" id="actions"></div>
        <div class="hint" id="hintLine"></div>
      </div>
    </section>
  </main>
</div>

<!-- opening demo overlay -->
<div class="overlay" id="demoOverlay">
  <div class="demo-card">
    <div class="dtitle">🧺 小猴要用天平分果子</div>
    <svg class="demo-svg" viewBox="0 0 360 200" aria-hidden="true">
      <rect x="0" y="140" width="360" height="60" fill="#cfe3b8"/>

      <g id="demoBeam" style="transform-origin:180px 30px;">
        <rect id="demoBeamRect" x="60" y="24" width="240" height="12" rx="6" fill="#c98a4b"/>
      </g>
      <g id="demoPanLGroup">
        <line id="demoRopeL" x1="80" y1="38" x2="62" y2="100" stroke="#8a5a2b" stroke-width="3"/>
        <line id="demoRopeL2" x1="80" y1="38" x2="98" y2="100" stroke="#8a5a2b" stroke-width="3"/>
        <path id="demoPanL" d="M44 100 A36 12 0 0 0 116 100 Z" fill="#f3d9a4" stroke="#c98a4b" stroke-width="3"/>
        <g id="demoWatermelon">
          <path d="M52,86 A20,20 0 0 1 92,86 Z" fill="#3fa34d"/>
          <path d="M58,85 A14,14 0 0 1 86,85 Z" fill="#ff8a7a"/>
        </g>
      </g>
      <g id="demoPanRGroup">
        <line id="demoRopeR" x1="280" y1="38" x2="262" y2="100" stroke="#8a5a2b" stroke-width="3"/>
        <line id="demoRopeR2" x1="280" y1="38" x2="298" y2="100" stroke="#8a5a2b" stroke-width="3"/>
        <path id="demoPanR" d="M244 100 A36 12 0 0 0 316 100 Z" fill="#f3d9a4" stroke="#c98a4b" stroke-width="3"/>
        <g id="demoApple">
          <circle cx="280" cy="84" r="14" fill="#e05252"/>
        </g>
      </g>
      <text id="demoText" x="180" y="182" text-anchor="middle" font-size="18" font-weight="800" fill="#1e3a5f"></text>
    </svg>
    <div class="dtext" id="demoTextLine">西瓜重，天平会往西瓜那边沉下去</div>
    <button class="skip" id="demoSkip">好，我来试试</button>
  </div>
</div>

<div class="pop" id="pop"></div>

<script>
(function(){
  "use strict";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(id){ return document.getElementById(id); };
  var stageBadge = $('stageBadge'), sceneTitle = $('sceneTitle'), sceneSub = $('sceneSub');
  var resultLine = $('resultLine'), tray = $('tray'), actions = $('actions'), hintLine = $('hintLine');
  var beamGroup = $('beamGroup'), panLGroup = $('panLGroup'), panRGroup = $('panRGroup');
  var fruitLG = $('fruitL'), fruitRG = $('fruitR');
  var monkey = $('monkey'), speech = $('speech'), speechText = $('speechText');
  var pop = $('pop'), popTimer = null;

  var FRUIT = {
    apple:{name:'苹果', w:2, color:'#e05252'},
    peach:{name:'桃子', w:1, color:'#ffb37e'},
    watermelon:{name:'西瓜', w:6, color:'#3fa34d'},
    banana:{name:'香蕉', w:3, color:'#f7c948'},
    grape:{name:'葡萄', w:2, color:'#9b6bbd'}
  };

  // ---- stage definitions ----
  // weight targets are abstract "weight units". Pan content is visual fruit.
  var STAGES = [
    { // 0: play & discover
      title:'天平怎么玩？', sub:'点果子放进盘里，看天平怎么动', badge:'第 1 关',
      tray:['watermelon','apple','peach','banana','grape'],
      win:null, intro:'先放一个果子，再放另一个，看看谁更重',
      say:['放一个果子试试','再来一个，比比看','一样重就会平平的'],
      hint:'随便放，多试试！玩够了点「下一关」',
      actions:[{t:'下一关', k:'next', primary:true}]
    },
    { // 1: which is heavier (watermelon vs apple)
      title:'哪个更重？', sub:'点对的答案', badge:'第 2 关',
      tray:['watermelon','apple'],
      win:null,
      preset:{L:'watermelon', R:'apple'},
      ask:'西瓜和苹果，哪个更重？',
      say:['西瓜更重，把西瓜这边压下去了','重的果子会把天平压下去'],
      hint:'先放西瓜，再放苹果，看天平往哪边沉',
      actions:[{t:'西瓜重', k:'L', correct:true},{t:'苹果重', k:'R', correct:false},{t:'一样重', k:'E', correct:false}]
    },
    { // 2: banana vs grape
      title:'哪个更重？', sub:'点对的答案', badge:'第 3 关',
      tray:['banana','grape'],
      win:null,
      preset:{L:'banana', R:'grape'},
      ask:'香蕉和葡萄，哪个更重？',
      say:['香蕉更重，天平沉向香蕉','哪边重，天平就沉向哪边'],
      hint:'先放香蕉，再放葡萄，看天平往哪边沉',
      actions:[{t:'香蕉重', k:'L', correct:true},{t:'葡萄重', k:'R', correct:false},{t:'一样重', k:'E', correct:false}]
    },
    { // 3: balance — 1 apple = 2 peaches
      title:'让天平平平的', sub:'1 个苹果 = 2 个桃子', badge:'第 4 关',
      tray:['peach'],
      win:{L:{apple:1}, R:{peach:2}},
      preset:{L:'apple'},
      ask:'左边 1 个苹果，右边放几个桃子，天平才平平的？',
      say:['1 个苹果正好顶 2 个桃子','平平的 = 两边一样重'],
      hint:'桃子一个一个放，看到平平的就停',
      actions:[{t:'重来', k:'reset', ghost:true}]
    },
    { // 4: balance — 1 watermelon = 2 bananas
      title:'再试试平衡', sub:'1 个西瓜 = 2 根香蕉', badge:'第 5 关',
      tray:['banana'],
      win:{L:{watermelon:1}, R:{banana:2}},
      preset:{L:'watermelon'},
      ask:'左边 1 个西瓜，右边放几根香蕉，天平才平平的？',
      say:['1 个西瓜正好顶 2 根香蕉','又成功了！你真会看天平'],
      hint:'香蕉一根一根放，看到平平的就停',
      actions:[{t:'重来', k:'reset', ghost:true}]
    },
    { // 5: bonus — 1 watermelon = 3 apples (same skeleton, new numbers)
      title:'举一反三', sub:'1 个西瓜 = 3 个苹果', badge:'第 6 关',
      tray:['apple'],
      win:{L:{watermelon:1}, R:{apple:3}},
      preset:{L:'watermelon'},
      ask:'西瓜还是 1 个，右边要放几个苹果才平平的？',
      say:['1 个西瓜顶 3 个苹果','你都会自己推了，太棒了！'],
      hint:'苹果一个一个放，看到平平的就停',
      actions:[{t:'重来', k:'reset', ghost:true}]
    }
  ];
  var stage = 0, lock = false, done = false;
  var leftFruits = [], rightFruits = [];

  var MAX_ANGLE = 9;
  function totalWeight(list){
    return list.reduce(function(s, f){ return s + (FRUIT[f] ? FRUIT[f].w : 0); }, 0);
  }
  function syncScale(instant){
    var wL = totalWeight(leftFruits), wR = totalWeight(rightFruits);
    var diff = wR - wL;
    var angle = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, diff * 1.2));
    if (reduceMotion || instant) {
      beamGroup.style.transition = 'none';
      panLGroup.style.transition = 'none';
      panRGroup.style.transition = 'none';
    } else {
      beamGroup.style.transition = 'transform .55s cubic-bezier(.25,1,.5,1)';
      panLGroup.style.transition = 'transform .55s cubic-bezier(.25,1,.5,1)';
      panRGroup.style.transition = 'transform .55s cubic-bezier(.25,1,.5,1)';
    }
    // rotate(+angle): heavier side (larger weight) goes DOWN.
    // wL > wR -> diff < 0 -> angle < 0 -> rotate(angle) tilts left end down.
    beamGroup.style.transform = 'rotate(' + angle + 'deg)';
    var panDy = Math.abs(angle) * 1.6;
    panLGroup.style.transform = angle < 0 ? 'translateY(' + (panDy) + 'px)' : 'translateY(0)';
    panRGroup.style.transform = angle > 0 ? 'translateY(' + (panDy) + 'px)' : 'translateY(0)';
    return {wL:wL, wR:wR, angle:angle};
  }

  function clearPans(instant){
    leftFruits = []; rightFruits = [];
    fruitLG.innerHTML = ''; fruitRG.innerHTML = '';
    syncScale(instant);
  }

  function fruitSVG(kind, x, y){
    var g = document.createElementNS('http://www.w3.org/2000/svg','use');
    g.setAttribute('href', '#fruit-' + kind);
    g.setAttribute('x', x); g.setAttribute('y', y);
    return g;
  }
  function panFruitPos(kind, idx, side){
    // small layout on pan: up to 3 in a row, more stacks in second row
    var col = idx % 3, row = Math.floor(idx / 3);
    var baseX = side === 'L' ? 130 : 510;
    var x = baseX - 26 + col * 26;
    var y = 238 - row * 26;
    return {x:x, y:y};
  }
  function renderPans(instant){
    fruitLG.innerHTML = ''; fruitRG.innerHTML = '';
    leftFruits.forEach(function(k, i){
      var p = panFruitPos(k, i, 'L');
      fruitLG.appendChild(fruitSVG(k, p.x, p.y));
    });
    rightFruits.forEach(function(k, i){
      var p = panFruitPos(k, i, 'R');
      fruitRG.appendChild(fruitSVG(k, p.x, p.y));
    });
    syncScale(instant);
  }
  function setPreset(preset){
    clearPans(true);
    if (!preset) return;
    var L = preset.L, R = preset.R;
    if (L){ leftFruits.push(L); }
    if (R){ rightFruits.push(R); }
    renderPans(true);
  }

  // ---- tray buttons ----
  function buildTray(list, disabled){
    tray.innerHTML = '';
    list.forEach(function(kind){
      var b = document.createElement('button');
      b.className = 'fruit-btn';
      b.dataset.kind = kind;
      b.setAttribute('aria-label', '放一个' + FRUIT[kind].name);
      b.innerHTML = '<svg viewBox="-24 -28 48 56" aria-hidden="true"><use href="#fruit-' + kind + '"/></svg>';
      if (disabled) b.classList.add('locked');
      b.addEventListener('pointerdown', onTrayDown);
      tray.appendChild(b);
    });
  }
  function onTrayDown(ev){
    if (lock || done) return;
    var btn = ev.currentTarget;
    if (btn.classList.contains('locked') || btn.classList.contains('used')) return;
    // mouse: click places instantly
    if (ev.pointerType === 'mouse') {
      placeFruit(btn.dataset.kind, btn);
      return;
    }
    // touch/pen: drag follows finger; tap without move also places
    btn.classList.add('drag');
    var moved = false;
    function onMove(e){
      moved = true;
      btn.style.left = (e.clientX - 29) + 'px';
      btn.style.top = (e.clientY - 29) + 'px';
    }
    function onUp(e){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      btn.classList.remove('drag');
      btn.style.left = ''; btn.style.top = '';
      if (!moved) { placeFruit(btn.dataset.kind, btn); return; }
      // drop test: over left or right pan?
      var svgRect = $('scaleSvg').getBoundingClientRect();
      var px = e.clientX, py = e.clientY;
      var lx = svgRect.left + svgRect.width * (130/640), ly = svgRect.top + svgRect.height * (238/420);
      var rx = svgRect.left + svgRect.width * (510/640), ry = svgRect.top + svgRect.height * (238/420);
      var scale = svgRect.width / 640;
      var panR = 58 * scale;
      if (Math.hypot(px - lx, py - ly) <= panR) placeFruit(btn.dataset.kind, btn, 'L');
      else if (Math.hypot(px - rx, py - ry) <= panR) placeFruit(btn.dataset.kind, btn, 'R');
      else placeFruit(btn.dataset.kind, btn); // fallback auto
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  }

  function placeFruit(kind, btn, side){
    if (lock || done) return;
    var st = STAGES[stage];
    if (side === 'L') { leftFruits.push(kind); }
    else if (side === 'R') { rightFruits.push(kind); }
    else {
      // auto: choose the lighter side
      if (totalWeight(leftFruits) <= totalWeight(rightFruits)) leftFruits.push(kind);
      else rightFruits.push(kind);
    }
    if (btn) btn.classList.add('used');
    renderPans(false);
    afterPlace();
  }

  function afterPlace(){
    var st = STAGES[stage];
    var w = syncScale(false);
    if (st.win){
      var goalL = st.win.L, goalR = st.win.R;
      var okL = checkGoal(leftFruits, goalL), okR = checkGoal(rightFruits, goalR);
      var overL = countList(leftFruits) > totalGoal(goalL), overR = countList(rightFruits) > totalGoal(goalR);
      if (okL && okR){
        winStage();
      } else if (overL || overR){
        showPop('果子放多了，天平歪了，点「重来」再试试', 'bad');
      } else {
        var msg = w.wL === w.wR ? '天平平平的…再放几个？' : (w.wL > w.wR ? '左边沉下去了，继续放右边' : '右边沉下去了，继续放左边');
        showPop(msg);
        say(st.say[0]);
      }
    } else if (st.ask){
      // preset compare mode: just show result line
      var msg = w.wL === w.wR ? '一样重！' : (w.wL > w.wR ? '左边更重，沉下去了' : '右边更重，沉下去了');
      resultLine.textContent = msg;
      resultLine.className = 'result-line';
      if (w.wL === w.wR) resultLine.classList.add('ok');
    } else {
      // free play stage 0
      var m2 = w.wL === w.wR ? '哇，平平的！两边一样重' : (w.wL > w.wR ? '左边沉下去 = 左边重' : '右边沉下去 = 右边重');
      resultLine.textContent = m2;
      resultLine.className = 'result-line';
      if (w.wL === w.wR) resultLine.classList.add('ok');
      var idx = leftFruits.length + rightFruits.length - 1;
      if (idx >= 0) say(st.say[Math.min(idx, st.say.length-1)]);
    }
  }

  function totalGoal(goal){
    var n = 0;
    for (var k in goal) if (goal.hasOwnProperty(k)) n += goal[k];
    return n;
  }
  function checkGoal(list, goal){
    var need = {};
    for (var k in goal) if (goal.hasOwnProperty(k)) need[k] = goal[k];
    list.forEach(function(k){ if (need[k] !== undefined) need[k]--; });
    for (var k2 in need) if (need.hasOwnProperty(k2) && need[k2] !== 0) return false;
    return true;
  }
  function countList(list){ return list.length; }

  function winStage(){
    if (done) return;
    done = true; lock = true;
    var st = STAGES[stage];
    resultLine.textContent = '🎉 天平平平的！';
    resultLine.className = 'result-line ok';
    say(st.say[1] || st.say[0]);
    showPop('太棒了！', 'ok');
    // celebrate: bounce monkey
    if (!reduceMotion){
      monkey.style.transition = 'transform .35s cubic-bezier(.25,1,.5,1)';
      monkey.style.transform = 'translateY(-14px)';
      setTimeout(function(){ monkey.style.transform = 'translateY(0)'; }, 350);
      setTimeout(function(){ monkey.style.transform = 'translateY(-10px)'; }, 700);
      setTimeout(function(){ monkey.style.transform = 'translateY(0)'; }, 1050);
    }
    if (stage >= STAGES.length - 1){
      buildActions([{t:'再来一遍', k:'reset', primary:true}]);
    } else {
      buildActions([{t:'下一关', k:'next', primary:true}]);
    }
  }

  // ---- actions ----
  function buildActions(list){
    actions.innerHTML = '';
    list.forEach(function(a){
      var b = document.createElement('button');
      b.className = 'act' + (a.primary ? ' primary' : '') + (a.ghost ? ' ghost' : '');
      b.textContent = a.t;
      b.addEventListener('click', function(){
        if (a.k === 'next') nextStage();
        else if (a.k === 'reset') resetStage();
        else if (a.correct !== undefined) answer(a.k, a.correct, b);
      });
      actions.appendChild(b);
    });
  }

  function answer(k, correct, btn){
    if (lock || done) return;
    var st = STAGES[stage];
    if (correct){
      lock = true; done = true;
      resultLine.textContent = '答对了！' + (st.say && st.say[0] ? ' ' + st.say[0] : '');
      resultLine.className = 'result-line ok';
      showPop('答对了！', 'ok');
      say(st.say[1] || st.say[0]);
      if (stage >= STAGES.length - 1){
        buildActions([{t:'再来一遍', k:'reset', primary:true}]);
      } else {
        buildActions([{t:'下一关', k:'next', primary:true}]);
      }
    } else {
      // concept wrong: show why, allow retry
      var why = k === 'E' ? '不是一样重——重的果子会把天平压下去' : '看看天平：它沉向哪边，哪边就更重。再试一次';
      resultLine.textContent = '再想一想：' + why;
      resultLine.className = 'result-line bad';
      btn.classList.add('shake');
      setTimeout(function(){ btn.classList.remove('shake'); }, 500);
      showPop('看天平沉向哪边，哪边就重', 'bad');
      say('哪边重，天平就沉向哪边');
      lock = false;
    }
  }

  function resetStage(){
    clearPans(true);
    done = false; lock = false;
    var st = STAGES[stage];
    if (st.preset) setPreset(st.preset);
    resultLine.textContent = '';
    resultLine.className = 'result-line';
    buildTray(st.tray, false);
    if (st.actions) buildActions(st.actions);
    if (st.hint) hintLine.textContent = st.hint;
    say(st.intro || '');
  }

  function nextStage(){
    stage++;
    if (stage >= STAGES.length) stage = STAGES.length - 1;
    loadStage();
  }

  function loadStage(){
    var st = STAGES[stage];
    done = false; lock = false;
    stageBadge.textContent = st.badge;
    sceneTitle.textContent = st.title;
    sceneSub.textContent = st.sub;
    resultLine.textContent = '';
    resultLine.className = 'result-line';
    hintLine.textContent = st.hint || '';
    clearPans(true);
    if (st.preset) setPreset(st.preset);
    buildTray(st.tray, false);
    if (st.actions) buildActions(st.actions); else buildActions([]);
    say(st.intro || '');
    if (st.ask){ resultLine.textContent = st.ask; }
  }

  function say(t){
    if (!t) { speech.classList.add('hidden'); return; }
    speech.classList.remove('hidden');
    speechText.textContent = t;
  }

  function showPop(msg, type){
    pop.textContent = msg;
    pop.className = 'pop show' + (type ? ' ' + type : '');
    clearTimeout(popTimer);
    popTimer = setTimeout(function(){ pop.classList.remove('show'); }, 2600);
  }

  // ---- opening demo (plays a few times, then stays on final state) ----
  function runDemo(){
    var demoBeam = $('demoBeam'), demoPanLGroup = $('demoPanLGroup'), demoText = $('demoText');
    var phases = [
      {ang:0,  txt:'先把西瓜放左边'},
      {ang:-7, txt:'西瓜更重，沉下去了'},
      {ang:0,  txt:''},
      {ang:-7, txt:'重的那边会沉下去'}
    ];
    var i = 0, rounds = 0;
    function setTilt(ang, txt){
      demoBeam.style.transition = 'transform .8s cubic-bezier(.25,1,.5,1)';
      demoPanLGroup.style.transition = 'transform .8s cubic-bezier(.25,1,.5,1)';
      demoBeam.style.transform = 'rotate(' + ang + 'deg)';
      demoPanLGroup.style.transform = ang < 0 ? 'translateY(12px)' : 'translateY(0)';
      demoText.textContent = txt;
    }
    function step(){
      if (reduceMotion){
        setTilt(-7, '西瓜重 → 天平沉向西瓜');
        return;
      }
      var p = phases[i];
      setTilt(p.ang, p.txt);
      i++;
      if (i >= phases.length){
        i = 0; rounds++;
        if (rounds >= 2){
          // stay at final tilted state
          setTilt(-7, '西瓜重 → 天平沉向西瓜');
          return;
        }
      }
      setTimeout(step, 950);
    }
    step();
  }

  $('demoSkip').addEventListener('click', function(){
    var ov = $('demoOverlay');
    ov.classList.add('hidden');
    loadStage();
  });

  window.addEventListener('resize', function(){ syncScale(true); });

  // start: show demo overlay only once
  runDemo();
})();
</script>
</body>
