<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v4">
<meta name="aid-version-at" content="2026-08-14T10-09-13">
<meta name="aid-version-note" content="系统重跑 2026-08-14T10-09-13">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>彩虹小火车装货物 · 按颜色分类</title>
<style>
  :root{
    --ink:#1e3a5f;
    --accent:#2f6fbf;
    --ok:#2fbf71;
    --bad:#e85d5d;
    --card:#fff;
    --soft:#f3f6fb;
    --line:#dbe4f0;
    --c-red:#e5484d;   --soft-red:#fdecec;
    --c-blue:#2f6fbf;  --soft-blue:#e8f1fb;
    --c-yellow:#f2b53c;--soft-yellow:#fdf3dd;
    --c-green:#3fa34d; --soft-green:#e9f6eb;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100dvh;height:100vh;overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#eaf3fd 0%,#f7fafd 100%);
    color:var(--ink);
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #app{
    height:100dvh;height:100vh;
    display:flex;flex-direction:column;
    max-width:min(1240px,100%);margin:0 auto;
    padding:10px clamp(8px,2vw,20px) 12px;
  }
  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:12px;padding:4px 6px 8px;flex:none}
  .logo{flex:none;width:46px;height:46px}
  h1{font-size:clamp(22px,2.6vw,32px);font-weight:800;letter-spacing:.5px;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{flex:none;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:clamp(17px,1.7vw,21px);font-weight:700;color:var(--accent);white-space:nowrap}
  #resetBtn{flex:none;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:26px;line-height:1;cursor:pointer;color:var(--accent);display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s}
  #resetBtn:active{transform:scale(.92);border-color:var(--accent)}
  /* ---------- stage ---------- */
  #stage{position:relative;flex:1;min-height:0;background:var(--card);border:3px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .skyline{position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(180deg,#bfe0ff,#e8f4ff);opacity:.5}
  #hint{position:absolute;left:12px;right:12px;top:10px;z-index:3;text-align:center;pointer-events:none;font-size:clamp(18px,2vw,24px);font-weight:600;color:var(--accent);text-shadow:0 1px 0 #fff}
  /* ---------- 货物 ---------- */
  #items{position:absolute;left:0;right:0;top:52px;bottom:0;z-index:4}
  .item{
    position:absolute;width:clamp(72px,9.5vw,92px);height:clamp(72px,9.5vw,92px);
    border-radius:20px;background:#fff;border:3px solid var(--line);
    box-shadow:0 6px 14px rgba(30,58,95,.14);
    display:flex;align-items:center;justify-content:center;
    cursor:grab;touch-action:none;
    transition:transform .18s cubic-bezier(.25,1,.5,1),border-color .18s,box-shadow .18s;
    will-change:left,top;
  }
  .item svg{width:80%;height:80%;pointer-events:none}
  .item.dragging{z-index:20;cursor:grabbing;transform:scale(1.14);border-color:var(--accent);box-shadow:0 14px 26px rgba(30,58,95,.28);transition:none}
  .item.selected{z-index:12;transform:scale(1.12);border-color:var(--accent);box-shadow:0 0 0 6px rgba(47,111,191,.22)}
  .item.returning{transition:left .3s cubic-bezier(.25,1,.5,1),top .3s cubic-bezier(.25,1,.5,1),transform .18s}
  .item.wrong{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  /* ---------- 火车 ---------- */
  #train{position:absolute;left:clamp(6px,1.5vw,16px);right:clamp(6px,1.5vw,16px);bottom:clamp(8px,1.6vw,14px);z-index:5;display:flex;align-items:flex-end;gap:clamp(4px,1vw,10px)}
  #engine{flex:none;width:clamp(96px,14vw,150px);height:clamp(96px,17vh,150px);position:relative}
  #engine svg{width:100%;height:100%;display:block}
  .puffs{position:absolute;left:52%;top:6px;pointer-events:none}
  .puff{position:absolute;left:0;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid #c9d8ec;opacity:0}
  #train.puffing .puff{animation:rise 1.5s cubic-bezier(.25,1,.5,1) infinite}
  #train.puffing .puff:nth-child(2){animation-delay:.5s}
  #train.puffing .puff:nth-child(3){animation-delay:1s}
  @keyframes rise{0%{transform:translate(0,0) scale(.7);opacity:0}15%{opacity:.95}100%{transform:translate(30px,-52px) scale(1.55);opacity:0}}
  .car{
    position:relative;flex:1;min-width:0;max-width:220px;
    height:clamp(112px,24vh,180px);
    border-radius:16px 16px 10px 10px;
    border:3px solid var(--hc);background:var(--hsoft);
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(6px,1.2vh,10px) 6px 6px;
    cursor:pointer;touch-action:manipulation;
    transition:transform .18s,border-color .18s,box-shadow .18s;
  }
  .car.active{transform:scale(1.04)}
  .car.glow{border-color:var(--hc);box-shadow:0 0 0 6px var(--hglow),0 10px 20px rgba(30,58,95,.18);transform:scale(1.04)}
  .car.pop{animation:pop .4s cubic-bezier(.25,1,.5,1)}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  .car .roof{width:88%;height:clamp(12px,2.2vh,18px);border-radius:8px 8px 4px 4px;background:var(--hc);flex:none}
  .car .win{
    flex:1;width:92%;min-height:0;background:rgba(255,255,255,.8);
    border:2px dashed var(--hc);border-radius:10px;margin-top:6px;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;padding:4px;overflow:hidden;
  }
  .car .win .mini{width:clamp(30px,4.4vw,46px);height:clamp(30px,4.4vw,46px);flex:none;pointer-events:none}
  .car .win .mini svg{width:100%;height:100%}
  .car .cname{margin-top:2px;font-size:clamp(20px,2.2vw,26px);font-weight:800;color:var(--hc)}
  .car .wheels{display:flex;gap:14px;margin-top:2px;flex:none}
  .car .wheels .wheel{width:clamp(16px,2.6vw,24px);height:clamp(16px,2.6vw,24px);border-radius:50%;background:#334155;border:3px solid #1e293b}
  /* ---------- 信息条 ---------- */
  #msg{flex:none;margin-top:10px;min-height:clamp(46px,6vh,56px);border-radius:14px;padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(21px,2.3vw,27px);font-weight:700;text-align:center;background:var(--soft);border:2px solid var(--line);color:var(--ink)}
  #msg.ok{background:#e9fbf0;border-color:var(--ok);color:#177a47}
  #msg.warn{background:#fdf0ef;border-color:var(--bad);color:#b23b3b}
  #msg .msg-ico{font-size:clamp(22px,2.6vw,30px);line-height:1}
  /* ---------- footer ---------- */
  footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px}
  #tip{font-size:clamp(22px,2.6vw,30px);font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #parent{flex:none;font-size:clamp(15px,1.7vw,19px);color:#7c8aa0;max-width:52%;text-align:right}
  /* ---------- 过关 ---------- */
  #win{position:absolute;inset:0;z-index:40;background:rgba(234,243,253,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
  #win.show{display:flex}
  #win .big{font-size:clamp(30px,5.5vw,52px);font-weight:900;color:var(--ink)}
  #win .sub{font-size:clamp(21px,3.2vw,32px);font-weight:700;color:var(--accent)}
  #win .sub2{font-size:clamp(17px,2.5vw,25px);color:#5b6b85;max-width:600px;line-height:1.6}
  .btn{border:none;cursor:pointer;background:var(--accent);color:#fff;border-radius:999px;padding:15px 36px;font-size:clamp(22px,2.8vw,30px);font-weight:800;box-shadow:0 8px 18px rgba(47,111,191,.35);transition:transform .15s,box-shadow .15s}
  .btn:active{transform:scale(.96)}
  .btn.alt{background:var(--ok);box-shadow:0 8px 18px rgba(47,191,113,.35)}
  /* ---------- 开场演示 ---------- */
  #demo{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#eaf3fd,#fdf7ea);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.5vh,24px);padding:20px;text-align:center}
  #demo.hide{display:none}
  #demo h2{font-size:clamp(28px,5vw,46px);font-weight:900;color:var(--ink)}
  #demo .demo-stage{position:relative;width:min(90vw,480px);height:min(46vw,250px);background:var(--card);border:3px solid var(--line);border-radius:var(--radius);overflow:hidden}
  #demo .d-cargo{position:absolute;left:50%;top:36%;width:60px;height:60px;margin-left:-30px;margin-top:-30px;z-index:3;animation:demoGo 4.8s cubic-bezier(.4,0,.2,1) .6s 2 forwards}
  #demo .d-cargo svg{width:100%;height:100%}
  #demo .d-car{position:absolute;right:5%;bottom:4%;width:150px;height:100px}
  #demo .d-car svg{width:100%;height:100%}
  #demo .d-label{position:absolute;left:50%;top:7%;transform:translateX(-50%);font-size:clamp(18px,2.6vw,24px);font-weight:800;color:var(--ink);white-space:nowrap}
  @keyframes demoGo{0%{transform:translate(0,0) scale(1)}12%{transform:translate(0,-8px) scale(1.08)}58%{transform:translate(141px,98px) scale(1.12)}78%{transform:translate(141px,98px) scale(.6)}100%{transform:translate(141px,98px) scale(.6)}}
  #demo .demo-tip{font-size:clamp(20px,2.8vw,30px);font-weight:800;color:var(--accent)}
  #demo .btn{background:var(--ok);box-shadow:0 8px 18px rgba(47,191,113,.35)}
  /* ---------- 降级与窄屏 ---------- */
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .item,.item.dragging,.item.selected,.item.returning{transform:none}
    #demo .d-cargo{animation:none;transform:translate(141px,98px) scale(.6)}
    #train.puffing .puff{animation:none;opacity:.85;transform:translate(30px,-52px) scale(1.4)}
  }
  @media (max-width:560px){
    .car .win{display:none}
    .car .cname{font-size:18px}
  }
  @media (max-height:560px){
    #hint{display:none}
    #msg{min-height:44px;font-size:18px;padding:4px 12px}
    #tip{font-size:20px}
    #parent{display:none}
    .car{height:92px}
    .car .win{display:none}
    .car .cname{font-size:18px}
    .item{width:60px;height:60px}
    #engine{width:84px;height:84px}
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="26" fill="#ffd66b"/>
      <g stroke="#8a5a00" stroke-width="3" stroke-linecap="round">
        <line x1="32" y1="6" x2="32" y2="12"/>
        <line x1="14" y1="14" x2="18" y2="19"/>
        <line x1="50" y1="14" x2="46" y2="19"/>
      </g>
      <circle cx="25" cy="30" r="3.4" fill="#1e3a5f"/>
      <circle cx="39" cy="30" r="3.4" fill="#1e3a5f"/>
      <path d="M25 40 Q32 47 39 40" stroke="#1e3a5f" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <circle cx="22" cy="24" r="3" fill="#fff"/>
      <circle cx="36" cy="24" r="3" fill="#fff"/>
    </svg>
    <h1>彩虹小火车装货物</h1>
    <button id="resetBtn" title="重新开始本关" aria-label="重新开始本关">↻</button>
    <div class="chip" id="chip">第 1 关</div>
  </header>

  <main id="stage">
    <div class="skyline"></div>
    <div id="hint">点住货物，拖到一样颜色的车厢</div>
    <div id="items"></div>
    <div id="train">
      <div id="engine">
        <div class="puffs"><span class="puff"></span><span class="puff"></span><span class="puff"></span></div>
        <svg viewBox="0 0 150 120" aria-hidden="true">
          <g stroke="rgba(30,58,95,.25)" stroke-width="2">
            <rect x="8" y="44" width="120" height="54" rx="14" fill="#33475f"/>
            <rect x="20" y="56" width="46" height="34" rx="8" fill="#bfe0ff"/>
            <rect x="76" y="18" width="18" height="32" rx="5" fill="#33475f"/>
            <rect x="80" y="10" width="10" height="10" rx="3" fill="#33475f"/>
            <circle cx="128" cy="80" r="9" fill="#ffd66b"/>
            <circle cx="128" cy="80" r="5" fill="#f6a821"/>
            <circle cx="42" cy="102" r="11" fill="#334155"/>
            <circle cx="94" cy="102" r="11" fill="#334155"/>
            <circle cx="42" cy="102" r="4" fill="#94a3b8"/>
            <circle cx="94" cy="102" r="4" fill="#94a3b8"/>
            <line x1="128" y1="60" x2="142" y2="60" stroke="#33475f" stroke-width="5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div id="cars"></div>
    </div>

    <div id="win">
      <div class="big" id="winBig">装完啦！</div>
      <div class="sub" id="winSub">小火车吃饱啦～</div>
      <div class="sub2" id="winSub2"></div>
      <button class="btn alt" id="nextBtn">下一关</button>
    </div>
  </main>

  <div id="msg"><span class="msg-ico">👋</span><span id="msgText">把颜色一样的货物，装进同一节车厢</span></div>

  <footer>
    <div id="tip">开始啦！</div>
    <div id="parent">我会说：红色的货物，装进哪节车厢呀？</div>
  </footer>
</div>

<!-- 开场演示 -->
<div id="demo">
  <h2>彩虹小火车装货物</h2>
  <div class="demo-stage">
    <div class="d-label">把红色礼盒，装进红色车厢</div>
    <div class="d-cargo" id="dCargo"></div>
    <div class="d-car" id="dCar"></div>
  </div>
  <div class="demo-tip">颜色一样的，装同一节车厢</div>
  <button class="btn" id="demoStart">跳过演示，开始玩</button>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 颜色 ---------- */
  var COLORS = {
    red:    {id:'red',   name:'红', main:'#e5484d', soft:'#fdecec'},
    blue:   {id:'blue',  name:'蓝', main:'#2f6fbf', soft:'#e8f1fb'},
    yellow: {id:'yellow',name:'黄', main:'#f2b53c', soft:'#fdf3dd'},
    green:  {id:'green', name:'绿', main:'#3fa34d', soft:'#e9f6eb'}
  };

  /* ---------- 货物 SVG（L1-3 站台货物） ---------- */
  function cargoSVG(kind, color){
    var c = COLORS[color].main;
    var body = '';
    if(kind==='gift'){
      body = '<rect x="14" y="28" width="36" height="26" rx="5" fill="'+c+'"/>'
           + '<rect x="9" y="20" width="46" height="11" rx="4" fill="'+c+'"/>'
           + '<path d="M32 20 V54" stroke="rgba(255,255,255,.75)" stroke-width="3"/>'
           + '<path d="M22 12 Q32 22 32 22 Q32 22 42 12" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round"/>'
           + '<circle cx="32" cy="23" r="2.6" fill="#fff"/>';
    }else if(kind==='ball'){
      body = '<circle cx="32" cy="34" r="20" fill="'+c+'"/>'
           + '<path d="M32 14 Q40 34 32 54" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none"/>'
           + '<ellipse cx="25" cy="26" rx="5" ry="8" fill="rgba(255,255,255,.4)"/>';
    }else if(kind==='can'){
      body = '<rect x="20" y="24" width="24" height="32" rx="6" fill="'+c+'"/>'
           + '<ellipse cx="32" cy="24" rx="12" ry="5" fill="'+c+'"/>'
           + '<rect x="13" y="16" width="38" height="9" rx="3" fill="#c9d8ec"/>';
    }else if(kind==='star'){
      var pts=[];for(var i=0;i<10;i++){var r=i%2===0?26:12;var a=Math.PI/2+i*Math.PI/5;pts.push((32+r*Math.cos(a)).toFixed(1)+','+(32-r*Math.sin(a)).toFixed(1));}
      body = '<polygon points="'+pts.join(' ')+'" fill="'+c+'" stroke="'+c+'" stroke-width="2" stroke-linejoin="round"/>';
    }
    return '<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="rgba(30,58,95,.18)" stroke-width="2">'+body+'</g></svg>';
  }

  /* ---------- 零食玩具 SVG（L4 举一反三） ---------- */
  function treatSVG(kind, color){
    var c = COLORS[color].main;
    var body = '';
    if(kind==='balloon'){
      body = '<path d="M32 62 Q29 46 32 34" stroke="#94a3b8" stroke-width="2.6" fill="none"/>'
           + '<ellipse cx="32" cy="22" rx="15" ry="18" fill="'+c+'"/>'
           + '<ellipse cx="27" cy="16" rx="5" ry="7" fill="rgba(255,255,255,.4)"/>'
           + '<path d="M29 40 L33 40 L32 34 Z" fill="'+c+'"/>';
    }else if(kind==='candy'){
      body = '<path d="M16 26 L5 16 L5 34 Z" fill="'+c+'"/>'
           + '<path d="M48 26 L59 16 L59 34 Z" fill="'+c+'"/>'
           + '<rect x="14" y="24" width="36" height="16" rx="7" fill="'+c+'"/>'
           + '<ellipse cx="32" cy="32" rx="10" ry="6" fill="rgba(255,255,255,.35)"/>';
    }else if(kind==='cup'){
      body = '<path d="M17 20 h30 l-5 32 h-20 Z" fill="'+c+'"/>'
           + '<path d="M47 24 h9 a7 7 0 0 1 0 16 h-10" stroke="'+c+'" stroke-width="5" fill="none" stroke-linecap="round"/>'
           + '<ellipse cx="32" cy="20" rx="15" ry="4" fill="'+c+'"/>';
    }else if(kind==='drum'){
      body = '<ellipse cx="32" cy="17" rx="16" ry="6" fill="'+c+'"/>'
           + '<rect x="16" y="17" width="32" height="26" fill="'+c+'"/>'
           + '<ellipse cx="32" cy="43" rx="16" ry="6" fill="'+c+'"/>'
           + '<line x1="16" y1="30" x2="48" y2="30" stroke="rgba(30,58,95,.25)" stroke-width="2"/>';
    }
    return '<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="rgba(30,58,95,.18)" stroke-width="2">'+body+'</g></svg>';
  }

  /* ---------- 关卡：先少后多，最后一关换物 ---------- */
  var LEVELS = [
    {colors:['red','blue'],                per:2, skin:'cargo', label:'第 1 关', tip:'先认 2 个颜色'},
    {colors:['red','blue','yellow'],       per:2, skin:'cargo', label:'第 2 关', tip:'多了黄色'},
    {colors:['red','blue','yellow','green'],per:2, skin:'cargo', label:'第 3 关', tip:'4 个颜色都会了'},
    {colors:['red','blue','yellow','green'],per:2, skin:'treats',label:'举一反三', tip:'换成零食玩具，你也会分'}
  ];
  var CARGO = ['gift','ball','can','star'];
  var TREATS = ['balloon','candy','cup','drum'];

  var stage = document.getElementById('stage');
  var itemsEl = document.getElementById('items');
  var carsEl = document.getElementById('cars');
  var trainEl = document.getElementById('train');
  var hintEl = document.getElementById('hint');
  var msgEl = document.getElementById('msg');
  var msgText = document.getElementById('msgText');
  var tipEl = document.getElementById('tip');
  var chipEl = document.getElementById('chip');
  var winEl = document.getElementById('win');
  var winBig = document.getElementById('winBig');
  var winSub = document.getElementById('winSub');
  var winSub2 = document.getElementById('winSub2');
  var nextBtn = document.getElementById('nextBtn');
  var resetBtn = document.getElementById('resetBtn');

  var level = 0;
  var selected = null;   // 点选兜底
  var placedCount = 0;
  var totalItems = 0;
  var busy = false;

  /* ---------- 开场演示 ---------- */
  function buildDemo(){
    document.getElementById('dCargo').innerHTML = cargoSVG('gift','red');
    document.getElementById('dCar').innerHTML =
      '<svg viewBox="0 0 150 100" aria-hidden="true">' +
      '<rect x="6" y="20" width="138" height="62" rx="10" fill="#fdecec" stroke="#e5484d" stroke-width="3"/>' +
      '<rect x="18" y="12" width="114" height="14" rx="6" fill="#e5484d"/>' +
      '<rect x="24" y="30" width="102" height="36" rx="8" fill="#fff" stroke="#e5484d" stroke-dasharray="6 5"/>' +
      '<circle cx="40" cy="92" r="8" fill="#334155"/>' +
      '<circle cx="110" cy="92" r="8" fill="#334155"/>' +
      '</svg>';
  }
  document.getElementById('demoStart').addEventListener('click', function(){
    document.getElementById('demo').classList.add('hide');
    loadLevel();
  });
  buildDemo();

  /* ---------- 游戏 ---------- */
  function loadLevel(){
    var L = LEVELS[level];
    chipEl.textContent = L.label;
    tipEl.textContent = L.tip;
    hintEl.textContent = '点住货物，拖到一样颜色的车厢';
    msgEl.className = '';
    msgText.textContent = '把颜色一样的货物，装进同一节车厢';
    winEl.classList.remove('show');
    trainEl.classList.remove('puffing');
    selected = null; placedCount = 0; busy = false;

    buildTrain(L.colors);

    // 建货物（乱序，不按答案排好）
    var kinds = (L.skin==='cargo' ? CARGO : TREATS).slice();
    var items = [];
    L.colors.forEach(function(cid){
      for(var i=0;i<L.per;i++){
        var kind = kinds.shift() || (L.skin==='cargo' ? CARGO : TREATS)[Math.floor(Math.random()*4)];
        items.push({color:cid, kind:kind});
      }
    });
    for(var i=items.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=items[i]; items[i]=items[j]; items[j]=t; }

    totalItems = items.length;
    scatterItems(items);
  }

  function buildTrain(colors){
    carsEl.innerHTML = '';
    colors.forEach(function(cid){
      var c = COLORS[cid];
      var car = document.createElement('div');
      car.className = 'car';
      car.dataset.color = cid;
      car.style.setProperty('--hc', c.main);
      car.style.setProperty('--hsoft', c.soft);
      car.style.setProperty('--hglow', c.main + '55');
      car.innerHTML =
        '<div class="roof"></div>' +
        '<div class="win"></div>' +
        '<div class="cname">' + c.name + '</div>' +
        '<div class="wheels"><div class="wheel"></div><div class="wheel"></div></div>';
      car.addEventListener('click', function(){ onCarTap(car); });
      car.addEventListener('pointerdown', function(){ car.classList.add('active'); });
      car.addEventListener('pointerup', function(){ car.classList.remove('active'); });
      car.addEventListener('pointerleave', function(){ car.classList.remove('active'); });
      carsEl.appendChild(car);
    });
  }

  function scatterItems(items){
    var stageRect = stage.getBoundingClientRect();
    var trainH = trainEl.offsetHeight;
    var pad = 10;
    var w = stageRect.width - pad*2;
    var areaBottom = stageRect.height - 52 - trainH - 14; // 相对 items 容器
    var cols = Math.ceil(Math.sqrt(items.length * (stageRect.width/240)));
    if(cols < 2) cols = 2;
    if(cols > items.length) cols = items.length;
    var rows = Math.ceil(items.length / cols);
    var cellW = w / cols;
    var cellH = Math.min(100, Math.max(66, (areaBottom - 6) / rows));
    itemsEl.innerHTML = '';
    items.forEach(function(it, idx){
      var col = idx % cols;
      var row = Math.floor(idx / cols);
      var el = document.createElement('div');
      el.className = 'item';
      el.dataset.color = it.color;
      el.dataset.kind = it.kind;
      el.innerHTML = LEVELS[level].skin==='cargo' ? cargoSVG(it.kind, it.color) : treatSVG(it.kind, it.color);
      var x = pad + col*cellW + (cellW-84)*0.5 + (Math.random()*14-7);
      var y = 6 + row*cellH + (Math.random()*10-5);
      y = Math.max(4, Math.min(areaBottom - 86, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.__home = {x:x, y:y};
      bindItem(el);
      itemsEl.appendChild(el);
    });
  }

  function bindItem(el){
    var startX=0, startY=0, moved=false, dragging=false;
    var w2 = 0;
    el.addEventListener('pointerdown', function(e){
      if(busy) return;
      e.preventDefault();
      var rect = stage.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      moved = false; dragging = true;
      w2 = el.offsetWidth/2;
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', function(e){
      if(!dragging) return;
      if(!moved && Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY) < 8) return;
      if(!moved){
        moved = true;
        clearSelected();
        selected = el;
        el.classList.add('dragging');
      }
      var rect = stage.getBoundingClientRect();
      var x = e.clientX - rect.left - w2;
      var y = e.clientY - rect.top - 52 - w2;   // items 容器内
      x = Math.max(0, Math.min(rect.width - w2*2, x));
      y = Math.max(0, Math.min(rect.height - 52 - w2*2, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      if(!moved){
        // 点选兜底：选中货物，等待点车厢
        clearSelected();
        selected = el;
        el.classList.add('selected');
        hintEl.textContent = '再点一节车厢，把货物放进去';
        return;
      }
      el.classList.remove('dragging');
      var rect = stage.getBoundingClientRect();
      var cx = parseFloat(el.style.left) + w2;
      var cy = parseFloat(el.style.top) + 52 + w2;  // 还原到 stage 坐标
      var car = findCarAt(cx + rect.left, cy + rect.top);
      if(car){ tryPlace(el, car); }
      else{ returnItem(el); }
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  function findCarAt(px, py){
    var cars = carsEl.querySelectorAll('.car');
    for(var i=0;i<cars.length;i++){
      var r = cars[i].getBoundingClientRect();
      if(px >= r.left && px <= r.right && py >= r.top && py <= r.bottom) return cars[i];
    }
    return null;
  }

  function onCarTap(car){
    if(busy) return;
    if(selected){
      var el = selected;
      selected = null;
      tryPlace(el, car);
    }else{
      car.classList.add('pop');
      setTimeout(function(){ car.classList.remove('pop'); }, 450);
      updateMsg('先点一个货物吧','');
    }
  }

  function clearSelected(){
    var s = itemsEl.querySelector('.item.selected');
    if(s) s.classList.remove('selected');
  }

  function tryPlace(el, car){
    if(el.dataset.color === car.dataset.color){
      placeItem(el, car);
    }else{
      wrongItem(el, car);
    }
  }

  function placeItem(el, car){
    busy = true;
    el.classList.remove('selected');
    el.classList.add('dragging');
    var carRect = car.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    var tx = carRect.left - stageRect.left + carRect.width/2 - el.offsetWidth/2;
    var ty = carRect.top - stageRect.top - 52 + 14;   // 落到车厢窗口上方
    el.style.left = tx + 'px';
    el.style.top = ty + 'px';
    setTimeout(function(){
      var win = car.querySelector('.win');
      var mini = document.createElement('div');
      mini.className = 'mini';
      mini.innerHTML = el.innerHTML;
      win.appendChild(mini);
      el.remove();
      placedCount++;
      busy = false;
      car.classList.add('pop');
      setTimeout(function(){ car.classList.remove('pop'); }, 450);
      updateMsg('对啦！' + COLORS[el.dataset.color].name + '色货物进' + COLORS[el.dataset.color].name + '色车厢','ok');
      if(placedCount >= totalItems){ finishLevel(); }
    }, 280);
  }

  function wrongItem(el, car){
    var cName = COLORS[el.dataset.color].name;
    var hName = COLORS[car.dataset.color].name;
    el.classList.add('wrong');
    car.classList.add('pop');
    setTimeout(function(){ car.classList.remove('pop'); }, 450);
    // 概念错：对照对例，指出该去哪节车厢
    var rightCar = carsEl.querySelector('.car[data-color="'+el.dataset.color+'"]');
    if(rightCar){
      rightCar.classList.add('glow');
      setTimeout(function(){ rightCar.classList.remove('glow'); }, 1600);
    }
    updateMsg('这个货物是' + cName + '色，要进' + cName + '色车厢；' + hName + '色车厢只装' + hName + '色','warn');
    setTimeout(function(){
      el.classList.remove('wrong');
      returnItem(el);
    }, 900);
  }

  function returnItem(el){
    el.classList.add('returning');
    el.style.left = el.__home.x + 'px';
    el.style.top = el.__home.y + 'px';
    setTimeout(function(){
      el.classList.remove('returning');
      el.classList.remove('dragging');
    }, 320);
  }

  function finishLevel(){
    trainEl.classList.add('puffing');
    tipEl.textContent = '呜——开走啦！';
    updateMsg('全部装好啦！','ok');
    setTimeout(showWin, 1100);
  }

  function showWin(){
    var L = LEVELS[level];
    var isLast = level === LEVELS.length-1;
    winBig.textContent = '装完啦！';
    if(isLast){
      winSub.textContent = '真棒！零食玩具你也分得清';
      winSub2.textContent = '颜色一样的，就能装进同一节车厢。回家试试：把袜子、积木、蜡笔按颜色分一分。';
      nextBtn.textContent = '再玩一次';
    }else{
      winSub.textContent = L.colors.length<4 ? '再来多一点颜色！' : '越来越厉害啦！';
      winSub2.textContent = '下一关颜色更多，货物更多。';
      nextBtn.textContent = '下一关';
    }
    winEl.classList.add('show');
  }
  nextBtn.addEventListener('click', function(){
    winEl.classList.remove('show');
    level++;
    if(level >= LEVELS.length){ level = 0; }
    loadLevel();
  });
  resetBtn.addEventListener('click', function(){
    winEl.classList.remove('show');
    loadLevel();
  });

  function updateMsg(text, cls){
    msgText.textContent = text;
    msgEl.className = cls;
    var ico = msgEl.querySelector('.msg-ico');
    ico.textContent = cls==='ok' ? '🎉' : (cls==='warn' ? '💡' : '👋');
  }

  /* 初始：等演示关闭后开始 */
  hintEl.textContent = '点一下开始';
  msgText.textContent = '先看演示，再动手';
})();
</script>
</body>
