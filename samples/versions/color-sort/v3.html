<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="aid-version" content="v3">
<meta name="aid-version-at" content="2026-08-14T08:25:39">
<meta name="aid-version-note" content="当前稿">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>送彩色玩具回家 · 按颜色分类</title>
<style>
  :root{
    --ink:#1e3a5f;
    --accent:#2f6fbf;
    --ok:#2fbf71;
    --bad:#e85d5d;
    --card:#fff;
    --soft:#f3f6fb;
    --line:#dbe4f0;
    --c-red:#e5484d;   --soft-red:#fdecec;
    --c-blue:#2f6fbf;  --soft-blue:#e8f1fb;
    --c-yellow:#f2b53c;--soft-yellow:#fdf3dd;
    --c-green:#3fa34d; --soft-green:#e9f6eb;
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100dvh;height:100vh;overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,#eaf3fd 0%,#f7fafd 100%);
    color:var(--ink);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    height:100dvh;height:100vh;
    display:flex;flex-direction:column;
    max-width:min(1240px,100%);
    margin:0 auto;
    padding:10px clamp(8px,2vw,20px) 12px;
  }
  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:12px;
    padding:4px 6px 8px;
    flex:none;
  }
  .logo{flex:none;width:44px;height:44px}
  h1{
    font-size:clamp(20px,2.4vw,30px);
    font-weight:800;letter-spacing:.5px;
    line-height:1.2;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chip{
    flex:none;background:var(--card);border:2px solid var(--line);
    border-radius:999px;padding:8px 16px;
    font-size:clamp(16px,1.6vw,20px);font-weight:700;color:var(--accent);
    white-space:nowrap;
  }
  #resetBtn{
    flex:none;width:48px;height:48px;border-radius:14px;
    border:2px solid var(--line);background:var(--card);
    font-size:24px;line-height:1;cursor:pointer;color:var(--accent);
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s, border-color .15s;
  }
  #resetBtn:active{transform:scale(.92);border-color:var(--accent)}
  /* ---------- stage ---------- */
  #stage{
    position:relative;flex:1;min-height:0;
    background:var(--card);
    border:3px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  /* 物品区提示 */
  .skyline{position:absolute;left:0;right:0;top:0;height:14px;
    background:linear-gradient(180deg,#bfe0ff,#e8f4ff);opacity:.5}
  #hint{
    position:absolute;left:12px;right:12px;top:10px;z-index:3;
    text-align:center;pointer-events:none;
    font-size:clamp(16px,1.8vw,22px);font-weight:600;color:var(--accent);
    text-shadow:0 1px 0 #fff;
  }
  /* 物品 */
  #items{position:absolute;inset:0;z-index:4}
  .item{
    position:absolute;width:clamp(64px,9vw,84px);height:clamp(64px,9vw,84px);
    border-radius:18px;background:#fff;
    border:3px solid var(--line);
    box-shadow:0 6px 14px rgba(30,58,95,.14);
    display:flex;align-items:center;justify-content:center;
    cursor:grab;touch-action:none;
    transition:transform .18s cubic-bezier(.25,1,.5,1), border-color .18s, box-shadow .18s;
    will-change:left,top;
  }
  .item svg{width:78%;height:78%;pointer-events:none}
  .item.dragging{
    z-index:20;cursor:grabbing;
    transform:scale(1.14);
    border-color:var(--accent);
    box-shadow:0 14px 26px rgba(30,58,95,.28);
    transition:none;
  }
  .item.selected{
    z-index:12;transform:scale(1.12);
    border-color:var(--accent);
    box-shadow:0 0 0 6px rgba(47,111,191,.22);
  }
  .item.returning{transition:left .3s cubic-bezier(.25,1,.5,1), top .3s cubic-bezier(.25,1,.5,1), transform .18s}
  .item.wrong{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translateX(-3px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-6px)}
    40%,60%{transform:translateX(6px)}
  }
  /* 家 */
  #homes{
    position:absolute;left:clamp(8px,2vw,20px);right:clamp(8px,2vw,20px);bottom:clamp(8px,2vw,16px);
    display:flex;gap:clamp(8px,2vw,16px);justify-content:center;
    z-index:5;
  }
  .home{
    position:relative;flex:1;max-width:230px;min-width:0;
    height:clamp(120px,26vh,180px);
    border-radius:16px;border:3px solid var(--line);
    background:var(--soft);
    display:flex;flex-direction:column;align-items:center;
    padding-top:clamp(12px,2vh,20px);
    cursor:pointer;touch-action:manipulation;
    transition:transform .18s, border-color .18s, box-shadow .18s;
  }
  .home .roof{
    position:absolute;top:-1px;left:-3px;right:-3px;height:clamp(26px,4.5vh,40px);
  }
  .home .roof svg{width:100%;height:100%;display:block}
  .home .door{
    margin-top:clamp(4px,1vh,8px);
    width:clamp(40px,6vw,64px);height:clamp(40px,7vh,64px);
    border-radius:12px 12px 8px 8px;
    border:3px solid rgba(0,0,0,.12);
    background:var(--hsoft);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(20px,2.4vw,28px);font-weight:800;color:var(--hc);
  }
  .home .slots{
    display:flex;gap:4px;margin-top:4px;height:34px;align-items:center;
    min-height:34px;
  }
  .home .slots .mini{width:32px;height:32px;flex:none;pointer-events:none}
  .home .slots .mini svg{width:100%;height:100%}
  .home .hname{
    margin-top:2px;font-size:clamp(20px,2.2vw,26px);font-weight:800;color:var(--hc);
  }
  .home.active{transform:scale(1.04);border-color:var(--hc);box-shadow:0 8px 18px rgba(30,58,95,.16)}
  .home.glow{border-color:var(--hc);box-shadow:0 0 0 6px var(--hglow), 0 10px 20px rgba(30,58,95,.18);transform:scale(1.04)}
  .home.pop{animation:pop .4s cubic-bezier(.25,1,.5,1)}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  /* ---------- 信息条 ---------- */
  #msg{
    flex:none;margin-top:10px;min-height:clamp(44px,6vh,54px);
    border-radius:14px;padding:8px 16px;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:clamp(20px,2.2vw,26px);font-weight:700;text-align:center;
    background:var(--soft);border:2px solid var(--line);color:var(--ink);
  }
  #msg.ok{background:#e9fbf0;border-color:var(--ok);color:#177a47}
  #msg.warn{background:#fdf0ef;border-color:var(--bad);color:#b23b3b}
  #msg .msg-ico{font-size:clamp(22px,2.6vw,30px);line-height:1}
  /* ---------- footer ---------- */
  footer{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-top:8px;
  }
  #tip{
    font-size:clamp(22px,2.6vw,30px);font-weight:800;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #parent{flex:none;font-size:clamp(14px,1.6vw,18px);color:#7c8aa0;max-width:52%;text-align:right}
  /* ---------- 过关 ---------- */
  #win{
    position:absolute;inset:0;z-index:40;
    background:rgba(234,243,253,.92);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    padding:20px;text-align:center;
  }
  #win.show{display:flex}
  #win .big{font-size:clamp(28px,5vw,48px);font-weight:900;color:var(--ink)}
  #win .sub{font-size:clamp(20px,3vw,30px);font-weight:700;color:var(--accent)}
  #win .sub2{font-size:clamp(16px,2.4vw,24px);color:#5b6b85;max-width:560px;line-height:1.6}
  .btn{
    border:none;cursor:pointer;
    background:var(--accent);color:#fff;
    border-radius:999px;
    padding:14px 34px;
    font-size:clamp(22px,2.8vw,30px);font-weight:800;
    box-shadow:0 8px 18px rgba(47,111,191,.35);
    transition:transform .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(.96)}
  .btn.alt{background:var(--ok);box-shadow:0 8px 18px rgba(47,191,113,.35)}
  /* ---------- 开场演示 ---------- */
  #demo{
    position:fixed;inset:0;z-index:100;
    background:linear-gradient(180deg,#eaf3fd,#fdf7ea);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.5vh,24px);
    padding:20px;text-align:center;
  }
  #demo.hide{display:none}
  #demo h2{font-size:clamp(28px,5vw,46px);font-weight:900;color:var(--ink)}
  #demo .demo-stage{
    position:relative;width:min(90vw,460px);height:min(46vw,240px);
    background:var(--card);border:3px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  #demo .d-star{
    position:absolute;left:50%;top:34%;width:56px;height:56px;
    margin-left:-28px;margin-top:-28px;
    z-index:3;
    animation:demoGo 4.6s cubic-bezier(.4,0,.2,1) .5s 2 forwards;
  }
  #demo .d-star svg{width:100%;height:100%}
  #demo .d-home{
    position:absolute;right:6%;bottom:4%;width:88px;height:88px;
  }
  #demo .d-home svg{width:100%;height:100%}
  #demo .d-label{
    position:absolute;left:50%;top:8%;transform:translateX(-50%);
    font-size:clamp(18px,2.6vw,24px);font-weight:800;color:var(--ink);white-space:nowrap;
  }
  @keyframes demoGo{
    0%{transform:translate(0,0) scale(1)}
    12%{transform:translate(0,-6px) scale(1.08)}
    55%{transform:translate(158px,104px) scale(1.15)}
    75%{transform:translate(158px,104px) scale(.55)}
    100%{transform:translate(158px,104px) scale(.55)}
  }
  #demo .demo-tip{font-size:clamp(20px,2.8vw,30px);font-weight:800;color:var(--accent)}
  #demo .btn{background:var(--ok);box-shadow:0 8px 18px rgba(47,191,113,.35)}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .item,.item.dragging,.item.selected,.item.returning{transform:none}
    #demo .d-star{animation:none}
  }
  @media (max-height:560px){
    #hint{display:none}
    #msg{min-height:44px;font-size:18px;padding:4px 12px}
    #tip{font-size:20px}
    #parent{display:none}
    .home{height:96px}
    .home .door{width:36px;height:36px;font-size:16px}
    .home .slots{display:none}
    .home .hname{font-size:18px}
    .item{width:58px;height:58px}
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="26" fill="#ffd66b"/>
      <g stroke="#8a5a00" stroke-width="3" stroke-linecap="round">
        <line x1="32" y1="6" x2="32" y2="12"/>
        <line x1="14" y1="14" x2="18" y2="19"/>
        <line x1="50" y1="14" x2="46" y2="19"/>
      </g>
      <circle cx="25" cy="30" r="3.4" fill="#1e3a5f"/>
      <circle cx="39" cy="30" r="3.4" fill="#1e3a5f"/>
      <path d="M25 40 Q32 47 39 40" stroke="#1e3a5f" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <circle cx="22" cy="24" r="3" fill="#fff"/>
      <circle cx="36" cy="24" r="3" fill="#fff"/>
    </svg>
    <h1>送彩色玩具回家</h1>
    <button id="resetBtn" title="重新开始本关" aria-label="重新开始本关">↻</button>
    <div class="chip" id="chip">第 1 关</div>
  </header>

  <main id="stage">
    <div class="skyline"></div>
    <div id="hint">点住玩具，拖到一样颜色的房子</div>
    <div id="items"></div>
    <div id="homes"></div>

    <div id="win">
      <div class="big" id="winBig">全部送回家！</div>
      <div class="sub" id="winSub">波波谢谢你～</div>
      <div class="sub2" id="winSub2"></div>
      <button class="btn alt" id="nextBtn">下一关</button>
    </div>
  </main>

  <div id="msg"><span class="msg-ico">👋</span><span id="msgText">把相同颜色的玩具送回家</span></div>

  <footer>
    <div id="tip">开始啦！</div>
    <div id="parent">我会说：宝宝，红色的玩具住在哪个家呀？</div>
  </footer>
</div>

<!-- 开场演示 -->
<div id="demo">
  <h2>送彩色玩具回家</h2>
  <div class="demo-stage">
    <div class="d-label">把红色星星，送进红色房子</div>
    <div class="d-star" id="dStar"></div>
    <div class="d-home" id="dHome"></div>
  </div>
  <div class="demo-tip">颜色一样的，住同一个家</div>
  <button class="btn" id="demoStart">跳过演示，开始玩</button>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 颜色与形状 ---------- */
  var COLORS = {
    red:    {id:'red',   name:'红', main:'#e5484d', soft:'#fdecec'},
    blue:   {id:'blue',  name:'蓝', main:'#2f6fbf', soft:'#e8f1fb'},
    yellow: {id:'yellow',name:'黄', main:'#f2b53c', soft:'#fdf3dd'},
    green:  {id:'green', name:'绿', main:'#3fa34d', soft:'#e9f6eb'}
  };

  function shapeSVG(shape, color){
    var c = COLORS[color].main;
    var fill = 'fill="'+c+'"';
    var body = '';
    if(shape==='circle'){
      body = '<circle cx="32" cy="32" r="22" '+fill+'/>';
    }else if(shape==='star'){
      var pts=[];for(var i=0;i<10;i++){var r=i%2===0?26:12;var a=Math.PI/2+i*Math.PI/5;pts.push((32+r*Math.cos(a)).toFixed(1)+','+(32-r*Math.sin(a)).toFixed(1));}
      body = '<polygon points="'+pts.join(' ')+'" '+fill+' stroke="'+c+'" stroke-width="2" stroke-linejoin="round"/>';
    }else if(shape==='heart'){
      body = '<path d="M32 50 C14 38 10 22 20 16 C28 12 32 20 32 20 C32 20 36 12 44 16 C54 22 50 38 32 50 Z" '+fill+'/>';
    }else if(shape==='square'){
      body = '<rect x="12" y="12" width="40" height="40" rx="10" '+fill+'/>';
    }else if(shape==='flower'){
      for(var j=0;j<5;j++){var aa=Math.PI/2+j*2*Math.PI/5;body += '<circle cx="'+(32+11*Math.cos(aa)).toFixed(1)+'" cy="'+(32-11*Math.sin(aa)).toFixed(1)+'" r="10" '+fill+'/>';}
      body += '<circle cx="32" cy="32" r="10" fill="#fff3b0"/>';
    }else if(shape==='drop'){
      body = '<path d="M32 8 C32 8 14 26 14 38 a18 18 0 0 0 36 0 C50 26 32 8 32 8 Z" '+fill+'/>';
    }
    return '<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="rgba(30,58,95,.18)" stroke-width="2">'+body+'</g></svg>';
  }

  function fruitSVG(kind, color){
    // 举一反三：换物不换颜色
    var c = COLORS[color].main;
    var body='';
    if(kind==='apple'){
      body = '<circle cx="32" cy="34" r="20" fill="'+c+'"/>'
           + '<path d="M32 16 Q36 10 40 12" stroke="#5b3b1e" stroke-width="3" fill="none" stroke-linecap="round"/>'
           + '<ellipse cx="29" cy="26" rx="5" ry="7" fill="rgba(255,255,255,.35)"/>';
    }else if(kind==='berry'){
      body = '<circle cx="20" cy="40" r="11" fill="'+c+'"/>'
           + '<circle cx="34" cy="32" r="11" fill="'+c+'"/>'
           + '<circle cx="44" cy="42" r="11" fill="'+c+'"/>'
           + '<circle cx="32" cy="20" r="8" fill="'+c+'"/>'
           + '<path d="M32 12 Q34 8 36 10" stroke="#3a7d44" stroke-width="3" fill="none" stroke-linecap="round"/>';
    }else if(kind==='pear'){
      body = '<path d="M32 44 a13 13 0 0 0 13-13 C45 22 38 14 32 8 C26 14 19 22 19 31 a13 13 0 0 0 13 13 Z" fill="'+c+'"/>'
           + '<path d="M32 8 Q34 3 37 4" stroke="#5b3b1e" stroke-width="3" fill="none" stroke-linecap="round"/>'
           + '<ellipse cx="27" cy="26" rx="4" ry="6" fill="rgba(255,255,255,.35)"/>';
    }else if(kind==='melon'){
      body = '<path d="M14 40 Q14 18 32 14 Q50 18 50 40 Q32 48 14 40 Z" fill="#e9f6eb"/>'
           + '<path d="M14 40 Q32 44 50 40" stroke="#7cb342" stroke-width="3" fill="none"/>'
           + '<circle cx="26" cy="32" r="3" fill="#e5484d"/><circle cx="36" cy="33" r="3" fill="#e5484d"/>'
           + '<circle cx="31" cy="40" r="3" fill="#e5484d"/><circle cx="32" cy="22" r="3" fill="#e5484d"/>';
    }
    return '<svg viewBox="0 0 64 64" aria-hidden="true"><g stroke="rgba(30,58,95,.18)" stroke-width="2">'+body+'</g></svg>';
  }

  /* ---------- 关卡：先少后多 ---------- */
  var LEVELS = [
    {colors:['red','blue'],                per:2, skin:'shape', label:'第 1 关', tip:'先认 2 个颜色'},
    {colors:['red','blue','yellow'],       per:2, skin:'shape', label:'第 2 关', tip:'多了黄色'},
    {colors:['red','blue','yellow','green'],per:2, skin:'shape', label:'第 3 关', tip:'4 个颜色都会了'},
    {colors:['red','blue','green'],        per:2, skin:'fruit', label:'举一反三', tip:'换成水果，你也会分'}
  ];
  var SHAPES = ['circle','star','heart','square','flower','drop'];
  var FRUITS = ['apple','berry','pear','melon'];

  var stage = document.getElementById('stage');
  var itemsEl = document.getElementById('items');
  var homesEl = document.getElementById('homes');
  var hintEl = document.getElementById('hint');
  var msgEl = document.getElementById('msg');
  var msgText = document.getElementById('msgText');
  var tipEl = document.getElementById('tip');
  var chipEl = document.getElementById('chip');
  var winEl = document.getElementById('win');
  var winBig = document.getElementById('winBig');
  var winSub = document.getElementById('winSub');
  var winSub2 = document.getElementById('winSub2');
  var nextBtn = document.getElementById('nextBtn');
  var resetBtn = document.getElementById('resetBtn');

  var level = 0;
  var selected = null;   // 点选兜底：当前选中的物品
  var placedCount = 0;
  var totalItems = 0;
  var busy = false;

  /* ---------- 开场演示 ---------- */
  function buildDemo(){
    var star = document.getElementById('dStar');
    star.innerHTML = shapeSVG('star','red');
    var home = document.getElementById('dHome');
    home.innerHTML = '<svg viewBox="0 0 88 88"><polygon points="44,4 84,34 4,34" fill="#e5484d"/><rect x="16" y="34" width="56" height="50" rx="6" fill="#fdecec" stroke="#e5484d" stroke-width="3"/><rect x="34" y="50" width="20" height="34" rx="4" fill="#e5484d"/></svg>';
  }
  document.getElementById('demoStart').addEventListener('click', function(){
    document.getElementById('demo').classList.add('hide');
    loadLevel();
  });
  buildDemo();

  /* ---------- 游戏 ---------- */
  function loadLevel(){
    var L = LEVELS[level];
    chipEl.textContent = L.label;
    tipEl.textContent = L.tip;
    hintEl.textContent = '点住玩具，拖到一样颜色的房子';
    msgEl.className = '';
    msgText.textContent = '把相同颜色的玩具送回家';
    winEl.classList.remove('show');
    selected = null; placedCount = 0; busy = false;

    // 建家
    homesEl.innerHTML = '';
    L.colors.forEach(function(cid){
      var c = COLORS[cid];
      var h = document.createElement('div');
      h.className = 'home';
      h.dataset.color = cid;
      h.style.setProperty('--hc', c.main);
      h.style.setProperty('--hsoft', c.soft);
      h.style.setProperty('--hglow', c.main + '55');
      h.innerHTML =
        '<div class="roof"><svg viewBox="0 0 200 40" preserveAspectRatio="none"><polygon points="8,40 100,2 192,40" fill="'+c.main+'"/></svg></div>' +
        '<div class="door">' + c.name + '</div>' +
        '<div class="slots"></div>' +
        '<div class="hname">' + c.name + '</div>';
      h.addEventListener('click', function(){ onHomeTap(h); });
      h.addEventListener('pointerdown', function(){ h.classList.add('active'); });
      h.addEventListener('pointerup', function(){ h.classList.remove('active'); });
      h.addEventListener('pointerleave', function(){ h.classList.remove('active'); });
      homesEl.appendChild(h);
    });

    // 建物品（乱序）
    var shapes = SHAPES.slice();
    var fruits = FRUITS.slice();
    itemsEl.innerHTML = '';
    var items = [];
    L.colors.forEach(function(cid){
      for(var i=0;i<L.per;i++){
        var kind;
        if(L.skin==='shape'){ kind = shapes.shift() || SHAPES[Math.floor(Math.random()*SHAPES.length)]; }
        else{ kind = fruits.shift() || FRUITS[Math.floor(Math.random()*FRUITS.length)]; }
        items.push({color:cid, kind:kind});
      }
    });
    // 打乱顺序（Fisher–Yates）
    for(var i=items.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=items[i]; items[i]=items[j]; items[j]=t; }

    totalItems = items.length;
    scatterItems(items);
    updateMsg('把相同颜色的玩具送回家','');
  }

  function nextLevel(){
    level++;
    if(level >= LEVELS.length){ level = 0; }
    loadLevel();
  }

  function scatterItems(items){
    var rect = stage.getBoundingClientRect();
    var pad = 16;
    var topArea = rect.height * 0.52;      // 物品区高度（上方）
    var w = rect.width - pad*2;
    var cols = Math.ceil(Math.sqrt(items.length * (rect.width/220)) );
    if(cols < 2) cols = 2;
    if(cols > items.length) cols = items.length;
    var rows = Math.ceil(items.length / cols);
    var cellW = w / cols;
    var cellH = Math.min(96, (topArea - 46) / rows);
    items.forEach(function(it, idx){
      var col = idx % cols;
      var row = Math.floor(idx / cols);
      var el = document.createElement('div');
      el.className = 'item';
      el.dataset.color = it.color;
      el.dataset.kind = it.kind;
      el.dataset.skin = LEVELS[level].skin;
      el.innerHTML = LEVELS[level].skin==='shape' ? shapeSVG(it.kind, it.color) : fruitSVG(it.kind, it.color);
      var x = pad + col*cellW + (cellW-72)*0.5 + (Math.random()*16-8);
      var y = 52 + row*cellH + (Math.random()*12-6);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.__home = {x:x, y:y};
      bindItem(el);
      itemsEl.appendChild(el);
    });
  }

  function bindItem(el){
    var startX=0, startY=0, moved=false, dragging=false;
    el.addEventListener('pointerdown', function(e){
      if(busy) return;
      e.preventDefault();
      var rect = stage.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      moved = false;
      dragging = true;
      selected = el;
      clearSelected();
      el.classList.add('dragging');
      el.style.left = (e.clientX - rect.left - 36) + 'px';
      el.style.top  = (e.clientY - rect.top - 36) + 'px';
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });
    el.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var rect = stage.getBoundingClientRect();
      var x = e.clientX - rect.left - 36;
      var y = e.clientY - rect.top - 36;
      x = Math.max(0, Math.min(rect.width-72, x));
      y = Math.max(0, Math.min(rect.height-72, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY) > 8) moved = true;
    });
    function endDrag(e){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if(!moved){
        // 点选兜底：选中物品，等待点家
        clearSelected();
        selected = el;
        el.classList.add('selected');
        hintEl.textContent = '再点一个房子，把玩具放进去';
        return;
      }
      var rect = stage.getBoundingClientRect();
      var cx = parseFloat(el.style.left) + 36;
      var cy = parseFloat(el.style.top) + 36;
      var home = findHomeAt(cx + rect.left, cy + rect.top);
      if(home){ tryPlace(el, home); }
      else{ returnItem(el); }
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  function findHomeAt(px, py){
    var homes = homesEl.querySelectorAll('.home');
    for(var i=0;i<homes.length;i++){
      var r = homes[i].getBoundingClientRect();
      if(px >= r.left && px <= r.right && py >= r.top && py <= r.bottom) return homes[i];
    }
    return null;
  }

  function onHomeTap(home){
    if(busy) return;
    if(selected){
      var el = selected;
      selected = null;
      tryPlace(el, home);
    }else{
      home.classList.add('pop');
      setTimeout(function(){ home.classList.remove('pop'); }, 450);
      updateMsg('先点一个玩具吧','');
    }
  }

  function clearSelected(){
    var s = itemsEl.querySelector('.item.selected');
    if(s) s.classList.remove('selected');
  }

  function tryPlace(el, home){
    var itemColor = el.dataset.color;
    var homeColor = home.dataset.color;
    if(itemColor === homeColor){
      placeItem(el, home);
    }else{
      wrongItem(el, home);
    }
  }

  function placeItem(el, home){
    busy = true;
    el.classList.remove('selected');
    el.classList.add('dragging');   // 抬高 z-index
    var homeRect = home.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    var tx = homeRect.left - stageRect.left + homeRect.width/2 - 36;
    var ty = homeRect.top - stageRect.top + 26 - 36;
    el.style.left = tx + 'px';
    el.style.top = ty + 'px';
    setTimeout(function(){
      // 移入家内槽位
      var slots = home.querySelector('.slots');
      var mini = document.createElement('div');
      mini.className = 'mini';
      mini.innerHTML = el.innerHTML;
      slots.appendChild(mini);
      el.remove();
      placedCount++;
      busy = false;
      home.classList.add('pop');
      setTimeout(function(){ home.classList.remove('pop'); }, 450);
      updateMsg('对啦！' + (COLORS[itemColor].name) + '色玩具回' + COLORS[itemColor].name + '色家','ok');
      if(placedCount >= totalItems){ setTimeout(showWin, 700); }
    }, 260);
  }

  function wrongItem(el, home){
    var cName = COLORS[el.dataset.color].name;
    var hName = COLORS[home.dataset.color].name;
    el.classList.add('wrong');
    home.classList.add('pop');
    setTimeout(function(){ home.classList.remove('pop'); }, 450);
    // 概念错：对照对例，指出该去哪个家
    var rightHome = homesEl.querySelector('.home[data-color="'+el.dataset.color+'"]');
    if(rightHome){
      rightHome.classList.add('glow');
      setTimeout(function(){ rightHome.classList.remove('glow'); }, 1600);
    }
    updateMsg('这个玩具是' + cName + '色，要住' + cName + '色房子；' + hName + '色房子住' + hName + '色玩具','warn');
    setTimeout(function(){
      el.classList.remove('wrong');
      returnItem(el);
    }, 900);
  }

  function returnItem(el){
    el.classList.add('returning');
    el.style.left = el.__home.x + 'px';
    el.style.top = el.__home.y + 'px';
    setTimeout(function(){
      el.classList.remove('returning');
      el.classList.remove('dragging');
    }, 320);
  }

  function showWin(){
    var L = LEVELS[level];
    var isLast = level === LEVELS.length-1;
    winBig.textContent = '全部送回家！';
    if(isLast){
      winSub.textContent = '真棒！换成果子你也分得清';
      winSub2.textContent = '宝宝已经会按颜色分类啦：颜色一样，就是一个家的。生活中试试：袜子、积木、蜡笔都能分一分。';
      nextBtn.textContent = '再玩一次';
    }else{
      winSub.textContent = L.colors.length<4 ? '再来多一点颜色！' : '越来越厉害啦！';
      winSub2.textContent = '下一关颜色更多，玩具更多。';
      nextBtn.textContent = '下一关';
    }
    winEl.classList.add('show');
  }
  nextBtn.addEventListener('click', function(){
    winEl.classList.remove('show');
    nextLevel();
  });
  resetBtn.addEventListener('click', function(){
    winEl.classList.remove('show');
    loadLevel();
  });

  function updateMsg(text, cls){
    msgText.textContent = text;
    msgEl.className = cls;
    var ico = msgEl.querySelector('.msg-ico');
    ico.textContent = cls==='ok' ? '🎉' : (cls==='warn' ? '💡' : '👋');
  }

  /* 初始：等演示关闭后开始 */
  hintEl.textContent = '点一下开始';
  msgText.textContent = '先看演示，再动手';
})();
</script>
</body>
</html>
