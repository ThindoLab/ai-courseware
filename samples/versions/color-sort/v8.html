<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#F2FAFF;color:#1e3a5f;
  user-select:none;-webkit-user-select:none;
}
#app{
  position:relative;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  max-width:min(1240px,100%);margin:0 auto;
}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 4px;gap:8px;flex:0 0 auto;
}
.h-title{font-size:clamp(20px,2.8vmin,28px);font-weight:900;display:flex;align-items:center;gap:6px}
.h-right{display:flex;align-items:center;gap:8px}
.h-progress{
  font-size:clamp(16px,2.2vmin,20px);font-weight:800;
  background:#fff;border:2px solid #BEE3F5;border-radius:999px;
  padding:8px 16px;color:#2f6fbf;white-space:nowrap;min-height:48px;
  display:flex;align-items:center;
}
.reset-btn{
  min-width:52px;min-height:52px;border-radius:50%;
  border:2px solid #BEE3F5;background:#fff;font-size:22px;
  font-weight:900;color:#2f6fbf;cursor:pointer;
}
.reset-btn:active{transform:scale(.92)}
main.stage{position:relative;flex:1;min-height:0;margin:6px 12px 4px;overflow:visible}
.stage-bg{
  position:absolute;inset:0;border-radius:26px;
  background:linear-gradient(180deg,#EAF8FF,#D2EEFF);
  box-shadow:inset 0 0 0 3px #BEE3F5;pointer-events:none;z-index:0;
}
.bg-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.hint{
  position:absolute;top:10px;left:0;right:0;text-align:center;
  font-size:clamp(18px,2.6vmin,24px);font-weight:800;color:#2f6fbf;
  z-index:2;pointer-events:none;padding:0 12px;
}
footer{flex:0 0 auto;padding:6px 12px 12px;margin-top:auto}
.ponds{display:flex;justify-content:center;gap:clamp(8px,2vmin,16px);padding:0 4px}
.pond{
  flex:1;min-width:0;max-width:200px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;position:relative;z-index:4;
}
.pond-tag{
  font-size:clamp(16px,2.2vmin,20px);font-weight:900;color:#1e3a5f;
  display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.swatch{width:22px;height:22px;border-radius:7px;background:var(--c);flex:0 0 auto;border:2px solid rgba(30,58,95,.15)}
.pond-water{
  width:100%;min-height:72px;min-width:64px;
  border-radius:16px 16px 22px 22px;
  background:var(--soft);border:4px solid var(--c);
  box-shadow:0 3px 0 rgba(30,58,95,.08);position:relative;z-index:4;
}
.pond.ok .pond-water{animation:pondOk .7s ease}
@keyframes pondOk{
  0%{box-shadow:0 0 0 0 rgba(47,191,113,0)}
  35%{box-shadow:0 0 0 10px rgba(47,191,113,.5)}
  100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}
}
.pond.shake{animation:shake .4s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-4px)}
}
.ctrl{min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.next-btn{
  font-size:clamp(18px,2.4vmin,24px);font-weight:900;color:#fff;
  background:#2f6fbf;border:none;border-radius:999px;
  padding:14px 32px;min-height:56px;min-width:120px;cursor:pointer;
  box-shadow:0 4px 0 #1c4a86;animation:popIn .35s ease;
}
.next-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1c4a86}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.fish{
  position:absolute;width:clamp(68px,10vmin,100px);aspect-ratio:120/80;
  cursor:grab;touch-action:none;
  filter:drop-shadow(0 3px 3px rgba(30,58,95,.2));
  transition:left .25s ease,top .25s ease;z-index:12;
}
.fish svg{width:100%;height:100%;display:block;pointer-events:none}
.fish.selected{z-index:25;transform:scale(1.12)}
.fish.selected::after{
  content:"";position:absolute;inset:-10px;
  border:4px dashed #F59E0B;border-radius:50%;pointer-events:none;
}
.fish.dragging{
  transition:none;z-index:40;transform:scale(1.18);
  filter:drop-shadow(0 8px 10px rgba(30,58,95,.35));
  cursor:grabbing;
}
.fish.settled{
  pointer-events:none;z-index:15;transform:scale(.5);opacity:.94;
  filter:drop-shadow(0 2px 3px rgba(30,58,95,.25));
  transition:left .55s cubic-bezier(.25,1,.5,1),top .55s cubic-bezier(.25,1,.5,1),transform .45s ease,opacity .45s ease;
}
.fish.swim{animation:swimBob 2.4s ease-in-out infinite}
.fish.swim:nth-child(odd){animation-duration:2.8s}
.fish.swim:nth-child(3n){animation-duration:2.1s}
@keyframes swimBob{
  0%,100%{transform:translate(0,0) rotate(-2deg)}
  50%{transform:translate(4px,-6px) rotate(2deg)}
}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:20vh;z-index:60;
  max-width:88vw;background:#fff;border-radius:18px;padding:14px 22px;
  font-size:clamp(18px,2.4vmin,22px);font-weight:800;
  box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .2s;
  text-align:center;pointer-events:none;
}
#toast.show{opacity:1}
#toast.ok{border:3px solid #2fbf71}
#toast.err{border:3px solid #F59E0B}
.overlay{
  position:absolute;inset:0;z-index:100;
  background:linear-gradient(160deg,#F2FAFF,#D9EEFF);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:20px;text-align:center;
}
.overlay.hidden{display:none}
.demo-title{font-size:clamp(26px,5vmin,36px);font-weight:900;color:#1e3a5f}
.demo-sub{font-size:clamp(18px,2.8vmin,24px);font-weight:700;color:#2f6fbf;max-width:28em;line-height:1.45}
.demo-play{
  position:relative;width:min(420px,90vw);height:clamp(140px,28vh,200px);
  background:#fff;border:3px dashed #BEE3F5;border-radius:22px;overflow:hidden;
}
.demo-play .dp-bg{position:absolute;inset:0;background:linear-gradient(180deg,#EAF8FF,#D2EEFF)}
.demo-pond-box{
  position:absolute;bottom:14px;right:28px;width:110px;
  display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;
}
.demo-pond-box .label{font-size:16px;font-weight:900}
.demo-water{
  width:100%;height:56px;border-radius:14px 14px 18px 18px;
  background:#FFE4E6;border:4px solid #E85D5D;
}
.demo-fish-el{
  position:absolute;left:24px;top:40%;width:88px;z-index:5;
  filter:drop-shadow(0 3px 3px rgba(30,58,95,.2));
  animation:demoSwim 2s cubic-bezier(.25,1,.5,1) infinite;
}
@keyframes demoSwim{
  0%{left:24px;top:42%;transform:scale(1)}
  55%{left:58%;top:48%;transform:scale(1)}
  75%{left:68%;top:58%;transform:scale(.55)}
  100%{left:68%;top:58%;transform:scale(.55);opacity:.9}
}
.ring-ok{
  position:absolute;right:36px;bottom:22px;width:90px;height:70px;
  border:4px solid #2fbf71;border-radius:50%;pointer-events:none;z-index:6;
  opacity:0;animation:ringPop 2s ease infinite;
  background:transparent;
}
@keyframes ringPop{
  0%,55%{opacity:0;transform:scale(.8)}
  70%,90%{opacity:1;transform:scale(1)}
  100%{opacity:0}
}
.big-btn{
  font-size:clamp(20px,2.8vmin,26px);font-weight:900;color:#fff;
  background:#2f6fbf;border:none;border-radius:999px;
  padding:16px 44px;min-height:64px;min-width:140px;cursor:pointer;
  box-shadow:0 5px 0 #1c4a86;
}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1c4a86}
.skip{
  position:absolute;top:14px;right:14px;
  font-size:clamp(16px,2.2vmin,18px);font-weight:800;color:#2f6fbf;
  background:#fff;border:2px solid #BEE3F5;border-radius:999px;
  padding:12px 20px;min-height:48px;cursor:pointer;
}
.green-btn{background:#2fbf71;box-shadow:0 5px 0 #1f9d52}
.congrats-title{font-size:clamp(28px,6vmin,42px);font-weight:900;color:#1e3a5f}
.fox{width:clamp(72px,14vmin,110px)}
.variant-card{
  background:#fff;border:3px solid #BEE3F5;border-radius:20px;
  padding:16px 22px;max-width:540px;
  font-size:clamp(18px,2.6vmin,22px);font-weight:700;color:#1e3a5f;line-height:1.55;
  text-align:left;
}
.variant-card b{color:#2f6fbf}
#endScreen{
  position:absolute;inset:0;z-index:110;
  background:linear-gradient(160deg,#E8FFF3,#D9EEFF);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:24px;text-align:center;
}
#endScreen.show{display:flex}
@media (prefers-reduced-motion: reduce){
  .fish.swim,.demo-fish-el,.ring-ok{animation:none !important}
  .fish{transition:none !important}
  .demo-fish-el{left:68%;top:58%;transform:scale(.55)}
  .ring-ok{opacity:1}
}
</style>

<body>
<div id="app">
  <header>
    <div class="h-title">🐠 按颜色分类</div>
    <div class="h-right">
      <div class="h-progress" id="progress">第 1 / 3 关</div>
      <button type="button" class="reset-btn" id="btnReset" title="重来" aria-label="本关重来">↻</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="stage-bg"></div>
    <svg class="bg-svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <circle cx="120" cy="60" r="28" fill="#fff" opacity=".55"/>
      <circle cx="148" cy="60" r="22" fill="#fff" opacity=".45"/>
      <circle cx="680" cy="48" r="20" fill="#fff" opacity=".4"/>
      <ellipse cx="400" cy="390" rx="420" ry="40" fill="#B8E0F5" opacity=".35"/>
    </svg>
    <p class="hint" id="hint">把小鱼拖进或点选后点同色水塘</p>
    <div id="fishLayer"></div>
  </main>

  <footer>
    <div class="ponds" id="ponds"></div>
    <div class="ctrl" id="ctrl"></div>
  </footer>

  <div class="overlay" id="demo">
    <button type="button" class="skip" id="btnSkip">跳过</button>
    <div class="demo-title">小鱼要回家啦</div>
    <p class="demo-sub">颜色一样才能进水塘 · 看红鱼游进红塘</p>
    <div class="demo-play" aria-hidden="true">
      <div class="dp-bg"></div>
      <div class="demo-fish-el" id="demoFish">
        <svg viewBox="0 0 120 80" width="88" height="58">
          <ellipse cx="58" cy="40" rx="38" ry="24" fill="#E85D5D"/>
          <path d="M22 40 L6 22 L10 40 L6 58 Z" fill="#E85D5D"/>
          <circle cx="78" cy="34" r="5" fill="#1e3a5f"/>
          <circle cx="80" cy="33" r="2" fill="#fff"/>
          <path d="M70 48 Q78 54 68 56" fill="none" stroke="#9b2c2c" stroke-width="2" stroke-linecap="round"/>
          <path d="M48 22 Q58 10 70 22" fill="#F87171" opacity=".9"/>
        </svg>
      </div>
      <div class="demo-pond-box">
        <span class="label">红塘</span>
        <div class="demo-water"></div>
      </div>
      <div class="ring-ok" title="对了"></div>
    </div>
    <button type="button" class="big-btn" id="btnStart">开始玩</button>
  </div>

  <!-- 独立结束页（祝贺 · 通关） -->
  <div id="endScreen" role="dialog" aria-labelledby="endTitle">
    <svg class="fox" viewBox="0 0 80 70" aria-hidden="true">
      <ellipse cx="40" cy="48" rx="28" ry="18" fill="#F6AD55"/>
      <circle cx="40" cy="32" r="18" fill="#F6AD55"/>
      <path d="M24 22 L18 8 L32 18 Z" fill="#F6AD55"/>
      <path d="M56 22 L62 8 L48 18 Z" fill="#F6AD55"/>
      <circle cx="33" cy="30" r="3" fill="#1e3a5f"/>
      <circle cx="47" cy="30" r="3" fill="#1e3a5f"/>
      <ellipse cx="40" cy="38" rx="5" ry="3" fill="#C05621"/>
    </svg>
    <div class="congrats-title" id="endTitle">通关祝贺！你真棒</div>
    <p class="demo-sub">一样颜色的小鱼，住进一样颜色的家</p>
    <div class="variant-card">
      举一反三：桌上有 <b>3 只黄积木</b> 和 <b>2 只绿积木</b>，黄筐里该放几只？
      还是「同色回家」——黄筐放 <b>3</b> 只黄积木。
    </div>
    <button type="button" class="big-btn green-btn" id="btnReplay">再玩一次</button>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
(function () {
  var COLORS = {
    red:    { name: '红', c: '#E85D5D', soft: '#FFE4E6', fin: '#F87171', dark: '#9b2c2c' },
    blue:   { name: '蓝', c: '#2f6fbf', soft: '#DBEAFE', fin: '#60A5FA', dark: '#1e4a8a' },
    yellow: { name: '黄', c: '#E6B422', soft: '#FEF3C7', fin: '#FCD34D', dark: '#A16207' },
    green:  { name: '绿', c: '#2fbf71', soft: '#D1FAE5', fin: '#6EE7B7', dark: '#047857' }
  };

  var LEVELS = [
    { ponds: ['red', 'blue'], fish: ['red', 'blue', 'red', 'blue'] },
    { ponds: ['red', 'blue', 'yellow'], fish: ['yellow', 'red', 'blue', 'yellow', 'blue', 'red'] },
    { ponds: ['red', 'blue', 'yellow', 'green'], fish: ['green', 'red', 'yellow', 'blue', 'green', 'red', 'blue', 'yellow'] }
  ];

  var level = 0;
  var selectedId = null;
  var placed = {};
  var drag = null;
  var gameOver = false;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById('stage');
  var fishLayer = document.getElementById('fishLayer');
  var pondsEl = document.getElementById('ponds');
  var ctrl = document.getElementById('ctrl');
  var hint = document.getElementById('hint');
  var progress = document.getElementById('progress');
  var toast = document.getElementById('toast');
  var demo = document.getElementById('demo');
  var endScreen = document.getElementById('endScreen');

  function fishSvg(key) {
    var p = COLORS[key];
    return (
      '<svg viewBox="0 0 120 80" aria-hidden="true">' +
      '<ellipse cx="58" cy="40" rx="38" ry="24" fill="' + p.c + '"/>' +
      '<path d="M22 40 L6 22 L10 40 L6 58 Z" fill="' + p.c + '"/>' +
      '<circle cx="78" cy="34" r="5" fill="#1e3a5f"/>' +
      '<circle cx="80" cy="33" r="2" fill="#fff"/>' +
      '<path d="M70 48 Q78 54 68 56" fill="none" stroke="' + p.dark + '" stroke-width="2" stroke-linecap="round"/>' +
      '<path d="M48 22 Q58 10 70 22" fill="' + p.fin + '" opacity=".95"/>' +
      '</svg>'
    );
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function showToast(msg, ok) {
    toast.textContent = msg;
    toast.className = 'show ' + (ok ? 'ok' : 'err');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.className = ''; }, 1600);
  }

  function layoutLoose(n) {
    var rect = stage.getBoundingClientRect();
    var w = rect.width || 360;
    var h = rect.height || 280;
    var pts = [];
    var cols = Math.ceil(Math.sqrt(n * 1.2));
    var rows = Math.ceil(n / cols);
    var padX = w * 0.12;
    var padY = h * 0.18;
    var usableW = Math.max(80, w - padX * 2);
    var usableH = Math.max(80, h - padY * 2 - 20);
    var i = 0;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols && i < n; c++, i++) {
        var jx = (Math.random() - 0.5) * (usableW / cols) * 0.35;
        var jy = (Math.random() - 0.5) * (usableH / rows) * 0.35;
        pts.push({
          x: padX + (c + 0.5) * (usableW / cols) + jx - 40,
          y: padY + (r + 0.5) * (usableH / rows) + jy - 28
        });
      }
    }
    return shuffle(pts);
  }

  function clearFish() {
    fishLayer.innerHTML = '';
    placed = {};
    selectedId = null;
  }

  function buildPonds(keys) {
    pondsEl.innerHTML = '';
    keys.forEach(function (k) {
      var p = COLORS[k];
      var d = document.createElement('div');
      d.className = 'pond';
      d.dataset.color = k;
      d.innerHTML =
        '<div class="pond-tag"><span class="swatch" style="--c:' + p.c + '"></span>' + p.name + '塘</div>' +
        '<div class="pond-water" style="--c:' + p.c + ';--soft:' + p.soft + '"></div>';
      d.addEventListener('click', function () { tryPlace(k, d); });
      pondsEl.appendChild(d);
    });
  }

  function spawnFish(colors) {
    clearFish();
    var list = shuffle(colors.slice());
    var pts = layoutLoose(list.length);
    list.forEach(function (col, i) {
      var el = document.createElement('div');
      el.className = 'fish' + (reduced ? '' : ' swim');
      el.dataset.color = col;
      el.dataset.id = 'f' + i;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', COLORS[col].name + '色小鱼');
      el.innerHTML = fishSvg(col);
      var pt = pts[i] || { x: 40 + i * 30, y: 80 };
      el.style.left = pt.x + 'px';
      el.style.top = pt.y + 'px';
      bindFish(el);
      fishLayer.appendChild(el);
    });
  }

  function bindFish(el) {
    el.addEventListener('pointerdown', function (e) {
      if (gameOver || el.classList.contains('settled')) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      selectFish(el);
      var rect = el.getBoundingClientRect();
      var srect = stage.getBoundingClientRect();
      drag = {
        el: el,
        ox: e.clientX - rect.left,
        oy: e.clientY - rect.top,
        sx: srect.left,
        sy: srect.top
      };
      el.classList.add('dragging');
      el.classList.remove('swim');
    });
    el.addEventListener('pointermove', function (e) {
      if (!drag || drag.el !== el) return;
      var x = e.clientX - drag.sx - drag.ox;
      var y = e.clientY - drag.sy - drag.oy;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
    el.addEventListener('pointerup', function (e) {
      if (!drag || drag.el !== el) return;
      el.classList.remove('dragging');
      try { el.releasePointerCapture(e.pointerId); } catch (err) {}
      var hit = pondFromPoint(e.clientX, e.clientY);
      drag = null;
      if (hit) tryPlace(hit.dataset.color, hit);
      else if (!reduced) el.classList.add('swim');
    });
    el.addEventListener('click', function (e) {
      if (gameOver || el.classList.contains('settled')) return;
      e.stopPropagation();
      selectFish(el);
    });
  }

  function selectFish(el) {
    selectedId = el.dataset.id;
    Array.prototype.forEach.call(fishLayer.children, function (f) {
      f.classList.toggle('selected', f.dataset.id === selectedId && !f.classList.contains('settled'));
    });
  }

  function pondFromPoint(cx, cy) {
    var nodes = pondsEl.querySelectorAll('.pond');
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) return nodes[i];
    }
    return null;
  }

  function tryPlace(pondColor, pondEl) {
    if (gameOver) return;
    var el = null;
    if (selectedId) {
      el = fishLayer.querySelector('[data-id="' + selectedId + '"]');
    }
    if (!el || el.classList.contains('settled')) {
      showToast('先点一条小鱼哦', false);
      return;
    }
    if (el.dataset.color !== pondColor) {
      pondEl.classList.remove('shake');
      void pondEl.offsetWidth;
      pondEl.classList.add('shake');
      showToast('颜色不一样！找和鱼一样颜色的水塘', false);
      return;
    }
    settleInto(el, pondEl, pondColor);
  }

  function settleInto(el, pondEl, pondColor) {
    var srect = stage.getBoundingClientRect();
    var prect = pondEl.querySelector('.pond-water').getBoundingClientRect();
    var count = placed[pondColor] || 0;
    placed[pondColor] = count + 1;
    var ox = (count % 3) * 14 - 10;
    var oy = Math.floor(count / 3) * 10;
    el.classList.remove('selected', 'swim', 'dragging');
    el.classList.add('settled');
    el.style.left = (prect.left - srect.left + prect.width * 0.35 + ox) + 'px';
    el.style.top = (prect.top - srect.top + prect.height * 0.15 + oy) + 'px';
    selectedId = null;
    pondEl.classList.remove('ok');
    void pondEl.offsetWidth;
    pondEl.classList.add('ok');
    showToast(COLORS[pondColor].name + '鱼回家啦！', true);
    checkWin();
  }

  function remaining() {
    var n = 0;
    Array.prototype.forEach.call(fishLayer.children, function (f) {
      if (!f.classList.contains('settled')) n++;
    });
    return n;
  }

  function showEnd() {
    gameOver = true;
    endScreen.classList.add('show');
    hint.textContent = '通关啦';
    ctrl.innerHTML = '';
  }

  function checkWin() {
    if (remaining() > 0) return;
    hint.textContent = '这一关全对！';
    ctrl.innerHTML = '';
    if (level < LEVELS.length - 1) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'next-btn';
      btn.textContent = '下一关';
      btn.addEventListener('click', function () {
        level++;
        startLevel();
      });
      ctrl.appendChild(btn);
    } else {
      /* 最后一关：直接进独立结束页，不把关卡清零 */
      setTimeout(showEnd, reduced ? 200 : 600);
    }
  }

  function startLevel() {
    if (gameOver) return;
    var L = LEVELS[level];
    progress.textContent = '第 ' + (level + 1) + ' / ' + LEVELS.length + ' 关';
    hint.textContent = '把小鱼拖进或点选后点同色水塘';
    ctrl.innerHTML = '';
    buildPonds(L.ponds);
    spawnFish(L.fish);
  }

  function startGame() {
    gameOver = false;
    demo.classList.add('hidden');
    endScreen.classList.remove('show');
    level = 0;
    startLevel();
  }

  document.getElementById('btnStart').addEventListener('click', startGame);
  document.getElementById('btnSkip').addEventListener('click', startGame);
  document.getElementById('btnReplay').addEventListener('click', startGame);
  document.getElementById('btnReset').addEventListener('click', function () {
    if (!demo.classList.contains('hidden')) return;
    if (endScreen.classList.contains('show')) return;
    startLevel();
  });
})();
</script>
</body>
</html>
