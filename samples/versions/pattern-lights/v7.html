<!-- aid-contract {"levels":[{"answers":["red"],"tiles":["red","blue","green"]},{"answers":["blue"],"tiles":["red","blue","yellow"]},{"answers":["green"],"tiles":["yellow","green","red"]},{"answers":["red"],"tiles":["blue","green","red"]}]} -->
<style>
:root{
  --accent:#2f6fbf; --ok:#2fbf71; --bad:#e85d5d;
  --ink:#1e3a5f; --muted:#5b6b82; --line:#d9e2ef; --card:#fff;
  --ease:cubic-bezier(.25,1,.5,1);
  --touch:64px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100dvh;overflow:hidden}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); background:#e8eef7;
  display:flex; flex-direction:column;
  padding:clamp(6px,1.2vh,14px) clamp(8px,1.5vw,18px);
}
.card{
  flex:1 1 auto; min-height:0; width:100%;
  max-width:min(1120px,100%); margin:0 auto;
  background:var(--card); border:1px solid var(--line); border-radius:20px;
  box-shadow:0 12px 30px rgba(30,58,95,.12);
  display:flex; flex-direction:column; overflow:hidden;
  padding:clamp(10px,1.5vh,18px) clamp(12px,1.8vw,24px) clamp(10px,1.3vh,16px);
}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
.top h1{margin:0;font-size:clamp(26px,2.6vw,32px);font-weight:800;letter-spacing:.5px}
.chip{font-size:20px;font-weight:700;color:var(--accent);background:#e8f0fb;padding:6px 14px;border-radius:999px;white-space:nowrap}
.chip.idx{color:var(--muted);background:#eef1f6}
.mode{margin-left:auto;font-size:20px;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.mode input{width:22px;height:22px;accent-color:var(--accent)}
.stage{
  flex:1 1 auto; min-height:0; position:relative; margin-top:10px;
  display:flex; flex-direction:column;
  background:linear-gradient(180deg,#0f1f38,#1a3358 70%,#243f66);
  border-radius:16px; overflow:hidden;
}
.hintRow{
  flex:none; display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:clamp(24px,2.4vw,28px); font-weight:700; color:#dbe7f7;
  padding:10px 8px 2px;
}
.hintRow .unitBox{display:inline-flex; gap:7px; align-items:center; padding:5px 14px; background:rgba(255,255,255,.12); border-radius:999px}
.hintRow .dot{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.35)}
.stage svg{flex:1 1 auto; width:100%; min-height:0; display:block}
.materials{
  flex:none; display:flex; justify-content:center; gap:clamp(10px,2vw,20px); margin-top:10px; flex-wrap:wrap;
}
.matBtn{
  width:clamp(100px,12vw,132px); height:clamp(104px,13vh,132px);
  border:3px solid var(--line); border-radius:18px; background:#fff; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-family:inherit; font-size:clamp(24px,2.4vw,28px); font-weight:800; color:var(--ink);
  transition:transform .18s var(--ease), border-color .18s, box-shadow .18s;
  touch-action:manipulation;
}
.matBtn svg{width:60px;height:60px;pointer-events:none}
.matBtn:active{transform:scale(.96)}
.matBtn.pick{border-color:var(--accent); background:#eef4fc; box-shadow:0 0 0 6px rgba(47,111,191,.16)}
.matBtn.correct{border-color:var(--ok); background:#e6f9ef}
.matBtn.wrong{border-color:var(--bad); background:#fdecec; animation:shake .4s ease}
.matBtn:disabled{opacity:.55; cursor:default}
.fb{
  flex:none; min-height:clamp(56px,7.5vh,72px); margin-top:10px;
  display:flex; align-items:center; justify-content:center; text-align:center;
  padding:10px 14px; border-radius:14px; background:#f4f8fd; border:1px solid var(--line);
  font-size:clamp(24px,2.4vw,28px); line-height:1.45; font-weight:700;
}
.fb.ok{background:#e6f9ef; border-color:#a7e8c6}
.fb.bad{background:#fff4ec; border-color:#f6c9a8}
.fb b{color:var(--accent)}
.fb.ok b{color:#1c8f57}
.bar{flex:none; display:flex; justify-content:center; gap:12px; margin-top:12px; flex-wrap:wrap}
.btn{
  min-height:var(--touch); padding:14px 26px; border-radius:14px; border:2px solid var(--line);
  background:#fff; font-family:inherit; font-size:clamp(24px,2.4vw,28px); font-weight:800; color:var(--ink);
  cursor:pointer; transition:transform .18s var(--ease), background .18s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{color:var(--muted)}
.btn:disabled{opacity:.5; cursor:default}

.bulb{opacity:0}
.bulb.in{opacity:1}
.bulb.light{animation:lightUp .45s var(--ease)}
@keyframes lightUp{0%{opacity:0;transform:translateY(-8px) scale(.82)}60%{opacity:1;transform:translateY(2px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
.askPulse{animation:askPulse 1.1s var(--ease) infinite}
@keyframes askPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.okRing{fill:none;stroke:#2fbf71;stroke-width:5;opacity:0}
.okRing.show{opacity:1;animation:ringIn .45s var(--ease)}
@keyframes ringIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.band{opacity:0; transition:opacity .3s var(--ease)}
.band.in{opacity:1}
.wire{stroke-dasharray:520;stroke-dashoffset:520;transition:stroke-dashoffset .85s var(--ease)}
.wire.drawn{stroke-dashoffset:0}
.foxJump{animation:foxJump .55s var(--ease)}
@keyframes foxJump{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}

.overlay{
  position:fixed; inset:0; z-index:50; background:rgba(14,29,52,.84);
  display:flex; align-items:center; justify-content:center; padding:18px;
}
.overlay[hidden]{display:none}
.ovCard{
  width:min(580px,96vw); background:#fff; border-radius:20px; padding:18px 20px 16px;
  box-shadow:0 20px 50px rgba(0,0,0,.4); text-align:center;
}
.ovTitle{font-size:clamp(28px,3vw,32px); font-weight:800; margin:0 0 6px}
.ovSub{font-size:clamp(22px,2.4vw,26px); color:var(--muted); margin:0 0 12px; line-height:1.5}
.ovCard svg{width:100%; max-height:220px}
.ovBtn{
  margin-top:14px; min-height:var(--touch); padding:13px 32px; border:none; border-radius:14px;
  background:var(--accent); color:#fff; font-family:inherit;
  font-size:clamp(24px,2.5vw,27px); font-weight:800; cursor:pointer;
}
.ovBtn:active{transform:scale(.97)}
.winLamps{display:flex; justify-content:center; gap:16px; margin:10px 0 4px}
.winLamp{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 12px rgba(255,255,255,.5))}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .bulb{opacity:1}
  .band{opacity:1}
  .wire{stroke-dashoffset:0}
  .okRing{opacity:1}
}
body.static *{animation:none!important;transition:none!important}
body.static .bulb{opacity:1}
body.static .band{opacity:1}
body.static .wire{stroke-dashoffset:0}
body.static .okRing{opacity:1}
@media (max-height:760px){
  .hintRow{display:none}
  .fb{min-height:48px; font-size:20px; padding:6px 10px}
  .top h1{font-size:22px}
}
</style>

<body>
<main class="card">
  <div class="top">
    <h1>小狐狸的彩灯串</h1>
    <span class="chip">找规律</span>
    <span class="chip idx" id="levelChip">第 1 关</span>
    <label class="mode"><input type="checkbox" id="staticMode"> 静态模式</label>
  </div>

  <div class="stage">
    <div class="hintRow">
      <span>一组：</span>
      <span class="unitBox" id="unitBox"></span>
      <span id="hintAsk">？＝要补的灯</span>
    </div>
    <svg id="scene" viewBox="0 0 640 280" role="img" aria-label="夜空里横着挂一串彩灯，问号处要补一盏灯"></svg>
  </div>

  <div class="materials" id="materials" role="group" aria-label="选择要补的灯"></div>

  <div class="fb" id="fb" aria-live="polite">先看灯串，找一找「一组」怎么排，再点灯补上问号。</div>

  <div class="bar">
    <button type="button" class="btn primary" id="btnCheck">✓ 看看对不对</button>
    <button type="button" class="btn" id="btnNext" hidden>下一关 →</button>
    <button type="button" class="btn ghost" id="btnReplay">↻ 重新开始</button>
  </div>
</main>

<div class="overlay" id="demoOverlay" role="dialog" aria-label="开场演示">
  <div class="ovCard">
    <p class="ovTitle">🦊 小狐狸挂彩灯</p>
    <p class="ovSub" id="demoSub">红-蓝 一组，一组一组排。问号该补哪盏？</p>
    <svg id="demoSvg" viewBox="0 0 320 160" aria-hidden="true"></svg>
    <button type="button" class="ovBtn" id="demoSkip">我学会啦，开始 →</button>
  </div>
</div>

<div class="overlay" id="winOverlay" role="dialog" aria-label="通关" hidden>
  <div class="ovCard">
    <p class="ovTitle">🎉 四关全过！</p>
    <p class="ovSub">你会自己找规律啦：<b>先找一组，一组一组排。</b></p>
    <div class="winLamps" id="winLamps"></div>
    <p class="ovSub" style="margin-top:8px">小狐狸送给你一颗星星 ⭐</p>
    <button type="button" class="ovBtn" id="winAgain">再玩一次 ↻</button>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var staticMode = false;

  var COLORS = {
    red:   { cn:'红', hex:'#ef4444', glow:'rgba(239,68,68,.4)' },
    blue:  { cn:'蓝', hex:'#3b82f6', glow:'rgba(59,130,246,.4)' },
    yellow:{ cn:'黄', hex:'#f5a623', glow:'rgba(245,166,35,.4)' },
    green: { cn:'绿', hex:'#22c55e', glow:'rgba(34,197,94,.4)' }
  };

  /* 先少后多：AB 末尾空 → AB 中间空 → AAB 末尾 → 举一反三 ABC */
  var LEVELS = [
    { unit:['red','blue'],              gapIdx:4, n:5, tiles:['red','blue','green'],  intro:'红-蓝 一组，问号是下一盏' },
    { unit:['red','blue'],              gapIdx:3, n:6, tiles:['red','blue','yellow'], intro:'还是红-蓝 一组，中间掉了一盏' },
    { unit:['yellow','yellow','green'], gapIdx:5, n:6, tiles:['yellow','green','red'], intro:'黄-黄-绿 一组，问号是下一盏' },
    { unit:['blue','green','red'],      gapIdx:5, n:6, tiles:['blue','green','red'],  intro:'举一反三：蓝-绿-红 一组，还是先找「一组」' }
  ];

  var q = 0, pickKey = null, locked = false;
  var svg = $('scene');
  var Y = 118, X0 = 78, SP = 92, WIRE_Y = 78;

  function keyName(k){ return COLORS[k].cn; }
  function keyAt(level, i){ return level.unit[i % level.unit.length]; }
  function ansKey(level){ return level.unit[level.gapIdx % level.unit.length]; }

  function bulbSVG(x, y, k, s){
    s = s || 1;
    var fill = COLORS[k].hex, glow = COLORS[k].glow;
    return '<circle cx="'+x+'" cy="'+y+'" r="'+(30*s)+'" fill="'+glow+'"/>' +
           '<circle cx="'+x+'" cy="'+y+'" r="'+(24*s)+'" fill="'+fill+'"/>' +
           '<circle cx="'+(x-7*s)+'" cy="'+(y-8*s)+'" r="'+(6*s)+'" fill="rgba(255,255,255,.55)"/>' +
           '<rect x="'+(x-11*s)+'" y="'+(y-36*s)+'" width="'+(22*s)+'" height="'+(11*s)+'" rx="3" fill="#64748b"/>';
  }

  function foxSVG(tx, ty, cls){
    return '<g class="fox'+(cls?' '+cls:'')+'" transform="translate('+tx+','+ty+')">' +
      '<ellipse cx="0" cy="28" rx="20" ry="14" fill="#e8873a"/>' +
      '<circle cx="0" cy="6" r="16" fill="#e8873a"/>' +
      '<path d="M-14 -4 L-22 -22 L-4 -10 Z" fill="#e8873a"/>' +
      '<path d="M14 -4 L22 -22 L4 -10 Z" fill="#e8873a"/>' +
      '<path d="M-14 -4 L-20 -18 L-6 -9 Z" fill="#fde8c8"/>' +
      '<path d="M14 -4 L20 -18 L6 -9 Z" fill="#fde8c8"/>' +
      '<ellipse cx="0" cy="12" rx="9" ry="7" fill="#fde8c8"/>' +
      '<circle cx="-6" cy="3" r="2.4" fill="#1e3a5f"/>' +
      '<circle cx="6" cy="3" r="2.4" fill="#1e3a5f"/>' +
      '<path d="M-3 11 Q0 15 3 11" stroke="#1e3a5f" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '<path d="M18 22 Q36 10 42 28 Q28 26 18 28" fill="#e8873a"/>' +
      '<path d="M38 26 Q42 22 44 28" fill="#f5f5f7"/>' +
      '<path d="M-10 30 L-16 44 M10 30 L16 44" stroke="#c46a28" stroke-width="3.2" stroke-linecap="round"/>' +
      '</g>';
  }

  function bgSVG(w){
    w = w || 640;
    var stars = [[30,28],[70,48],[110,22],[160,40],[210,18],[260,50],[310,26],[360,44],[410,20],[460,52],[510,30],[560,42],[600,24]];
    var s = stars.map(function(p,i){
      var r = (i % 3 === 0) ? 2.4 : 1.6;
      return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+r+'" fill="#fff" opacity="'+(i%2?'.5':'.85')+'"/>';
    }).join('');
    return '<circle cx="560" cy="48" r="26" fill="#fde68a"/>' +
           '<circle cx="572" cy="40" r="22" fill="#0f1f38"/>' +
           s +
           '<rect x="0" y="248" width="'+w+'" height="32" fill="#2a4d3a"/>' +
           foxSVG(72, 210, '');
  }

  function render(level){
    svg.innerHTML = '';
    var n = level.n;
    var lastX = X0 + (n - 1) * SP;
    var inner = bgSVG(640);
    inner += '<line class="wire'+(reduced||staticMode?' drawn':'')+'" id="wireLine" x1="'+(X0-28)+'" y1="'+WIRE_Y+'" x2="'+(lastX+28)+'" y2="'+WIRE_Y+'" stroke="#8fa6c4" stroke-width="4" stroke-linecap="round"/>';

    var len = level.unit.length;
    var groups = Math.ceil(n / len);
    for(var g = 0; g < groups; g++){
      var start = g * len, end = Math.min((g + 1) * len, n) - 1;
      if(end < start) continue;
      var x1 = X0 + start * SP - 34, x2 = X0 + end * SP + 34;
      var hot = (level.gapIdx >= start && level.gapIdx <= end);
      inner += '<path class="band'+(hot?' hot':'')+'" d="M '+x1+' 168 Q '+(x1+x2)/2+' 188 '+x2+' 168" fill="none" stroke="'+(hot?'rgba(127,176,234,.95)':'rgba(255,255,255,.28)')+'" stroke-width="'+(hot?4:3)+'" stroke-linecap="round"/>';
    }

    for(var i = 0; i < n; i++){
      if(i === level.gapIdx) continue;
      var x = X0 + i * SP;
      inner += '<g class="bulb" data-i="'+i+'">' + bulbSVG(x, Y, keyAt(level, i), 1) + '</g>';
    }

    var ax = X0 + level.gapIdx * SP;
    var askCls = 'askSlot' + (reduced || staticMode ? '' : ' askPulse');
    inner += '<g class="'+askCls+'" id="askSlot">' +
      '<circle cx="'+ax+'" cy="'+Y+'" r="28" fill="#eef4fc" stroke="#7fb0ea" stroke-width="3" stroke-dasharray="8 7"/>' +
      '<circle cx="'+ax+'" cy="'+Y+'" r="36" fill="rgba(255,255,255,.12)"/>' +
      '<text x="'+ax+'" y="'+(Y+12)+'" text-anchor="middle" font-size="32" font-weight="800" fill="#9cc3f0">?</text>' +
      '</g>';
    inner += '<circle class="okRing" id="okRing" cx="'+ax+'" cy="'+Y+'" r="40"/>';

    svg.innerHTML = inner;

    var bulbs = svg.querySelectorAll('.bulb');
    if(!reduced && !staticMode){
      var wire = $('wireLine');
      if(wire){ requestAnimationFrame(function(){ wire.classList.add('drawn'); }); }
      bulbs.forEach(function(b, idx){
        setTimeout(function(){ b.classList.add('in','light'); }, 120 + idx * 70);
      });
      svg.querySelectorAll('.band').forEach(function(bb, idx){
        setTimeout(function(){ bb.classList.add('in'); }, 220 + idx * 90);
      });
    } else {
      bulbs.forEach(function(b){ b.classList.add('in'); });
      svg.querySelectorAll('.band').forEach(function(bb){ bb.classList.add('in'); });
    }

    $('unitBox').innerHTML = level.unit.map(function(k){
      return '<span class="dot" style="background:'+COLORS[k].hex+'"></span>';
    }).join('');
    $('hintAsk').textContent = (level.gapIdx === level.n - 1) ? '？＝下一盏' : '？＝掉的灯';
  }

  function materialSVG(k){
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<line x1="20" y1="28" x2="80" y2="28" stroke="#8fa6c4" stroke-width="3"/>' +
      bulbSVG(50, 58, k, 0.9) + '</svg>';
  }

  function renderMaterials(level){
    var ans = ansKey(level);
    var pool = level.tiles.slice();
    if(pool.indexOf(ans) === -1) pool[0] = ans;
    for(var j = pool.length - 1; j > 0; j--){
      var r = Math.floor(Math.random() * (j + 1));
      var t = pool[j]; pool[j] = pool[r]; pool[r] = t;
    }
    var wrap = $('materials');
    wrap.innerHTML = '';
    pickKey = null;
    pool.forEach(function(k){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'matBtn'; b.dataset.key = k;
      b.setAttribute('aria-label', '选' + keyName(k) + '灯');
      b.innerHTML = materialSVG(k) + '<span>' + keyName(k) + '</span>';
      wrap.appendChild(b);
    });
  }

  function setFB(html, cls){
    var fb = $('fb');
    fb.className = 'fb' + (cls ? ' ' + cls : '');
    fb.innerHTML = html;
  }

  function showAnswer(level, k){
    var slot = $('askSlot');
    var ax = X0 + level.gapIdx * SP;
    slot.outerHTML = '<g class="bulb in light" id="filledBulb">' + bulbSVG(ax, Y, k, 1) + '</g>';
    var ring = $('okRing');
    if(ring){
      ring.setAttribute('cx', ax);
      ring.setAttribute('cy', Y);
      ring.classList.add('show');
    }
    var fox = svg.querySelector('.fox');
    if(fox && !reduced && !staticMode) fox.classList.add('foxJump');
  }

  function setLockedUI(on){
    locked = on;
    $('btnCheck').disabled = on;
    Array.prototype.forEach.call(document.querySelectorAll('.matBtn'), function(b){ b.disabled = on; });
  }

  function loadLevel(i){
    q = i;
    locked = false;
    pickKey = null;
    var level = LEVELS[q];
    $('levelChip').textContent = '第 ' + (q + 1) + ' 关';
    $('btnNext').hidden = true;
    $('btnCheck').disabled = false;
    $('btnCheck').hidden = false;
    render(level);
    renderMaterials(level);
    setFB(level.intro + '。点下面一盏灯，再点「看看对不对」。', '');
  }

  function onPick(e){
    if(locked) return;
    var btn = e.target.closest('.matBtn');
    if(!btn || !btn.dataset.key) return;
    pickKey = btn.dataset.key;
    Array.prototype.forEach.call(document.querySelectorAll('.matBtn'), function(b){
      b.classList.toggle('pick', b === btn);
      b.classList.remove('wrong','correct');
    });
    setFB('你选了 <b>' + keyName(pickKey) + '</b> 灯。点「看看对不对」。', '');
  }

  function onCheck(){
    if(locked) return;
    var level = LEVELS[q];
    if(!pickKey){
      setFB('先点下面一盏灯，再检查哦。', 'bad');
      return;
    }
    var ans = ansKey(level);
    var btns = document.querySelectorAll('.matBtn');
    if(pickKey === ans){
      setLockedUI(true);
      Array.prototype.forEach.call(btns, function(b){
        if(b.dataset.key === ans) b.classList.add('correct');
        b.classList.remove('pick');
      });
      showAnswer(level, ans);
      var unitStr = level.unit.map(keyName).join('-');
      setFB('对啦！一组是 <b>' + unitStr + '</b>，问号是 <b>' + keyName(ans) + '</b> 灯。', 'ok');
      $('btnCheck').hidden = true;
      if(q < LEVELS.length - 1){
        $('btnNext').hidden = false;
      } else {
        setTimeout(showWin, reduced || staticMode ? 200 : 700);
      }
    } else {
      Array.prototype.forEach.call(btns, function(b){
        if(b.dataset.key === pickKey) b.classList.add('wrong');
      });
      setFB('还差一点点。先数「一组」：' + level.unit.map(keyName).join('→') + '，再想想问号该是哪一盏。', 'bad');
      setTimeout(function(){
        Array.prototype.forEach.call(document.querySelectorAll('.matBtn'), function(b){ b.classList.remove('wrong'); });
      }, 450);
    }
  }

  function showWin(){
    var box = $('winLamps');
    box.innerHTML = '';
    ['red','blue','yellow','green'].forEach(function(k){
      var d = document.createElement('div');
      d.className = 'winLamp';
      d.style.background = COLORS[k].hex;
      d.textContent = '✦';
      d.style.color = '#fff';
      d.style.fontSize = '28px';
      box.appendChild(d);
    });
    $('winOverlay').hidden = false;
  }

  function runDemo(){
    var demo = $('demoSvg');
    var gap = 3;
    var dx = 56, x0 = 48, yy = 78;
    function paint(reveal){
      var h = bgMini() + '<line x1="20" y1="48" x2="300" y2="48" stroke="#8fa6c4" stroke-width="3"/>';
      var seq = ['red','blue','red','blue'];
      for(var i=0;i<4;i++){
        var xx = x0 + i*dx;
        if(i===gap && !reveal){
          h += '<circle cx="'+xx+'" cy="'+yy+'" r="22" fill="#eef4fc" stroke="#7fb0ea" stroke-width="2" stroke-dasharray="6 5"/>' +
               '<text x="'+xx+'" y="'+(yy+9)+'" text-anchor="middle" font-size="24" font-weight="800" fill="#9cc3f0">?</text>';
        } else {
          var kk = (i===gap) ? 'red' : seq[i];
          h += bulbSVG(xx, yy, kk, 0.72);
        }
      }
      if(reveal){
        h += '<circle cx="'+(x0+gap*dx)+'" cy="'+yy+'" r="30" fill="none" stroke="#2fbf71" stroke-width="4"/>';
      }
      h += foxSVG(278, 118, '');
      demo.innerHTML = h;
    }
    function bgMini(){
      return '<circle cx="290" cy="28" r="14" fill="#fde68a"/><circle cx="296" cy="24" r="12" fill="#fff"/>' +
             '<circle cx="40" cy="22" r="1.5" fill="#94a3b8"/><circle cx="80" cy="18" r="1.2" fill="#94a3b8"/><circle cx="140" cy="26" r="1.4" fill="#94a3b8"/>';
    }
    paint(false);
    if(reduced || staticMode){
      paint(true);
      $('demoSub').textContent = '一组是红-蓝，问号补红灯！';
      return;
    }
    setTimeout(function(){
      paint(true);
      $('demoSub').textContent = '一组是红-蓝，问号补红灯！';
    }, 900);
  }

  function startGame(){
    $('demoOverlay').hidden = true;
    loadLevel(0);
  }

  $('materials').addEventListener('click', onPick);
  $('btnCheck').addEventListener('click', onCheck);
  $('btnNext').addEventListener('click', function(){
    if(q < LEVELS.length - 1) loadLevel(q + 1);
  });
  $('btnReplay').addEventListener('click', function(){
    $('winOverlay').hidden = true;
    loadLevel(0);
  });
  $('demoSkip').addEventListener('click', startGame);
  $('winAgain').addEventListener('click', function(){
    $('winOverlay').hidden = true;
    loadLevel(0);
  });
  $('staticMode').addEventListener('change', function(){
    staticMode = $('staticMode').checked;
    document.body.classList.toggle('static', staticMode);
    if(!$('demoOverlay').hidden) runDemo();
    else if(!locked) loadLevel(q);
  });

  runDemo();
})();
</script>
</body>
</html>
