<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刷牙步骤排队 · 排序</title>
<!-- 风格：生活习惯·步骤排序 / 场景：家庭+学前 / 核心：顺序逻辑 -->
<style>
:root{--accent:#06b6d4;--ok:#10b981;--bad:#ef4444;--ink:#1f2a44;--muted:#667085;--line:#a5f3fc;--ease:cubic-bezier(0.25,1,0.5,1);--touch:52px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#ecfeff,#f0fdf4);min-height:100vh;padding:14px 12px 28px}
.card{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 28px rgba(6,182,212,.12);padding:18px 16px 22px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{margin:0;font-size:22px;font-weight:800}
.badge{font-size:14px;font-weight:700;color:#0e7490;background:#cffafe;padding:5px 12px;border-radius:999px}
.story{background:linear-gradient(135deg,#cffafe,#d1fae5);border-left:5px solid var(--accent);border-radius:0 14px 14px 0;padding:12px;margin-bottom:12px;font-size:16px;line-height:1.7}
.slots{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.slot-row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}
.num{width:48px;height:48px;border-radius:50%;background:#e0f2fe;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#0369a1}
.slot{min-height:56px;border:2px dashed #67e8f9;border-radius:14px;background:#f8fafc;display:flex;align-items:center;padding:8px 12px;font-size:16px;font-weight:700;cursor:pointer}
.slot.filled{border-style:solid;border-color:var(--accent);background:#ecfeff}
.slot.ok{border-color:var(--ok);background:#ecfdf5}
.slot.bad{border-color:var(--bad);background:#fef2f2}
.tokens{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:12px}
.tok{min-height:var(--touch);padding:12px 14px;border-radius:14px;border:2px solid #e2e8f0;background:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.tok.picked{border-color:var(--accent);background:#cffafe}
.tok.used{opacity:.35;pointer-events:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{min-height:var(--touch);padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,var(--accent),#0891b2);color:#fff;border:none}
.fb{min-height:52px;border-radius:14px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:16px;line-height:1.55;margin:10px 0}
.fb.ok{background:#ecfdf5;border-color:#6ee7b7}
.fb.bad{background:#fff7ed;border-color:#fcd34d}
.thinking{background:#fffbeb;border-radius:12px;padding:10px;font-size:15px;border:1px dashed #fcd34d}
.thinking .tag{font-weight:800;color:#b45309}
.say{margin-top:8px;font-size:15px;min-height:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="top"><h1>刷牙步骤排队</h1><span class="badge">4–8 岁 · 生活排序</span></div>
  <div class="story">刷牙有先后顺序。把步骤卡片放进 1→2→3→4 的格子里。可先点卡片再点格子。</div>
  <div id="pipe" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;font-size:13px;font-weight:700;color:#0e7490" aria-hidden="true">
    <span>①准备</span><span>→</span><span>②挤膏</span><span>→</span><span>③刷</span><span>→</span><span>④漱口</span>
  </div>
  <div class="slots" id="slots"></div>
  <div class="tokens" id="tokens"></div>
  <div class="btn-row">
    <button type="button" class="btn primary" id="btnCheck">✓ 检查顺序</button>
    <button type="button" class="btn" id="btnReset">↻ 重新开始</button>
    <button type="button" class="btn" id="btnSay">🗣️ 我会说</button>
  </div>
  <div class="fb" id="fb" aria-live="polite">先想：挤牙膏之前要先拿什么？</div>
  <p class="thinking"><span class="tag">我怎么想：</span><span id="think">准备工具 → 挤膏 → 刷 → 漱口。乱序会很奇怪。</span></p>
  <div class="say" id="say"></div>
</main>
<script>
(function(){
  const STEPS = [
    {id:'cup', text:'🪥 拿出牙刷和杯子'},
    {id:'paste', text:'🧴 挤上牙膏'},
    {id:'brush', text:'😁 上下轻轻刷干净'},
    {id:'rinse', text:'💧 漱口把泡沫吐掉'}
  ];
  const ORDER = ['cup','paste','brush','rinse'];
  let filled = {}, picked=null, locked=false;
  const $=id=>document.getElementById(id);

  let shuffled = STEPS.slice().sort(()=>Math.random()-0.5);
  function renderTokensStable(){
    const tok=$('tokens'); tok.innerHTML='';
    const used=Object.values(filled);
    shuffled.forEach(st=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='tok'+(picked===st.id?' picked':'')+(used.includes(st.id)?' used':'');
      b.textContent=st.text;
      b.disabled=used.includes(st.id)||locked;
      b.onclick=()=>{ if(locked||used.includes(st.id))return; picked=st.id; renderSlots(); renderTokensStable(); };
      tok.appendChild(b);
    });
  }
  function renderSlots(){
    const slots=$('slots'); slots.innerHTML='';
    ORDER.forEach((_,i)=>{
      const row=document.createElement('div');
      row.className='slot-row';
      row.innerHTML = '<div class="num">'+(i+1)+'</div><button type="button" class="slot'+(filled[i]?' filled':'')+'" data-i="'+i+'"></button>';
      slots.appendChild(row);
      const slot=row.querySelector('.slot');
      if(filled[i]){
        slot.textContent = STEPS.find(x=>x.id===filled[i]).text;
      } else slot.textContent='（第 '+(i+1)+' 步）';
      slot.onclick=()=>onSlot(i);
    });
  }
  function onSlot(i){
    if(locked) return;
    if(!picked){
      if(filled[i]){ delete filled[i]; renderSlots(); renderTokensStable(); }
      return;
    }
    filled[i]=picked; picked=null;
    document.querySelectorAll('.slot').forEach(s=>s.classList.remove('ok','bad'));
    renderSlots(); renderTokensStable();
  }
  $('btnCheck').onclick=()=>{
    if(Object.keys(filled).length<4){ $('fb').className='fb bad'; $('fb').textContent='还有空位。'; return; }
    let all=true;
    document.querySelectorAll('.slot').forEach(s=>{
      const i=+s.dataset.i;
      s.classList.remove('ok','bad');
      if(filled[i]===ORDER[i]) s.classList.add('ok');
      else { s.classList.add('bad'); all=false; }
    });
    if(all){
      locked=true;
      $('fb').className='fb ok';
      $('fb').textContent='顺序对啦！①准备 → ②挤膏 → ③刷 → ④漱口。每天睡前也这样。';
      $('think').textContent='生活顺序：先准备工具，再做动作，最后收拾/漱口。';
    } else {
      // 指出第一处错误
      let first=-1;
      for(let i=0;i<4;i++){ if(filled[i]!==ORDER[i]){ first=i; break; } }
      const got = STEPS.find(x=>x.id===filled[first]);
      const need = STEPS.find(x=>x.id===ORDER[first]);
      $('fb').className='fb bad';
      $('fb').textContent='第 '+(first+1)+' 步你放了「'+(got?got.text:'?')+'」，更合理的是「'+need.text+'」。点格子取出重排。';
    }
  };
  $('btnReset').onclick=()=>{
    filled={}; picked=null; locked=false;
    shuffled = STEPS.slice().sort(()=>Math.random()-0.5);
    renderSlots(); renderTokensStable();
    $('fb').className='fb'; $('fb').textContent='先想：挤牙膏之前要先拿什么？';
    $('say').textContent='';
  };
  $('btnSay').onclick=()=>{
    $('say').textContent='我会说：先拿牙刷杯子，再挤牙膏，然后刷，最后漱口。';
  };
  renderSlots(); renderTokensStable();
})();
</script>
</body>
</html>
