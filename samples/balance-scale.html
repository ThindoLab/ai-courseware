<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小猴的天平 · 比轻重</title>
<!-- 风格：科学探究·天平倾斜 / 场景：教室+家庭 / 核心：质量比较 -->
<style>
:root{--accent:#0d9488;--ink:#1f2a44;--muted:#667085;--line:#99f6e4;--ease:cubic-bezier(0.25,1,0.5,1);--touch:52px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#f0fdfa,#e0f2fe);min-height:100vh;padding:14px 12px 28px}
.card{max-width:720px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 28px rgba(13,148,136,.12);padding:18px 16px 22px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.top h1{margin:0;font-size:22px;font-weight:800}
.badge{font-size:14px;font-weight:700;color:#0f766e;background:#ccfbf1;padding:5px 12px;border-radius:999px}
.story{background:linear-gradient(135deg,#ccfbf1,#e0f2fe);border-left:5px solid var(--accent);border-radius:0 14px 14px 0;padding:12px;margin-bottom:12px;font-size:16px;line-height:1.7}
.stage{background:#f0fdfa;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;min-height:200px}
.scale{position:relative;height:160px;margin:0 auto;max-width:400px}
.pole{position:absolute;left:50%;bottom:10px;width:8px;height:90px;background:#64748b;transform:translateX(-50%);border-radius:4px}
.base{position:absolute;left:50%;bottom:0;width:80px;height:12px;background:#475569;transform:translateX(-50%);border-radius:6px}
.beam{position:absolute;left:50%;bottom:90px;width:280px;height:10px;background:#0f766e;transform:translateX(-50%);transform-origin:center center;border-radius:5px;transition:transform .55s var(--ease)}
.pan{position:absolute;top:-8px;width:70px;height:40px;background:#5eead4;border:3px solid #0d9488;border-radius:0 0 40px 40px;display:flex;align-items:flex-end;justify-content:center;font-size:22px;padding-bottom:4px}
.pan.L{left:0;transform:translateX(-50%)}
.pan.R{right:0;transform:translateX(50%)}
.labels{display:flex;justify-content:space-between;max-width:320px;margin:8px auto 0;font-weight:700;font-size:14px;color:var(--muted)}
.ctrl{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.row label{font-weight:700}
.step button{min-width:var(--touch);min-height:var(--touch);border-radius:14px;border:2px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer;font-family:inherit}
.step .v{min-width:40px;text-align:center;font-size:22px;font-weight:800;color:var(--accent)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{min-height:var(--touch);padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:linear-gradient(135deg,var(--accent),#0f766e);color:#fff;border:none}
.fb{min-height:52px;border-radius:14px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:16px;line-height:1.55;margin:10px 0}
.thinking{background:#fffbeb;border-radius:12px;padding:10px;font-size:15px;border:1px dashed #fcd34d}
.thinking .tag{font-weight:800;color:#b45309}
.say{margin-top:8px;font-size:15px;min-height:22px}
.verdict{text-align:center;font-size:20px;font-weight:800;margin-top:6px;color:#0f766e}
@media (prefers-reduced-motion:reduce){.beam{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="top"><h1>小猴的天平</h1><span class="badge">6–9 岁 · 比轻重</span></div>
  <div class="story">左边放一些 🍎，右边放一些 🍐。哪边<strong>更重</strong>，横梁就向哪边<strong>低下去</strong>。两边一样重就平衡。</div>
  <div class="stage" role="img" aria-label="天平图解">
    <div class="scale">
      <div class="base"></div>
      <div class="pole"></div>
      <div class="beam" id="beam">
        <div class="pan L" id="panL">🍎</div>
        <div class="pan R" id="panR">🍐</div>
      </div>
    </div>
    <div class="labels"><span id="labL">左 3</span><span id="labR">右 2</span></div>
    <div class="verdict" id="verdict">左边更重 ↓</div>
  </div>
  <div class="ctrl">
    <div class="row">
      <label>左边 🍎</label>
      <div class="step"><button type="button" id="lM">−</button><span class="v" id="lV">3</span><button type="button" id="lP">+</button></div>
      <input type="range" id="L" min="0" max="8" value="3" aria-label="左边个数">
    </div>
    <div class="row">
      <label>右边 🍐</label>
      <div class="step"><button type="button" id="rM">−</button><span class="v" id="rV">2</span><button type="button" id="rP">+</button></div>
      <input type="range" id="R" min="0" max="8" value="2" aria-label="右边个数">
    </div>
    <div class="btn-row">
      <button type="button" class="btn primary" id="btnCheck">✓ 我说得对吗</button>
      <button type="button" class="btn" id="btnReset">↻ 重新开始</button>
      <button type="button" class="btn" id="btnSay">🗣️ 我会说</button>
    </div>
  </div>
  <div class="fb" id="fb" aria-live="polite">拖滑块看横梁倾斜。重的一侧会向下。</div>
  <p class="thinking"><span class="tag">我怎么想：</span><span id="think">比个数：多的一侧更重（这里一个苹果≈一个梨）。</span></p>
  <div class="say" id="say"></div>
</main>
<script>
(function(){
  let L=3,R=2;
  const $=id=>document.getElementById(id);
  function state(){
    if(L>R) return 'left';
    if(R>L) return 'right';
    return 'eq';
  }
  function draw(){
    L=+$('L').value; R=+$('R').value;
    $('lV').textContent=L; $('rV').textContent=R;
    $('labL').textContent='左 '+L+' 个'; $('labR').textContent='右 '+R+' 个';
    $('panL').textContent = L? '🍎'.repeat(Math.min(L,3))+(L>3?'×'+L:'') : '空';
    $('panR').textContent = R? '🍐'.repeat(Math.min(R,3))+(R>3?'×'+R:'') : '空';
    const s=state();
    // 倾斜随差值增大（最多 18°），更直观
    const diff = Math.min(Math.abs(L-R), 6);
    const ang = s==='left' ? (6+diff*2) : s==='right' ? -(6+diff*2) : 0;
    $('beam').style.transform = 'translateX(-50%) rotate('+ang+'deg)';
    $('verdict').textContent = s==='left'?'左边更重 ↓（多 '+(L-R)+'）':s==='right'?'右边更重 ↓（多 '+(R-L)+'）':'两边一样 · 平衡 ✓';
    $('verdict').style.color = s==='eq'?'#059669':'#0f766e';
    $('think').textContent = s==='eq'?'两边个数相同 → 平衡。':'差得越多，横梁斜得越厉害。';
    $('fb').className='fb';
    $('fb').textContent='左 '+L+' · 右 '+R+'。拖滑块看倾斜变化。';
  }
  function bind(m,p,r){
    $(m).onclick=()=>{ r.value=Math.max(+r.min,+r.value-1); draw(); };
    $(p).onclick=()=>{ r.value=Math.min(+r.max,+r.value+1); draw(); };
    r.oninput=draw;
  }
  bind('lM','lP',$('L')); bind('rM','rP',$('R'));
  $('btnCheck').onclick=()=>{
    const s=state();
    $('fb').className='fb';
    $('fb').style.background = s==='eq'?'#ecfdf5':'#f0fdfa';
    $('fb').textContent = s==='left'?'对：左 '+L+' > 右 '+R+'，左侧重。':s==='right'?'对：右 '+R+' > 左 '+L+'，右侧重。':'对：一样重，横梁水平。';
  };
  $('btnReset').onclick=()=>{ $('L').value=3; $('R').value=2; draw(); $('say').textContent=''; $('fb').textContent='拖滑块看横梁倾斜。重的一侧会向下。'; };
  $('btnSay').onclick=()=>{
    const s=state();
    $('say').textContent = s==='eq'?'我会说：两边一样重，天平平衡。':s==='left'?'我会说：左边更重，所以左边低下去。':'我会说：右边更重，所以右边低下去。';
  };
  draw();
})();
</script>
</body>
</html>
